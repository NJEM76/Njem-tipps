plugins {
  id 'com.android.application'
}
android {
  namespace 'com.njem.tipps'
  compileSdk 34
  defaultConfig {
    applicationId "com.njem.tipps"
    minSdk 21
    targetSdk 34
    versionCode 1
    versionName "1.0"
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  imimplementation 'androidx.appcompat:appcompat:1.6.1'
}
