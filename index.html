    <div class="card" style="margin-bottom:.75rem">
      <div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:10px">👥 Simamia Watumiaji</div>
      ${(users||[]).map(u=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:.65rem 0;border-bottom:1px solid var(--border)">
        <div><div style="font-weight:600;font-size:13px">${u.name}</div><div style="font-size:10px;color:var(--muted)">${u.phone}</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-size:11px;color:var(--accent)">TZS ${fmt(u.bankroll)}</div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
            <select onchange="window._role('${u.id}',this.value)" style="padding:.3rem .5rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:11px">
              ${['owner','analyst','viewer'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${ROLES[r]||r}</option>`).join('')}
            </select>
            <div style="font-size:9px;color:var(--muted)">${u.role==='owner'?'Simamia yote':u.role==='analyst'?'Weka mikeka':'Soma tu'}</div>
          </div>
        </div>
      </div>`).join('')}
    </div>
    <div class="card" style="border-color:rgba(255,170,0,.3)">
      <div style="font-size:12px;font-weight:700;color:var(--warn);margin-bottom:6px">⚡ API-Sports Key — BONUS (Si Lazima)</div>
      <div style="font-size:11px;margin-bottom:8px;color:${APISPORTS_KEY?'var(--win)':'var(--muted)'}">
        ${APISPORTS_KEY?'✅ Inaongeza live stats za API-Sports':'ℹ️ Bila key — Fixtures na Livescores zinafanya kazi (TheSportsDB bure)'}
      </div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:8px;background:rgba(0,0,0,.3);padding:.5rem;border-radius:8px">
        💡 Fixtures + Livescores + AI hazitegemei key hii — zinatumia TheSportsDB (bure). Key hii inaongeza live stats za ziada tu.
      </div>
      <input class="inp" id="apisports-key" placeholder="Paste API-Sports key hapa (optional)..." style="margin-bottom:8px" value="${APISPORTS_KEY}"/>
      <button onclick="window._saveApiSports()" class="btn-ghost" style="border-color:var(--warn);color:var(--warn);margin-bottom:8px">💾 Hifadhi API-Sports Key</button>
      <div style="font-size:11px;color:var(--muted)">Pata key bure (100 req/siku): <a href="https://dashboard.api-sports.io" target="_blank" style="color:var(--warn)">dashboard.api-sports.io</a></div>
    </div>
    <div class="card" style="border-color:rgba(77,166,255,.3);margin-top:.75rem">
      <div style="font-size:12px;font-weight:700;color:var(--info);margin-bottom:6px">🤖 OpenRouter AI — Betslip OCR</div>
      <div style="font-size:11px;margin-bottom:8px;color:${GEMINI_KEY?'var(--win)':'var(--muted)'}">
        ${GEMINI_KEY?'✅ Key ipo':'⚠️ Hakuna key — OCR haifanyi kazi'}
      </div>
      <input class="inp" id="gemini-key" placeholder="Paste OpenRouter API key hapa (sk-or-v1-...)" style="margin-bottom:8px" value="${GEMINI_KEY}"/>
      <button onclick="window._saveGemini()" class="btn-ghost">💾 Hifadhi OpenRouter Key</button>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">Pata key bure: <a href="https://openrouter.ai/keys" target="_blank" style="color:var(--accent)">openrouter.ai/keys</a></div>
    </div>`;

  window._role=async(uid,role)=>{await sb.from('users').update({role}).eq('id',uid);toast(`Role → ${ROLES[role]}`);};
  window._saveGemini=()=>{GEMINI_KEY=el('gemini-key')?.value?.trim()||'';localStorage.setItem('njem_or_key',GEMINI_KEY);localStorage.removeItem('njem_gemini_key');toast(GEMINI_KEY?'✅ OpenRouter key imehifadhiwa!':'Key ni empty','warn');renderAdmin(c);};
  window._saveApiSports=()=>{
    APISPORTS_KEY=el('apisports-key')?.value?.trim()||'';
    localStorage.setItem('njem_apisports_key',APISPORTS_KEY);
    toast(APISPORTS_KEY?`✅ Key imehifadhiwa! (${APISPORTS_KEY.slice(0,8)}...)`:'Key ni empty','warn');
    if(APISPORTS_KEY) fetchLiveScores();
    renderAdmin(c);
  };
  window._adSettle=async(mkId,newStatus,userId,potReturn,stake)=>{
    await sb.from('mikeka').update({status:newStatus}).eq('id',mkId);
    if(newStatus==='WON'){
      const gain=(potReturn||0)-(stake||0);
      const{data:u}=await sb.from('users').select('bankroll').eq('id',userId).maybeSingle();
      if(u){const nb=(u.bankroll||0)+gain;await sb.from('users').update({bankroll:nb}).eq('id',userId);if(userId===currentUser.id)await updateUser({bankroll:nb});}
      toast(`✅ WON! +TZS ${fmt(gain)}`,'ok');
    }else{toast(`Settled: ${newStatus}`);}
    await loadData();renderAdmin(c);
  };
  window._adMatchOut=async(mkId,matchId,outcome,userId,potReturn,stake)=>{
    await sb.from('matches').update({outcome}).eq('id',matchId);
    const{data:fm}=await sb.from('matches').select('*').eq('mkeka_id',mkId);
    const allDone=(fm||[]).every(m=>m.outcome&&m.outcome!=='PENDING');
    if(allDone){
      const hasLoss=(fm||[]).some(m=>m.outcome==='LOSS'),allVoid=(fm||[]).every(m=>m.outcome==='VOID');
      const ns=hasLoss?'LOST':allVoid?'VOID':'WON';
      await sb.from('mikeka').update({status:ns}).eq('id',mkId);
      if(ns==='WON'){
        const gain=(potReturn||0)-(stake||0);
        const{data:u}=await sb.from('users').select('bankroll').eq('id',userId).maybeSingle();
        if(u){const nb=(u.bankroll||0)+gain;await sb.from('users').update({bankroll:nb}).eq('id',userId);if(userId===currentUser.id)await updateUser({bankroll:nb});}
        toast(`🎉 WON! +TZS ${fmt(gain)}`,'ok');
      }else{toast(`Settled: ${ns}`);}
    }else{toast(`Match → ${outcome}`,'info');}
    await loadData();renderAdmin(c);
  };
}

// ═══════════════════════════════════════
// AUTO LOGIN — Check saved session
// ═══════════════════════════════════════
async function checkSavedSession() {
  try {
    const saved = localStorage.getItem('njem_session');
    if (!saved) { showAuth('login'); return; }
    const savedUser = JSON.parse(saved);
    if (!savedUser || !savedUser.id) { showAuth('login'); return; }
    // Verify user still exists in Supabase + get fresh data
    const { data, error } = await sb.from('users').select('*').eq('id', savedUser.id).maybeSingle();
    if (error || !data) {
      localStorage.removeItem('njem_session');
      showAuth('login');
      return;
    }
    // Auto login with fresh data
    await loginUser(data);
  } catch(e) {
    showAuth('login');
  }
}

// Global handlers
window._showMatchDetails = (teams, eventId) => showMatchDetailsModal(teams, eventId);
window._showFixtures = () => showFixtureBrowser();
window._aiAnalysis = (teams, mid) => {
  readInps();
  const match = pMatches.find(m => m._id === mid);
  const teamsStr = match ? match.teams : teams;
  if (!teamsStr || !teamsStr.includes(' vs ')) return toast('Jaza jina la timu kwanza!', 'warn');
  showAIAnalysis(teamsStr);
};

// BOOT — Check saved session first
checkSavedSession();
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
