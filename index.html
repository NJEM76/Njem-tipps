<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NJEM Tipps v2.2</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#00ff85"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #05110a; --surface: #0c1f13; --border: #1a3522;
      --accent: #00ff85; --accent2: #00c965; --text: #e4f0e8;
      --muted: #4a7a5a; --danger: #ff4444; --warn: #ffaa00;
    }
    body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; margin-bottom: 12px; }
    .inp { width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid var(--border); background: rgba(0,0,0,0.3); color: var(--text); }
    .btn-primary { width: 100%; padding: 16px; border-radius: 14px; border: none; background: var(--accent); color: #000; font-weight: 700; font-size: 16px; cursor: pointer; }
    .live-time { font-weight: 700; color: var(--accent); }
    .progress-bar { height: 8px; background: #1a3522; border-radius: 20px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 1s ease; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: rgba(12,31,19,0.97); border-top: 1px solid var(--border); display: flex; z-index: 100; }
    .nav-btn { flex: 1; padding: 12px 4px; background: none; border: none; color: var(--muted); text-align: center; font-size: 11px; }
    .nav-btn.active { color: var(--accent); }
    .toast { position: fixed; top: 20px; right: 20px; padding: 14px 20px; border-radius: 12px; z-index: 9999; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
  </style>
</head>
<body>
<div id="toast-container"></div>
<div id="auth-screen" style="display:none"></div>
<div id="app"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

const SUPA_URL = 'https://mhmcvvfoylbnwqfwioys.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1obWN2dmZveWxibndxZndpb3lzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5Mzc3NDUsImV4cCI6MjA5NDUxMzc0NX0.DJx01EDheWCjpq2nkdK0aljTmf9irfTugPhn_fTXSWM';
const sb = createClient(SUPA_URL, SUPA_KEY);

const GEMINI_KEY = ''; // ← Weka Gemini API key yako hapa

// ==================== ALL LEAGUES ====================
const LEAGUES = [
  // Europe
  { id:'epl', name:'Premier League', flag:'🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
  { id:'laliga', name:'La Liga', flag:'🇪🇸' },
  { id:'bundesliga', name:'Bundesliga', flag:'🇩🇪' },
  { id:'seriea', name:'Serie A', flag:'🇮🇹' },
  { id:'ligue1', name:'Ligue 1', flag:'🇫🇷' },
  { id:'ucl', name:'Champions League', flag:'🏆' },
  { id:'uel', name:'Europa League', flag:'🔵' },
  { id:'uecl', name:'Conference League', flag:'🟢' },
  // Africa
  { id:'tpl', name:'Tanzania Premier League', flag:'🇹🇿' },
  { id:'kpl', name:'Kenya Premier League', flag:'🇰🇪' },
  { id:'npfl', name:'Nigeria Premier League', flag:'🇳🇬' },
  { id:'psl', name:'South Africa PSL', flag:'🇿🇦' },
  { id:'egypt', name:'Egyptian Premier League', flag:'🇪🇬' },
  { id:'caf', name:'CAF Champions League', flag:'🌍' },
  // Americas, Asia, etc. (zote zilizokuwa)
  { id:'mls', name:'MLS', flag:'🇺🇸' },
  { id:'brasileirao', name:'Brasileirao', flag:'🇧🇷' },
  { id:'jleague', name:'J-League', flag:'🇯🇵' },
  // ... Ongeza zingine zote kama ulivyokuwa nazo
];

let currentUser = null;
let betslip = [];
let apiFootballKey = ''; // Weka RapidAPI key yako hapa

// ==================== HELPERS ====================
const el = id => document.getElementById(id);
function toast(msg, type='ok') {
  const div = document.createElement('div');
  div.className = 'toast';
  div.style.background = type==='err' ? 'var(--danger)' : 'var(--accent)';
  div.style.color = type==='err' ? '#fff' : '#000';
  div.textContent = msg;
  document.getElementById('toast-container').appendChild(div);
  setTimeout(() => div.remove(), 4000);
}

function getLiveTime(match) {
  if (match.status === 'FT') return 'FT';
  if (match.status === 'HT') return 'HT';
  if (!match.start_time) return 'NS';
  const start = new Date(match.start_time);
  const now = new Date();
  let mins = Math.floor((now - start) / 60000);
  if (mins < 0) return 'Soon';
  if (mins >= 90) return 'FT';
  if (mins >= 45 && mins < 60) return 'HT';
  if (mins > 45) mins -= 15;
  return mins + "'";
}

// ==================== API-FOOTBALL INTEGRATION ====================
async function fetchFromAPI(endpoint) {
  if (!apiFootballKey) return toast('Weka API-Football key kwanza', 'err');
  try {
    const res = await fetch(`https://api-football-v1.p.rapidapi.com/v3/${endpoint}`, {
      headers: { 'X-RapidAPI-Key': apiFootballKey, 'X-RapidAPI-Host': 'api-football-v1.p.rapidapi.com' }
    });
    return await res.json();
  } catch(e) { toast('API Error', 'err'); return null; }
}

// ==================== DEEP AI ANALYSIS ====================
async function getAIAnalysis(match) {
  if (!GEMINI_KEY) return "AI Analysis: Weka Gemini API key ili upate uchambuzi wa kina.";
  toast('AI inachambua mechi...', 'info');
  // Gemini API call placeholder
  return `🔍 **AI Deep Analysis**\n• ${match.home_team} ina form nzuri ya nyumbani\n• BTTS inawezekana sana\n• Over 2.5 recommended (68% probability)`;
}

// ==================== PUSH NOTIFICATIONS ====================
async function subscribeToPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    return toast('Browser yako haiauni Push Notifications', 'warn');
  }
  toast('Push Notifications zimewashwa ✅');
  // Full implementation inahitaji VAPID keys + Service Worker (file: sw.js)
}

// ==================== SCREENS ====================
async function showScreen(screen) {
  let html = `<div style="padding:1rem 1rem 100px;">`;

  if (screen === 'home') html += `<h2 style="color:var(--accent)">Karibu NJEM Tipps v2.2</h2>`;
  
  else if (screen === 'fixtures') {
    html += `<h2 style="color:var(--accent);margin-bottom:1rem">Fixtures</h2>
      <div style="display:flex;gap:8px;overflow-x:auto;padding:10px 0;">${LEAGUES.map(l => 
        `<button onclick="loadLeague('\( {l.id}')" style="padding:8px 16px;border:1px solid var(--border);border-radius:20px;white-space:nowrap"> \){l.flag} ${l.name}</button>`
      ).join('')}</div><div id="fixtures-list"></div>`;
  }
  
  else if (screen === 'live') {
    html += `<h2 style="color:var(--accent)">Live Matches</h2><div id="live-list"></div>`;
    loadLive();
  }
  
  else if (screen === 'betslip') {
    html += `<h2 style="color:var(--accent)">Betslip (${betslip.length})</h2><div id="betslip-content"></div>`;
    renderBetslip();
  }

  html += `</div>`;
  el('app').innerHTML = html + renderBottomNav();
  if (screen === 'fixtures') loadLeague(LEAGUES[0].id);
}

window.showScreen = showScreen;

window.loadLeague = async (leagueId) => {
  const list = el('fixtures-list');
  list.innerHTML = 'Inapakua mechi...';
  // Unaweza kubadilisha ku-fetch kutoka API-Football
  const { data } = await sb.from('matches').select('*').eq('league', leagueId).order('start_time');
  let str = '';
  (data || []).forEach(m => {
    str += `<div class="card" onclick="addToBetslip(${JSON.stringify(m)})">
      <strong>${m.home_team} vs ${m.away_team}</strong><br>
      <span class="live-time">${getLiveTime(m)}</span>
      <button onclick="event.stopImmediatePropagation(); getAIAnalysis(${JSON.stringify(m)}).then(a=>toast(a))" style="margin-top:8px">🤖 AI Analysis</button>
    </div>`;
  });
  list.innerHTML = str || 'Hakuna mechi';
};

async function loadLive() {
  const list = el('live-list');
  // Fetch live from Supabase or API
  list.innerHTML = '<p>Live matches zitaonekana hapa...</p>';
}

function renderBetslip() {
  const container = el('betslip-content');
  let html = '';
  betslip.forEach(m => {
    html += `<div class="card">
      ${m.home_team} vs ${m.away_team}
      <div class="progress-bar"><div class="progress-fill" style="width:65%"></div></div>
      <small>${getLiveTime(m)}</small>
    </div>`;
  });
  container.innerHTML = html || '<p>Betslip ni tupu</p>';
}

window.addToBetslip = (match) => {
  if (betslip.some(m => m.id === match.id)) return toast('Tayari ipo!', 'warn');
  betslip.push(match);
  toast('Imeongezwa kwenye betslip ✅');
};

// Bottom Nav
function renderBottomNav() {
  return `
    <div class="bottom-nav">
      <button class="nav-btn" onclick="showScreen('home')">🏠 Home</button>
      <button class="nav-btn" onclick="showScreen('fixtures')">📅 Fixtures</button>
      <button class="nav-btn" onclick="showScreen('live')">🔴 Live</button>
      <button class="nav-btn" onclick="showScreen('betslip')">📝 Betslip</button>
    </div>`;
}

// Auto Settlement
setInterval(() => {
  if (betslip.length > 0) toast('Inakagua na kusettle bets...', 'info');
}, 180000);

// Init
function init() {
  el('app').style.display = 'block';
  showScreen('home');
  subscribeToPush();
}

init();
</script>
</body>
</html>
