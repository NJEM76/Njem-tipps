// Fetch live scores for today's matches
// API-Sports fetch helper
async function apiSportsFetch(endpoint) {
  if (!APISPORTS_KEY) return null;
  try {
    const url = `https://v3.football.api-sports.io${endpoint}`;
    const res = await fetch(url, {
      method: 'GET',
      headers: {
        'x-apisports-key': APISPORTS_KEY
      }
    });
    if (!res.ok) {
      console.warn('API-Sports HTTP error:', res.status, url);
      return null;
    }
    const json = await res.json();
    if (json.errors && Object.keys(json.errors).length > 0) {
      console.warn('API-Sports error response:', JSON.stringify(json.errors));
      return null;
    }
    return json;
  } catch(e) {
    console.warn('API-Sports fetch exception:', e.message);
    return null;
  }
}
// apiSports() alias - used in fixture browser
async function apiSports(endpoint) {
  const ep = endpoint.startsWith('/') ? endpoint : '/' + endpoint;
  return apiSportsFetch(ep);
}

async function fetchLiveScores() {
  // PRIMARY: TheSportsDB (FREE, no key needed) — inafanya kazi kila wakati

  // BONUS: API-Sports kama ipo key — inaongeza data zaidi lakini si lazima
  if (APISPORTS_KEY) {
    await fetchLiveScoresApiSports();
  }
}

// TheSportsDB FREE — msingi wa livescores bila key
async function fetchLiveScoresFree() {
  try {
    const today = new Date().toISOString().split('T')[0];
    // Fetch general soccer events AND live events endpoint
    const [res1, res2] = await Promise.allSettled([
      fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/eventsday.php?d=${today}&s=Soccer`),
      fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/livescore.php?s=Soccer`)
    ]);
    const data1 = res1.status==='fulfilled' && res1.value.ok ? await res1.value.json() : {events:[]};
    const data2 = res2.status==='fulfilled' && res2.value.ok ? await res2.value.json() : {events:[]};
    // Merge, deduplicate by event ID
    const evMap = {};
    [...(data1.events||[]), ...(data2.events||[])].forEach(ev => {
      if(ev.idEvent) evMap[ev.idEvent] = ev;
    });
    const events = Object.values(evMap);
    const nowMs = Date.now();
    events.forEach(ev => {
      if (!ev.strHomeTeam || !ev.strAwayTeam) return;
      const st = (ev.strStatus || '').trim();
      const isLive = ['1H','2H','HT','ET','In Progress','Live','LIVE','Extra Time','Penalties'].includes(st) 
                    || (st.includes('HT') || st === 'INT');
      const isFinished = ['FT','AET','PEN','Match Finished','Full Time','After Extra Time'].includes(st)
                        || st.startsWith('FT') || st.startsWith('AET');
      
      // Parse minute from strProgress — could be "45", "45+2", "HT", etc.
      let minuteNum = 0;
      let minuteDisplay = '';
      if (st === 'HT') { minuteDisplay = 'HT'; minuteNum = 45; }
      else if (isLive && ev.strProgress) {
        const prog = ev.strProgress.toString().trim();
        const base = parseInt(prog.split('+')[0]) || 0;
        minuteNum = base;
        minuteDisplay = prog.includes('+') ? prog + "'" : prog + "'";
      } else if (isLive) { minuteDisplay = 'LIVE'; minuteNum = 0; }
      else if (isFinished) { minuteDisplay = 'FT'; }

      const scoreData = {
        home: ev.intHomeScore !== null ? ev.intHomeScore : '-',
        away: ev.intAwayScore !== null ? ev.intAwayScore : '-',
        homeTeam: ev.strHomeTeam,
        awayTeam: ev.strAwayTeam,
        minute: minuteDisplay,
        minuteNum,
        status: st,
        league: ev.strLeague || '',
        leagueLogo: ev.strLeagueBadge || '',
        country: ev.strCountry || '',
        fixtureId: ev.idEvent,
        time: ev.strTime ? ev.strTime.slice(0,5) : '',
        date: ev.dateEvent || today,
        fetchedAt: nowMs,
        isLive, isFinished,
        isUpcoming: !isLive && !isFinished,
      };
      const k1 = `${ev.strHomeTeam} vs ${ev.strAwayTeam}`.toLowerCase();
      const k2 = `${ev.strAwayTeam} vs ${ev.strHomeTeam}`.toLowerCase();
      liveScores[k1] = scoreData;
      liveScores[k2] = scoreData;
    });
    lastLiveFetch = Date.now();
    await autoSettleMatches();
    if (['results','mikeka','home'].includes(currentTab)) refreshLiveUI();
    if (currentTab === 'home') renderLiveSection();
    if (currentTab === 'fixtures') renderFixtures(el('content'));
  } catch(e) {
    console.log('TheSportsDB livescores error:', e.message);
  }
}

// Find score for a match by team names
function findScore(teamsStr) {
  if (!teamsStr) return null;
  const key = teamsStr.toLowerCase().trim();
  // Direct match
  if (liveScores[key]) return liveScores[key];
  // Partial match
  for (const [k, v] of Object.entries(liveScores)) {
    const parts = key.split(' vs ');
    if (parts.length === 2) {
      const home = parts[0].trim().toLowerCase();
      const away = parts[1].trim().toLowerCase();
      if (k.includes(home) || k.includes(away)) return v;
    }
  }
  return null;
}

// Auto-settle betslip matches that are finished
async function autoSettleMatches() {
  if (!currentUser) return;
  const pendingMikeka = mikeka.filter(m => m.status === 'PENDING');
  
  for (const mk of pendingMikeka) {
    const matches = mk.matches || [];
    let allSettled = true;
    let needsUpdate = false;
    
    for (const match of matches) {
      if (match.outcome !== 'PENDING') continue;
      
      const score = findScore(match.teams);
      if (!score || !score.isFinished) { allSettled = false; continue; }
      
      // Determine outcome based on market and pick
      const outcome = determineOutcome(match, score);
      if (outcome) {
        await sb.from('matches').update({ outcome }).eq('id', match.id);
        match.outcome = outcome;
        needsUpdate = true;
        toast(`✅ Auto: ${match.teams} — ${outcome}`, 'info');
      } else {
        allSettled = false;
      }
    }
    
    // Check if whole mkeka is settled
    if (needsUpdate) {
      const { data: freshMatches } = await sb.from('matches').select('*').eq('mkeka_id', mk.id);
      const allDone = (freshMatches || []).every(m => m.outcome !== 'PENDING');
      if (allDone) {
        const hasLoss = (freshMatches || []).some(m => m.outcome === 'LOSS');
        const allVoid = (freshMatches || []).every(m => m.outcome === 'VOID');
        const newStatus = hasLoss ? 'LOST' : allVoid ? 'VOID' : 'WON';
        await sb.from('mikeka').update({ status: newStatus }).eq('id', mk.id);
        if (newStatus === 'WON') {
          const gain = (mk.potential_return || 0) - (mk.stake || 0);
          await updateUser({ bankroll: currentUser.bankroll + gain });
          // Push notification
          showNotification('🎉 Mkeka Umeshinda!', `+TZS ${fmt(gain)} — ${mk.name}`);
          toast(`🎉 AUTO WIN! +TZS ${fmt(gain)}`, 'ok');
        } else if (newStatus === 'LOST') {
          showNotification('❌ Mkeka Umepoteza', mk.name || 'Mkeka');
        }
        await loadData();
      }
    }
  }
}

// Determine match outcome from score
function determineOutcome(match, score) {
  const home = parseInt(score.home) || 0;
  const away = parseInt(score.away) || 0;
  const total = home + away;
  const market = match.market || '';
  const pick = (match.pick || '').toLowerCase().trim();
  
  try {
    // 1X2
    if (market === '1X2') {
      const result = home > away ? '1' : away > home ? '2' : 'X';
      return result === pick ? 'WIN' : 'LOSS';
    }
    // Double Chance
    if (market === 'Double Chance') {
      const result = home > away ? '1' : away > home ? '2' : 'X';
      if (pick === '1x' || pick === 'x1') return (result==='1'||result==='X') ? 'WIN' : 'LOSS';
      if (pick === '12') return (result==='1'||result==='2') ? 'WIN' : 'LOSS';
      if (pick === 'x2' || pick === '2x') return (result==='2'||result==='X') ? 'WIN' : 'LOSS';
    }
    // Draw No Bet
    if (market === 'Draw No Bet') {
      if (home === away) return 'VOID';
      const result = home > away ? '1' : '2';
      return result === pick ? 'WIN' : 'LOSS';
    }
    // Over/Under
    if (market.startsWith('Over ') || market.startsWith('Under ')) {
      const line = parseFloat(market.split(' ')[1]);
      if (market.startsWith('Over ')) return total > line ? 'WIN' : 'LOSS';
      if (market.startsWith('Under ')) return total < line ? 'WIN' : 'LOSS';
    }
    // BTTS
    if (market === 'BTTS - Yes') return (home > 0 && away > 0) ? 'WIN' : 'LOSS';
    if (market === 'BTTS - No') return (home === 0 || away === 0) ? 'WIN' : 'LOSS';
    // HT markets - cannot auto-settle without HT score
    return null;
  } catch(e) {
    return null;
  }
}

// Push notification
function showNotification(title, body) {
  if (!('Notification' in window)) return;
  if (Notification.permission === 'granted') {
    new Notification(title, { body, icon: '/icon-192.png' });
  } else if (Notification.permission !== 'denied') {
    Notification.requestPermission().then(p => {
      if (p === 'granted') new Notification(title, { body, icon: '/icon-192.png' });
    });
  }
}

// Cash out alert
function checkCashoutAlerts() {
  const pendingMikeka = mikeka.filter(m => m.status === 'PENDING');
  pendingMikeka.forEach(mk => {
    const matches = mk.matches || [];
    let wonCount = 0, pendingCount = 0;
    
    matches.forEach(match => {
      if (match.outcome === 'WIN') wonCount++;
      if (match.outcome === 'PENDING') {
        const score = findScore(match.teams);
        if (score && score.isLive) pendingCount++;
      }
    });
    
    // If more than 70% of matches won and rest are live
    const pct = wonCount / matches.length;
    if (pct >= 0.7 && pendingCount > 0) {
      showNotification('💰 CASHOUT ALERT!', `${mk.name}: ${wonCount}/${matches.length} zimeshinda — Fikiria cashout!`);
      toast(`💰 CASHOUT: ${mk.name} — ${wonCount}/${matches.length} WIN!`, 'warn');
    }
  });
}

// Refresh live scores in UI
function refreshLiveUI() {
  // Update live badges on visible cards
  document.querySelectorAll('[data-teams]').forEach(el => {
    const teams = el.dataset.teams;
    const score = findScore(teams);
    if (score && score.isLive) {

      el.innerHTML = `<span style="color:var(--muted);font-size:11px">FT: ${score.home}-${score.away}</span>`;
    }
  });
}

async function fetchTeamForm(teamName) {
  try {
    // TheSportsDB tu — bure, bila API key, bila quota
    const res = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(teamName)}`);
    const data = await res.json();
    const team = (data.teams||[])[0];
    if (!team) return null;
    const res2 = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/eventslast.php?id=${team.idTeam}`);
    const data2 = await res2.json();
    return { team, events: (data2.results||[]).slice(0,5) };
  } catch(e) { return null; }
}

async function fetchH2H(homeTeam, awayTeam) {
  try {
    // TheSportsDB tu — bure, bila API key, bila quota
    const [homeData, awayData] = await Promise.all([
      fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(homeTeam)}`).then(r=>r.json()),
      fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(awayTeam)}`).then(r=>r.json()),
    ]);
    const homeId = (homeData.teams||[])[0]?.idTeam;
    const awayId = (awayData.teams||[])[0]?.idTeam;
    if (!homeId || !awayId) return [];
    const res = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/eventsh2h.php?idHomeTeam=${homeId}&idAwayTeam=${awayId}`);
    const data = await res.json();
    return (data.results||[]).slice(0,5);
  } catch(e) { return []; }
}

function analyzeForm(events, teamName) {
  if (!events || !events.length) return { wins:0, draws:0, losses:0, goalsFor:0, goalsAgainst:0, form:[] };
  let wins=0, draws=0, losses=0, goalsFor=0, goalsAgainst=0, form=[];
  events.forEach(ev => {
    const isHome = ev.strHomeTeam?.toLowerCase().includes(teamName.toLowerCase().split(' ')[0]);
    const hg = parseInt(ev.intHomeScore)||0;
    const ag = parseInt(ev.intAwayScore)||0;
    const gf = isHome ? hg : ag;
    const ga = isHome ? ag : hg;
    goalsFor += gf; goalsAgainst += ga;
    if (gf > ga) { wins++; form.push('W'); }
    else if (gf === ga) { draws++; form.push('D'); }
    else { losses++; form.push('L'); }
  });
  return { wins, draws, losses, goalsFor, goalsAgainst, form };
}

function analyzeH2H(h2hEvents, homeTeam) {
  if (!h2hEvents || !h2hEvents.length) return null;
  let homeWins=0, awayWins=0, draws=0, totalGoals=0;
  h2hEvents.forEach(ev => {
    const hg = parseInt(ev.intHomeScore)||0;
    const ag = parseInt(ev.intAwayScore)||0;
    totalGoals += hg + ag;
    const isHome = ev.strHomeTeam?.toLowerCase().includes(homeTeam.toLowerCase().split(' ')[0]);
    if (hg > ag) isHome ? homeWins++ : awayWins++;
    else if (hg < ag) isHome ? awayWins++ : homeWins++;
    else draws++;
  });
  return {
    homeWins, awayWins, draws,
    avgGoals: (totalGoals / h2hEvents.length).toFixed(1),
    total: h2hEvents.length
  };
}

function generateAIRecommendations(homeTeam, awayTeam, homeStats, awayStats, h2h) {
  const recs = [];
  const totalHomeGoals = homeStats.goalsFor + homeStats.goalsAgainst;
  const totalAwayGoals = awayStats.goalsFor + awayStats.goalsAgainst;
  const avgTotalGoals = homeStats.form.length ? (totalHomeGoals / homeStats.form.length) : 0;
  const avgAwayGoals = awayStats.form.length ? (totalAwayGoals / awayStats.form.length) : 0;
  const avgGoals = (avgTotalGoals + avgAwayGoals) / 2;
  const h2hAvgGoals = h2h ? parseFloat(h2h.avgGoals) : 0;

  // Over/Under recommendation
  const goalAvg = h2h ? (h2hAvgGoals + avgGoals) / 2 : avgGoals;
  if (goalAvg > 2.5) {
    recs.push({
      icon: '⚽',
      market: `Over 2.5 Goals`,
      pick: 'Over 2.5',
      confidence: Math.min(Math.round(55 + (goalAvg - 2.5) * 10), 78),
      reason: `Wastani wa magoli ${goalAvg.toFixed(1)} kwa mechi. ${h2h ? `H2H avg ${h2hAvgGoals} magoli.` : ''}`,
      type: goalAvg > 3 ? 'best' : 'ok'
    });
  } else {
    recs.push({
      icon: '🔒',
      market: `Under 2.5 Goals`,
      pick: 'Under 2.5',
      confidence: Math.min(Math.round(55 + (2.5 - goalAvg) * 8), 72),
      reason: `Mechi za hivi karibuni zina magoli machache. Avg ${goalAvg.toFixed(1)}.`,
      type: goalAvg < 1.8 ? 'best' : 'ok'
    });
  }

  // 1X2 / Double Chance recommendation
  const homeWinRate = homeStats.form.length ? homeStats.wins / homeStats.form.length : 0;
  const awayWinRate = awayStats.form.length ? awayStats.wins / awayStats.form.length : 0;
  const h2hHomeDominance = h2h ? h2h.homeWins / h2h.total : 0.5;

  if (homeWinRate > 0.6 && h2hHomeDominance > 0.4) {
    recs.push({
      icon: '🏠',
      market: 'Double Chance 1X',
      pick: '1X',
      confidence: Math.min(Math.round(55 + homeWinRate * 20), 75),
      reason: `${homeTeam} wameshinda ${Math.round(homeWinRate*100)}% ya mechi zao za hivi karibuni. H2H wanaongoza ${h2h?h2h.homeWins:0}/${h2h?h2h.total:0}.`,
      type: homeWinRate > 0.7 ? 'best' : 'ok'
    });
  } else if (awayWinRate > 0.6) {
    recs.push({
      icon: '✈️',
      market: 'Double Chance X2',
      pick: 'X2',
      confidence: Math.min(Math.round(52 + awayWinRate * 18), 72),
      reason: `${awayTeam} wana form nzuri — wameshinda ${Math.round(awayWinRate*100)}% ya mechi zao.`,
      type: awayWinRate > 0.7 ? 'best' : 'ok'
    });
  } else {
    recs.push({
      icon: '⚖️',
      market: 'Double Chance 1X',
      pick: '1X',
      confidence: 55,
      reason: 'Mechi usawa — Double Chance ni salama zaidi kuliko 1X2 moja kwa moja.',
      type: 'ok'
    });
  }

  // BTTS recommendation
  const homeScoredIn = homeStats.goalsFor > 0;
  const awayScoredIn = awayStats.goalsFor > 0;
  const homeConcedeRate = homeStats.form.length ? homeStats.goalsAgainst / homeStats.form.length : 1;
  const awayConcedeRate = awayStats.form.length ? awayStats.goalsAgainst / awayStats.form.length : 1;

  if (homeConcedeRate > 0.8 && awayConcedeRate > 0.8) {
    recs.push({
      icon: '🎯',
      market: 'BTTS - Yes',
      pick: 'BTTS Yes',
      confidence: Math.min(Math.round(55 + (homeConcedeRate + awayConcedeRate) * 5), 73),
      reason: `${homeTeam} wapoteza avg ${homeConcedeRate.toFixed(1)} kwa mechi. ${awayTeam} avg ${awayConcedeRate.toFixed(1)}. Pande zote zinaweza kuscore.`,
      type: homeConcedeRate > 1 && awayConcedeRate > 1 ? 'best' : 'ok'
    });
  }

  // Sort by confidence
  recs.sort((a, b) => b.confidence - a.confidence);
  return recs.slice(0, 4);
}

}

function statRow(label, homeVal, awayVal, homePct) {
  const pct = typeof homePct === 'number' ? Math.min(Math.max(homePct, 5), 95) : 50;
  return `
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
        <span style="font-weight:600;color:var(--accent)">${homeVal}</span>
        <span style="color:var(--muted);font-size:11px">${label}</span>
        <span style="font-weight:600;color:var(--text)">${awayVal}</span>
      </div>
      <div style="background:rgba(0,0,0,.4);border-radius:20px;height:6px;overflow:hidden;display:flex">
        <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:20px;transition:width .8s"></div>
      </div>
    </div>`;
}

function formatForm(formStr) {
  if (!formStr) return '';
  return formStr.split('').map(c => {
    const col = c==='W'?'var(--win)':c==='L'?'var(--loss)':'var(--warn)';
    return `<span style="color:${col};font-weight:700;font-size:11px">${c}</span>`;
  }).join(' ');
}

function generateMatchAI(score, stats) {
  const tips = [];
  const home = score.homeTeam || 'Home';
  const away = score.awayTeam || 'Away';
  const h = parseInt(score.home) || 0;
  const a = parseInt(score.away) || 0;
  const total = h + a;
  const min = score.minuteNum || 0;

  if (score.isLive) {
    // Live recommendations
    if (total === 0 && min > 60) tips.push({icon:'💡',msg:`${min}+ dakika bila goli — Over 0.5 inaweza kuwa risky`});
    if (total >= 2 && min < 70) tips.push({icon:'🔥',msg:`Magoli ${total} tayari — Over ${total}.5 inawezekana kabla FT`});
    if (h > a + 1) tips.push({icon:'💰',msg:`${home} wanaongoza kwa ${h}-${a} — Fikiria cashout sasa`});
    if (a > h + 1) tips.push({icon:'💰',msg:`${away} wanaongoza kwa ${a}-${h} — Fikiria cashout sasa`});
    if (parseInt(stats.red_home) > 0) tips.push({icon:'🟥',msg:`${home} wana mchezaji nje — ${away} wana advantage`});
    if (parseInt(stats.red_away) > 0) tips.push({icon:'🟥',msg:`${away} wana mchezaji nje — ${home} wana advantage`});
    if (h === a && min > 75) tips.push({icon:'⚡',msg:`Sare ${h}-${a} dakika ${min} — Bonyeza kwa ${home} au ${away} kwa late goal`});
  } else if (score.isFinished) {
    tips.push({icon:'📊',msg:`Matokeo: ${home} ${h} - ${a} ${away}`});
    if (total > 3) tips.push({icon:'📈',msg:`Magoli ${total} — Over 2.5 ingelifaa kwenye mechi hii`});
    if (total < 2) tips.push({icon:'📉',msg:`Magoli ${total} tu — Under 2.5 ingelifaa`});
  } else {
    tips.push({icon:'⏳',msg:`Mechi hii bado haijachezwa — subiri kwa data zaidi`});
  }

  if (!tips.length) tips.push({icon:'📊',msg:'Data ya kutosha haipatikani kwa mapendekezo'});

  return tips.map(t => `
    <div style="display:flex;gap:8px;margin-bottom:6px;align-items:flex-start">
      <span style="font-size:14px">${t.icon}</span>
      <span style="font-size:12px;color:#5a9e70">${t.msg}</span>
    </div>`).join('');
}

// Start/stop live polling
function startLiveScores() {
  if (liveInterval) return;
  liveEnabled = true;
  fetchLiveScores(); // Immediate first fetch
  liveInterval = setInterval(() => {
    fetchLiveScores();
    checkCashoutAlerts();
  }, 30000); // Every 30 seconds for more real-time feel

  // Real-time minute counter — increments displayed minute every 60s based on fetchedAt
  liveMinuteInterval = setInterval(() => {
    const now = Date.now();
    let hasLive = false;
    Object.values(liveScores).forEach(s => {
      if (!s.isLive || !s.fetchedAt || s.minuteNum <= 0 || s.status === 'HT') return;
      hasLive = true;
      // Estimate current minute: base minuteNum + elapsed seconds since fetch / 60
      const elapsed = Math.floor((now - s.fetchedAt) / 60000);
      const estimated = Math.min(s.minuteNum + elapsed, s.minuteNum <= 45 ? 45 : 90);
      s._estimatedMinute = estimated;
    });
    if (hasLive && currentTab === 'home') renderLiveSection();
  }, 15000); // Update display every 15s

  console.log('✅ Live scores started — polling every 30s');
}

function stopLiveScores() {
  if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
  if (liveMinuteInterval) { clearInterval(liveMinuteInterval); liveMinuteInterval = null; }
  liveEnabled = false;
}

function getStreak(){
  const s=[...mikeka].filter(m=>m.status!=='PENDING'&&m.status!=='VOID');
  if(!s.length)return{type:'none',count:0};
  const t=s[0].status==='WON'?'WIN':'LOSS';let c=0;
  for(const m of s){if((m.status==='WON')===(t==='WIN'))c++;else break;}
  return{type:t,count:c};
}
function analyzeRisk(matches){
  const flags=[],tips=[];
  const totalOdds=matches.reduce((p,m)=>p*(parseFloat(m.odds)||1),1);
  if(matches.length>4)flags.push({icon:'⚠️',msg:`Mechi ${matches.length} — chances za kupoteza zinaongezeka`});
  if(totalOdds>20)flags.push({icon:'🔴',msg:`Odds ${totalOdds.toFixed(2)} ni kubwa mno!`});
  matches.forEach(m=>{
    if(parseFloat(m.odds)<1.2)flags.push({icon:'⚠️',msg:`${m.teams||'Mechi'}: Odds ${m.odds} — value si nzuri`});
    if(parseFloat(m.odds)>5)flags.push({icon:'🔴',msg:`${m.teams||'Mechi'}: Odds ${m.odds} — hatari!`});
  });
  const streak=getStreak();
  if(streak.type==='LOSS'&&streak.count>=2)flags.push({icon:'🚨',msg:`Loss streak ${streak.count} — fikiria vizuri!`});
  const lgMap={};
  mikeka.forEach(mk=>(mk.matches||[]).forEach(match=>{
    if(!lgMap[match.league])lgMap[match.league]={w:0,l:0,t:0};
    lgMap[match.league].t++;
    if(match.outcome==='WIN')lgMap[match.league].w++;
    if(match.outcome==='LOSS')lgMap[match.league].l++;
  }));
  matches.forEach(m=>{
    const lg=lgMap[m.league];
    if(lg&&lg.t>=3){
      const wr=(lg.w/lg.t)*100;
      if(wr<30)flags.push({icon:'📊',msg:`${lgName(m.league)}: Win rate ${wr.toFixed(0)}% — league hii inakuchania!`});
      if(wr>60)tips.push({icon:'✅',msg:`${lgName(m.league)}: Win rate ${wr.toFixed(0)}% — league nzuri kwako!`});
    }
  });
  const mkMap={};
  mikeka.forEach(mk=>(mk.matches||[]).forEach(match=>{
    if(!mkMap[match.market])mkMap[match.market]={w:0,t:0};
    mkMap[match.market].t++;
    if(match.outcome==='WIN')mkMap[match.market].w++;
  }));
  const best=Object.entries(mkMap).filter(([,v])=>v.t>=3).sort((a,b)=>(b[1].w/b[1].t)-(a[1].w/a[1].t))[0];
  if(best)tips.push({icon:'💡',msg:`Market bora kwako: ${best[0]} (${((best[1].w/best[1].t)*100).toFixed(0)}% win)`});
  return{flags,tips,totalOdds};
}
async function ocrImage(base64,mimeType){
  if(!GEMINI_KEY){toast('Weka OpenRouter API key kwenye Admin → Settings','err');return[];}
  try{
    const url='https://openrouter.ai/api/v1/chat/completions';
    const body={
      model:'meta-llama/llama-3.2-11b-vision-instruct:free',
      messages:[{
        role:'user',
        content:[
          {type:'text',text:`You are a sports betting slip reader. Extract ALL matches from this betslip image.
Return ONLY a valid JSON array, nothing else, no markdown:
[{"teams":"Team A vs Team B","market":"Double Chance","pick":"1X","odds":"1.75"}]
Always return valid JSON array even if unsure.`},
          {type:'image_url',image_url:{url:'data:'+mimeType+';base64,'+base64}}
        ]
      }],
      max_tokens:1000,
      temperature:0.1
    };
    const res=await fetch(url,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+GEMINI_KEY,
        'HTTP-Referer':'https://njem-tipps.netlify.app',
        'X-Title':'NJEM Tipps'
      },
      body:JSON.stringify(body)
    });
    if(!res.ok){
      const err=await res.json();
      toast('OpenRouter error: '+(err.error?.message||res.status),'err');
      return[];
    }
    const data=await res.json();
    const text=data.choices?.[0]?.message?.content||'[]';
    const clean=text.replace(/```json|```/g,'').trim();
    const match=clean.match(/\[[\s\S]*\]/);
    if(!match){toast('Mechi hazipatikani kwenye picha','warn');return[];}
    return JSON.parse(match[0]);
  }catch(e){
    console.error('OCR error:',e);
    toast('OCR imeshindwa: '+e.message,'err');
    return[];
  }
}

    </nav>`;
  window._logout=logout;window._tab=showTab;window._bk=showBankrollModal;
}
function updateNav(tab){
  document.querySelectorAll('.nav-icon').forEach(e=>{e.classList.remove('active');e.classList.add('inactive');});
  document.querySelectorAll('.nav-label').forEach(e=>e.classList.remove('active'));
  const ic=el('ni-'+tab),lb=el('nl-'+tab);
  if(ic){ic.classList.remove('inactive');ic.classList.add('active');}
  if(lb)lb.classList.add('active');
}
function showTab(tab){
  currentTab=tab;updateNav(tab);
  const s=getStreak(),b=el('streak-banner');
  if(b){
    if(s.type==='LOSS'&&s.count>=2){
      b.style.display='block';b.className=s.count>=LOSS_STREAK_LIMIT?'banner-danger':'banner-warn';
      b.textContent=s.count>=LOSS_STREAK_LIMIT?`🚨 SIMAMA! Loss streak ${s.count}! Pumzika leo`:`⚠️ Loss streak ${s.count}. Kuwa makini!`;
    }else b.style.display='none';
  }
  const c=el('content');c.className='fadeUp';void c.offsetWidth;
  if(tab==='home')renderHome(c);
  if(tab==='fixtures')renderFixtures(c);
  if(tab==='feed')renderFeed(c);
  if(tab==='mikeka')renderMikeka(c);
  if(tab==='post')renderPost(c);
  if(tab==='results')renderResults(c);
  if(tab==='reports')renderReports(c);
  if(tab==='admin')renderAdmin(c);
}

// BANKROLL MODAL
function showBankrollModal(){
  if(currentUser.role!=='owner')return toast('Wewe ni '+ROLES[currentUser.role]+' — huwezi kubadilisha bankroll','err');
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML=`
    <div class="modal-box">
      <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:4px">💰 Bankroll</div>
      <div style="font-size:28px;font-weight:800;color:var(--accent);margin-bottom:1rem">TZS ${fmt(currentUser.bankroll)}</div>
      <div class="grid-2" style="margin-bottom:1rem">
        <button onclick="window._bkAction('add')" style="padding:.75rem;border-radius:12px;border:none;background:var(--win);color:#000;font-weight:700;cursor:pointer;font-size:14px">➕ Ongeza</button>
        <button onclick="window._bkAction('withdraw')" style="padding:.75rem;border-radius:12px;border:none;background:var(--danger);color:#fff;font-weight:700;cursor:pointer;font-size:14px">➖ Toa</button>
      </div>
      <div id="bk-area"></div>
      <button onclick="this.closest('.modal-overlay').remove()" style="width:100%;padding:.65rem;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;margin-top:.5rem">Funga</button>
    </div>`;
  document.body.appendChild(ov);ov.onclick=(e)=>{if(e.target===ov)ov.remove();};
  window._bkAction=(type)=>{
    el('bk-area').innerHTML=`
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">${type==='add'?'Kiasi cha Kuongeza':'Kiasi cha Kutoa'} (TZS)</div>
      <input class="inp" id="bk-amt" type="number" placeholder="e.g. 10000" style="margin-bottom:8px"/>
      <input class="inp" id="bk-note" placeholder="Maelezo (Deposit / Withdraw)" style="margin-bottom:10px"/>
      <button onclick="window._bkConfirm('${type}')" style="width:100%;padding:.75rem;border-radius:12px;border:none;background:${type==='add'?'var(--win)':'var(--danger)'};color:${type==='add'?'#000':'#fff'};font-weight:700;cursor:pointer">${type==='add'?'Ongeza':'Toa'}</button>`;
  };
  window._bkConfirm=async(type)=>{
    const amt=parseFloat(el('bk-amt')?.value||0);
    if(!amt||amt<=0)return toast('Weka kiasi sahihi!','err');
    if(type==='withdraw'&&amt>currentUser.bankroll)return toast('Huna pesa za kutosha!','err');
    const newBk=type==='add'?currentUser.bankroll+amt:currentUser.bankroll-amt;
    await updateUser({bankroll:newBk});
    await sb.from('transactions').insert({id:uid(),user_id:currentUser.id,type,amount:amt,note:el('bk-note')?.value||'',balance_after:newBk}).catch(()=>{});
    toast(type==='add'?`✅ Imeongezwa TZS ${fmt(amt)}`:`✅ Imetolewa TZS ${fmt(amt)}`);
    ov.remove();showTab(currentTab);
  };
}

function renderLiveSection() {
  const sec = el('live-section');
  if (!sec) return;

  const allMatches = Object.values(liveScores);
  // deduplicate
  const seen = new Set();
  const unique = allMatches.filter(s => {
    const k = s.homeTeam + s.awayTeam;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });

  const liveOnly = unique.filter(s => s.isLive);
  const upcoming = unique.filter(s => s.isUpcoming).slice(0, 6);
  const finished = unique.filter(s => s.isFinished).slice(0, 4);

  if (!unique.length) {
    sec.innerHTML = `
      <div style="font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px">
        📅 Mechi za Leo
        <span style="margin-left:auto;font-size:10px;color:var(--muted);font-weight:400">Inapakia...</span>
      </div>
      <div class="center"><div class="spinner"></div></div>`;
    return;
  }

  const displayMatches = liveOnly.length ? liveOnly.slice(0, 10) : upcoming.slice(0, 6);
  const sectionTitle = liveOnly.length 
    ? `<span style="animation:pulse 1s infinite">🔴</span> Live Sasa Hivi (${liveOnly.length})` 
    : `📅 Mechi Za Leo (${upcoming.length} zinasubiri)`;

  // Time since last fetch
  const secAgo = lastLiveFetch ? Math.floor((Date.now() - lastLiveFetch) / 1000) : null;
  const freshLabel = secAgo !== null ? (secAgo < 60 ? `${secAgo}s iliyopita` : `${Math.floor(secAgo/60)}m iliyopita`) : 'Inapakia...';

  sec.innerHTML = `
    <div style="font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px">
      ${sectionTitle}
      <span style="margin-left:auto;font-size:10px;color:var(--muted);font-weight:400">🔄 ${freshLabel}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      ${displayMatches.map(s => {
        // Use estimated minute for live matches if available
        const displayMin = s.isLive 
          ? (s.status === 'HT' ? 'HT' : s._estimatedMinute ? `${s._estimatedMinute}'` : s.minute || 'LIVE')
          : '';
        return `
        <div onclick="window._showMatchDetails('${s.homeTeam.replace(/'/g,"\\'")  } vs ${s.awayTeam.replace(/'/g,"\\'")}','${s.fixtureId||''}')"
          style="background:var(--surface);border:1px solid ${s.isLive?'rgba(255,68,68,.4)':'var(--border)'};border-radius:12px;padding:.75rem;display:flex;justify-content:space-between;align-items:center;cursor:pointer">
          <div style="flex:1">
            <div style="font-size:12px;font-weight:600">${s.homeTeam}</div>
            <div style="font-size:10px;color:var(--muted);margin:2px 0">${s.league}</div>
            <div style="font-size:12px;font-weight:600">${s.awayTeam}</div>
          </div>
          <div style="text-align:center;min-width:80px">
            ${s.isLive ? `
              <div style="font-size:22px;font-weight:800;color:var(--danger);letter-spacing:2px">${s.home} - ${s.away}</div>
              <div style="font-size:10px;color:var(--danger);font-weight:700;animation:pulse 1s infinite">🔴 ${displayMin}</div>
            ` : s.isFinished ? `
              <div style="font-size:22px;font-weight:800;color:var(--muted);letter-spacing:2px">${s.home} - ${s.away}</div>
              <div style="font-size:10px;color:var(--muted)">FT</div>
            ` : `
              <div style="font-size:14px;font-weight:700;color:var(--text)">${s.time||'--:--'}</div>
              <div style="font-size:10px;color:var(--muted)">Inakuja</div>
            `}
          </div>
        </div>`}).join('')}
    </div>
    ${!displayMatches.length ? `<div style="text-align:center;padding:1.5rem;color:var(--muted);font-size:13px">
      <div style="font-size:32px;margin-bottom:8px">⏳</div>
      <div>Hakuna mechi za live sasa hivi</div>
      <div style="font-size:11px;margin-top:4px">Data inatoka TheSportsDB (update kila 30s)</div>
      <button onclick="window._tab('fixtures')" style="margin-top:10px;padding:.4rem 1rem;border-radius:20px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:11px;cursor:pointer">📅 Angalia Fixtures</button>
    </div>` : ''}
    ${finished.length > 0 && !liveOnly.length ? `
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px">✅ Zimekwisha Leo</div>
    ${finished.map(s => `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:.6rem .75rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;opacity:.75">
        <div style="flex:1"><div style="font-size:12px">${s.homeTeam} vs ${s.awayTeam}</div><div style="font-size:10px;color:var(--muted)">${s.league}</div></div>
        <div style="text-align:center"><div style="font-size:18px;font-weight:800;color:var(--muted)">${s.home} - ${s.away}</div><div style="font-size:10px;color:var(--muted)">FT</div></div>
      </div>`).join('')}` : ''}
  `;
}

function renderFixtures(c) {
  if (!fixSelectedDate) fixSelectedDate = new Date().toISOString().split('T')[0];
  // Extended dates: -2 days to +4 days = 7 total
  const dates = [-2,-1,0,1,2,3,4].map(d => {
    const dt = new Date(); dt.setDate(dt.getDate() + d);
    const label = d===-2?'Juzi-1':d===-1?'Jana':d===0?'Leo':d===1?'Kesho':dt.toLocaleDateString('sw-TZ',{weekday:'short',day:'numeric'});
    return { val: dt.toISOString().split('T')[0], label };
  });
  const regions = [...new Set(SPORTSDB_LEAGUES.map(l => l.region))];

  c.innerHTML = `
    <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:.75rem">📅 Fixtures</div>

    <!-- Date selector — scrollable -->
    <div style="display:flex;gap:6px;margin-bottom:.75rem;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch">
      ${dates.map(d => `
        <button onclick="window._fixPickDate('${d.val}')" id="fixd-${d.val}"
          style="padding:.4rem .85rem;border-radius:20px;border:1.5px solid ${d.val===fixSelectedDate?'var(--accent)':'var(--border)'};background:${d.val===fixSelectedDate?'rgba(0,255,133,.15)':'transparent'};color:${d.val===fixSelectedDate?'var(--accent)':'var(--muted)'};font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0">
          ${d.label}
        </button>`).join('')}
      <!-- Custom date input -->
      <label style="flex-shrink:0;display:flex;align-items:center;gap:4px;padding:.4rem .75rem;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap">
        📆 <input type="date" id="fix-custom-date" value="${fixSelectedDate}" style="border:none;background:transparent;color:var(--accent);font-size:12px;cursor:pointer;width:110px;outline:none" onchange="window._fixPickDate(this.value)"/>
      </label>
    </div>

    <!-- Search leagues -->
    <input class="inp" id="fix-search" placeholder="🔍 Tafuta ligi au nchi..." style="margin-bottom:.75rem;font-size:13px" value="${fixLeagueSearch||''}" oninput="window._fixSearch(this.value)"/>

    <!-- League selector by region -->
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Chagua Ligi (${SPORTSDB_LEAGUES.length})</div>
    <div id="fix-league-list">
    ${regions.map(r => {
      const leagues = SPORTSDB_LEAGUES.filter(l=>l.region===r);
      return `
      <div class="fix-region-block" data-region="${r}">
        <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:8px 0 4px">${r} (${leagues.length})</div>
        <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:4px">
          ${leagues.map(l => `
            <button onclick="window._fixPickLeague('${l.id}')" id="fixl-${l.id}"
              style="display:flex;align-items:center;gap:10px;padding:.6rem .85rem;border-radius:12px;border:1px solid ${fixSelectedLeague?.id===l.id?'var(--accent)':'var(--border)'};background:${fixSelectedLeague?.id===l.id?'rgba(0,255,133,.08)':'var(--surface)'};color:var(--text);cursor:pointer;text-align:left;font-family:inherit;transition:border-color .15s">
              <span style="font-size:18px">${l.flag}</span>
              <span style="font-size:13px;font-weight:${fixSelectedLeague?.id===l.id?'700':'400'};color:${fixSelectedLeague?.id===l.id?'var(--accent)':'var(--text)'}">${l.name}</span>
              <span style="margin-left:auto;color:var(--muted);font-size:16px">›</span>
            </button>`).join('')}
        </div>
      </div>`;
    }).join('')}
    </div>

    <!-- Matches output -->
    <div id="fix-matches-out" style="margin-top:1rem"></div>
  `;

  window._fixPickDate = (date) => {
    if (!date) return;
    fixSelectedDate = date;
    document.querySelectorAll('[id^="fixd-"]').forEach(b => {
      const isActive = b.id === 'fixd-' + date;
      b.style.borderColor = isActive ? 'var(--accent)' : 'var(--border)';
      b.style.background = isActive ? 'rgba(0,255,133,.15)' : 'transparent';
      b.style.color = isActive ? 'var(--accent)' : 'var(--muted)';
    });
    // Also update custom date input
    const cdi = el('fix-custom-date');
    if (cdi) cdi.value = date;
    if (fixSelectedLeague) loadFixMatchesFree(fixSelectedLeague);
  };

  window._fixSearch = (q) => {
    fixLeagueSearch = q.toLowerCase();
    const blocks = document.querySelectorAll('.fix-region-block');
    blocks.forEach(block => {
      const btns = block.querySelectorAll('button[id^="fixl-"]');
      let visibleCount = 0;
      btns.forEach(btn => {
        const lgName = btn.querySelector('span:nth-child(2)')?.textContent?.toLowerCase() || '';
        const regionName = block.dataset.region?.toLowerCase() || '';
        const match = !fixLeagueSearch || lgName.includes(fixLeagueSearch) || regionName.includes(fixLeagueSearch);
        btn.style.display = match ? '' : 'none';
        if (match) visibleCount++;
      });
      block.style.display = visibleCount > 0 ? '' : 'none';
    });
  };

  window._fixPickLeague = (lgId) => {
    const lg = SPORTSDB_LEAGUES.find(l => l.id === lgId);
    if (!lg) return;
    fixSelectedLeague = lg;
    document.querySelectorAll('[id^="fixl-"]').forEach(b => {
      const isActive = b.id === 'fixl-' + lgId;
      b.style.borderColor = isActive ? 'var(--accent)' : 'var(--border)';
      b.style.background = isActive ? 'rgba(0,255,133,.08)' : 'var(--surface)';
      const nameSpan = b.querySelector('span:nth-child(2)');
      if (nameSpan) { nameSpan.style.color = isActive ? 'var(--accent)' : 'var(--text)'; nameSpan.style.fontWeight = isActive ? '700' : '400'; }
    });
    // Scroll to results
    const out = el('fix-matches-out');
    if (out) setTimeout(() => out.scrollIntoView({behavior:'smooth', block:'start'}), 100);
    loadFixMatchesFree(lg);
  };

  // Reapply search filter if any
  if (fixLeagueSearch) window._fixSearch(fixLeagueSearch);

  // Kama kulikuwa na league iliyochaguliwa, ipakia tena
  if (fixSelectedLeague) loadFixMatchesFree(fixSelectedLeague);
}

async function loadFixMatchesFree(league) {
  const out = el('fix-matches-out');
  if (!out) return;
  out.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:.5rem">
      <span style="font-size:18px">${league.flag}</span>
      <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px">${league.name}</span>
      <span style="font-size:11px;color:var(--muted)">${fixSelectedDate}</span>
    </div>
    <div class="center"><div class="spinner"></div></div>`;

  try {
    // Pakia kutoka TheSportsDB — FREE, bila API key
    const res = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/eventsday.php?d=${fixSelectedDate}&l=${league.sportsdbId}`);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    let matches = data.events || [];

    // Kama TheSportsDB haina data kwa ligi hii, jaribu search kwa jina
    if (!matches.length) {
      const res2 = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/eventsday.php?d=${fixSelectedDate}&s=Soccer`);
      const data2 = await res2.json();
      const leagueLow = league.name.toLowerCase();
      matches = (data2.events || []).filter(ev =>
        ev.strLeague?.toLowerCase().includes(leagueLow.split(' ')[0].toLowerCase())
      );
    }

    if (!matches.length) {
      out.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:.5rem">
          <span style="font-size:18px">${league.flag}</span>
          <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px">${league.name}</span>
        </div>
        <div style="text-align:center;padding:2rem;color:var(--muted)">
          <div style="font-size:36px">📅</div>
          <div style="margin-top:8px;font-size:13px">Hakuna mechi tarehe ${fixSelectedDate}</div>
          <div style="font-size:11px;margin-top:4px">Jaribu tarehe nyingine</div>
        </div>`;
      return;
    }

    out.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:.75rem">
        <span style="font-size:18px">${league.flag}</span>
        <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px">${league.name}</span>
        <span style="font-size:11px;color:var(--muted);margin-left:auto">${matches.length} mechi</span>
      </div>
      ${matches.map(ev => {
        const home = ev.strHomeTeam;
        const away = ev.strAwayTeam;
        const isLive = ['1H','2H','HT','ET','In Progress'].includes(ev.strStatus);
        const isFT = ['FT','AET','PEN','Match Finished'].includes(ev.strStatus);
        const hg = ev.intHomeScore;
        const ag = ev.intAwayScore;
        const time = ev.strTime ? ev.strTime.slice(0,5) : '--:--';

        return `
          <div style="background:var(--surface);border:1px solid ${isLive?'rgba(255,68,68,.4)':'var(--border)'};border-radius:14px;padding:.85rem;margin-bottom:.6rem">
            <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem">
              <div style="text-align:right">
                <div style="font-size:13px;font-weight:600">${home}</div>
              </div>
              <div style="text-align:center;min-width:70px">
                ${isLive ? `
                  <div style="font-size:20px;font-weight:800;color:var(--danger)">${hg??0} - ${ag??0}</div>
                  <div style="font-size:10px;color:var(--danger);animation:pulse 1s infinite">🔴 LIVE ${ev.strProgress||''}</div>
                ` : isFT ? `
                  <div style="font-size:20px;font-weight:800;color:var(--muted)">${hg??'-'} - ${ag??'-'}</div>
                  <div style="font-size:10px;color:var(--muted)">FT</div>
                ` : `
                  <div style="font-size:16px;font-weight:700;color:var(--text)">${time}</div>
                  <div style="font-size:10px;color:var(--muted)">vs</div>
                `}
              </div>
              <div style="text-align:left">
                <div style="font-size:13px;font-weight:600">${away}</div>
              </div>
            </div>
            ${!isFT && home && away ? `
            <div style="margin-top:8px;display:flex;gap:6px">
              <button onclick="window._fixAddBetslip('${home.replace(/'/g,"\\'")} vs ${away.replace(/'/g,"\\'")}','${league.id}')"
                style="flex:1;padding:.4rem;border-radius:10px;border:1px solid rgba(0,255,133,.3);background:rgba(0,255,133,.08);color:var(--accent);font-size:11px;font-weight:600;cursor:pointer">
                ➕ Ongeza Betslip
              </button>
            </div>` : ''}
          </div>`;
      }).join('')}`;

    window._fixAddBetslip = (teams, lgId) => {
      if (pMatches.length >= MAX_MATCHES) {
        toast(`Max mechi ${MAX_MATCHES}!`, 'err');
        return;
      }
      const newMatch = { ...newM(), teams, league: lgId };
      pMatches.push(newMatch);
      toast(`✅ ${teams} imeongezwa!`);
      showTab('post');
    };

  } catch(e) {
    out.innerHTML = `
      <div style="text-align:center;padding:2rem;color:var(--muted)">
        <div style="font-size:32px">⚠️</div>
        <div style="margin-top:8px;font-size:13px">Imeshindwa kupakia fixtures</div>
        <div style="font-size:11px;margin-top:4px">Angalia internet yako</div>
        <button onclick="window._fixPickLeague('${league.id}')" style="margin-top:12px;padding:.5rem 1.25rem;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;cursor:pointer">🔄 Jaribu Tena</button>
      </div>`;
  }
}

// FEED
let feedFilter = 'ALL';
function renderFeed(c){
  // Group mikeka by user for per-user stats
  const userStats = {};
  allMikeka.forEach(m => {
    const uid = m.user_id || 'unknown';
    const uname = m.users?.name || 'Unknown';
    if(!userStats[uid]) userStats[uid] = {name:uname,won:0,lost:0,pending:0,total:0};
    userStats[uid].total++;
    if(m.status==='WON') userStats[uid].won++;
    else if(m.status==='LOST') userStats[uid].lost++;
    else if(m.status==='PENDING') userStats[uid].pending++;
  });

  // Filter
  const isOwner = currentUser.role==='owner';
  const filtered = feedFilter==='ALL' ? allMikeka :
    feedFilter==='MINE' ? allMikeka.filter(m=>m.user_id===currentUser.id) :
    allMikeka.filter(m=>m.status===feedFilter);

  c.innerHTML=`
    <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:.5rem">📡 Mikeka Yote</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:.75rem">Betslip za wote zinaonekana hapa — soma, usibadilishe</div>

    <!-- Per-user quick stats -->
    <div style="overflow-x:auto;display:flex;gap:6px;margin-bottom:.75rem;padding-bottom:4px">
      ${Object.entries(userStats).map(([uid,s])=>{
        const wr = (s.won+s.lost)>0?Math.round(s.won/(s.won+s.lost)*100):0;
        const isMe = uid===currentUser.id;
        return `<div style="flex-shrink:0;background:${isMe?'rgba(0,255,133,.12)':'var(--surface)'};border:1px solid ${isMe?'rgba(0,255,133,.4)':'var(--border)'};border-radius:12px;padding:.6rem .85rem;min-width:110px">
          <div style="font-size:11px;font-weight:700;color:${isMe?'var(--accent)':'var(--text)'};">${s.name.split(' ')[0]}${isMe?' (Mimi)':''}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">${s.total} mikeka · <span style="color:var(--win)">${wr}%</span></div>
          <div style="font-size:10px;color:var(--muted)">${s.won}W/${s.lost}L/${s.pending}⏳</div>
        </div>`;
      }).join('')}
    </div>

    <!-- Filter buttons -->
    <div style="display:flex;gap:5px;margin-bottom:.75rem;overflow-x:auto;padding-bottom:4px">
      ${['ALL','MINE','PENDING','WON','LOST'].map(f=>`
        <button onclick="window._feedF('${f}')" style="flex-shrink:0;padding:.35rem .75rem;border-radius:20px;border:1.5px solid ${feedFilter===f?'var(--accent)':'var(--border)'};background:${feedFilter===f?'rgba(0,255,133,.15)':'transparent'};color:${feedFilter===f?'var(--accent)':'var(--muted)'};font-weight:700;font-size:11px;cursor:pointer">
          ${f==='MINE'?'Zangu':f} <span style="opacity:.6">${f==='ALL'?allMikeka.length:f==='MINE'?allMikeka.filter(m=>m.user_id===currentUser.id).length:allMikeka.filter(m=>m.status===f).length}</span>
        </button>`).join('')}
    </div>

    ${filtered.length===0?'<div class="empty"><div style="font-size:44px">📡</div><div style="margin-top:8px">Hakuna mikeka</div></div>':
    filtered.map(m=>{
      const isOwn = m.user_id===currentUser.id;
      return `
      <div class="card" style="margin-bottom:.75rem;border-color:${isOwn?'rgba(0,255,133,.25)':'var(--border)'}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div>
            <div style="font-size:13px;font-weight:700">${m.name||'Mkeka'}</div>
            <div style="font-size:10px;color:${isOwn?'var(--accent)':'var(--muted)'}">👤 ${m.users?.name||'Unknown'}${isOwn?' ✦':''} · ${m.date}</div>
          </div>
          <div style="text-align:right">
            <div style="background:${sc(m.status)}22;color:${sc(m.status)};padding:.15rem .55rem;border-radius:20px;font-size:10px;font-weight:700">${m.status}</div>
            <div style="font-size:12px;color:var(--accent);font-weight:600;margin-top:3px">${(m.total_odds||1).toFixed(2)}x</div>
          </div>
        </div>
        ${(m.matches||[]).map(match=>`
          <div style="display:flex;justify-content:space-between;padding:.4rem 0;border-top:1px solid #0d1f14;font-size:12px">
            <div>
              <div>${lgFlag(match.league)} ${match.teams}</div>
              <div style="font-size:10px;color:var(--muted)">${match.market} · <b>${match.pick}</b></div>
            </div>
            <div style="text-align:right">
              <div style="color:var(--accent)">${match.odds}x</div>
              <div style="font-size:10px;font-weight:700;color:${sc(match.outcome)}">${match.outcome||'⏳'}</div>
            </div>
          </div>`).join('')}
        <div style="margin-top:.6rem;padding:.5rem;background:rgba(0,0,0,.2);border-radius:8px;display:flex;justify-content:space-between;font-size:12px">
          <span style="color:var(--muted)">Stake: <b>TZS ${fmt(m.stake)}</b></span>
          <span style="color:var(--accent);font-weight:600">Return: TZS ${fmt(m.potential_return||0)}</span>
        </div>
        ${m.analysis?`<div style="margin-top:6px;font-size:11px;color:var(--muted);font-style:italic;padding:.4rem;background:rgba(0,0,0,.15);border-radius:8px">📝 ${m.analysis}</div>`:''}
      </div>`;
    }).join('')}`;

  window._feedF = (f) => { feedFilter = f; renderFeed(c); };
}

function renderMikeka(c){
  // Viewer sees all betslips; analyst/owner toggle between own and all
  const isViewer=currentUser.role==='viewer';
  const isOwner=currentUser.role==='owner';
  const mkData = isViewer ? allMikeka : (mkScope==='all' ? allMikeka : mikeka);
  const shown=mkData.filter(m=>mkF==='ALL'||m.status===mkF).filter(m=>!mkQ||m.name?.toLowerCase().includes(mkQ)||m.matches?.some(x=>x.teams?.toLowerCase().includes(mkQ)));
  c.innerHTML=`
    ${isViewer?'<div style="font-size:11px;color:var(--accent);margin-bottom:.5rem">👁️ Unaona mikeka yote — read only</div>':''}
    <input class="inp" id="mk-q" placeholder="🔍 Tafuta mkeka au timu..." value="${mkQ}" style="margin-bottom:.75rem"/>
    ${!isViewer?`<div style="display:flex;gap:6px;margin-bottom:.5rem">
      <button onclick="window._mkScope('own')" style="flex:1;padding:.4rem;border-radius:10px;border:1.5px solid ${mkScope==='own'?'var(--accent)':'var(--border)'};background:${mkScope==='own'?'rgba(0,255,133,.1)':'transparent'};color:${mkScope==='own'?'var(--accent)':'var(--muted)'};font-weight:700;font-size:12px;cursor:pointer">Zangu (${mikeka.length})</button>
      <button onclick="window._mkScope('all')" style="flex:1;padding:.4rem;border-radius:10px;border:1.5px solid ${mkScope==='all'?'var(--accent)':'var(--border)'};background:${mkScope==='all'?'rgba(0,255,133,.1)':'transparent'};color:${mkScope==='all'?'var(--accent)':'var(--muted)'};font-weight:700;font-size:12px;cursor:pointer">Zote (${allMikeka.length})</button>
    </div>`:''}
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:.75rem">
      ${['ALL','PENDING','WON','LOST','VOID'].map(f=>`<button class="btn-outline ${mkF===f?'active':''}" onclick="window._mkF('${f}')" style="${mkF===f?`border-color:${sc(f)};background:${sc(f)}22;color:${sc(f)}`:''}">
        ${f} <span style="opacity:.6">${mkData.filter(m=>f==='ALL'||m.status===f).length}</span></button>`).join('')}
    </div>
    ${shown.length===0?'<div class="empty"><div style="font-size:44px">📋</div><div style="margin-top:8px">Hakuna mikeka</div></div>':shown.map(m=>mkCard(m,false)).join('')}`;
  el('mk-q').oninput=(e)=>{mkQ=e.target.value.toLowerCase();renderMikeka(c);};
  window._mkF=(f)=>{mkF=f;renderMikeka(c);};
  window._mkScope=(s)=>{mkScope=s;renderMikeka(c);};
  c.querySelectorAll('[data-exp]').forEach(btn=>{
    btn.onclick=()=>{const d=el('det-'+btn.dataset.exp);if(d)d.style.display=d.style.display==='none'?'block':'none';};
  });
}

function mkCard(m,mini){
  const matches=m.matches||[];
  return`<div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;margin-bottom:.6rem;overflow:hidden">
    <div data-exp="${m.id}" style="padding:.85rem;cursor:${mini?'default':'pointer'};display:flex;justify-content:space-between;align-items:center">
      <div style="flex:1">
        <div style="font-weight:600;font-size:13px">${m.name||'Mkeka #'+m.id.slice(-4)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${m.date} · ${matches.length} mechi · TZS ${fmt(m.stake)}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <div style="background:${sc(m.status)}22;color:${sc(m.status)};padding:.15rem .55rem;border-radius:20px;font-size:10px;font-weight:700">${m.status}</div>
        <div style="font-size:12px;color:var(--accent);font-weight:600">${(m.total_odds||1).toFixed(2)}x</div>
      </div>
    </div>
    ${!mini?`<div id="det-${m.id}" style="display:none;border-top:1px solid var(--border);padding:.75rem">
      ${matches.map((match,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;${i<matches.length-1?'border-bottom:1px solid #0d1f14':''}">
        <div><div style="font-size:12px;font-weight:600">${lgFlag(match.league)} ${match.teams}</div><div style="font-size:10px;color:var(--muted)">${lgName(match.league)} · ${match.market} · ${match.pick}</div></div>
        <div style="text-align:right"><div style="font-size:12px">${match.odds}x</div><div style="font-size:10px;font-weight:700;color:${sc(match.outcome)};background:${sc(match.outcome)}22;padding:.1rem .4rem;border-radius:6px">${match.outcome||'PENDING'}</div></div>
      </div>`).join('')}
      <div style="margin-top:.75rem;padding:.6rem;background:rgba(0,0,0,.3);border-radius:10px;display:flex;justify-content:space-between;font-size:13px">
        <span style="color:var(--muted)">Potential Return:</span><span style="color:var(--accent);font-weight:700">TZS ${fmt(m.potential_return||0)}</span>
      </div>
      ${m.analysis?`<div style="margin-top:8px;font-size:11px;color:var(--muted);font-style:italic">📝 ${m.analysis}</div>`:''}
    </div>`:''}
  </div>`;
}

// POST
let pMatches=[],pChecks=[false,false,false,false],kOn=false,kProb=55;
function renderPost(c){
  if(!pMatches.length)pMatches=[newM()];
  const tOdds=pMatches.reduce((p,m)=>p*(parseFloat(m.odds)||1),1);
  const stake=parseInt(el('post-stake')?.value||currentUser.stake||5000);
  const potRet=Math.round(tOdds*stake);
  const kF=kelly(tOdds,kProb/100),kStake=Math.round(currentUser.bankroll*kF/1000)*1000;
  const allOk=pChecks.every(Boolean),risk=analyzeRisk(pMatches);
  const regions=[...new Set(LEAGUES.map(l=>l.region))];
  c.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800">➕ Mkeka Mpya</div>
      <button onclick="window._showFixtures()" style="padding:.45rem .9rem;border-radius:20px;border:1.5px solid rgba(77,166,255,.4);background:rgba(77,166,255,.08);color:var(--info);font-size:12px;font-weight:600;cursor:pointer">📅 Fixtures</button>
    </div>
    <div style="margin-bottom:.75rem">
      <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px">📸 Upload Betslip — AI Itasoma</div>
      <label for="ocr-in" style="display:block;border:2px dashed var(--border);border-radius:14px;padding:1.25rem 1rem;text-align:center;cursor:pointer;background:rgba(0,255,133,.03);transition:border-color .2s" id="ocr-label">
        <div style="font-size:32px;margin-bottom:8px">📸</div>
        <div style="font-size:13px;font-weight:600;color:var(--accent)" id="ocr-txt">Bonyeza Hapa — Chagua Picha</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">JPG, PNG — OpenRouter AI itasoma mechi zote</div>
        ${GEMINI_KEY
          ? '<div style="font-size:10px;color:var(--win);margin-top:6px;font-weight:600">✅ OpenRouter iko tayari</div>'
          : '<div style="font-size:10px;color:var(--warn);margin-top:6px">⚠️ Weka OpenRouter key kwenye Admin kwanza</div>'}
      </label>
      <input type="file" id="ocr-in" accept="image/*,image/jpeg,image/png,image/webp" capture="environment" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px"/>
    </div>
    <div style="background:${allOk?'#0f3520':'#1f1a00'};border:1px solid ${allOk?'rgba(0,255,133,.3)':'rgba(255,170,0,.3)'};border-radius:14px;padding:1rem;margin-bottom:.9rem">
      <div style="font-size:12px;font-weight:700;color:${allOk?'var(--win)':'var(--warn)'};margin-bottom:10px">${allOk?'✅ Checklist Imekamilika!':'⚠️ Pre-Bet Checklist'}</div>
      ${['Nimefanya research ya kutosha','Odds hizi zina value','Siko kwenye loss streak kubwa','Mechi zote ni kutoka leagues ninazojua'].map((l,i)=>`
        <div onclick="window._chk(${i})" style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;cursor:pointer">
          <div style="width:18px;height:18px;border-radius:5px;border:2px solid ${pChecks[i]?'var(--win)':'var(--muted)'};background:${pChecks[i]?'rgba(0,255,133,.2)':'transparent'};flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--win)">${pChecks[i]?'✓':''}</div>
          <div style="font-size:11px;color:${pChecks[i]?'#5a9e70':'var(--muted)'}">${l}</div>
        </div>`).join('')}
    </div>
    ${risk.flags.length>0||risk.tips.length>0?`<div class="card" style="margin-bottom:.9rem">
      <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:10px">🤖 AI Risk Analysis</div>
      ${risk.flags.map(f=>`<div class="red-flag"><span>${f.icon}</span><span style="font-size:12px;color:var(--danger)">${f.msg}</span></div>`).join('')}
      ${risk.tips.map(t=>`<div class="green-tip"><span>${t.icon}</span><span style="font-size:12px;color:var(--win)">${t.msg}</span></div>`).join('')}
    </div>`:''}
    <input class="inp" id="post-name" placeholder="Jina la mkeka (optional)" style="margin-bottom:10px"/>
    <div class="grid-2" style="margin-bottom:10px">
      <div><div style="font-size:10px;color:var(--muted);margin-bottom:4px">Tarehe</div><input type="date" class="inp-sm" id="post-date" value="${today()}"/></div>
      <div><div style="font-size:10px;color:var(--muted);margin-bottom:4px">Stake (TZS)</div><input type="number" class="inp-sm" id="post-stake" value="${currentUser.stake||5000}"/></div>
    </div>
    <div class="card" style="margin-bottom:.9rem">
      <div style="display:flex;justify-content:space-between;align-items:center${kOn?';margin-bottom:12px':''}">
        <div style="font-size:12px;font-weight:700;color:var(--accent)">🧮 Kelly Criterion</div>
        <button class="btn-outline ${kOn?'active':''}" onclick="window._kTog()">${kOn?'Ficha':'Tumia'}</button>
      </div>
      ${kOn?`<input type="range" min="30" max="80" value="${kProb}" oninput="window._kSlide(this.value)" style="width:100%;accent-color:var(--accent);margin-bottom:8px"/>
      <div class="grid-2" style="margin-bottom:8px">
        <div style="background:rgba(0,0,0,.3);padding:.6rem;border-radius:8px;text-align:center"><div style="font-size:10px;color:var(--muted)">Win Prob</div><div style="font-weight:700;color:var(--accent)" id="k-pct">${kProb}%</div></div>
        <div style="background:rgba(0,0,0,.3);padding:.6rem;border-radius:8px;text-align:center"><div style="font-size:10px;color:var(--muted)">Stake Bora</div><div style="font-weight:700;color:var(--accent)">TZS ${fmt(kStake)}</div></div>
      </div>
      <button class="btn-ghost" onclick="window._kApply(${kStake})">↑ Tumia TZS ${fmt(kStake)}</button>`:''}
    </div>
    <div style="font-size:13px;font-weight:700;margin-bottom:8px">Mechi (${pMatches.length}/${MAX_MATCHES})</div>
    <div id="matches-con">${pMatches.map((m,i)=>mHTML(m,i,regions)).join('')}</div>
    <button onclick="window._addM()" style="width:100%;padding:.65rem;border-radius:10px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;margin-bottom:.9rem">+ Ongeza Mechi</button>
    <textarea class="inp-sm" id="post-ana" placeholder="Analysis yako — mbona umichagua mikeka hii?" rows="3" style="margin-bottom:.9rem"></textarea>
    <div style="background:linear-gradient(135deg,#0f3520,#092518);border:1px solid rgba(0,255,133,.2);border-radius:14px;padding:1rem;margin-bottom:.9rem">
      ${[['Total Odds',tOdds.toFixed(2)+'x','var(--text)'],['Stake','TZS '+fmt(stake),'var(--text)'],['Potential Return','TZS '+fmt(potRet),'var(--win)'],['Faida','TZS '+fmt(potRet-stake),(potRet-stake)>=0?'var(--win)':'var(--loss)']].map(([l,v,col])=>`
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px"><span style="color:var(--muted)">${l}</span><span style="font-weight:700;color:${col}">${v}</span></div>`).join('')}
    </div>
    <button class="btn-primary" id="post-btn" onclick="window._post()">📤 Post Mkeka</button>`;

  wireInps();

  // OCR handler - robust version for mobile
  const ocrInput = el('ocr-in');
  if(ocrInput){
    // Remove old listeners
    const newInput = ocrInput.cloneNode(true);
    ocrInput.parentNode.replaceChild(newInput, ocrInput);
    newInput.addEventListener('change', async function(e){
      const file = e.target.files && e.target.files[0];
      if(!file){toast('Hakuna picha iliyochaguliwa','warn');return;}
      if(!GEMINI_KEY){toast('Weka OpenRouter API key kwenye Admin kwanza!','err');return;}
      // Show loading state
      const txt = el('ocr-txt');
      const lbl = el('ocr-label');
      if(txt) txt.textContent = '🤖 OpenRouter AI inasoma picha...';
      if(lbl) lbl.style.borderColor = 'var(--accent)';
      toast('📸 Picha imepokelewa — AI inasoma...','info');
      const reader = new FileReader();
      reader.onload = async(ev) => {
        try{
          const b64 = ev.target.result.split(',')[1];
          const extracted = await ocrImage(b64, file.type);
          if(extracted && extracted.length > 0){
            pMatches = extracted.slice(0, MAX_MATCHES).map(m=>({
              ...newM(),
              teams: m.teams||'',
              market: MARKETS.includes(m.market) ? m.market : 'Double Chance',
              odds: m.odds||'',
              pick: m.pick||m.market||''
            }));
            toast('✅ Mechi '+extracted.length+' zimepatikana!');
            renderPost(c);
          } else {
            if(txt) txt.textContent = '⚠️ Mechi hazipatikani — Jaza manually';
            toast('Mechi hazipatikani kwenye picha','warn');
          }
        }catch(err){
          if(txt) txt.textContent = '❌ Hitilafu — Jaribu tena';
          toast('Hitilafu: '+err.message,'err');
        }
      };
      reader.onerror = () => toast('Imeshindwa kusoma picha','err');
      reader.readAsDataURL(file);
    });
  }
  window._chk=(i)=>{pChecks[i]=!pChecks[i];renderPost(c);};
  window._kTog=()=>{kOn=!kOn;renderPost(c);};
  window._kSlide=(v)=>{kProb=parseInt(v);const p=el('k-pct');if(p)p.textContent=v+'%';};
  window._kApply=(s)=>{const i=el('post-stake');if(i)i.value=s;renderPost(c);};
  window._addM=()=>{if(pMatches.length>=MAX_MATCHES)return toast(`Max mechi ${MAX_MATCHES}!`,'err');pMatches.push(newM());renderPost(c);};
  window._delM=(id)=>{if(pMatches.length>1){pMatches=pMatches.filter(m=>m._id!==id);renderPost(c);}};
  window._post=async()=>{
    if(!pChecks.every(Boolean))return toast('Kamilisha checklist kwanza!','warn');
    readInps();
    if(!pMatches.every(m=>m.teams&&m.odds))return toast('Jaza mechi zote vizuri!','err');
    const streak=getStreak();
    if(streak.type==='LOSS'&&streak.count>=LOSS_STREAK_LIMIT)return toast('🚨 Loss streak! Pumzika kwanza!','err');
    const name=el('post-name')?.value||`Mkeka ${mikeka.length+1}`;
    const date=el('post-date')?.value||today();
    const stake=parseInt(el('post-stake')?.value||5000);
    const ana=el('post-ana')?.value||'';
    const tOdds=pMatches.reduce((p,m)=>p*(parseFloat(m.odds)||1),1);
    const potRet=Math.round(tOdds*stake);
    const mId=uid();
    const btn=el('post-btn');btn.textContent='Inasave...';btn.disabled=true;
    const{error:e1}=await sb.from('mikeka').insert({id:mId,user_id:currentUser.id,name,date,stake,total_odds:tOdds,potential_return:potRet,analysis:ana,status:'PENDING'});
    if(e1){btn.textContent='📤 Post Mkeka';btn.disabled=false;return toast('Hitilafu: '+e1.message,'err');}
    const{error:e2}=await sb.from('matches').insert(pMatches.map(m=>({id:uid(),mkeka_id:mId,teams:m.teams,league:m.league,market:m.market,pick:m.pick,odds:parseFloat(m.odds),outcome:'PENDING'})));
    btn.textContent='📤 Post Mkeka';btn.disabled=false;
    if(e2)return toast('Hitilafu ya mechi: '+e2.message,'err');
    toast('Mkeka umewekwa! 🎯');
    pMatches=[newM()];pChecks=[false,false,false,false];
    await loadData();showTab('mikeka');
  };
}
function newM(){return{_id:uid(),teams:'',league:'epl',market:'Double Chance',pick:'',odds:''};}
function mHTML(m,idx,regions){
  return`<div class="card" style="margin-bottom:.6rem">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px">
      <div style="font-size:11px;font-weight:700;color:var(--accent)">Mechi ${idx+1}</div>
      ${idx>0?`<button onclick="window._delM('${m._id}')" style="background:none;border:none;color:var(--loss);cursor:pointer;font-size:18px;padding:0">×</button>`:''}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
      <input class="inp-sm" data-mid="${m._id}" data-f="teams" placeholder="Timu A vs Timu B" value="${m.teams}" style="flex:1"/>
      ${m.teams && m.teams.includes(' vs ') ? `<button onclick="window._aiAnalysis('${m.teams.replace(/'/g,"\'")}','${m._id}')" style="padding:.4rem .6rem;border-radius:8px;border:1px solid rgba(0,255,133,.3);background:rgba(0,255,133,.08);color:var(--accent);font-size:11px;cursor:pointer;white-space:nowrap">🤖 AI</button>` : ''}
    </div>
    <div class="grid-2" style="margin-bottom:6px">
      <select class="inp-sm" data-mid="${m._id}" data-f="league" style="max-width:100%;text-overflow:ellipsis">
        ${regions.map(r=>`<optgroup label="${r}">${LEAGUES.filter(l=>l.region===r).map(l=>`<option value="${l.id}" ${m.league===l.id?'selected':''}>${l.flag} ${l.name}</option>`).join('')}</optgroup>`).join('')}
      </select>
      <select class="inp-sm" data-mid="${m._id}" data-f="market">
        ${MARKETS.map(mk=>`<option value="${mk}" ${m.market===mk?'selected':''}>${mk}</option>`).join('')}
      </select>
    </div>
    <div class="grid-2">
      <input class="inp-sm" data-mid="${m._id}" data-f="pick" placeholder="Pick (1X, Over 2.5...)" value="${m.pick}"/>
      <input class="inp-sm" data-mid="${m._id}" data-f="odds" placeholder="Odds (1.75)" type="number" step="0.01" min="1" value="${m.odds}"/>
    </div>
  </div>`;
}
function wireInps(){
  document.querySelectorAll('[data-mid]').forEach(inp=>{
    inp.onchange=(e)=>{const mid=e.target.dataset.mid,f=e.target.dataset.f,v=e.target.value;pMatches=pMatches.map(m=>m._id===mid?{...m,[f]:v}:m);};
  });
}
function readInps(){
  document.querySelectorAll('[data-mid]').forEach(inp=>{
    const mid=inp.dataset.mid,f=inp.dataset.f;pMatches=pMatches.map(m=>m._id===mid?{...m,[f]:inp.value}:m);
  });
}

// RESULTS
function renderResults(c){
  if(currentUser.role==='viewer'){
    c.innerHTML=`<div style="text-align:center;padding:3rem 1rem;color:var(--muted)">
      <div style="font-size:44px">👁️</div>
      <div style="margin-top:8px;font-size:13px">Viewer haiwezi kurekodi matokeo</div>
      <div style="font-size:11px;margin-top:4px">Toa role ya Analyst kwa admin</div>
    </div>`;
    return;
  }
  const pending=mikeka.filter(m=>m.status==='PENDING');
  if(!pending.length){c.innerHTML=`<div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:1rem">✅ Rekodi Matokeo</div><div class="empty"><div style="font-size:44px">✅</div><div style="margin-top:8px">Hakuna mkeka unaosubiri</div></div>`;return;}
  c.innerHTML=`<div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:1rem">✅ Rekodi Matokeo</div>
    ${pending.map(m=>`<div class="card" style="padding:0;overflow:hidden;margin-bottom:.75rem">
      <div style="padding:.85rem;border-bottom:1px solid var(--border)">
        <div style="font-weight:700">${m.name||'Mkeka'}</div>
        <div style="font-size:11px;color:var(--muted)">${m.date} · ${(m.total_odds||1).toFixed(2)}x · TZS ${fmt(m.potential_return||0)}</div>
      </div>
      ${(m.matches||[]).map((match,i)=>`<div style="padding:.75rem;border-bottom:${i<m.matches.length-1?'1px solid #0d1f14':'none'}">
        <div style="font-size:12px;font-weight:600;margin-bottom:2px">${lgFlag(match.league)} ${match.teams}</div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:8px">${match.market} · ${match.pick} @ ${match.odds}x</div>
        <div style="display:flex;gap:6px">
          ${['WIN','LOSS','VOID'].map(o=>`<button onclick="window._out('${m.id}','${match.id}','${o}')" style="flex:1;padding:.4rem;border-radius:20px;border:1.5px solid ${match.outcome===o?sc(o):'var(--border)'};background:${match.outcome===o?sc(o)+'22':'transparent'};color:${match.outcome===o?sc(o):'var(--muted)'};font-weight:700;font-size:11px;cursor:pointer">${o}</button>`).join('')}
        </div>
      </div>`).join('')}
    </div>`).join('')}`;
  window._out=async(mId,matchId,outcome)=>{
    await sb.from('matches').update({outcome}).eq('id',matchId);
    const{data:all}=await sb.from('matches').select('*').eq('mkeka_id',mId);
    const allDone=all.every(m=>m.outcome!=='PENDING');
    if(allDone){
      const hasLoss=all.some(m=>m.outcome==='LOSS'),allVoid=all.every(m=>m.outcome==='VOID');
      const newS=hasLoss?'LOST':allVoid?'VOID':'WON';
      await sb.from('mikeka').update({status:newS}).eq('id',mId);
      const mk=mikeka.find(m=>m.id===mId);
      if(newS==='WON'&&mk){const gain=(mk.potential_return||0)-(mk.stake||0);await updateUser({bankroll:currentUser.bankroll+gain});toast(`🎉 Umeshinda! +TZS ${fmt(gain)}`);}
      else if(newS==='LOST')toast('Mkeka umepoteza. Jaribu tena! 💪','warn');
    }
    await loadData();renderResults(c);
  };
}

// REPORTS
let rP='month',rV='overview';
function renderReports(c){
  // Viewer sees all mikeka stats; others see own
  const reportData = (currentUser.role==='viewer') ? allMikeka : mikeka;
  const now=new Date();
  const fil=reportData.filter(m=>{
    const d=new Date(m.date);
    if(rP==='week'){const w=new Date(now);w.setDate(now.getDate()-7);return d>=w;}
    if(rP==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    if(rP==='year')return d.getFullYear()===now.getFullYear();
    return true;
  });
  const won=fil.filter(m=>m.status==='WON'),lost=fil.filter(m=>m.status==='LOST'),settled=[...won,...lost];
  const staked=fil.reduce((s,m)=>s+(m.stake||0),0),ret=won.reduce((s,m)=>s+(m.potential_return||0),0);
  const profit=ret-staked,roi=staked>0?((profit/staked)*100).toFixed(1):'0.0';
  const wr=settled.length>0?((won.length/settled.length)*100).toFixed(1):'0.0';
  const lgMap={},mkMap={};
  fil.forEach(m=>(m.matches||[]).forEach(x=>{
    if(!lgMap[x.league])lgMap[x.league]={w:0,l:0,t:0};
    lgMap[x.league].t++;if(x.outcome==='WIN')lgMap[x.league].w++;if(x.outcome==='LOSS')lgMap[x.league].l++;
    if(!mkMap[x.market])mkMap[x.market]={w:0,t:0};
    mkMap[x.market].t++;if(x.outcome==='WIN')mkMap[x.market].w++;
  }));
  const danger=Object.entries(lgMap).filter(([,s])=>s.t>=2&&(s.l/s.t)>0.6);

  const grade=parseFloat(roi)>=15?'A+':parseFloat(roi)>=5?'A':parseFloat(roi)>=0?'B':parseFloat(roi)>=-10?'C':'D';

  c.innerHTML=`
    <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:.9rem">📊 Ripoti</div>

      ${[['week','Wiki'],['month','Mwezi'],['year','Mwaka'],['all','Yote']].map(([v,l])=>`<button onclick="window._rP('${v}')" style="flex:1;padding:.45rem;border-radius:12px;border:1.5px solid ${rP===v?'var(--accent)':'var(--border)'};background:${rP===v?'rgba(0,255,133,.15)':'transparent'};color:${rP===v?'var(--accent)':'var(--muted)'};font-weight:700;font-size:12px;cursor:pointer">${l}</button>`).join('')}
    </div>
    <div style="display:flex;gap:5px;margin-bottom:.9rem;overflow-x:auto;padding-bottom:2px">

      </div>

      ${best.length?`<div style="font-size:12px;font-weight:700;color:var(--win);margin-bottom:8px;margin-top:8px">✅ Leagues Bora</div>
        ${best.map(([id,s])=>`<div class="card" style="border-color:rgba(0,255,133,.3);margin-bottom:.5rem"><div style="display:flex;justify-content:space-between"><span style="font-weight:600">${lgFlag(id)} ${lgName(id)}</span><span style="color:var(--win);font-weight:700">${((s.w/s.t)*100).toFixed(0)}% Win</span></div><div style="font-size:10px;color:var(--muted);margin-top:4px">${s.w}W/${s.l}L — ✅ Endelea!</div></div>`).join('')}`:''}

  }
  if(rV==='markets'){
    rc.innerHTML=Object.entries(mkMap).sort((a,b)=>(b[1].w/b[1].t)-(a[1].w/a[1].t)).map(([market,s])=>{const w=s.t?((s.w/s.t)*100).toFixed(0):0;return`<div class="card" style="margin-bottom:.5rem"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-weight:600">${market}</span><span style="font-weight:700;color:${parseInt(w)>=50?'var(--win)':'var(--loss)'}">${w}%</span></div><div style="background:rgba(0,0,0,.4);border-radius:10px;height:6px;overflow:hidden"><div style="height:100%;width:${w}%;background:var(--info);border-radius:10px"></div></div><div style="font-size:10px;color:var(--muted);margin-top:4px">${s.w}W/${s.t-s.w}L</div></div>`;}).join('')||'<div class="empty"><div style="font-size:44px">📊</div><div style="margin-top:8px">Hakuna data</div></div>';

          \${bestMk?\`<div style="font-size:11px;color:var(--muted)">🏆 Market bora: <strong style="color:var(--accent)">\${bestMk[0]}</strong> (\${Math.round(bestMk[1].w/bestMk[1].t*100)}% win)</div>\`:''}
        </div>\`;
      }).join('');
  }
}
