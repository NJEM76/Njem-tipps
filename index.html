<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NJEM Tipps v2.7</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#00ff85"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #05110a; --surface: #0c1f13; --border: #1a3522;
      --accent: #00ff85; --text: #e4f0e8; --muted: #4a7a5a;
    }
    body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1rem; margin-bottom: 12px; }
    .live-time { font-weight: 700; color: var(--accent); font-size: 15px; }
    .progress-bar { height: 8px; background: #1a3522; border-radius: 20px; overflow: hidden; margin: 8px 0; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #00c965); transition: width 1s ease; }
    .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 500px; background: rgba(12,31,19,0.97); border-top: 1px solid var(--border); display: flex; z-index: 100; }
    .nav-btn { flex: 1; padding: 10px 4px; background: none; border: none; color: var(--muted); text-align: center; font-size: 11px; }
    .nav-btn.active { color: var(--accent); }
    .toast { position: fixed; top: 20px; right: 20px; padding: 14px 20px; border-radius: 12px; z-index: 9999; font-weight: 600; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
  </style>
</head>
<body>
<div id="toast-container"></div>
<div id="app"></div>

<script type="module">
const API_KEY = 'd73264988a520615d546704abada1027';   // ← **PASTE API KEY YAKO HAPA**

const LEAGUES = [
  { id: 39, name: 'Premier League', flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿' },
  { id: 140, name: 'La Liga', flag: '🇪🇸' },
  { id: 78, name: 'Bundesliga', flag: '🇩🇪' },
  { id: 135, name: 'Serie A', flag: '🇮🇹' },
  { id: 61, name: 'Ligue 1', flag: '🇫🇷' },
  { id: 2, name: 'Champions League', flag: '🏆' },
  { id: 3, name: 'Europa League', flag: '🔵' },
  { id: 71, name: 'Tanzania Premier League', flag: '🇹🇿' },
  { id: 62, name: 'Kenya Premier League', flag: '🇰🇪' },
  { id: 79, name: 'Nigeria NPFL', flag: '🇳🇬' },
  { id: 100, name: 'South Africa PSL', flag: '🇿🇦' },
  { id: 88, name: 'Egypt Premier League', flag: '🇪🇬' },
  { id: 253, name: 'MLS', flag: '🇺🇸' },
  { id: 128, name: 'Brasileirão', flag: '🇧🇷' },
];

let betslip = [];

function toast(msg, type = 'ok') {
  const div = document.createElement('div');
  div.className = 'toast';
  div.style.background = type === 'err' ? '#ff4444' : '#00ff85';
  div.style.color = type === 'err' ? '#fff' : '#000';
  div.textContent = msg;
  document.getElementById('toast-container').appendChild(div);
  setTimeout(() => div.remove(), 4000);
}

function getLiveTime(match) {
  const status = match.fixture?.status || match.status;
  if (status?.short === 'FT') return 'FT';
  if (status?.short === 'HT') return 'HT';
  if (status?.elapsed) return status.elapsed + "'";
  return new Date(match.fixture?.date).toLocaleTimeString('sw-KE', {hour:'2-digit', minute:'2-digit'});
}

async function fetchFixtures(leagueId = null) {
  if (!API_KEY) {
    toast("d73264988a520615d546704abada1027 ", "err");
    return getMockData();
  }
  try {
    const date = new Date().toISOString().split('T')[0];
    let url = `https://v3.football.api-sports.io/fixtures?date=${date}`;
    if (leagueId) url += `&league=${leagueId}`;

    const res = await fetch(url, {
      headers: {
        'x-rapidapi-key': API_KEY,
        'x-rapidapi-host': 'v3.football.api-sports.io'
      }
    });
    const json = await res.json();
    return json.response || [];
  } catch (e) {
    toast("API haikufanikiwa, inatumia mock data", "warn");
    return getMockData();
  }
}

function getMockData() {
  return [
    {fixture: {id: 101, date: "2026-05-19T18:00:00"}, teams: {home: {name: "Young Africans"}, away: {name: "Simba SC"}}, goals: {home: 2, away: 1}, status: {short: "LIVE", elapsed: 67}},
    {fixture: {id: 102, date: "2026-05-19T20:00:00"}, teams: {home: {name: "Manchester City"}, away: {name: "Liverpool"}}, goals: {}, status: {short: "NS"}},
  ];
}

// ... (sehemu zingine za code zimeachwa sawa na awali ili isichukue nafasi)

async function showScreen(screen) {
  let html = `<div style="padding:1rem 1rem 90px">`;

  if (screen === 'home') html += `<h2 style="color:var(--accent)">Karibu NJEM Tipps v2.7</h2>`;
  else if (screen === 'fixtures') {
    html += `<h2 style="color:var(--accent)">Fixtures</h2>
      <div style="display:flex;gap:8px;overflow-x:auto;padding:10px 0;flex-wrap:wrap;">
        \( {LEAGUES.map(l => `<button onclick="loadLeague( \){l.id})" style="padding:10px 16px;border:1px solid var(--border);border-radius:999px;margin:4px">${l.flag} ${l.name}</button>`).join('')}
      </div><div id="fixtures-list"></div>`;
  } 
  else if (screen === 'live') html += `<h2 style="color:var(--accent)">🔴 Live</h2><div id="live-list"></div>`;
  else if (screen === 'betslip') html += `<h2 style="color:var(--accent)">Betslip (${betslip.length})</h2><div id="betslip-list"></div>`;

  html += `</div>`;
  document.getElementById('app').innerHTML = html + renderBottomNav(screen);

  if (screen === 'fixtures') loadLeague(LEAGUES[0].id);
  if (screen === 'live') loadLive();
  if (screen === 'betslip') renderBetslip();
}

function renderBottomNav(active) {
  return `<div class="bottom-nav">
    <button class="nav-btn ${active==='home'?'active':''}" onclick="showScreen('home')">🏠 Home</button>
    <button class="nav-btn ${active==='fixtures'?'active':''}" onclick="showScreen('fixtures')">📅 Fixtures</button>
    <button class="nav-btn ${active==='live'?'active':''}" onclick="showScreen('live')">🔴 Live</button>
    <button class="nav-btn ${active==='betslip'?'active':''}" onclick="showScreen('betslip')">📝 Betslip</button>
  </div>`;
}

window.loadLeague = async (leagueId) => {
  const container = document.getElementById('fixtures-list');
  container.innerHTML = `<p>Inapakua mechi kutoka API-Football...</p>`;
  const matches = await fetchFixtures(leagueId);
  let str = '';
  matches.forEach(m => {
    str += `<div class="card" onclick="addToBetslip(${JSON.stringify(m)})">
      <div style="display:flex;justify-content:space-between">
        <strong>${m.teams.home.name} vs ${m.teams.away.name}</strong>
        <span class="live-time">${getLiveTime(m)}</span>
      </div>
    </div>`;
  });
  container.innerHTML = str || `<p>Hakuna mechi kwa sasa</p>`;
};

async function loadLive() {
  const container = document.getElementById('live-list');
  const matches = await fetchFixtures();
  let str = '';
  matches.filter(m => ['LIVE','HT','1H','2H'].includes(m.status?.short)).forEach(m => {
    str += `<div class="card">${m.teams.home.name} ${m.goals.home||0} - ${m.goals.away||0} \( {m.teams.away.name} <span class="live-time"> \){getLiveTime(m)}</span></div>`;
  });
  container.innerHTML = str || `<p>Hakuna mechi za live kwa sasa</p>`;
}

window.addToBetslip = (match) => {
  if (betslip.some(b => b.fixture.id === match.fixture.id)) return toast("Tayari ipo!", "warn");
  betslip.push(match);
  toast("✅ Imeongezwa kwenye Betslip");
};

function renderBetslip() {
  const container = document.getElementById('betslip-list');
  let html = betslip.map(m => `
    <div class="card">
      ${m.teams.home.name} vs ${m.teams.away.name}
      <div class="progress-bar"><div class="progress-fill" style="width:65%"></div></div>
    </div>`).join('');
  container.innerHTML = html || `<p>Betslip ni tupu</p>`;
}

window.showScreen = showScreen;

showScreen('home');
toast("🚀 NJEM Tipps v2.7 Tayari", "ok");
</script>
</body>
</html>
