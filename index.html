// Fetch live scores for today's matches

// Find score for a match by team names
function findScore(teamsStr) {
  if (!teamsStr) return null;
  const key = teamsStr.toLowerCase().trim();
  // Direct match
  if (liveScores[key]) return liveScores[key];
  // Partial match
  for (const [k, v] of Object.entries(liveScores)) {
    const parts = key.split(' vs ');
    if (parts.length === 2) {
      const home = parts[0].trim().toLowerCase();
      const away = parts[1].trim().toLowerCase();
      if (k.includes(home) || k.includes(away)) return v;
    }
  }
  return null;
}

// Auto-settle betslip matches that are finished
async function autoSettleMatches() {
  if (!currentUser) return;
  const pendingMikeka = mikeka.filter(m => m.status === 'PENDING');
  
  for (const mk of pendingMikeka) {
    const matches = mk.matches || [];
    let allSettled = true;
    let needsUpdate = false;
    
    for (const match of matches) {
      if (match.outcome !== 'PENDING') continue;
      
      const score = findScore(match.teams);
      if (!score || !score.isFinished) { allSettled = false; continue; }
      
      // Determine outcome based on market and pick
      const outcome = determineOutcome(match, score);
      if (outcome) {
        await sb.from('matches').update({ outcome }).eq('id', match.id);
        match.outcome = outcome;
        needsUpdate = true;
        toast(`✅ Auto: ${match.teams} — ${outcome}`, 'info');
      } else {
        allSettled = false;
      }
    }
    
    // Check if whole mkeka is settled
    if (needsUpdate) {
      const { data: freshMatches } = await sb.from('matches').select('*').eq('mkeka_id', mk.id);
      const allDone = (freshMatches || []).every(m => m.outcome !== 'PENDING');
      if (allDone) {
        const hasLoss = (freshMatches || []).some(m => m.outcome === 'LOSS');
        const allVoid = (freshMatches || []).every(m => m.outcome === 'VOID');
        const newStatus = hasLoss ? 'LOST' : allVoid ? 'VOID' : 'WON';
        await sb.from('mikeka').update({ status: newStatus }).eq('id', mk.id);
        if (newStatus === 'WON') {

        } else if (newStatus === 'LOST') {
          showNotification('❌ Mkeka Umepoteza', mk.name || 'Mkeka');
        }
        await loadData();
      }
    }
  }
}

// Determine match outcome from score
function determineOutcome(match, score) {
  const home = parseInt(score.home) || 0;
  const away = parseInt(score.away) || 0;
  const total = home + away;
  const market = match.market || '';
  const pick = (match.pick || '').toLowerCase().trim();
  
  try {
    // 1X2
    if (market === '1X2') {
      const result = home > away ? '1' : away > home ? '2' : 'X';
      return result === pick ? 'WIN' : 'LOSS';
    }
    // Double Chance
    if (market === 'Double Chance') {
      const result = home > away ? '1' : away > home ? '2' : 'X';
      if (pick === '1x' || pick === 'x1') return (result==='1'||result==='X') ? 'WIN' : 'LOSS';
      if (pick === '12') return (result==='1'||result==='2') ? 'WIN' : 'LOSS';
      if (pick === 'x2' || pick === '2x') return (result==='2'||result==='X') ? 'WIN' : 'LOSS';
    }
    // Draw No Bet
    if (market === 'Draw No Bet') {
      if (home === away) return 'VOID';
      const result = home > away ? '1' : '2';
      return result === pick ? 'WIN' : 'LOSS';
    }
    // Over/Under
    if (market.startsWith('Over ') || market.startsWith('Under ')) {
      const line = parseFloat(market.split(' ')[1]);
      if (market.startsWith('Over ')) return total > line ? 'WIN' : 'LOSS';
      if (market.startsWith('Under ')) return total < line ? 'WIN' : 'LOSS';
    }
    // BTTS
    if (market === 'BTTS - Yes') return (home > 0 && away > 0) ? 'WIN' : 'LOSS';
    if (market === 'BTTS - No') return (home === 0 || away === 0) ? 'WIN' : 'LOSS';
    // HT markets - cannot auto-settle without HT score
    return null;
  } catch(e) {
    return null;
  }
}

async function fetchTeamForm(teamName) {
  try {
    const res = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(teamName)}`);

    const team = (data.teams||[])[0];
    if (!team) return null;
    // Get last 5 events
    const res2 = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/eventslast.php?id=${team.idTeam}`);
    const data2 = await res2.json();
    return { team, events: (data2.results||[]).slice(0,5) };
  } catch(e) { return null; }
}

async function fetchH2H(homeTeam, awayTeam) {
  try {
    // Search both teams
    const [homeData, awayData] = await Promise.all([
      fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(homeTeam)}`).then(r=>r.json()),
      fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(awayTeam)}`).then(r=>r.json()),
    ]);
    const homeId = (homeData.teams||[])[0]?.idTeam;
    const awayId = (awayData.teams||[])[0]?.idTeam;
    if (!homeId || !awayId) return [];
    const res = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/eventsh2h.php?idHomeTeam=${homeId}&idAwayTeam=${awayId}`);
    const data = await res.json();
    return (data.results||[]).slice(0,5);
  } catch(e) { return []; }
}

function analyzeForm(events, teamName) {
  if (!events || !events.length) return { wins:0, draws:0, losses:0, goalsFor:0, goalsAgainst:0, form:[] };
  let wins=0, draws=0, losses=0, goalsFor=0, goalsAgainst=0, form=[];
  events.forEach(ev => {
    const isHome = ev.strHomeTeam?.toLowerCase().includes(teamName.toLowerCase().split(' ')[0]);
    const hg = parseInt(ev.intHomeScore)||0;
    const ag = parseInt(ev.intAwayScore)||0;
    const gf = isHome ? hg : ag;
    const ga = isHome ? ag : hg;
    goalsFor += gf; goalsAgainst += ga;
    if (gf > ga) { wins++; form.push('W'); }
    else if (gf === ga) { draws++; form.push('D'); }
    else { losses++; form.push('L'); }
  });
  return { wins, draws, losses, goalsFor, goalsAgainst, form };
}

function analyzeH2H(h2hEvents, homeTeam) {
  if (!h2hEvents || !h2hEvents.length) return null;
  let homeWins=0, awayWins=0, draws=0, totalGoals=0;
  h2hEvents.forEach(ev => {
    const hg = parseInt(ev.intHomeScore)||0;
    const ag = parseInt(ev.intAwayScore)||0;
    totalGoals += hg + ag;
    const isHome = ev.strHomeTeam?.toLowerCase().includes(homeTeam.toLowerCase().split(' ')[0]);
    if (hg > ag) isHome ? homeWins++ : awayWins++;
    else if (hg < ag) isHome ? awayWins++ : homeWins++;
    else draws++;
  });
  return {
    homeWins, awayWins, draws,
    avgGoals: (totalGoals / h2hEvents.length).toFixed(1),
    total: h2hEvents.length
  };
}

function generateAIRecommendations(homeTeam, awayTeam, homeStats, awayStats, h2h) {
  const recs = [];
  const totalHomeGoals = homeStats.goalsFor + homeStats.goalsAgainst;
  const totalAwayGoals = awayStats.goalsFor + awayStats.goalsAgainst;
  const avgTotalGoals = homeStats.form.length ? (totalHomeGoals / homeStats.form.length) : 0;
  const avgAwayGoals = awayStats.form.length ? (totalAwayGoals / awayStats.form.length) : 0;
  const avgGoals = (avgTotalGoals + avgAwayGoals) / 2;
  const h2hAvgGoals = h2h ? parseFloat(h2h.avgGoals) : 0;

  // Over/Under recommendation
  const goalAvg = h2h ? (h2hAvgGoals + avgGoals) / 2 : avgGoals;
  if (goalAvg > 2.5) {
    recs.push({
      icon: '⚽',
      market: `Over 2.5 Goals`,
      pick: 'Over 2.5',
      confidence: Math.min(Math.round(55 + (goalAvg - 2.5) * 10), 78),
      reason: `Wastani wa magoli ${goalAvg.toFixed(1)} kwa mechi. ${h2h ? `H2H avg ${h2hAvgGoals} magoli.` : ''}`,
      type: goalAvg > 3 ? 'best' : 'ok'
    });
  } else {
    recs.push({
      icon: '🔒',
      market: `Under 2.5 Goals`,
      pick: 'Under 2.5',
      confidence: Math.min(Math.round(55 + (2.5 - goalAvg) * 8), 72),
      reason: `Mechi za hivi karibuni zina magoli machache. Avg ${goalAvg.toFixed(1)}.`,
      type: goalAvg < 1.8 ? 'best' : 'ok'
    });
  }

  // 1X2 / Double Chance recommendation
  const homeWinRate = homeStats.form.length ? homeStats.wins / homeStats.form.length : 0;
  const awayWinRate = awayStats.form.length ? awayStats.wins / awayStats.form.length : 0;
  const h2hHomeDominance = h2h ? h2h.homeWins / h2h.total : 0.5;

  if (homeWinRate > 0.6 && h2hHomeDominance > 0.4) {
    recs.push({
      icon: '🏠',
      market: 'Double Chance 1X',
      pick: '1X',
      confidence: Math.min(Math.round(55 + homeWinRate * 20), 75),
      reason: `${homeTeam} wameshinda ${Math.round(homeWinRate*100)}% ya mechi zao za hivi karibuni. H2H wanaongoza ${h2h?h2h.homeWins:0}/${h2h?h2h.total:0}.`,
      type: homeWinRate > 0.7 ? 'best' : 'ok'
    });
  } else if (awayWinRate > 0.6) {
    recs.push({
      icon: '✈️',
      market: 'Double Chance X2',
      pick: 'X2',
      confidence: Math.min(Math.round(52 + awayWinRate * 18), 72),
      reason: `${awayTeam} wana form nzuri — wameshinda ${Math.round(awayWinRate*100)}% ya mechi zao.`,
      type: awayWinRate > 0.7 ? 'best' : 'ok'
    });
  } else {
    recs.push({
      icon: '⚖️',
      market: 'Double Chance 1X',
      pick: '1X',
      confidence: 55,
      reason: 'Mechi usawa — Double Chance ni salama zaidi kuliko 1X2 moja kwa moja.',
      type: 'ok'
    });
  }

  // BTTS recommendation
  const homeScoredIn = homeStats.goalsFor > 0;
  const awayScoredIn = awayStats.goalsFor > 0;
  const homeConcedeRate = homeStats.form.length ? homeStats.goalsAgainst / homeStats.form.length : 1;
  const awayConcedeRate = awayStats.form.length ? awayStats.goalsAgainst / awayStats.form.length : 1;

  if (homeConcedeRate > 0.8 && awayConcedeRate > 0.8) {
    recs.push({
      icon: '🎯',
      market: 'BTTS - Yes',
      pick: 'BTTS Yes',
      confidence: Math.min(Math.round(55 + (homeConcedeRate + awayConcedeRate) * 5), 73),
      reason: `${homeTeam} wapoteza avg ${homeConcedeRate.toFixed(1)} kwa mechi. ${awayTeam} avg ${awayConcedeRate.toFixed(1)}. Pande zote zinaweza kuscore.`,
      type: homeConcedeRate > 1 && awayConcedeRate > 1 ? 'best' : 'ok'
    });
  }

  // Sort by confidence
  recs.sort((a, b) => b.confidence - a.confidence);
  return recs.slice(0, 4);
}

function generateMatchAI(score, stats) {
  const tips = [];
  const home = score.homeTeam || 'Home';
  const away = score.awayTeam || 'Away';
  const h = parseInt(score.home) || 0;
  const a = parseInt(score.away) || 0;
  const total = h + a;
  const min = score.minuteNum || 0;

  if (score.isLive) {
    // Live recommendations
    if (total === 0 && min > 60) tips.push({icon:'💡',msg:`${min}+ dakika bila goli — Over 0.5 inaweza kuwa risky`});
    if (total >= 2 && min < 70) tips.push({icon:'🔥',msg:`Magoli ${total} tayari — Over ${total}.5 inawezekana kabla FT`});
    if (h > a + 1) tips.push({icon:'💰',msg:`${home} wanaongoza kwa ${h}-${a} — Fikiria cashout sasa`});
    if (a > h + 1) tips.push({icon:'💰',msg:`${away} wanaongoza kwa ${a}-${h} — Fikiria cashout sasa`});
    if (parseInt(stats.red_home) > 0) tips.push({icon:'🟥',msg:`${home} wana mchezaji nje — ${away} wana advantage`});
    if (parseInt(stats.red_away) > 0) tips.push({icon:'🟥',msg:`${away} wana mchezaji nje — ${home} wana advantage`});
    if (h === a && min > 75) tips.push({icon:'⚡',msg:`Sare ${h}-${a} dakika ${min} — Bonyeza kwa ${home} au ${away} kwa late goal`});
  } else if (score.isFinished) {
    tips.push({icon:'📊',msg:`Matokeo: ${home} ${h} - ${a} ${away}`});
    if (total > 3) tips.push({icon:'📈',msg:`Magoli ${total} — Over 2.5 ingelifaa kwenye mechi hii`});
    if (total < 2) tips.push({icon:'📉',msg:`Magoli ${total} tu — Under 2.5 ingelifaa`});
  } else {
    tips.push({icon:'⏳',msg:`Mechi hii bado haijachezwa — subiri kwa data zaidi`});
  }

}

function getStreak(){
  const s=[...mikeka].filter(m=>m.status!=='PENDING'&&m.status!=='VOID');
  if(!s.length)return{type:'none',count:0};
  const t=s[0].status==='WON'?'WIN':'LOSS';let c=0;
  for(const m of s){if((m.status==='WON')===(t==='WIN'))c++;else break;}
  return{type:t,count:c};
}
function analyzeRisk(matches){
  const flags=[],tips=[];
  const totalOdds=matches.reduce((p,m)=>p*(parseFloat(m.odds)||1),1);
  if(matches.length>4)flags.push({icon:'⚠️',msg:`Mechi ${matches.length} — chances za kupoteza zinaongezeka`});
  if(totalOdds>20)flags.push({icon:'🔴',msg:`Odds ${totalOdds.toFixed(2)} ni kubwa mno!`});
  matches.forEach(m=>{
    if(parseFloat(m.odds)<1.2)flags.push({icon:'⚠️',msg:`${m.teams||'Mechi'}: Odds ${m.odds} — value si nzuri`});
    if(parseFloat(m.odds)>5)flags.push({icon:'🔴',msg:`${m.teams||'Mechi'}: Odds ${m.odds} — hatari!`});
  });
  const streak=getStreak();
  if(streak.type==='LOSS'&&streak.count>=2)flags.push({icon:'🚨',msg:`Loss streak ${streak.count} — fikiria vizuri!`});
  const lgMap={};
  mikeka.forEach(mk=>(mk.matches||[]).forEach(match=>{
    if(!lgMap[match.league])lgMap[match.league]={w:0,l:0,t:0};
    lgMap[match.league].t++;
    if(match.outcome==='WIN')lgMap[match.league].w++;
    if(match.outcome==='LOSS')lgMap[match.league].l++;
  }));
  matches.forEach(m=>{
    const lg=lgMap[m.league];
    if(lg&&lg.t>=3){
      const wr=(lg.w/lg.t)*100;
      if(wr<30)flags.push({icon:'📊',msg:`${lgName(m.league)}: Win rate ${wr.toFixed(0)}% — league hii inakuchania!`});
      if(wr>60)tips.push({icon:'✅',msg:`${lgName(m.league)}: Win rate ${wr.toFixed(0)}% — league nzuri kwako!`});
    }
  });
  const mkMap={};
  mikeka.forEach(mk=>(mk.matches||[]).forEach(match=>{
    if(!mkMap[match.market])mkMap[match.market]={w:0,t:0};
    mkMap[match.market].t++;
    if(match.outcome==='WIN')mkMap[match.market].w++;
  }));
  const best=Object.entries(mkMap).filter(([,v])=>v.t>=3).sort((a,b)=>(b[1].w/b[1].t)-(a[1].w/a[1].t))[0];
  if(best)tips.push({icon:'💡',msg:`Market bora kwako: ${best[0]} (${((best[1].w/best[1].t)*100).toFixed(0)}% win)`});
  return{flags,tips,totalOdds};
}
async function ocrImage(base64,mimeType){
  if(!GEMINI_KEY){toast('Weka OpenRouter API key kwenye Admin → Settings','err');return[];}
  try{
    const url='https://openrouter.ai/api/v1/chat/completions';
    const body={
      model:'meta-llama/llama-3.2-11b-vision-instruct:free',
      messages:[{
        role:'user',
        content:[
          {type:'text',text:`You are a sports betting slip reader. Extract ALL matches from this betslip image.
Return ONLY a valid JSON array, nothing else, no markdown:
[{"teams":"Team A vs Team B","market":"Double Chance","pick":"1X","odds":"1.75"}]
Always return valid JSON array even if unsure.`},
          {type:'image_url',image_url:{url:'data:'+mimeType+';base64,'+base64}}
        ]
      }],
      max_tokens:1000,
      temperature:0.1
    };
    const res=await fetch(url,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+GEMINI_KEY,
        'HTTP-Referer':'https://njem-tipps.netlify.app',
        'X-Title':'NJEM Tipps'
      },
      body:JSON.stringify(body)
    });
    if(!res.ok){
      const err=await res.json();
      toast('OpenRouter error: '+(err.error?.message||res.status),'err');
      return[];
    }
    const data=await res.json();
    const text=data.choices?.[0]?.message?.content||'[]';
    const clean=text.replace(/```json|```/g,'').trim();
    const match=clean.match(/\[[\s\S]*\]/);
    if(!match){toast('Mechi hazipatikani kwenye picha','warn');return[];}
    return JSON.parse(match[0]);
  }catch(e){
    console.error('OCR error:',e);
    toast('OCR imeshindwa: '+e.message,'err');
    return[];
  }
}

function showBankrollModal(){
  if(currentUser.role!=='owner')return toast('Wewe ni '+ROLES[currentUser.role]+' — huwezi kubadilisha bankroll','err');
  const ov=document.createElement('div');ov.className='modal-overlay';
  ov.innerHTML=`
    <div class="modal-box">
      <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:4px">💰 Bankroll</div>
      <div style="font-size:28px;font-weight:800;color:var(--accent);margin-bottom:1rem">TZS ${fmt(currentUser.bankroll)}</div>
      <div class="grid-2" style="margin-bottom:1rem">
        <button onclick="window._bkAction('add')" style="padding:.75rem;border-radius:12px;border:none;background:var(--win);color:#000;font-weight:700;cursor:pointer;font-size:14px">➕ Ongeza</button>
        <button onclick="window._bkAction('withdraw')" style="padding:.75rem;border-radius:12px;border:none;background:var(--danger);color:#fff;font-weight:700;cursor:pointer;font-size:14px">➖ Toa</button>
      </div>

    </div>`;
  document.body.appendChild(ov);ov.onclick=(e)=>{if(e.target===ov)ov.remove();};
  window._bkAction=(type)=>{
    el('bk-area').innerHTML=`
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">${type==='add'?'Kiasi cha Kuongeza':'Kiasi cha Kutoa'} (TZS)</div>
      <input class="inp" id="bk-amt" type="number" placeholder="e.g. 10000" style="margin-bottom:8px"/>
      <input class="inp" id="bk-note" placeholder="Maelezo (Deposit / Withdraw)" style="margin-bottom:10px"/>
      <button onclick="window._bkConfirm('${type}')" style="width:100%;padding:.75rem;border-radius:12px;border:none;background:${type==='add'?'var(--win)':'var(--danger)'};color:${type==='add'?'#000':'#fff'};font-weight:700;cursor:pointer">${type==='add'?'Ongeza':'Toa'}</button>`;
  };
  window._bkConfirm=async(type)=>{
    const amt=parseFloat(el('bk-amt')?.value||0);
    if(!amt||amt<=0)return toast('Weka kiasi sahihi!','err');
    if(type==='withdraw'&&amt>currentUser.bankroll)return toast('Huna pesa za kutosha!','err');
    const newBk=type==='add'?currentUser.bankroll+amt:currentUser.bankroll-amt;
    await updateUser({bankroll:newBk});
    await sb.from('transactions').insert({id:uid(),user_id:currentUser.id,type,amount:amt,note:el('bk-note')?.value||'',balance_after:newBk}).catch(()=>{});
    toast(type==='add'?`✅ Imeongezwa TZS ${fmt(amt)}`:`✅ Imetolewa TZS ${fmt(amt)}`);
    ov.remove();showTab(currentTab);
  };
}

    </div>
    <div style="font-size:13px;font-weight:700;margin-bottom:8px">Mechi (${pMatches.length}/${MAX_MATCHES})</div>
    <div id="matches-con">${pMatches.map((m,i)=>mHTML(m,i,regions)).join('')}</div>
    <button onclick="window._addM()" style="width:100%;padding:.65rem;border-radius:10px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;margin-bottom:.9rem">+ Ongeza Mechi</button>
    <textarea class="inp-sm" id="post-ana" placeholder="Analysis yako — mbona umichagua mikeka hii?" rows="3" style="margin-bottom:.9rem"></textarea>
    <div style="background:linear-gradient(135deg,#0f3520,#092518);border:1px solid rgba(0,255,133,.2);border-radius:14px;padding:1rem;margin-bottom:.9rem">
      ${[['Total Odds',tOdds.toFixed(2)+'x','var(--text)'],['Stake','TZS '+fmt(stake),'var(--text)'],['Potential Return','TZS '+fmt(potRet),'var(--win)'],['Faida','TZS '+fmt(potRet-stake),(potRet-stake)>=0?'var(--win)':'var(--loss)']].map(([l,v,col])=>`
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px"><span style="color:var(--muted)">${l}</span><span style="font-weight:700;color:${col}">${v}</span></div>`).join('')}
    </div>
    <button class="btn-primary" id="post-btn" onclick="window._post()">📤 Post Mkeka</button>`;

  wireInps();

  // OCR handler - robust version for mobile
  const ocrInput = el('ocr-in');
  if(ocrInput){
    // Remove old listeners
    const newInput = ocrInput.cloneNode(true);
    ocrInput.parentNode.replaceChild(newInput, ocrInput);
    newInput.addEventListener('change', async function(e){
      const file = e.target.files && e.target.files[0];
      if(!file){toast('Hakuna picha iliyochaguliwa','warn');return;}
      if(!GEMINI_KEY){toast('Weka OpenRouter API key kwenye Admin kwanza!','err');return;}
      // Show loading state
      const txt = el('ocr-txt');
      const lbl = el('ocr-label');
      if(txt) txt.textContent = '🤖 OpenRouter AI inasoma picha...';
      if(lbl) lbl.style.borderColor = 'var(--accent)';
      toast('📸 Picha imepokelewa — AI inasoma...','info');
      const reader = new FileReader();
      reader.onload = async(ev) => {
        try{
          const b64 = ev.target.result.split(',')[1];
          const extracted = await ocrImage(b64, file.type);
          if(extracted && extracted.length > 0){
            pMatches = extracted.slice(0, MAX_MATCHES).map(m=>({
              ...newM(),
              teams: m.teams||'',
              market: MARKETS.includes(m.market) ? m.market : 'Double Chance',
              odds: m.odds||'',
              pick: m.pick||m.market||''
            }));
            toast('✅ Mechi '+extracted.length+' zimepatikana!');
            renderPost(c);
          } else {
            if(txt) txt.textContent = '⚠️ Mechi hazipatikani — Jaza manually';
            toast('Mechi hazipatikani kwenye picha','warn');
          }
        }catch(err){
          if(txt) txt.textContent = '❌ Hitilafu — Jaribu tena';
          toast('Hitilafu: '+err.message,'err');
        }
      };
      reader.onerror = () => toast('Imeshindwa kusoma picha','err');
      reader.readAsDataURL(file);
    });
  }
  window._chk=(i)=>{pChecks[i]=!pChecks[i];renderPost(c);};
  window._kTog=()=>{kOn=!kOn;renderPost(c);};
  window._kSlide=(v)=>{kProb=parseInt(v);const p=el('k-pct');if(p)p.textContent=v+'%';};
  window._kApply=(s)=>{const i=el('post-stake');if(i)i.value=s;renderPost(c);};
  window._addM=()=>{if(pMatches.length>=MAX_MATCHES)return toast(`Max mechi ${MAX_MATCHES}!`,'err');pMatches.push(newM());renderPost(c);};
  window._delM=(id)=>{if(pMatches.length>1){pMatches=pMatches.filter(m=>m._id!==id);renderPost(c);}};
  window._post=async()=>{
    if(!pChecks.every(Boolean))return toast('Kamilisha checklist kwanza!','warn');
    readInps();
    if(!pMatches.every(m=>m.teams&&m.odds))return toast('Jaza mechi zote vizuri!','err');
    const streak=getStreak();
    if(streak.type==='LOSS'&&streak.count>=LOSS_STREAK_LIMIT)return toast('🚨 Loss streak! Pumzika kwanza!','err');
    const name=el('post-name')?.value||`Mkeka ${mikeka.length+1}`;
    const date=el('post-date')?.value||today();
    const stake=parseInt(el('post-stake')?.value||5000);
    const ana=el('post-ana')?.value||'';
    const tOdds=pMatches.reduce((p,m)=>p*(parseFloat(m.odds)||1),1);
    const potRet=Math.round(tOdds*stake);
    const mId=uid();
    const btn=el('post-btn');btn.textContent='Inasave...';btn.disabled=true;
    const{error:e1}=await sb.from('mikeka').insert({id:mId,user_id:currentUser.id,name,date,stake,total_odds:tOdds,potential_return:potRet,analysis:ana,status:'PENDING'});
    if(e1){btn.textContent='📤 Post Mkeka';btn.disabled=false;return toast('Hitilafu: '+e1.message,'err');}
    const{error:e2}=await sb.from('matches').insert(pMatches.map(m=>({id:uid(),mkeka_id:mId,teams:m.teams,league:m.league,market:m.market,pick:m.pick,odds:parseFloat(m.odds),outcome:'PENDING'})));
    btn.textContent='📤 Post Mkeka';btn.disabled=false;
    if(e2)return toast('Hitilafu ya mechi: '+e2.message,'err');
    toast('Mkeka umewekwa! 🎯');
    pMatches=[newM()];pChecks=[false,false,false,false];
    await loadData();showTab('mikeka');
  };
}
function newM(){return{_id:uid(),teams:'',league:'epl',market:'Double Chance',pick:'',odds:''};}
function mHTML(m,idx,regions){
  return`<div class="card" style="margin-bottom:.6rem">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px">
      <div style="font-size:11px;font-weight:700;color:var(--accent)">Mechi ${idx+1}</div>
      ${idx>0?`<button onclick="window._delM('${m._id}')" style="background:none;border:none;color:var(--loss);cursor:pointer;font-size:18px;padding:0">×</button>`:''}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
      <input class="inp-sm" data-mid="${m._id}" data-f="teams" placeholder="Timu A vs Timu B" value="${m.teams}" style="flex:1"/>
      ${m.teams && m.teams.includes(' vs ') ? `<button onclick="window._aiAnalysis('${m.teams.replace(/'/g,"\'")}','${m._id}')" style="padding:.4rem .6rem;border-radius:8px;border:1px solid rgba(0,255,133,.3);background:rgba(0,255,133,.08);color:var(--accent);font-size:11px;cursor:pointer;white-space:nowrap">🤖 AI</button>` : ''}
    </div>
    <div class="grid-2" style="margin-bottom:6px">
      <select class="inp-sm" data-mid="${m._id}" data-f="league">
        ${regions.map(r=>`<optgroup label="${r}">${LEAGUES.filter(l=>l.region===r).map(l=>`<option value="${l.id}" ${m.league===l.id?'selected':''}>${l.flag} ${l.name}</option>`).join('')}</optgroup>`).join('')}
      </select>
      <select class="inp-sm" data-mid="${m._id}" data-f="market">
        ${MARKETS.map(mk=>`<option value="${mk}" ${m.market===mk?'selected':''}>${mk}</option>`).join('')}
      </select>
    </div>
    <div class="grid-2">
      <input class="inp-sm" data-mid="${m._id}" data-f="pick" placeholder="Pick (1X, Over 2.5...)" value="${m.pick}"/>
      <input class="inp-sm" data-mid="${m._id}" data-f="odds" placeholder="Odds (1.75)" type="number" step="0.01" min="1" value="${m.odds}"/>
    </div>
  </div>`;
}
function wireInps(){
  document.querySelectorAll('[data-mid]').forEach(inp=>{
    inp.onchange=(e)=>{const mid=e.target.dataset.mid,f=e.target.dataset.f,v=e.target.value;pMatches=pMatches.map(m=>m._id===mid?{...m,[f]:v}:m);};
  });
}
function readInps(){
  document.querySelectorAll('[data-mid]').forEach(inp=>{
    const mid=inp.dataset.mid,f=inp.dataset.f;pMatches=pMatches.map(m=>m._id===mid?{...m,[f]:inp.value}:m);
  });
}

// RESULTS
function renderResults(c){
  const pending=mikeka.filter(m=>m.status==='PENDING');
  if(!pending.length){c.innerHTML=`<div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:1rem">✅ Rekodi Matokeo</div><div class="empty"><div style="font-size:44px">✅</div><div style="margin-top:8px">Hakuna mkeka unaosubiri</div></div>`;return;}
  c.innerHTML=`<div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:1rem">✅ Rekodi Matokeo</div>
    ${pending.map(m=>`<div class="card" style="padding:0;overflow:hidden;margin-bottom:.75rem">
      <div style="padding:.85rem;border-bottom:1px solid var(--border)">
        <div style="font-weight:700">${m.name||'Mkeka'}</div>
        <div style="font-size:11px;color:var(--muted)">${m.date} · ${(m.total_odds||1).toFixed(2)}x · TZS ${fmt(m.potential_return||0)}</div>
      </div>
      ${(m.matches||[]).map((match,i)=>`<div style="padding:.75rem;border-bottom:${i<m.matches.length-1?'1px solid #0d1f14':'none'}">
        <div style="font-size:12px;font-weight:600;margin-bottom:2px">${lgFlag(match.league)} ${match.teams}</div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:8px">${match.market} · ${match.pick} @ ${match.odds}x</div>
        <div style="display:flex;gap:6px">
          ${['WIN','LOSS','VOID'].map(o=>`<button onclick="window._out('${m.id}','${match.id}','${o}')" style="flex:1;padding:.4rem;border-radius:20px;border:1.5px solid ${match.outcome===o?sc(o):'var(--border)'};background:${match.outcome===o?sc(o)+'22':'transparent'};color:${match.outcome===o?sc(o):'var(--muted)'};font-weight:700;font-size:11px;cursor:pointer">${o}</button>`).join('')}
        </div>
      </div>`).join('')}
    </div>`).join('')}`;
  window._out=async(mId,matchId,outcome)=>{
    await sb.from('matches').update({outcome}).eq('id',matchId);
    const{data:all}=await sb.from('matches').select('*').eq('mkeka_id',mId);
    const allDone=all.every(m=>m.outcome!=='PENDING');
    if(allDone){
      const hasLoss=all.some(m=>m.outcome==='LOSS'),allVoid=all.every(m=>m.outcome==='VOID');
      const newS=hasLoss?'LOST':allVoid?'VOID':'WON';
      await sb.from('mikeka').update({status:newS}).eq('id',mId);
      const mk=mikeka.find(m=>m.id===mId);
      if(newS==='WON'&&mk){const gain=(mk.potential_return||0)-(mk.stake||0);await updateUser({bankroll:currentUser.bankroll+gain});toast(`🎉 Umeshinda! +TZS ${fmt(gain)}`);}
      else if(newS==='LOST')toast('Mkeka umepoteza. Jaribu tena! 💪','warn');
    }
    await loadData();renderResults(c);
  };
}

// REPORTS
let rP='month',rV='overview';
function renderReports(c){
  const now=new Date();
  const fil=mikeka.filter(m=>{
    const d=new Date(m.date);
    if(rP==='week'){const w=new Date(now);w.setDate(now.getDate()-7);return d>=w;}
    if(rP==='month')return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
    if(rP==='year')return d.getFullYear()===now.getFullYear();
    return true;
  });
  const won=fil.filter(m=>m.status==='WON'),lost=fil.filter(m=>m.status==='LOST'),settled=[...won,...lost];
  const staked=fil.reduce((s,m)=>s+(m.stake||0),0),ret=won.reduce((s,m)=>s+(m.potential_return||0),0);
  const profit=ret-staked,roi=staked>0?((profit/staked)*100).toFixed(1):'0.0';
  const wr=settled.length>0?((won.length/settled.length)*100).toFixed(1):'0.0';
  const lgMap={},mkMap={};
  fil.forEach(m=>(m.matches||[]).forEach(x=>{
    if(!lgMap[x.league])lgMap[x.league]={w:0,l:0,t:0};
    lgMap[x.league].t++;if(x.outcome==='WIN')lgMap[x.league].w++;if(x.outcome==='LOSS')lgMap[x.league].l++;
    if(!mkMap[x.market])mkMap[x.market]={w:0,t:0};
    mkMap[x.market].t++;if(x.outcome==='WIN')mkMap[x.market].w++;
  }));
  const danger=Object.entries(lgMap).filter(([,s])=>s.t>=2&&(s.l/s.t)>0.6);
  const best=Object.entries(lgMap).filter(([,s])=>s.t>=2&&(s.w/s.t)>0.6);
  const days={};fil.forEach(m=>{if(!days[m.date])days[m.date]=0;if(m.status==='WON')days[m.date]+=(m.potential_return-m.stake);if(m.status==='LOST')days[m.date]-=m.stake;});
  const dayArr=Object.entries(days).sort((a,b)=>a[0].localeCompare(b[0])).slice(-14);
  const maxAbs=Math.max(...dayArr.map(([,v])=>Math.abs(v)),1);
  const grade=parseFloat(roi)>=15?'A+':parseFloat(roi)>=5?'A':parseFloat(roi)>=0?'B':parseFloat(roi)>=-10?'C':'D';
  const gColor=parseFloat(roi)>=5?'var(--win)':parseFloat(roi)>=0?'var(--warn)':'var(--loss)';
  c.innerHTML=`
    <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:.9rem">📊 Ripoti</div>
    <div style="display:flex;gap:6px;margin-bottom:.75rem">
      ${[['week','Wiki'],['month','Mwezi'],['year','Mwaka'],['all','Yote']].map(([v,l])=>`<button onclick="window._rP('${v}')" style="flex:1;padding:.45rem;border-radius:12px;border:1.5px solid ${rP===v?'var(--accent)':'var(--border)'};background:${rP===v?'rgba(0,255,133,.15)':'transparent'};color:${rP===v?'var(--accent)':'var(--muted)'};font-weight:700;font-size:12px;cursor:pointer">${l}</button>`).join('')}
    </div>
    <div style="display:flex;gap:5px;margin-bottom:.9rem">
      ${[['overview','Muhtasari'],['leagues','Ligi'],['markets','Markets'],['trend','Trend'],['ai','AI Tips']].map(([v,l])=>`<button onclick="window._rV('${v}')" style="flex:1;padding:.4rem;border-radius:10px;border:1.5px solid ${rV===v?'var(--accent)':'var(--border)'};background:${rV===v?'rgba(0,255,133,.1)':'transparent'};color:${rV===v?'var(--accent)':'var(--muted)'};font-weight:700;font-size:10px;cursor:pointer">${l}</button>`).join('')}
    </div>
    <div id="rc"></div>`;
  window._rP=(v)=>{rP=v;renderReports(c);};window._rV=(v)=>{rV=v;renderReports(c);};
  const rc=el('rc');
  if(rV==='overview'){
    rc.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.75rem">
        ${[['📋',fil.length,'Mikeka','var(--text)'],['✅',won.length,'Imeshinda','var(--win)'],['❌',lost.length,'Imepoteza','var(--loss)'],['🎯',wr+'%','Win Rate',parseFloat(wr)>=50?'var(--win)':'var(--loss)'],['💸',fmt(staked),'Staked','var(--text)'],['💰',fmt(ret),'Return','var(--win)'],[profit>=0?'📈':'📉',(profit>=0?'+':'')+fmt(profit),'Faida',profit>=0?'var(--win)':'var(--loss)'],['🔄',roi+'%','ROI',parseFloat(roi)>=0?'var(--win)':'var(--loss)']].map(([ic,v,l,col])=>`<div class="stat-box"><div class="stat-icon">${ic}</div><div class="stat-val" style="color:${col}">${v}</div><div class="stat-label">${l}</div></div>`).join('')}
      </div>
      <div class="card" style="margin-bottom:.75rem">
        <div style="font-size:12px;font-weight:700;margin-bottom:10px">Win vs Loss</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${clamp(parseFloat(wr),0,100)}%"></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted)"><span>Loss: ${lost.length}</span><span style="color:var(--win);font-weight:700">${wr}% won</span><span>Win: ${won.length}</span></div>
      </div>
      <div style="background:linear-gradient(135deg,#0f3520,#092518);border:1px solid rgba(0,255,133,.2);border-radius:14px;padding:1rem;display:flex;align-items:center;gap:16px">
        <div style="font-family:'Syne',sans-serif;font-size:52px;font-weight:800;color:${gColor}">${grade}</div>
        <div><div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px">🛡️ NJEM Score</div>
          <div style="font-size:12px;color:#5a9e70">${parseFloat(roi)>=15?'🔥 Bora sana!':parseFloat(roi)>=0?'👍 Uko njia sahihi!':parseFloat(roi)>=-10?'⚠️ Pumzika kidogo.':'🚨 Simama. Reboot.'}</div>
        </div>
      </div>`;
  }
  if(rV==='leagues'){
    rc.innerHTML=`
      ${danger.length?`<div style="font-size:12px;font-weight:700;color:var(--danger);margin-bottom:8px">🚨 Leagues Zinazokuchania</div>
        ${danger.map(([id,s])=>`<div class="card" style="border-color:rgba(255,68,68,.3);margin-bottom:.5rem"><div style="display:flex;justify-content:space-between"><span style="font-weight:600">${lgFlag(id)} ${lgName(id)}</span><span style="color:var(--loss);font-weight:700">${((s.l/s.t)*100).toFixed(0)}% Loss</span></div><div style="font-size:10px;color:var(--muted);margin-top:4px">${s.w}W/${s.l}L — ⚠️ Epuka!</div></div>`).join('')}`:''}
      ${best.length?`<div style="font-size:12px;font-weight:700;color:var(--win);margin-bottom:8px;margin-top:8px">✅ Leagues Bora</div>
        ${best.map(([id,s])=>`<div class="card" style="border-color:rgba(0,255,133,.3);margin-bottom:.5rem"><div style="display:flex;justify-content:space-between"><span style="font-weight:600">${lgFlag(id)} ${lgName(id)}</span><span style="color:var(--win);font-weight:700">${((s.w/s.t)*100).toFixed(0)}% Win</span></div><div style="font-size:10px;color:var(--muted);margin-top:4px">${s.w}W/${s.l}L — ✅ Endelea!</div></div>`).join('')}`:''}
      ${Object.entries(lgMap).sort((a,b)=>b[1].w-a[1].w).map(([id,s])=>{const w=s.t?((s.w/s.t)*100).toFixed(0):0;return`<div class="card" style="margin-bottom:.5rem"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-weight:600;font-size:13px">${lgFlag(id)} ${lgName(id)}</span><span style="font-weight:700;color:${parseInt(w)>=50?'var(--win)':'var(--loss)'}">${w}%</span></div><div style="background:rgba(0,0,0,.4);border-radius:10px;height:6px;overflow:hidden"><div style="height:100%;width:${w}%;background:${parseInt(w)>=50?'var(--win)':'var(--loss)'};border-radius:10px;transition:width .8s"></div></div><div style="font-size:10px;color:var(--muted);margin-top:4px">${s.w}W/${s.l}L/${s.t} mechi</div></div>`;}).join('')||'<div class="empty"><div style="font-size:44px">📊</div><div style="margin-top:8px">Hakuna data</div></div>'}`;
  }
  if(rV==='markets'){
    rc.innerHTML=Object.entries(mkMap).sort((a,b)=>(b[1].w/b[1].t)-(a[1].w/a[1].t)).map(([market,s])=>{const w=s.t?((s.w/s.t)*100).toFixed(0):0;return`<div class="card" style="margin-bottom:.5rem"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-weight:600">${market}</span><span style="font-weight:700;color:${parseInt(w)>=50?'var(--win)':'var(--loss)'}">${w}%</span></div><div style="background:rgba(0,0,0,.4);border-radius:10px;height:6px;overflow:hidden"><div style="height:100%;width:${w}%;background:var(--info);border-radius:10px"></div></div><div style="font-size:10px;color:var(--muted);margin-top:4px">${s.w}W/${s.t-s.w}L</div></div>`;}).join('')||'<div class="empty"><div style="font-size:44px">📊</div><div style="margin-top:8px">Hakuna data</div></div>';
  }
  if(rV==='trend'){
    rc.innerHTML=`<div class="card"><div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:12px">📈 Trend (Siku 14)</div>
      ${dayArr.length===0?'<div style="text-align:center;color:var(--muted);padding:1rem">Hakuna data</div>':dayArr.map(([date,val])=>`<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><div style="font-size:10px;color:var(--muted);min-width:50px">${date.slice(5)}</div><div style="flex:1;background:rgba(0,0,0,.4);border-radius:6px;height:18px;overflow:hidden;position:relative">${val!==0?`<div style="position:absolute;top:0;height:100%;width:${(Math.abs(val)/maxAbs*100).toFixed(0)}%;${val>0?'left:0':'right:0'};background:${val>0?'var(--win)':'var(--loss)'};border-radius:6px"></div>`:''}</div><div style="font-size:11px;font-weight:700;color:${val>=0?'var(--win)':'var(--loss)'};min-width:70px;text-align:right">${val>=0?'+':''}${fmt(val)}</div></div>`).join('')}
    </div>`;
  }
  if(rV==='ai'){
    rc.innerHTML=`
      <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:12px">🤖 AI Smart Recommendations</div>
      ${danger.map(([id])=>`<div class="red-flag"><span>🚨</span><div><div style="font-size:12px;font-weight:700;color:var(--danger)">${lgFlag(id)} ${lgName(id)} — Epuka!</div><div style="font-size:11px;color:var(--muted);margin-top:2px">League hii inakuchania. AI inakushauri uepuke.</div></div></div>`).join('')}
      ${best.map(([id])=>`<div class="green-tip"><span>⭐</span><div><div style="font-size:12px;font-weight:700;color:var(--win)">${lgFlag(id)} ${lgName(id)} — Endelea!</div><div style="font-size:11px;color:var(--muted);margin-top:2px">League hii inakupa matokeo mazuri. Weka nguvu hapa.</div></div></div>`).join('')}
      ${Object.entries(mkMap).length?`<div class="green-tip"><span>💡</span><div><div style="font-size:12px;font-weight:700;color:var(--win)">Market Bora: ${Object.entries(mkMap).sort((a,b)=>(b[1].w/b[1].t)-(a[1].w/a[1].t))[0]?.[0]||'N/A'}</div><div style="font-size:11px;color:var(--muted)">Market hii inakupa win rate kubwa zaidi kwako.</div></div></div>`:''}
      ${danger.length===0&&best.length===0?'<div class="empty"><div style="font-size:44px">🤖</div><div style="margin-top:8px">Weka mikeka 10+ ili AI ikupe recommendations</div></div>':''}`;
  }
}

async function renderAdmin(c){
  c.innerHTML=`<div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:1rem">⚙️ Admin</div><div class="center"><div class="spinner"></div></div>`;
  const{data:users}=await sb.from('users').select('*');
  const{data:allMk}=await sb.from('mikeka').select('stake,status');
  const won=(allMk||[]).filter(m=>m.status==='WON'),staked=(allMk||[]).reduce((s,m)=>s+(m.stake||0),0);
  c.innerHTML=`
    <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:1rem">⚙️ Admin Dashboard</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1rem">
      ${[['👥',(users||[]).length,'Watumiaji','var(--text)'],['📋',(allMk||[]).length,'Mikeka Yote','var(--text)'],['🏆',won.length,'Zilizoshinda','var(--win)'],['💸',fmt(staked),'Total Staked','var(--accent)']].map(([ic,v,l,col])=>`<div class="stat-box"><div class="stat-icon">${ic}</div><div class="stat-val" style="color:${col}">${v}</div><div class="stat-label">${l}</div></div>`).join('')}
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:10px">👥 Simamia Watumiaji</div>
      ${(users||[]).map(u=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:.65rem 0;border-bottom:1px solid var(--border)">
        <div><div style="font-weight:600;font-size:13px">${u.name}</div><div style="font-size:10px;color:var(--muted)">${u.phone}</div></div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="font-size:11px;color:var(--accent)">TZS ${fmt(u.bankroll)}</div>
          <select onchange="window._role('${u.id}',this.value)" style="padding:.3rem .5rem;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:11px">
            ${['owner','analyst','viewer'].map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${ROLES[r]||r}</option>`).join('')}
          </select>
        </div>
      </div>`).join('')}
    </div>
    <div class="card" style="border-color:rgba(77,166,255,.3)">
      <div style="font-size:12px;font-weight:700;color:var(--info);margin-bottom:10px">🤖 OpenRouter AI — Weka API Key</div>
      <input class="inp" id="gemini-key" placeholder="Paste OpenRouter API key hapa (sk-or-v1-...)" style="margin-bottom:8px" value="${GEMINI_KEY}"/>
      <button onclick="window._saveGemini()" class="btn-ghost">💾 Hifadhi Key</button>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">Pata key bure: <a href="https://openrouter.ai/keys" target="_blank" style="color:var(--accent)">openrouter.ai/keys</a> (inaanza na sk-or-v1-...)</div>
    </div>`;
  window._role=async(uid,role)=>{await sb.from('users').update({role}).eq('id',uid);toast(`Role → ${ROLES[role]}`);};
  window._saveGemini=()=>{GEMINI_KEY=el('gemini-key')?.value||'';localStorage.setItem('njem_or_key',GEMINI_KEY);localStorage.removeItem('njem_gemini_key');toast(GEMINI_KEY?'✅ Gemini key imehifadhiwa! Inafanya kazi sasa.':'Key ni empty','warn');renderAdmin(c);};
}

// ═══════════════════════════════════════
// AUTO LOGIN — Check saved session
// ═══════════════════════════════════════
async function checkSavedSession() {
  try {
    const saved = localStorage.getItem('njem_session');
    if (!saved) { showAuth('login'); return; }
    const savedUser = JSON.parse(saved);
    if (!savedUser || !savedUser.id) { showAuth('login'); return; }
    // Verify user still exists in Supabase + get fresh data
    const { data, error } = await sb.from('users').select('*').eq('id', savedUser.id).maybeSingle();
    if (error || !data) {
      localStorage.removeItem('njem_session');
      showAuth('login');
      return;
    }
    // Auto login with fresh data
    await loginUser(data);
  } catch(e) {
    showAuth('login');
  }
}

// Global handlers
window._showMatchDetails = (teams, eventId) => showMatchDetailsModal(teams, eventId);
window._aiAnalysis = (teams, mid) => {
  readInps();
  const match = pMatches.find(m => m._id === mid);
  const teamsStr = match ? match.teams : teams;
  if (!teamsStr || !teamsStr.includes(' vs ')) return toast('Jaza jina la timu kwanza!', 'warn');
  showAIAnalysis(teamsStr);
};

// BOOT — Check saved session first
checkSavedSession();
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
