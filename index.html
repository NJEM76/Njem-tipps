<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>NJEM Tipps - Real Data</title>
  <meta name="theme-color" content="#00ff85">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #05110a; --surface: #0c1f13; --border: #1a3522;
      --accent: #00ff85; --text: #e4f0e8; --muted: #4a7a5a;
    }
    body { background: var(--bg); font-family: 'DM Sans', sans-serif; color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-container, .app-container { max-width: 500px; width: 100%; margin: auto; background: var(--surface); border-radius: 32px; padding: 2rem 1.5rem; border: 1px solid var(--border); }
    input, button { width: 100%; padding: 12px; margin-top: 12px; border-radius: 60px; border: none; font-size: 1rem; }
    input { background: #0a1910; border: 1px solid var(--border); color: var(--text); text-align: center; }
    button { background: var(--accent); color: #05110a; font-weight: bold; cursor: pointer; }
    button.secondary { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
    .error { color: #ff8888; text-align: center; margin-top: 12px; font-size: 0.85rem; }
    .header-title { font-family: 'Syne'; font-size: 1.4rem; color: var(--accent); }
    .card { background: rgba(0,0,0,0.2); border-radius: 24px; padding: 1rem; margin-bottom: 1rem; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
    .live-dot { display: inline-block; width: 10px; height: 10px; background: #ff4444; border-radius: 50%; margin-right: 6px; animation: pulse 1s infinite; }
    @keyframes pulse { 0%{ opacity: 1; } 50%{ opacity: 0.3; } }
    .badge-live { background: #ff4444; padding: 2px 8px; border-radius: 30px; font-size: 0.7rem; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; padding: 0.5rem; z-index: 100; max-width: 500px; margin: auto; }
    .nav-btn { flex: 1; background: none; border: none; color: var(--muted); font-weight: 600; padding: 8px; cursor: pointer; }
    .nav-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    .toast { position: fixed; top: 20px; right: 20px; background: var(--surface); border-left: 4px solid var(--accent); padding: 10px 15px; border-radius: 16px; z-index: 999; }
  </style>
</head>
<body>
<div id="loginScreen" class="login-container">
  <h2>🔐 NJEM TIPPS</h2>
  <p style="text-align:center; margin-bottom:20px;">Ingiza PIN yako (default: 1234)</p>
  <input type="password" id="pinInput" placeholder="PIN kwa namba 4" maxlength="6" inputmode="numeric">
  <button id="loginBtn">Ingia</button>
  <div id="loginError" class="error"></div>
  <div style="margin-top:20px; text-align:center; font-size:12px; color:#4a7a5a;">💡 Bado huna akaunti? Tumia PIN 1234 au weka PIN yoyote mpya (itahifadhiwa)</div>
</div>

<div id="appScreen" style="display:none; max-width:500px; margin:0 auto; min-height:100vh; padding-bottom:70px;">
  <div class="app-container" style="border-radius:0; background:transparent; padding:1rem;">
    <div class="flex-between">
      <div class="header-title">NJEM TIPPS</div>
      <div id="bankrollDisplay" style="background:#00000066; padding:5px 12px; border-radius:30px;">💵 TZS 0</div>
      <button class="secondary" style="width:auto; padding:5px 10px; margin:0;" onclick="logout()">🚪 Toka</button>
    </div>
    <div id="mainContent" style="margin-top: 1rem;"></div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn" data-tab="home">🏠 Home</button>
    <button class="nav-btn" data-tab="fixtures">📅 Fixtures</button>
    <button class="nav-btn" data-tab="mikeka">📋 Mikeka</button>
    <button class="nav-btn" data-tab="public">🌍 Public</button>
  </div>
</div>

<script>
  // ----------------------- API FOOTBALL (REAL DATA) -----------------------
  const API_FOOTBALL_KEY = "YOUR_API_FOOTBALL_KEY"; // Register on RapidAPI to get your key.
  const API_FOOTBALL_HOST = "v3.football.api-sports.io";
  const BASE_URL = "https://v3.football.api-sports.io";

  async function fetchRealLiveScores() {
    try {
      // Fetch live matches from API-Football
      const response = await fetch(`${BASE_URL}/fixtures?live=all`, {
        method: "GET",
        headers: {
          "x-apisports-key": API_FOOTBALL_KEY,
          "x-apisports-host": API_FOOTBALL_HOST,
        },
      });
      const data = await response.json();
      if (data.response && data.response.length > 0) {
        // Store the live matches in a global variable (use it to replace liveScores)
        liveScores = {};
        data.response.forEach(match => {
          const homeTeam = match.teams.home.name;
          const awayTeam = match.teams.away.name;
          const matchKey = `${homeTeam} vs ${awayTeam}`;
          liveScores[matchKey] = {
            home: match.goals.home,
            away: match.goals.away,
            minute: match.fixture.status.elapsed ? `${match.fixture.status.elapsed}'` : "LIVE",
            league: match.league.name,
            isLive: true
          };
        });
        if (currentTab === 'home') renderHome();
      } else {
        // If no live matches, fallback to fixtures of the day
        await fetchRealFixtures();
      }
    } catch (err) {
      console.error("Error fetching real live scores:", err);
      addToast("Imeshindwa kupata data halisi za mechi. Angalia API key yako.", true);
    }
  }

  async function fetchRealFixtures() {
    try {
      const today = new Date().toISOString().split('T')[0];
      const response = await fetch(`${BASE_URL}/fixtures?date=${today}`, {
        method: "GET",
        headers: {
          "x-apisports-key": API_FOOTBALL_KEY,
          "x-apisports-host": API_FOOTBALL_HOST,
        },
      });
      const data = await response.json();
      if (data.response && data.response.length > 0) {
        fixturesList = [];
        data.response.forEach(match => {
          const fixture = {
            home: match.teams.home.name,
            away: match.teams.away.name,
            time: match.fixture.date.substring(11, 16), // Extract HH:MM from the datetime string
            league: match.league.name,
            date: match.fixture.date.split('T')[0]
          };
          fixturesList.push(fixture);
        });
      } else {
        fixturesList = [];
      }
      if (currentTab === 'fixtures') renderFixtures();
      if (currentTab === 'home' && Object.keys(liveScores).length === 0) {
        renderHomeFallback();
      }
    } catch (err) {
      console.error("Error fetching fixtures:", err);
      addToast("Imeshindwa kupata data za fixtures za leo.", true);
    }
  }

  // ----------------------- FALLBACK: DEMO DATA (IF NO REAL DATA) -----------------------
  function renderHomeFallback() {
    const container = document.getElementById('mainContent');
    let html = `<div class="flex-between"><h3><span class="live-dot"></span> Live Scores</h3><button class="secondary" onclick="refreshData()">🔄 Refresh</button></div>
                <div class="card" style="text-align:center;">Hakuna mechi za live kwa sasa. Jaribu tena baada ya dakika chache.</div>`;
    container.innerHTML = html;
  }

  // ----------------------- USER & LOCAL STORAGE -----------------------
  let currentUserPIN = null;
  let userData = {}; // structure: { bankroll, myBets, publicTips }
  let liveScores = {};
  let fixturesList = [];

  function saveUserData() {
    if (!currentUserPIN) return;
    let allUsers = JSON.parse(localStorage.getItem('njem_users')) || {};
    allUsers[currentUserPIN] = userData;
    localStorage.setItem('njem_users', JSON.stringify(allUsers));
  }

  function loadUserData(pin) {
    let allUsers = JSON.parse(localStorage.getItem('njem_users')) || {};
    if (allUsers[pin]) {
      userData = allUsers[pin];
    } else {
      userData = {
        bankroll: 125000,
        myBets: [],
        publicTips: []
      };
      allUsers[pin] = userData;
      localStorage.setItem('njem_users', JSON.stringify(allUsers));
    }
    currentUserPIN = pin;
    updateBankrollUI();
  }

  function updateBankrollUI() {
    const el = document.getElementById('bankrollDisplay');
    if (el) el.innerHTML = `💵 TZS ${userData.bankroll?.toLocaleString() || 0}`;
  }

  function addToast(msg, isErr = false) {
    let toastDiv = document.createElement('div');
    toastDiv.className = 'toast';
    toastDiv.style.borderLeftColor = isErr ? '#ff5e5e' : '#00ff85';
    toastDiv.innerText = msg;
    document.body.appendChild(toastDiv);
    setTimeout(() => toastDiv.remove(), 3500);
  }

  // ----------------------- RENDERS -----------------------
  function renderHome() {
    let html = `<div class="flex-between"><h3><span class="live-dot"></span> Live Scores</h3><button class="secondary" onclick="refreshData()">🔄 Refresh</button></div>`;
    if (Object.keys(liveScores).length === 0) {
      html += `<div class="card" style="text-align:center;">Hakuna mechi za live kwa sasa. Jaribu tena baada ya dakika chache.</div>`;
    } else {
      for (let [match, data] of Object.entries(liveScores)) {
        html += `<div class="card">
          <div class="flex-between"><small>${data.league}</small><span class="badge-live">LIVE ${data.minute}</span></div>
          <div style="font-weight:bold; margin:8px 0;">${match}</div>
          <div class="flex-between"><span style="font-size:24px;">${data.home} - ${data.away}</span></div>
        </div>`;
      }
    }
    document.getElementById('mainContent').innerHTML = html;
  }

  function renderFixtures() {
    let html = `<h3>📅 Mechi za Leo</h3><button class="secondary" onclick="refreshData()" style="margin-bottom:10px;">🔄 Refresh Fixtures</button>`;
    if (fixturesList.length === 0) {
      html += `<div class="card" style="text-align:center;">Hakuna fixtures za leo. Jaribu tena baada ya muda.</div>`;
    } else {
      fixturesList.forEach(f => {
        html += `<div class="card">
          <div class="flex-between"><span>${f.league}</span><span>🕒 ${f.time}</span></div>
          <div><strong>${f.home} vs ${f.away}</strong></div>
          <button class="secondary" style="margin-top:8px;" onclick='quickAddBet("${f.home} vs ${f.away}")'>➕ Weka dau</button>
        </div>`;
      });
    }
    document.getElementById('mainContent').innerHTML = html;
  }

  window.quickAddBet = (matchName) => {
    document.querySelector('.nav-btn[data-tab="mikeka"]').click();
    setTimeout(() => {
      let inp = document.getElementById('betMatch');
      if (inp) inp.value = matchName;
      addToast(`Tayari kuweka dau: ${matchName}`);
    }, 100);
  };

  function renderMikeka() {
    let bets = userData.myBets || [];
    let totalStake = bets.filter(b=>b.status==='open').reduce((s,b)=>s+b.stake,0);
    let potential = bets.filter(b=>b.status==='open').reduce((s,b)=>s+(b.stake*b.odds),0);
    let html = `<div class="flex-between"><h3>📋 Mikeka Yangu</h3><button class="secondary" onclick="resetAllBets()">🗑️ Reset</button></div>
                <div class="card"><div>💰 Jumla Stake: TZS ${totalStake.toLocaleString()}</div><div>🎯 Uwezo wa kushinda: TZS ${potential.toLocaleString()}</div></div>
                <button onclick="showAddBetForm()" style="margin:10px 0;">+ Weka Dau Jipya</button>
                <div id="addBetForm" style="display:none; background:var(--surface); border-radius:20px; padding:1rem; margin-bottom:1rem;">
                  <input type="text" id="betMatch" placeholder="Mechi (eg. Yanga vs Simba)">
                  <input type="number" id="betOdds" placeholder="Odds (mfano 2.15)" step="0.01">
                  <input type="number" id="betStake" placeholder="Kiasi (TZS)">
                  <select id="betPrediction"><option>1 (Home)</option><option>X (Draw)</option><option>2 (Away)</option></select>
                  <div class="flex-between"><button onclick="addBet()">Hifadhi</button><button class="secondary" onclick="closeBetForm()">Ghairi</button></div>
                </div>
                <div id="betsList">`;
    if (bets.length === 0) html += `<div class="card">Hakuna mikeka bado.</div>`;
    else {
      bets.forEach((bet, idx) => {
        let statusText = bet.status === 'open' ? '🟢 Open' : (bet.status === 'won' ? '🏆 WON' : '❌ Lost');
        html += `<div class="card">
          <div class="flex-between"><strong>${bet.match}</strong> <span class="text-accent">${bet.prediction}</span></div>
          <div>Odds ${bet.odds} | Stake TZS ${bet.stake.toLocaleString()}</div>
          <div>Kushinda: TZS ${(bet.stake*bet.odds).toLocaleString()}</div>
          <div class="flex-between" style="margin-top:8px;">
            ${statusText}
            <div>${bet.status === 'open' ? `<button class="secondary" onclick="settleBet(${idx},'won')">✔️ Shinda</button> <button class="secondary" onclick="settleBet(${idx},'lost')">❌ Potea</button>` : ''}
            <button class="secondary" onclick="deleteBet(${idx})">🗑️</button></div>
          </div>
        </div>`;
      });
    }
    html += `</div>`;
    document.getElementById('mainContent').innerHTML = html;
  }

  window.showAddBetForm = () => { document.getElementById('addBetForm').style.display = 'block'; };
  window.closeBetForm = () => { document.getElementById('addBetForm').style.display = 'none'; };
  window.addBet = () => {
    let match = document.getElementById('betMatch').value.trim();
    let odds = parseFloat(document.getElementById('betOdds').value);
    let stake = parseInt(document.getElementById('betStake').value);
    let prediction = document.getElementById('betPrediction').value;
    if (!match || isNaN(odds) || isNaN(stake) || stake <= 0 || odds < 1.01) { addToast("Angalia odds na stake", true); return; }
    if (stake > userData.bankroll) { addToast("Bankroll haitoshi!", true); return; }
    userData.bankroll -= stake;
    userData.myBets = userData.myBets || [];
    userData.myBets.push({ match, odds, stake, prediction, status: 'open', date: new Date().toISOString() });
    saveUserData();
    updateBankrollUI();
    closeBetForm();
    addToast(`Dau limewekwa: ${match}`);
    renderMikeka();
  };
  window.settleBet = (idx, result) => {
    let bet = userData.myBets[idx];
    if (!bet || bet.status !== 'open') return;
    if (result === 'won') {
      userData.bankroll += bet.stake * bet.odds;
      addToast(`🎉 Umeshinda TZS ${(bet.stake*bet.odds).toLocaleString()}`);
      bet.status = 'won';
    } else if (result === 'lost') {
      bet.status = 'lost';
      addToast(`❌ Dau limepotea: ${bet.match}`);
    }
    saveUserData();
    updateBankrollUI();
    renderMikeka();
  };
  window.deleteBet = (idx) => {
    let bet = userData.myBets[idx];
    if (bet.status === 'open') {
      userData.bankroll += bet.stake;
      addToast("Stake imerejeshwa");
    }
    userData.myBets.splice(idx, 1);
    saveUserData();
    updateBankrollUI();
    renderMikeka();
  };
  window.resetAllBets = () => {
    if(confirm("Futa mikeka yote na urejeshe bankroll TZS 125,000?")){
      userData.myBets = [];
      userData.bankroll = 125000;
      saveUserData();
      updateBankrollUI();
      renderMikeka();
      addToast("Imefutwa kabisa");
    }
  };

  // Public Tips
  function renderPublic() {
    let tips = userData.publicTips || [];
    let html = `<div class="flex-between"><h3>🌍 Vidokezo vya Umma</h3><button class="secondary" onclick="showAddTipForm()">➕ Toa Shauri</button></div>
                <div id="addTipForm" style="display:none; background:var(--surface); padding:1rem; border-radius:20px; margin:10px 0;">
                  <input type="text" id="tipMatch" placeholder="Mechi"><input type="text" id="tipPrediction" placeholder="Utabiri"><input type="text" id="tipOdds" placeholder="Odds"><textarea id="tipReason" rows="2" placeholder="Sababu"></textarea>
                  <div class="flex-between"><button onclick="addPublicTip()">Chapisha</button><button class="secondary" onclick="closeTipForm()">Funga</button></div>
                </div>
                <div id="tipsList">`;
    if (tips.length === 0) html += `<div class="card">Hakuna vidokezo. Kuwa wa kwanza!</div>`;
    else {
      [...tips].reverse().forEach((tip, idx) => {
        html += `<div class="card">
          <div class="flex-between"><strong>⚽ ${tip.match}</strong><span>${tip.prediction}</span></div>
          <div>📊 Odds: ${tip.odds || '-'} | 🕒 ${new Date(tip.date).toLocaleString()}</div>
          <div>💡 ${tip.reason || 'Hakuna maelezo'}</div>
          <div class="flex-between"><small>🧑‍💻 ${tip.author || 'NJEM User'}</small><button class="secondary" onclick="likeTip(${tips.length-1-idx})">❤️ ${tip.likes || 0}</button></div>
        </div>`;
      });
    }
    html += `</div>`;
    document.getElementById('mainContent').innerHTML = html;
  }
  window.showAddTipForm = () => { document.getElementById('addTipForm').style.display = 'block'; };
  window.closeTipForm = () => { document.getElementById('addTipForm').style.display = 'none'; };
  window.addPublicTip = () => {
    let match = document.getElementById('tipMatch').value.trim();
    let pred = document.getElementById('tipPrediction').value.trim();
    if (!match || !pred) { addToast("Jaza mechi na utabiri", true); return; }
    userData.publicTips = userData.publicTips || [];
    userData.publicTips.push({
      match, prediction: pred, odds: document.getElementById('tipOdds').value.trim() || '-',
      reason: document.getElementById('tipReason').value.trim(), date: new Date().toISOString(),
      author: currentUserPIN === '1234' ? 'Mzee NJEM' : 'Mtumiaji', likes: 0
    });
    saveUserData();
    closeTipForm();
    document.getElementById('tipMatch').value = '';
    document.getElementById('tipPrediction').value = '';
    addToast("Shauri limechapishwa!");
    renderPublic();
  };
  window.likeTip = (idx) => {
    userData.publicTips[idx].likes = (userData.publicTips[idx].likes || 0) + 1;
    saveUserData();
    renderPublic();
  };

  // refresh data
  window.refreshData = () => {
    fetchRealLiveScores();
    fetchRealFixtures();
    addToast("Data inaburudishwa...");
  };

  // Tab navigation
  let currentTab = 'home';
  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-btn').forEach(btn => {
      if (btn.getAttribute('data-tab') === tab) btn.classList.add('active');
      else btn.classList.remove('active');
    });
    if (tab === 'home') renderHome();
    else if (tab === 'fixtures') renderFixtures();
    else if (tab === 'mikeka') renderMikeka();
    else if (tab === 'public') renderPublic();
  }

  // Logout
  window.logout = () => {
    currentUserPIN = null;
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'block';
    document.getElementById('pinInput').value = '';
  };

  // Login logic
  document.getElementById('loginBtn').addEventListener('click', () => {
    let pin = document.getElementById('pinInput').value.trim();
    if (pin === "") {
      document.getElementById('loginError').innerText = "Tafadhali ingiza PIN";
      return;
    }
    loadUserData(pin);
    // Load initial live data and fixtures
    fetchRealLiveScores();
    fetchRealFixtures();
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    switchTab('home');
    // attach nav listeners
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', (e) => switchTab(btn.getAttribute('data-tab')));
    });
    addToast(`Karibu ${pin === '1234' ? 'Mzee NJEM' : 'mchapishaji'}`);
          
  // Allow enter key
  document.getElementById('pinInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('loginBtn').click();
  });
</script>
</body>
</html>
