<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes"/>
  <title>N JEM Tipps v2.0</title>
  <meta name="theme-color" content="#00ff85"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="N JEM Tipps"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#05110a;--surface:#0c1f13;--border:#1a3522;--accent:#00ff85;
      --accent2:#00c965;--text:#e4f0e8;--muted:#4a7a5a;--danger:#ff4444;
      --warn:#ffaa00;--win:#00ff85;--loss:#ff4444;--info:#4da6ff;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }
    .spinner {
      border: 3px solid rgba(0,255,133,0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: var(--accent);
      animation: spin 1s linear infinite;
      margin: 2rem auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .modal-overlay {
      position: fixed; top:0; left:0; width:100%; height:100%;
      background: rgba(0,0,0,0.75); display:flex; align-items:center;
      justify-content:center; z-index:1000; padding:1rem;
    }
    .modal-box {
      background: var(--surface); border:1px solid var(--border);
      border-radius: 16px; padding:1.5rem; width:100%; max-width:460px;
    }
    .inp {
      width:100%; padding:.75rem; background:rgba(0,0,0,0.2);
      border:1px solid var(--border); border-radius:10px; color:#fff;
      font-family:inherit; outline:none;
    }
    .inp:focus { border-color: var(--accent); }
    .btn-primary {
      width:100%; padding:.85rem; background:var(--accent); color:#05110a;
      border:none; border-radius:12px; font-weight:700; cursor:pointer;
    }
  </style>
</head>
<body>

  <div id="loading-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center">
    <div style="font-family:'Syne',sans-serif;font-size:24px;font-weight:800;color:var(--accent);margin-bottom:10px">NJEM TIPPS</div>
    <div class="spinner"></div>
  </div>

  <div id="auth-screen" style="display:none;padding:2rem 1.5rem;max-width:420px;margin:10vh auto auto auto">
    <div id="auth-form" class="modal-box" style="max-width:100%"></div>
  </div>

  <div id="app" style="display:none;max-width:480px;margin:0 auto;padding-bottom:80px;position:relative">
    <div id="streak-banner" style="display:none;padding:.5rem;text-align:center;font-size:12px;font-weight:700;position:sticky;top:0;z-index:100"></div>
    <div id="app-body" style="padding:1rem"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
