function renderFixtures(c) {
  if (!fixSelectedDate) fixSelectedDate = new Date().toISOString().split('T')[0];

  // Sub-tab selector — always rendered at top
  const fixSubTabs = [
    {id:'fixtures', icon:'📅', label:'Fixtures'},
    {id:'live',     icon:'🔴', label:'Live'},
    {id:'results',  icon:'📊', label:'Results'},
    {id:'ai',       icon:'🤖', label:'AI'},
  ];

  c.innerHTML = `
    <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:.75rem">📅 Mechi</div>
    <!-- Sub-tab selector -->
    <div style="display:flex;gap:5px;margin-bottom:.85rem;background:rgba(0,0,0,.25);border-radius:14px;padding:4px">
      ${fixSubTabs.map(t=>`
        <button onclick="window._fixSubTab('${t.id}')"
          style="flex:1;padding:.5rem .2rem;border-radius:10px;border:none;background:${_fixSubTab===t.id?'var(--surface)':'transparent'};color:${_fixSubTab===t.id?'var(--accent)':'var(--muted)'};font-weight:${_fixSubTab===t.id?'700':'400'};font-size:12px;cursor:pointer;box-shadow:${_fixSubTab===t.id?'0 1px 4px rgba(0,0,0,.3)':'none'}">
          ${t.icon} ${t.label}
        </button>`).join('')}
    </div>
    <div id="fix-sub-content"></div>
  `;

  window._fixSubTab = (tab) => { _fixSubTab = tab; renderFixtures(c); };

  const fixSub = el('fix-sub-content');

  // ══════════ AI TAB ══════════
  if(_fixSubTab === 'ai'){
    // Get recent fixtures for team picker
    const allLivePairs = Object.values(liveScores).filter(s=>s.homeTeam&&s.awayTeam);
    fixSub.innerHTML = `
      <div style="background:linear-gradient(135deg,#0a1f12,#05110a);border:1px solid rgba(77,166,255,.25);border-radius:20px;padding:1.1rem;margin-bottom:.85rem">

        ${allLivePairs.length > 0 ? `

        <button onclick="window._fixRefresh()" style="padding:.3rem .65rem;border-radius:20px;border:1px solid var(--border);background:rgba(0,255,133,.08);color:var(--accent);font-size:11px;font-weight:700;cursor:pointer">🔄</button>
      </div>
    </div>

    ${_fixCalView ? `
    <!-- CALENDAR VIEW -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:.85rem;margin-bottom:.75rem">
      <div style="text-align:center;font-size:13px;font-weight:700;margin-bottom:8px">
        ${todayDt.toLocaleDateString('sw-TZ',{month:'long',year:'numeric'})}
      </div>
      <div class="cal-grid" style="margin-bottom:4px">
        ${daysOfWeek.map(d=>`<div style="text-align:center;font-size:10px;color:var(--muted);font-weight:700;padding-bottom:4px">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">
        ${calDays.map(({dt, otherMonth}) => {
          const val = dt.toISOString().split('T')[0];
          const isToday = val === todayDt.toISOString().split('T')[0];
          const isSelected = val === fixSelectedDate;
          return `<div class="cal-day${isToday?' today':''}${isSelected?' selected':''}${otherMonth?' other-month':''}"
            onclick="window._fixPickDate('${val}')"
            style="${isSelected?'background:var(--accent);color:#000;border-color:var(--accent)':''}"
          >${dt.getDate()}</div>`;
        }).join('')}
      </div>
      <div style="margin-top:8px;font-size:11px;text-align:center;color:var(--muted)">Tarehe iliyochaguliwa: <strong style="color:var(--accent)">${fixSelectedDate}</strong></div>
    </div>` : `
    <!-- DATE SCROLL VIEW -->
    <div style="display:flex;gap:6px;margin-bottom:.75rem;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch">
      ${dates.map(d => `
        <button onclick="window._fixPickDate('${d.val}')" id="fixd-${d.val}"
          style="padding:.4rem .85rem;border-radius:20px;border:1.5px solid ${d.val===fixSelectedDate?'var(--accent)':'var(--border)'};background:${d.val===fixSelectedDate?'rgba(0,255,133,.15)':'transparent'};color:${d.val===fixSelectedDate?'var(--accent)':'var(--muted)'};font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0">
          ${d.label}
        </button>`).join('')}
      <!-- Custom date input -->
      <label style="flex-shrink:0;display:flex;align-items:center;gap:4px;padding:.4rem .75rem;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap">
        📆 <input type="date" id="fix-custom-date" value="${fixSelectedDate}" style="border:none;background:transparent;color:var(--accent);font-size:12px;cursor:pointer;width:110px;outline:none" onchange="window._fixPickDate(this.value)"/>
      </label>
    </div>`}

    <!-- Search leagues -->
    <input class="inp" id="fix-search" placeholder="🔍 Tafuta ligi au nchi..." style="margin-bottom:.75rem;font-size:13px" value="${fixLeagueSearch||''}" oninput="window._fixSearch(this.value)" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="none"/>

    <!-- League selector by region -->
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Chagua Ligi (${SPORTSDB_LEAGUES.length})</div>
    <div id="fix-league-list">
    ${regions.map(r => {
      const leagues = SPORTSDB_LEAGUES.filter(l=>l.region===r);
      return `
      <div class="fix-region-block" data-region="${r}">
        <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:8px 0 4px">${r} (${leagues.length})</div>
        <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:4px">
          ${leagues.map(l => `
            <button onclick="window._fixPickLeague('${l.id}')" id="fixl-${l.id}"
              style="display:flex;align-items:center;gap:10px;padding:.6rem .85rem;border-radius:12px;border:1px solid ${fixSelectedLeague?.id===l.id?'var(--accent)':'var(--border)'};background:${fixSelectedLeague?.id===l.id?'rgba(0,255,133,.08)':'var(--surface)'};color:var(--text);cursor:pointer;text-align:left;font-family:inherit;transition:border-color .15s">
              <span style="font-size:18px">${l.flag}</span>
              <span style="font-size:13px;font-weight:${fixSelectedLeague?.id===l.id?'700':'400'};color:${fixSelectedLeague?.id===l.id?'var(--accent)':'var(--text)'}">${l.name}</span>
              <span style="margin-left:auto;color:var(--muted);font-size:16px">›</span>
            </button>`).join('')}
        </div>
      </div>`;
    }).join('')}
    </div>

    <!-- Matches output -->
    <div id="fix-matches-out" style="margin-top:1rem"></div>
  `;

  window._fixToggleCal = () => {
    window._fixCalendarMode = !window._fixCalendarMode;
    renderFixtures(c);
  };

  window._fixPickDate = (date) => {
    if (!date) return;
    fixSelectedDate = date;
    document.querySelectorAll('[id^="fixd-"]').forEach(b => {
      const isActive = b.id === 'fixd-' + date;
      b.style.borderColor = isActive ? 'var(--accent)' : 'var(--border)';
      b.style.background = isActive ? 'rgba(0,255,133,.15)' : 'transparent';
      b.style.color = isActive ? 'var(--accent)' : 'var(--muted)';
    });
    // Also update custom date input
    const cdi = el('fix-custom-date');
    if (cdi) cdi.value = date;
    if (fixSelectedLeague) loadFixMatchesFree(fixSelectedLeague);
  };

  window._fixRefresh = () => {
    if (fixSelectedLeague) {
      loadFixMatchesFree(fixSelectedLeague).then(() => {
        toast('Fixtures zimesasishwa! ✅', 'ok');
      });
    } else {
      toast('Chagua ligi kwanza!', 'warn');
    }
  };

  let _fixSearchTimer;
  window._fixSearch = (q) => {
    clearTimeout(_fixSearchTimer);
    _fixSearchTimer = setTimeout(() => {
    fixLeagueSearch = q.toLowerCase();
    // Optimization: avoid DOM blocking by using requestAnimationFrame
    requestAnimationFrame(() => {
      const blocks = document.querySelectorAll('.fix-region-block');
      blocks.forEach(block => {
        const btns = block.querySelectorAll('button[id^="fixl-"]');
        let visibleCount = 0;
        btns.forEach(btn => {
          const lgName = btn.querySelector('span:nth-child(2)')?.textContent?.toLowerCase() || '';
          const regionName = block.dataset.region?.toLowerCase() || '';
          const match = !fixLeagueSearch || lgName.includes(fixLeagueSearch) || regionName.includes(fixLeagueSearch);
          btn.style.display = match ? '' : 'none';
          if (match) visibleCount++;
        });
        block.style.display = visibleCount > 0 ? '' : 'none';
      });
    });
    }, 180);
  };

  window._fixPickLeague = (lgId) => {
    const lg = SPORTSDB_LEAGUES.find(l => l.id === lgId);
    if (!lg) return;
    fixSelectedLeague = lg;
    document.querySelectorAll('[id^="fixl-"]').forEach(b => {
      const isActive = b.id === 'fixl-' + lgId;
      b.style.borderColor = isActive ? 'var(--accent)' : 'var(--border)';
      b.style.background = isActive ? 'rgba(0,255,133,.08)' : 'var(--surface)';
      const nameSpan = b.querySelector('span:nth-child(2)');
      if (nameSpan) { nameSpan.style.color = isActive ? 'var(--accent)' : 'var(--text)'; nameSpan.style.fontWeight = isActive ? '700' : '400'; }
    });
    // Scroll to results
    const out = el('fix-matches-out');
    if (out) setTimeout(() => out.scrollIntoView({behavior:'smooth', block:'start'}), 100);
    loadFixMatchesFree(lg);
  };

  // Reapply search filter if any
  if (fixLeagueSearch) window._fixSearch(fixLeagueSearch);

  // Kama kulikuwa na league iliyochaguliwa, ipakia tena
  if (fixSelectedLeague) loadFixMatchesFree(fixSelectedLeague);
}

// ── Fixture card renderer (shared) ───────────────────────────────────
function renderFixCard(home, away, isLive, isFT, hg, ag, minute, time, leagueId, showBetBtn, fixtureId) {
  const safeH = (home||'').replace(/'/g,"\\'");
  const safeA = (away||'').replace(/'/g,"\\'");
  const teamsJson = JSON.stringify({teams:`${home} vs ${away}`, league: leagueId}).replace(/"/g,'&quot;');
  // For upcoming: show time prominently; for live: show score+minute; for FT: show final score
  const timeDisplay = time ? time : '--:--';
  return `
    <div draggable="${showBetBtn && !isFT ? 'true' : 'false'}"
      ondragstart="event.dataTransfer.setData('application/json','${teamsJson}');event.currentTarget.style.opacity='.5'"
      ondragend="event.currentTarget.style.opacity='1'"
      style="background:var(--surface);border:1px solid ${isLive?'rgba(255,68,68,.4)':'var(--border)'};border-radius:14px;padding:.85rem;margin-bottom:.6rem${isLive?';box-shadow:0 0 12px rgba(255,68,68,.15)':''}${showBetBtn&&!isFT?';cursor:grab':''}">
      <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem">
        <div style="text-align:right"><div style="font-size:13px;font-weight:600">${home}</div></div>
        <div style="text-align:center;min-width:80px">
          ${isLive ? `
            <div style="font-size:20px;font-weight:800;color:var(--danger)">${hg??0} - ${ag??0}</div>
            <div style="font-size:10px;color:var(--danger);animation:pulse 1s infinite;font-weight:700">🔴 ${minute||'LIVE'}</div>
          ` : isFT ? `
            <div style="font-size:20px;font-weight:800;color:var(--muted)">${hg??'-'} - ${ag??'-'}</div>
            <div style="font-size:10px;color:var(--muted);font-weight:700">✅ FT</div>
          ` : `
            <div style="font-size:17px;font-weight:800;color:var(--accent)">${timeDisplay}</div>
            <div style="font-size:9px;color:var(--muted)">KICK-OFF</div>
          `}
        </div>
        <div style="text-align:left"><div style="font-size:13px;font-weight:600">${away}</div></div>
      </div>
      ${showBetBtn && !isFT && home && away ? `
      <div style="margin-top:8px;display:flex;gap:6px">
        <button onclick="window._fixAddBetslip('${safeH} vs ${safeA}','${leagueId}')"
          style="flex:1;padding:.4rem;border-radius:10px;border:1px solid rgba(0,255,133,.3);background:rgba(0,255,133,.08);color:var(--accent);font-size:11px;font-weight:600;cursor:pointer">
          ➕ Ongeza Betslip
        </button>
        ${isLive ? `<button onclick="window._showMatchDetails('${safeH} vs ${safeA}','${fixtureId||''}')" style="padding:.4rem .7rem;border-radius:10px;border:1px solid rgba(255,68,68,.3);background:rgba(255,68,68,.08);color:var(--danger);font-size:11px;cursor:pointer">📊 Stats</button>` : ''}
      </div>` : ''}
    </div>`;
}

// ── Main fixture loader — tries 3 sources in order ────────────────────
async function loadFixMatchesFree(league) {
  const out = el('fix-matches-out');
  if (!out) return;
  out.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:.5rem">
      <span style="font-size:18px">${league.flag}</span>
      <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px">${league.name}</span>
      <span style="font-size:11px;color:var(--muted)">${fixSelectedDate}</span>
    </div>
    <div class="center"><div class="spinner"></div><div style="font-size:11px;color:var(--muted);margin-top:6px">Inatafuta kutoka vyanzo vya data...</div></div>`;

  let matches = [];   // normalised scoreData objects
  let srcLabel = '';

  // ── Source 1: API-Football ───────────────────────────────────────
  if (APISPORTS_KEY) {
    const lgId = APIFOOTBALL_LEAGUE_IDS[league.id];
    if (lgId) {
      try {
        const data = await apifootballFetch(`/fixtures?league=${lgId}&date=${fixSelectedDate}&timezone=Africa/Dar_es_Salaam`);
        if (data && !data._rateLimit && (data.response||[]).length > 0) {
          const nowMs = Date.now();
          matches = data.response.map(fix => normaliseApifootball(fix, nowMs)).filter(Boolean);
          srcLabel = '⚡ API-Football';
        }
      } catch(e) { console.warn('fix src1:', e.message); }
    }
  }

  // ── Source 1b: football-data.org ────────────────────────────────
  if (!matches.length && FOOTBALLDATA_KEY) {
    const fdCode = FOOTBALLDATA_LEAGUE_IDS[league.id];
    if (fdCode) {
      try {
        const data = await footballdataFetch(`competitions/${fdCode}/matches?dateFrom=${fixSelectedDate}&dateTo=${fixSelectedDate}`);
        if ((data?.matches||[]).length > 0) {
          const nowMs = Date.now();
          matches = data.matches.map(m => normaliseFootballData(m, nowMs)).filter(Boolean);
          srcLabel = '🟠 football-data.org';
        }
      } catch(e) { console.warn('fix src1b football-data:', e.message); }
    }
  }

  // ── Source 2: Sportmonks (free trial — 120 leagues) ──────────────
  if (!matches.length && SPORTMONKS_KEY) {
    const lgId = SPORTMONKS_LEAGUE_IDS[league.id];
    if (lgId) {
      try {
        const data = await sportmonksFetch(
          `fixtures/date/${fixSelectedDate}?filters=leagueId:${lgId}&include=participants;scores;state;league;venue`
        );
        if ((data?.data||[]).length > 0) {
          const nowMs = Date.now();
          matches = data.data.map(fix => normaliseSportmonks(fix, nowMs)).filter(Boolean);
          srcLabel = '🟢 Sportmonks';
        }
      } catch(e) { console.warn('fix src2 Sportmonks:', e.message); }
    }
    // Kama league haina ID kwenye Sportmonks, jaribu kuSearch kwa jina
    if (!matches.length) {
      try {
        const today2 = fixSelectedDate;
        const data = await sportmonksFetch(
          `fixtures/date/${today2}?include=participants;scores;state;league`
        );
        if ((data?.data||[]).length > 0) {
          const nowMs = Date.now();
          const lgNameLower = league.name.toLowerCase();
          const filtered = (data.data).filter(fix =>
            fix.league?.name?.toLowerCase().includes(lgNameLower.split(' ')[0])
          );
          if (filtered.length > 0) {
            matches = filtered.map(fix => normaliseSportmonks(fix, nowMs)).filter(Boolean);
            srcLabel = '🟢 Sportmonks';
          }
        }
      } catch(e) { console.warn('fix src2b Sportmonks search:', e.message); }
    }
  }

  // ── Source 3: AllSports API ──────────────────────────────────────
  if (!matches.length && ALLSPORTS_KEY) {
    const lgId = ALLSPORTS_LEAGUE_IDS[league.id];
    if (lgId) {
      try {
        const data = await allsportsFetch(`?met=Fixtures&leagueId=${lgId}&from=${fixSelectedDate}&to=${fixSelectedDate}`);
        if ((data?.result||[]).length > 0) {
          const nowMs = Date.now();
          matches = data.result.map(ev => normaliseAllsports(ev, nowMs)).filter(Boolean);
          srcLabel = '🌐 AllSports';
        }
      } catch(e) { console.warn('fix src3 AllSports:', e.message); }
    }
  }

  // ── Source 4: TheSportsDB (free fallback) ────────────────────────
  if (!matches.length && league.sportsdbId && league.sportsdbId !== '0') {
    try {
      // Tanzania special handling — TPL sometimes listed under different names
      const isTanzania = ['tpl','crdb_fed','mapinduzi'].includes(league.id);
      
      // First try: fetch by league sportsdbId directly
      const data = await sportsdbFetch(`eventsday.php?d=${fixSelectedDate}&l=${league.sportsdbId}`);
      let evs = data?.events || [];

      // Fallback for Tanzania if specific ID fails
      if (isTanzania && !evs.length) {
         const dataTz = await sportsdbFetch(`eventsday.php?d=${fixSelectedDate}&s=Soccer`);
         evs = (dataTz?.events || []).filter(e => (e.strCountry||'').toLowerCase() === 'tanzania');
      }

      // STRICT: Filter by country + league name to prevent cross-country contamination
      // e.g. Norway sportsdbId 4346 should NOT show MLS results  
      if (evs.length > 0) {
        const CTRY_MAP = {
          'kpl':'kenya','npfl':'nigeria','psl':'south africa','egypt':'egypt','ghana':'ghana',
          'uganda':'uganda','rwanda':'rwanda','zambia':'zambia','morocco':'morocco',
          'algeria':'algeria','tunisia':'tunisia','senegal':'senegal','mali':'mali',
          'burkina':'burkina','guinea':'guinea','togo':'togo','benin':'benin',
          'gabon':'gabon','libya':'libya','mozambique':'mozambique','cote':'ivory',
          'cameroon':'cameroon','angola':'angola','drc':'congo','ethiopia':'ethiopia',
          'zimbabwe':'zimbabwe','namibia':'namibia','malawi':'malawi',
          'epl':'england','laliga':'spain','bundesliga':'germany',
          'seriea':'italy','ligue1':'france','eredivisie':'netherlands','primeira':'portugal',
          'jupiler':'belgium','superlig':'turkey','championship':'england','scottish':'scotland',
          'norwegian':'norway','swedish':'sweden','danish':'denmark','swiss':'switzerland',
          'austrian':'austria','greek':'greece','czech':'czech','romanian':'romania',
          'croatian':'croatia','serbian':'serbia','rpl':'russia','ekstraklasa':'poland',
          'ukr':'ukraine','azerbaijani':'azerbaijan','kazakh':'kazakhstan',
          'albanian':'albania','bosnian':'bosnia','slovakian':'slovakia',
          'hungarian':'hungary','bulgarian':'bulgaria','belarusian':'belarus',
          'armenian':'armenia','georgian':'georgia',
          'mls':'united states','brasileirao':'brazil','liga_mx':'mexico',
          'argentina':'argentina','colombia':'colombia','chile':'chile','peru':'peru',
          'ecuador':'ecuador','venezuela':'venezuela','uruguay':'uruguay',
          'paraguay':'paraguay','bolivia':'bolivia',
          'jleague':'japan','kleague':'korea','csl':'china','isl':'india',
          'saudi':'saudi','uae':'emirates','qatar':'qatar','iran':'iran','iraq':'iraq',
          'jordan':'jordan','oman':'oman','a_league':'australia','thailand':'thailand',
          'vleague':'vietnam','mpl':'malaysia','bahrain':'bahrain',
        };
        const reqCountry = CTRY_MAP[league.id];
        if (reqCountry && !isTanzania) {
          const filtered = evs.filter(ev => {
            const ctryL = (ev.strCountry||'').toLowerCase();
            const lgL = (ev.strLeague||'').toLowerCase();
            return ctryL.includes(reqCountry) || lgL.includes(reqCountry);
          });
          if (filtered.length > 0) evs = filtered;
          else evs = []; // No results matching this country — try next source
        } else if (league.id !== 'tpl') {
          // For leagues without country map, filter by league name keyword
          const keyword = league.name.split(' ')[0].toLowerCase();
          const filtered = evs.filter(ev => ev.strLeague?.toLowerCase().includes(keyword));
          if (filtered.length > 0) evs = filtered;
        }
      }

      // Second try: search all soccer events if direct fetch gave nothing — WITH STRICT COUNTRY FILTER
      if (!evs.length) {
        const data2 = await sportsdbFetch(`eventsday.php?d=${fixSelectedDate}&s=Soccer`);
        const allEvs = data2?.events || [];
        
        if (isTanzania) {
          const tanzaniaKeywords = ['tanzania', 'tanzanian', 'tpl', 'crdb', 'mapinduzi'];
          evs = allEvs.filter(ev => {
            const lgLower = (ev.strLeague || '').toLowerCase();
            const ctryLower = (ev.strCountry || '').toLowerCase();
            return tanzaniaKeywords.some(kw => lgLower.includes(kw) || ctryLower.includes(kw));
          });
        } else {
          // STRICT: use country map to avoid cross-country contamination
          const LEAGUE_COUNTRY_MAP = {
            'kpl':'kenya','npfl':'nigeria','psl':'south africa','egypt':'egypt',
            'ghana':'ghana','uganda':'uganda','rwanda':'rwanda','zambia':'zambia',
            'morocco':'morocco','algeria':'algeria','tunisia':'tunisia','senegal':'senegal',
            'mali':'mali','burkina':'burkina','guinea':'guinea','togo':'togo',
            'benin':'benin','gabon':'gabon','libya':'libya','mozambique':'mozambique',
            'cote':'ivory','cameroon':'cameroon','angola':'angola','drc':'congo',
            'ethiopia':'ethiopia','zimbabwe':'zimbabwe','namibia':'namibia','malawi':'malawi',
            'epl':'england','laliga':'spain','bundesliga':'germany','seriea':'italy',
            'ligue1':'france','eredivisie':'netherlands','primeira':'portugal',
            'jupiler':'belgium','superlig':'turkey','championship':'england',
            'scottish':'scotland','swiss':'switzerland','austrian':'austria',
            'greek':'greece','danish':'denmark','swedish':'sweden','norwegian':'norway',
            'czech':'czech','romanian':'romania','croatian':'croatia','serbian':'serbia',
            'rpl':'russia','ekstraklasa':'poland','ukr':'ukraine',
            'azerbaijani':'azerbaijan','kazakh':'kazakhstan','albanian':'albania',
            'bosnian':'bosnia','slovakian':'slovakia','hungarian':'hungary',
            'bulgarian':'bulgaria','belarusian':'belarus','armenian':'armenia','georgian':'georgia',
            'mls':'united states','brasileirao':'brazil','liga_mx':'mexico',
            'argentina':'argentina','colombia':'colombia','chile':'chile',
            'peru':'peru','ecuador':'ecuador','venezuela':'venezuela',
            'uruguay':'uruguay','paraguay':'paraguay','bolivia':'bolivia',
            'jleague':'japan','kleague':'korea','csl':'china','isl':'india',
            'saudi':'saudi','uae':'emirates','qatar':'qatar',
            'iran':'iran','iraq':'iraq','jordan':'jordan','oman':'oman',
            'a_league':'australia','thailand':'thailand','vleague':'vietnam',
            'mpl':'malaysia','bahrain':'bahrain',
          };
          const requiredCountry = LEAGUE_COUNTRY_MAP[league.id];
          const nameParts = league.name.toLowerCase()
            .replace(/[^\w\s]/g,'')
            .split(' ')
            .filter(p => p.length > 3 && !['premier','league','super','first','division','national','professional','ligue'].includes(p));
          
          evs = allEvs.filter(ev => {
            const lgLower = ev.strLeague?.toLowerCase() || '';
            const ctryLower = ev.strCountry?.toLowerCase() || '';
            // Must match country if we know it
            if (requiredCountry && !ctryLower.includes(requiredCountry) && !lgLower.includes(requiredCountry)) return false;
            // Must match at least one distinctive name part
            if (nameParts.length > 0) return nameParts.some(p => lgLower.includes(p));
            return true;
          });
        }
      }

      if (evs.length > 0) {
        const nowMs = Date.now();
        matches = evs.map(ev => normaliseSportsdb(ev, nowMs)).filter(Boolean);
        srcLabel = '📡 TheSportsDB';
      }
      
      // Tanzania last resort: try round-based fetch
      if (!matches.length && isTanzania) {
        try {
          const roundData = await sportsdbFetch(`eventsnextleague.php?id=${league.sportsdbId}`);
          const nextEvs = roundData?.events || [];
          if (nextEvs.length > 0) {
            const nowMs = Date.now();
            matches = nextEvs.map(ev => normaliseSportsdb(ev, nowMs)).filter(Boolean);
            srcLabel = '📡 TheSportsDB (Next)';
          }
        } catch(e2) { console.warn('Tanzania next round fetch:', e2.message); }
      }
    } catch(e) { console.warn('fix src4 TheSportsDB:', e.message); }
  }

  // ── No data found ────────────────────────────────────────────────
  if (!matches.length) {
    const hasAnyKey = APISPORTS_KEY || ALLSPORTS_KEY || SPORTMONKS_KEY;
    out.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:.75rem">
        <span style="font-size:18px">${league.flag}</span>
        <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px">${league.name}</span>
      </div>
      <div style="text-align:center;padding:2rem;color:var(--muted)">
        <div style="font-size:36px">📅</div>
        <div style="margin-top:8px;font-size:13px;font-weight:600">Hakuna mechi tarehe ${fixSelectedDate}</div>
        <div style="font-size:11px;margin-top:6px;line-height:1.5">
          ${!hasAnyKey
            ? `⚠️ Ongeza <strong style="color:var(--warn)">Sportmonks</strong>, <strong style="color:var(--warn)">API-Football</strong> au <strong style="color:var(--warn)">AllSports key</strong> kwenye Admin kwa data sahihi zaidi`
            : `Ligi hii inaweza kuwa na mapumziko leo, au tarehe hii haina mechi zilizopangwa.`}
        </div>
        <button onclick="window._fixPickLeague('${league.id}')" style="margin-top:14px;padding:.5rem 1.25rem;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;cursor:pointer">🔄 Jaribu Tena</button>
      </div>`;
    return;
  }

  // ── Render matches ───────────────────────────────────────────────
  out.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:.75rem;flex-wrap:wrap">
      <span style="font-size:18px">${league.flag}</span>
      <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px">${league.name}</span>
      <span style="font-size:11px;color:var(--muted);margin-left:auto">${matches.length} mechi</span>
      <span style="font-size:10px;color:var(--muted);background:rgba(0,0,0,.3);padding:.15rem .5rem;border-radius:8px">${srcLabel}</span>
    </div>
    ${matches.map(m => renderFixCard(
      m.homeTeam, m.awayTeam,
      m.isLive, m.isFinished,
      m.home, m.away,
      m.minute, m.time,
      league.id, true, m.fixtureId
    )).join('')}`;

  window._fixAddBetslip = (teams, lgId) => {
    if (pMatches.length >= MAX_MATCHES) { toast(`Max mechi ${MAX_MATCHES}!`, 'err'); return; }
    const newMatch = { ...newM(), teams, league: lgId };
    pMatches.push(newMatch);
    toast(`✅ ${teams} imeongezwa!`);
    showTab('post');
  };
}

      </div>

      <!-- List -->
      ${wlShown.length===0?`<div class="empty"><div style="font-size:44px">${wlF==='WIN'?'🏆':wlF==='LOSS'?'💔':'📋'}</div><div style="margin-top:8px">Hakuna mikeka ${wlF==='WIN'?'iliyoshinda':wlF==='LOSS'?'iliyopotea':'iliyosettled'}</div></div>`:wlShown.map(m=>mkCard(m,false)).join('')}

function mkCard(m,mini){
  const matches=m.matches||[];
  const posterName=m.users?.name||(m.user_id===currentUser.id?currentUser.name:null);
  const isOwn=m.user_id===currentUser.id;
  const isOwner=currentUser.role==='owner';
  const isAnalyst=currentUser.role==='analyst'||isOwner;
  const canEdit=isOwn&&isAnalyst&&m.status==='PENDING';
  const canCashout=isOwn&&(isAnalyst||isOwner)&&m.status==='PENDING';
  const isCashout=m.status==='CASHOUT';
  const statusEmoji=m.status==='WON'?'🟢':m.status==='LOST'?'🔴':m.status==='CASHOUT'?'💵':m.status==='VOID'?'⚪':'🟡';

  // Build per-match rows with live score integration
  function matchRow(match, i) {
    const sc2 = findScore(match.teams);
    const isLive  = sc2?.isLive;
    const isFT    = sc2?.isFinished;
    const hg = sc2 ? sc2.home : null;
    const ag = sc2 ? sc2.away : null;
    const min = sc2?._estimatedMinute || sc2?.minuteNum || 0;
    const minDisplay = sc2?.minute || '';
    const outcomeColor = match.outcome==='WIN'?'var(--win)':match.outcome==='LOSS'?'var(--loss)':match.outcome==='VOID'?'var(--muted)':'var(--warn)';
    const scoreChip = (isLive||isFT) && hg!==null && ag!==null
      ? `<span style="background:${isLive?'rgba(255,68,68,.15)':'rgba(0,0,0,.3)'};border:1px solid ${isLive?'rgba(255,68,68,.5)':'rgba(255,255,255,.1)'};border-radius:8px;padding:.15rem .5rem;font-size:12px;font-weight:800;color:${isLive?'var(--danger)':'var(--muted)'};margin-left:4px">${hg} - ${ag}</span>`
      : '';
    const minChip = isLive
      ? `<span style="font-size:9px;color:var(--danger);animation:pulse 1s infinite;font-weight:700;display:inline-block;margin-left:3px">${minDisplay||'LIVE'}</span>`
      : isFT ? `<span style="font-size:9px;color:var(--muted);font-weight:700;margin-left:3px">FT</span>` : '';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;${i<matches.length-1?'border-bottom:1px solid #0d1f14':''}">
      <div style="flex:1">
        <div style="font-size:12px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:2px">
          ${lgFlag(match.league)} ${match.teams}${scoreChip}${minChip}
        </div>
        <div style="font-size:10px;color:var(--muted)">${lgName(match.league)} · ${match.market} · ${match.pick}</div>
      </div>
      <div style="text-align:right;margin-left:8px">
        <div style="font-size:12px">${match.odds}x</div>
        <div style="font-size:10px;font-weight:700;color:${outcomeColor};background:${outcomeColor}22;padding:.1rem .4rem;border-radius:6px">${match.outcome||'PENDING'}</div>
      </div>
    </div>`;
  }

  // Count live matches for header badge
  const liveCount = m.status==='PENDING' ? matches.filter(match=>findScore(match.teams)?.isLive).length : 0;
  const liveBadge = liveCount>0
    ? `<span style="background:rgba(255,68,68,.15);border:1px solid rgba(255,68,68,.4);border-radius:12px;padding:.1rem .5rem;font-size:9px;font-weight:700;color:var(--danger);animation:pulse 1.5s infinite;margin-left:6px">🔴 ${liveCount} LIVE</span>`
    : '';

  return`<div style="background:var(--surface);border:1px solid ${isOwn?'rgba(0,255,133,.25)':'var(--border)'};border-radius:16px;margin-bottom:.6rem;overflow:hidden">
    <div data-exp="${m.id}" style="padding:.85rem;cursor:${mini?'default':'pointer'};display:flex;justify-content:space-between;align-items:center">
      <div style="flex:1">
        <div style="font-weight:600;font-size:13px;display:flex;align-items:center;flex-wrap:wrap">${statusEmoji} ${m.name||'Mkeka #'+m.id.slice(-4)}${liveBadge}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">
          ${posterName?`👤 <span style="color:${isOwn?'var(--accent)':'var(--muted)'};">${posterName}</span> · `:''}${m.date} · ${matches.length} mechi · TZS ${fmt(m.stake)}
        </div>
        ${isCashout&&m.cashout_amount?`<div style="font-size:11px;color:var(--info);margin-top:2px;font-weight:600">💵 Cashout: TZS ${fmt(m.cashout_amount)}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <div style="background:${sc(m.status)}22;color:${sc(m.status)};padding:.15rem .55rem;border-radius:20px;font-size:10px;font-weight:700">${m.status}</div>
        <div style="font-size:12px;color:var(--accent);font-weight:600">${(m.total_odds||1).toFixed(2)}x</div>
      </div>
    </div>
    ${!mini?`<div id="det-${m.id}" style="display:none;border-top:1px solid var(--border);padding:.75rem">
      ${matches.map((match,i)=>matchRow(match,i)).join('')}
      <div style="margin-top:.75rem;padding:.6rem;background:rgba(0,0,0,.3);border-radius:10px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:${isCashout?'6px':'0'}">
          <span style="color:var(--muted)">Potential Return:</span><span style="color:var(--accent);font-weight:700">TZS ${fmt(m.potential_return||0)}</span>
        </div>
        ${isCashout&&m.cashout_amount?`
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
          <span style="color:var(--muted)">Cashout Iliyopokelewa:</span><span style="color:var(--info);font-weight:700">TZS ${fmt(m.cashout_amount)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span style="color:var(--muted)">Faida/Hasara vs Stake:</span>
          <span style="color:${m.cashout_amount>=m.stake?'var(--win)':'var(--loss)'};font-weight:700">${m.cashout_amount>=m.stake?'+':''}TZS ${fmt(m.cashout_amount-(m.stake||0))}</span>
        </div>`:''}
      </div>
      ${m.analysis?`<div style="margin-top:8px;font-size:11px;color:var(--muted);font-style:italic">📝 ${m.analysis}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:12px">
        <button onclick="window._exportMkekaPDF('${m.id}')" style="flex:1;padding:.5rem;border-radius:10px;border:1px solid var(--accent);background:rgba(0,255,133,.08);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer">📄 PDF</button>
        <button onclick="window._shareMkekaImage('${m.id}')" style="flex:1;padding:.5rem;border-radius:10px;border:1px solid rgba(0,200,255,.5);background:rgba(0,200,255,.08);color:#4de8ff;font-size:12px;font-weight:600;cursor:pointer">📸 Shiriki</button>
        ${canEdit?`<button onclick="window._editMkeka('${m.id}')" style="flex:1;padding:.5rem;border-radius:10px;border:1px solid var(--accent);background:rgba(0,255,133,.08);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer">✏️ Edit</button>`:''}
        ${canCashout?`<button onclick="window._cashoutMkeka('${m.id}',${m.stake||0},${m.potential_return||0})" style="flex:1;padding:.5rem;border-radius:10px;border:1px solid var(--info);background:rgba(77,166,255,.08);color:var(--info);font-size:12px;font-weight:600;cursor:pointer">💵 Cashout</button>`:''}
      </div>
    </div>`:''}
  </div>`;
}

// ═══════════════════════════════════════
// EXPORT MKEKA AS PDF (kwa kushare na group)
// ═══════════════════════════════════════
window._exportMkekaPDF = async (mkId) => {
  const mk = (allMikeka.find(m=>m.id===mkId)) || mikeka.find(m=>m.id===mkId);
  if(!mk) return toast('Mkeka haipatikani','err');
  const matches = mk.matches || [];
  if(!matches.length) return toast('Mkeka hauna mechi','err');

  toast('📄 Inatengeneza PDF...','info');

  // Pakua jsPDF kwa dynamic import (CDN)
  let jsPDFCtor;
  try {
    const mod = await import('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/+esm');
    jsPDFCtor = mod.jsPDF || mod.default;
  } catch(e){ return toast('Imeshindwa kupakia PDF library — angalia mtandao','err'); }

  // Pata H2H/Form data kama ipo (imehifadhiwa local kwa mikeka uliyoweka wewe)
  let njemData = [];
  try { njemData = JSON.parse(localStorage.getItem(`njem_data_${mkId}`)||'[]'); } catch(e){}
  const njemFor = (teams) => njemData.find(n=>n.teams===teams) || null;

  const doc = new jsPDFCtor({unit:'mm',format:'a5'});
  const W = doc.internal.pageSize.getWidth();
  let y = 0;

  // ── HEADER / "LOGO" — 76TIPPS brand bar ──────────────────────────
  doc.setFillColor(5,17,10);

// ═══════════════════════════════════════
// SHARE MKEKA AS IMAGE — kwa Android APK & WhatsApp
// Canvas-based, haihitaji library yoyote
// ═══════════════════════════════════════
window._shareMkekaImage = (mkId) => {
  const mk = (allMikeka.find(m=>m.id===mkId)) || mikeka.find(m=>m.id===mkId);
  if(!mk) return toast('Mkeka haipatikani','err');
  const matches = mk.matches || [];
  if(!matches.length) return toast('Mkeka hauna mechi','err');

  toast('📸 Inatengeneza picha...','info');

  try {
    const W = 420;
    const HEADER_H = 90;
    const MATCH_H = 58;
    const FOOTER_H = 60;
    const PAD = 18;
    const H = HEADER_H + matches.length * MATCH_H + FOOTER_H + 20;

    const dpr = Math.min(window.devicePixelRatio || 2, 3);
    const canvas = document.createElement('canvas');
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);

    // === BACKGROUND ===
    ctx.fillStyle = '#05110a';
    ctx.fillRect(0, 0, W, H);

    // === HEADER GRADIENT ===
    const hGrad = ctx.createLinearGradient(0, 0, W, HEADER_H);
    hGrad.addColorStop(0, '#0f3520');
    hGrad.addColorStop(1, '#072010');
    ctx.fillStyle = hGrad;
    ctx.beginPath();
    ctx.roundRect(PAD, 10, W - PAD*2, HEADER_H - 16, 12);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,255,133,0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Logo circle
    ctx.fillStyle = '#00ff85';
    ctx.beginPath();
    ctx.arc(PAD + 22, 10 + (HEADER_H-16)/2, 16, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = `bold ${12}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('76', PAD+22, 10+(HEADER_H-16)/2 + 4);
    ctx.textAlign = 'left';

    // Title
    ctx.fillStyle = '#00ff85';
    ctx.font = `bold 18px sans-serif`;
    ctx.fillText('76TIPPS', PAD + 46, 36);
    ctx.fillStyle = '#4a7a5a';
    ctx.font = `11px sans-serif`;
    ctx.fillText('NJEM System · Betslip', PAD + 46, 54);

    // Mkeka name & date
    const mkName = (mk.name || 'Mkeka').slice(0, 28);
    ctx.fillStyle = '#e4f0e8';
    ctx.font = `bold 13px sans-serif`;
    ctx.fillText(mkName, PAD + 46, 70);
    ctx.fillStyle = '#4a7a5a';
    ctx.font = `10px sans-serif`;
    ctx.fillText(mk.date || '', PAD + 46, 82);

    // Status badge top-right
    const stColor = mk.status==='WON'?'#00ff85':mk.status==='LOST'?'#ff4444':mk.status==='PENDING'?'#ffaa00':'#888';
    ctx.fillStyle = stColor + '33';
    ctx.beginPath();
    ctx.roundRect(W - PAD - 56, 22, 56, 22, 6);
    ctx.fill();
    ctx.fillStyle = stColor;
    ctx.font = `bold 11px sans-serif`;
    ctx.textAlign = 'right';
    ctx.fillText(mk.status || 'PENDING', W - PAD - 6, 37);
    ctx.textAlign = 'left';

    let y = HEADER_H + 8;

    // === MATCHES ===
    matches.forEach((match, i) => {
      const isEven = i % 2 === 0;
      ctx.fillStyle = isEven ? '#0c1f13' : '#081510';
      ctx.beginPath();
      ctx.roundRect(PAD, y, W - PAD*2, MATCH_H - 4, 8);
      ctx.fill();
      ctx.strokeStyle = '#1a3522';
      ctx.lineWidth = 0.5;
      ctx.stroke();

      // Number badge
      ctx.fillStyle = '#00ff85';
      ctx.beginPath();
      ctx.roundRect(PAD + 6, y + 8, 20, 20, 4);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = `bold 11px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(String(i+1), PAD + 16, y + 22);
      ctx.textAlign = 'left';

      // Teams
      const teams = (match.teams || '').slice(0, 36);
      ctx.fillStyle = '#e4f0e8';
      ctx.font = `bold 12px sans-serif`;
      ctx.fillText(teams, PAD + 34, y + 17);

      // League + Market
      const detail = `${lgName(match.league)} · ${match.market}`;
      ctx.fillStyle = '#4a7a5a';
      ctx.font = `9.5px sans-serif`;
      ctx.fillText(detail.slice(0, 48), PAD + 34, y + 32);

      // Pick
      ctx.fillStyle = '#00c965';
      ctx.font = `bold 10px sans-serif`;
      ctx.fillText(`Pick: ${match.pick}`, PAD + 34, y + 46);

      // Odds — right aligned
      ctx.fillStyle = '#00ff85';
      ctx.font = `bold 15px sans-serif`;
      ctx.textAlign = 'right';
      ctx.fillText(`${match.odds}x`, W - PAD - 8, y + 20);

      // Outcome
      if (match.outcome && match.outcome !== 'PENDING') {
        const oc = match.outcome === 'WIN' ? '#00ff85' : match.outcome === 'LOSS' ? '#ff4444' : '#888';
        ctx.fillStyle = oc;
        ctx.font = `bold 10px sans-serif`;
        ctx.fillText(match.outcome, W - PAD - 8, y + 38);
      }
      ctx.textAlign = 'left';

      y += MATCH_H;
    });

    // === SUMMARY BOX ===
    y += 6;
    ctx.fillStyle = '#0f3520';
    ctx.beginPath();
    ctx.roundRect(PAD, y, W - PAD*2, FOOTER_H - 12, 10);
    ctx.fill();
    ctx.strokeStyle = 'rgba(0,255,133,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#4a7a5a';
    ctx.font = `10px sans-serif`;
    ctx.fillText('Total Odds', PAD + 12, y + 16);
    ctx.fillText('Stake', PAD + 12, y + 30);
    ctx.fillText('Potential Return', PAD + 12, y + 44);

    ctx.textAlign = 'right';
    ctx.fillStyle = '#00ff85';
    ctx.font = `bold 13px sans-serif`;
    ctx.fillText(`${(mk.total_odds||1).toFixed(2)}x`, W - PAD - 12, y + 16);
    ctx.fillStyle = '#e4f0e8';
    ctx.fillText(`TZS ${fmt(mk.stake||0)}`, W - PAD - 12, y + 30);
    ctx.fillStyle = '#00ff85';
    ctx.fillText(`TZS ${fmt(mk.potential_return||0)}`, W - PAD - 12, y + 44);
    ctx.textAlign = 'left';

    // === WATERMARK FOOTER ===
    y += FOOTER_H;
    ctx.fillStyle = '#1a3522';
    ctx.fillRect(0, y, W, H - y);
    ctx.fillStyle = '#4a7a5a';
    ctx.font = `9px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('76TIPPS · NJEM MABULA · 0764674285 · Cheza kwa busara', W/2, y + 14);
    ctx.textAlign = 'left';

    // === SHARE / DOWNLOAD ===
    canvas.toBlob(blob => {
      if (!blob) { toast('❌ Picha imeshindwa kuundwa','err'); return; }
      const fname = `Mkeka_${(mk.name||'76TIPPS').replace(/[^\w]/g,'_')}_${mk.date||'today'}.png`;
      // Tumia toDataURL kwa WebView compatibility
      const dataUrl = canvas.toDataURL('image/png');
      _shareOrShowImage(dataUrl, blob, fname, mk.name || 'Mkeka wa 76TIPPS');
    }, 'image/png');

  } catch(e) {
    console.error('Image export error:', e);
    toast('❌ Hitilafu: ' + e.message, 'err');
  }
};

// ═══════════════════════════════════════
// ANDROID WEBVIEW DETECTION & BRIDGE
// ═══════════════════════════════════════
function _isWebView() {
  const ua = navigator.userAgent || '';
  // WebView user agent ina "wv" au "Version/X.X" pamoja na "Mobile Safari"
  return /wv\b|WebView/i.test(ua) || (typeof window.Android !== 'undefined');
}

function _tryAndroidBridge(dataUrl, fname) {
  // Kama APK ina addJavascriptInterface('Android') — hii ndiyo njia bora zaidi
  try {
    if (window.Android) {
      if (typeof window.Android.saveImage === 'function') {
        window.Android.saveImage(dataUrl, fname);
        toast('✅ Imehifadhiwa kwenye gallery!', 'ok');
        return true;
      }
      if (typeof window.Android.shareImage === 'function') {
        window.Android.shareImage(dataUrl, fname);
        return true;
      }
      if (typeof window.Android.downloadFile === 'function') {
        window.Android.downloadFile(dataUrl, fname, 'image/png');
        toast('✅ Inapakuliwa...', 'ok');
        return true;
      }
    }
  } catch(e) { console.warn('Android bridge error:', e); }
  return false;
}

// ═══════════════════════════════════════
// UNIVERSAL IMAGE SHARE — Web + APK + WebView zote
// ═══════════════════════════════════════
function _shareOrShowImage(dataUrl, blob, fname, title) {
  if (_tryAndroidBridge(dataUrl, fname)) return;

  // WebView share fallback (often navigator.share is undefined or restricted)
  const canShare = navigator.share && navigator.canShare;
  
  if (blob && canShare && !_isWebView()) {
    try {
      const imgFile = new File([blob], fname, { type: 'image/png' });
      navigator.share({ files: [imgFile], title: title, text: title + ' · 76TIPPS' })
        .then(() => toast('Imetumwa! ✅', 'ok'))
        .catch(err => { 
          if (err.name !== 'AbortError') {
             console.warn('Share failed, showing modal');
             _showImageModal(dataUrl, fname);
          }
        });
      return;
    } catch (e) { console.warn('Share API error:', e); }
  }
  
  // Direct download attempt for browsers
  if (!_isWebView()) {
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
  
  _showImageModal(dataUrl, fname);
}

        </div>

      </div>

      </div>

      <div style="padding:.85rem 1rem">

        <div style="display:flex;gap:8px;flex-wrap:wrap">

      a.click();
      setTimeout(() => document.body.removeChild(a), 1500);

  document.getElementById('open-img-btn').onclick = () => {

        tmp.click();
      }
    } catch(e) {
      toast('Shikilia picha hapo juu → Save image', 'info');
    }
  };
}

function _downloadBlob(blob, fname) {
  // Tumia _shareOrShowImage badala — inafanya kazi kwa WebView pia
  const reader = new FileReader();
  reader.onload = (e) => _shareOrShowImage(e.target.result, blob, fname, fname.replace(/_/g,' ').replace('.png',''));
  reader.readAsDataURL(blob);
}

          <input type="number" class="inp-sm" id="edit-stake" value="${mk.stake||5000}"/>
        </div>
      </div>
      <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px">Mechi (${matches.length})</div>
      ${matchesHtml}
      <div style="margin-bottom:10px">
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px">Analysis</div>
        <textarea class="inp-sm" id="edit-ana" rows="2" placeholder="Analysis yako...">${mk.analysis||''}</textarea>
      </div>
      <button id="edit-save-btn" style="width:100%;padding:.9rem;border-radius:14px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:15px;cursor:pointer">💾 Hifadhi Mabadiliko</button>
    </div>`;
  document.body.appendChild(ov);
  ov.onclick = (e) => { if(e.target===ov) ov.remove(); };

  document.getElementById('edit-save-btn').onclick = async () => {
    const btn = document.getElementById('edit-save-btn');
    btn.textContent = 'Inasave...'; btn.disabled = true;

    const newName = document.getElementById('edit-name')?.value || mk.name;
    const newDate = document.getElementById('edit-date')?.value || mk.date;
    const newStake = parseInt(document.getElementById('edit-stake')?.value || mk.stake);

    // Update each match
    for (const match of matches) {
      const newTeams  = document.getElementById(`edit-teams-${match.id}`)?.value || match.teams;
      const newLeague = document.getElementById(`edit-league-${match.id}`)?.value || match.league;
      const newMarket = document.getElementById(`edit-market-${match.id}`)?.value || match.market;
      const newPick   = document.getElementById(`edit-pick-${match.id}`)?.value || match.pick;
      const newOdds   = parseFloat(document.getElementById(`edit-odds-${match.id}`)?.value || match.odds);
      await sb.from('matches').update({teams:newTeams,league:newLeague,market:newMarket,pick:newPick,odds:newOdds}).eq('id',match.id);
    }

    // Recalculate odds & potential return
    const newOddsArr = matches.map(match => parseFloat(document.getElementById(`edit-odds-${match.id}`)?.value || match.odds));
    const newTotalOdds = newOddsArr.reduce((p,o)=>p*(o||1),1);
    const newPotRet = Math.round(newTotalOdds * newStake);
    const newAna = document.getElementById('edit-ana')?.value || '';

    const {error} = await sb.from('mikeka').update({
      name: newName, date: newDate, stake: newStake,
      total_odds: newTotalOdds, potential_return: newPotRet, analysis: newAna
    }).eq('id', mkId);

    btn.textContent = '💾 Hifadhi Mabadiliko'; btn.disabled = false;
    if (error) return toast('Hitilafu: ' + error.message, 'err');
    toast('✅ Mkeka umesasishwa!');
    ov.remove();
    await loadData();
    showTab('mikeka');
  };
};

      <div id="cashout-preview" style="display:none;padding:.6rem;background:rgba(0,0,0,.3);border-radius:10px;margin-bottom:12px;font-size:12px"></div>
      <button id="cashout-confirm-btn" style="width:100%;padding:.9rem;border-radius:14px;border:none;background:var(--info);color:#fff;font-weight:700;font-size:15px;cursor:pointer">✅ Thibitisha Cashout</button>

    </div>`;
  document.body.appendChild(ov);
  ov.onclick = (e) => { if(e.target===ov) ov.remove(); };

  const amtInp = document.getElementById('cashout-amount');
  const preview = document.getElementById('cashout-preview');
  amtInp.oninput = () => {
    const amt = parseInt(amtInp.value) || 0;
    if (!amt) { preview.style.display='none'; return; }
    const profit = amt - stake;
    preview.style.display = 'block';
    preview.innerHTML = `
      <div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="color:var(--muted)">Cashout:</span><span style="color:var(--info);font-weight:700">TZS ${fmt(amt)}</span></div>

  };

  document.getElementById('cashout-confirm-btn').onclick = async () => {
    const amt = parseInt(amtInp.value);
    if (!amt || amt < 1) return toast('Ingiza kiasi sahihi!', 'err');
    const btn = document.getElementById('cashout-confirm-btn');
    btn.textContent = 'Inasave...'; btn.disabled = true;

    const { error } = await sb.from('mikeka').update({

      cashout_amount: amt

    if (error) {
      btn.textContent = '✅ Thibitisha Cashout'; btn.disabled = false;
      return toast('Hitilafu: ' + error.message, 'err');
    }

    // Stake iliishapigwa wakati wa POST — ongeza cashout amount tu kurudi bankroll
    // Fetch latest bankroll first to prevent overwriting
    const { data: freshUser } = await sb.from('users').select('bankroll').eq('id', currentUser.id).maybeSingle();
    const currentBk = freshUser?.bankroll ?? currentUser.bankroll;
    const newBankroll = currentBk + amt;

       btn.textContent = '✅ Thibitisha Cashout'; btn.disabled = false;

    toast(`💵 Cashout ya TZS ${fmt(amt)} imesajiliwa!`, 'ok');
    ov.remove();
    await loadData();
    // Ensure UI is updated
    if (currentTab === 'mikeka') renderMikeka(el('content'));
    else showTab('mikeka');
  };
};

    let v = parseInt(inp.value);

    // Hakuna max limit ya bankroll — mtumiaji anaweza weka yoyote
    _updateSummary();
  };
  // Helper: sasisha summary (odds, stake, potential return) bila re-render kamili
  window._updateSummary = () => {
    readInps();
    const tOdds = pMatches.reduce((p, m) => p * (parseFloat(m.odds) || 1), 1);
    const stake = parseInt(el('post-stake')?.value || currentUser.stake || 5000);
    const potRet = Math.round(tOdds * stake);
    const ev = (tOdds * (kProb / 100)) - 1;
    const evSign = ev > 0 ? '+' : '';
    // Update summary cells
    const cells = document.querySelectorAll('[data-summary]');
    cells.forEach(cell => {
      const key = cell.dataset.summary;
      if (key === 'odds') cell.textContent = tOdds.toFixed(2) + 'x';
      if (key === 'stake') cell.textContent = fmtAmt(stake);
      if (key === 'return') cell.textContent = fmtAmt(potRet);
      if (key === 'profit') {
        cell.textContent = fmtAmt(potRet - stake);
        cell.style.color = (potRet - stake) >= 0 ? 'var(--win)' : 'var(--loss)';
      }
      if (key === 'ev') {
        cell.textContent = evSign + (ev * 100).toFixed(1) + '%';
        cell.className = 'ev-badge ' + (ev > 0 ? 'ev-pos' : 'ev-neg');
      }
    });
  };
  window._toggleUnitsPost = () => { toggleUnits(); };

  // Drag-drop bet slip builder: fixture card → matches-con
  window._dropMatch = (ev) => {
    ev.preventDefault();
    try {
      const data = JSON.parse(ev.dataTransfer.getData('application/json'));
      if (!data.teams) return;
      if (pMatches.length >= MAX_MATCHES) return toast(`Max mechi ${MAX_MATCHES} (NJEM System)!`, 'err');
      const leagueId = data.league || 'tpl';
      if(leagueId === 'vleague') return toast('🚫 Vietnam V.League ni BANNED!', 'err');
      const newMatch = { ...newM(), teams: data.teams, league: leagueId };
      pMatches.push(newMatch);
      toast(`✅ ${data.teams} imeongezwa! Jaza H2H na form.`, 'ok');
      renderPost(c);
    } catch(e) {}
  };

  // OCR handler - robust version for mobile
  const ocrInput = el('ocr-in');
  if(ocrInput){
    // Remove old listeners
    const newInput = ocrInput.cloneNode(true);
    ocrInput.parentNode.replaceChild(newInput, ocrInput);
    newInput.addEventListener('change', async function(e){
      const file = e.target.files && e.target.files[0];
      if(!file){toast('Hakuna picha iliyochaguliwa','warn');return;}
      if(!GEMINI_KEY){toast('Weka OpenRouter API key kwenye Admin kwanza!','err');return;}
      // Show loading state
      const txt = el('ocr-txt');
      const lbl = el('ocr-label');
      if(txt) txt.textContent = '🤖 OpenRouter AI inasoma picha...';
      if(lbl) lbl.style.borderColor = 'var(--accent)';
      toast('📸 Picha imepokelewa — AI inasoma...','info');
      const reader = new FileReader();
      reader.onload = async(ev) => {
        try{
          const b64 = ev.target.result.split(',')[1];
          const extracted = await ocrImage(b64, file.type);
          if(extracted && extracted.length > 0){
            pMatches = extracted.slice(0, MAX_MATCHES).map(m=>({
              ...newM(),
              teams: m.teams||'',
              market: MARKETS.includes(m.market) ? m.market : 'Double Chance',
              odds: m.odds||'',
              pick: m.pick||m.market||''
            }));
            toast('✅ Mechi '+extracted.length+' zimepatikana!');
            renderPost(c);
          } else {
            if(txt) txt.textContent = '⚠️ Mechi hazipatikani — Jaza manually';
            toast('Mechi hazipatikani kwenye picha','warn');
          }
        }catch(err){
          if(txt) txt.textContent = '❌ Hitilafu — Jaribu tena';
          toast('Hitilafu: '+err.message,'err');
        }
      };
      reader.onerror = () => toast('Imeshindwa kusoma picha','err');
      reader.readAsDataURL(file);
    });
  }
  window._chk=(i)=>{
    pChecks[i]=!pChecks[i];
    // Sasisha checkbox bila re-render
    const allOk=pChecks.every(Boolean);
    document.querySelectorAll('[data-chk]').forEach(div=>{
      const ci=parseInt(div.dataset.chk);
      const box=div.querySelector('[data-chkbox]');
      const lbl=div.querySelector('[data-chklbl]');
      if(box){box.style.borderColor=pChecks[ci]?'var(--win)':'var(--muted)';box.style.background=pChecks[ci]?'rgba(0,255,133,.2)':'transparent';box.textContent=pChecks[ci]?'✓':'';}
      if(lbl)lbl.style.color=pChecks[ci]?'#5a9e70':'var(--muted)';
    });
    const hdr=document.querySelector('[data-chkhdr]');
    if(hdr){hdr.style.color=allOk?'var(--win)':'var(--warn)';hdr.textContent=allOk?'✅ Checklist Imekamilika!':'⚠️ Pre-Bet Checklist';}
    const wrap=document.querySelector('[data-chkwrap]');
    if(wrap){wrap.style.background=allOk?'#0f3520':'#1f1a00';wrap.style.borderColor=allOk?'rgba(0,255,133,.3)':'rgba(255,170,0,.3)';}
  };
  window._kTog=()=>{kOn=!kOn;renderPost(c);};
  window._kSlide=(v)=>{kProb=parseInt(v);const p=el('k-pct');if(p)p.textContent=v+'%';};
  window._kApply=(s)=>{const i=el('post-stake');if(i)i.value=s;renderPost(c);};
  window._addM=()=>{if(pMatches.length>=MAX_MATCHES)return toast(`Max mechi ${MAX_MATCHES}!`,'err');pMatches.push(newM());renderPost(c);};
  window._delM=(id)=>{if(pMatches.length>1){pMatches=pMatches.filter(m=>m._id!==id);renderPost(c);}};
  window._analyzeMkeka=()=>showMkekaAIAnalysis();
  window._post=async()=>{
    if(!pChecks.every(Boolean))return toast('Kamilisha checklist kwanza!','warn');
    readInps();
    if(!pMatches.every(m=>m.teams&&m.odds))return toast('Jaza mechi zote vizuri!','err');

    // ══ NJEM SYSTEM VALIDATION ══════════════════════════════════════
    for(const m of pMatches){
      const teams = m.teams || 'Mechi';
      const teamName = teams.split(' vs ')[0] || teams;

      // 1. Vietnam V.League — banned kabisa
      if(m.league === 'vleague'){
        return toast(`🚫 ${teamName}: Vietnam V.League ni BANNED. Toa mechi hii!`, 'err');
      }

      // 2. H2H threshold — promoted teams zinapewa nafasi
      const h2hNum = parseInt(m.h2h)||0;
      const h2hMin = m.promoted ? 0 : 3; // promoted: huhitaji H2H; non-promoted: angalau 3
      if(!m.promoted && h2hNum > 0 && h2hNum < h2hMin){
        // Onyo tu — si block kamili
        toast(`⚠️ ${teamName}: H2H ni ${h2hNum} — chini ya ${h2hMin}. Endelea kwa tahadhari.`, 'warn');
      }

      // 3. Form comparison — onyo tu kwa promoted, si block
      const teamForm = parseFloat(m.team_form)||0;
      const oppForm = parseFloat(m.opp_form)||0;
      if(!m.promoted && teamForm > 0 && oppForm > 0 && teamForm <= oppForm){
        toast(`⚠️ ${teamName}: Form ${teamForm}% ≤ mpinzani ${oppForm}%. Kuwa makini.`, 'warn');
      }

      // 4. Odds range — 1.01 hadi 6.00 (onyo tu, si block)
      const oddsNum = parseFloat(m.odds)||0;
      if(oddsNum < 1.01){
        return toast(`⚠️ ${teamName}: Odds ${oddsNum} — chini ya 1.01. Haiwezekani.`, 'err');
      }
      if(oddsNum > 6.00){
        return toast(`⚠️ ${teamName}: Odds ${oddsNum} — juu ya 6.00. Hatari kubwa sana.`, 'err');
      }
    }

    // 5. Promoted team warning (si block — ni info tu)
    const promotedMatches = pMatches.filter(m=>m.promoted);
    if(promotedMatches.length > 1){
      return toast(`⚠️ Mechi ${promotedMatches.length} za timu zilizopanda — hatari! Max 1 promoted team kwa mkeka.`, 'err');
    }

    // 6. Total odds range check (1.60 – 2.00 per NJEM System target)
    const tOddsCheck = pMatches.reduce((p,m)=>p*(parseFloat(m.odds)||1),1);
    if(tOddsCheck > 4.0 && pMatches.length >= 3){
      // Warning tu — si block
      toast(`⚠️ Total odds ${tOddsCheck.toFixed(2)} — juu kidogo. Fikiria tena.`, 'warn');
    }
    // ══ MWISHO WA VALIDATION ═════════════════════════════════════════

    const streak=getStreak();
    if(streak.type==='LOSS'&&streak.count>=LOSS_STREAK_LIMIT)return toast('🚨 Loss streak! Pumzika kwanza!','err');
    const name=el('post-name')?.value||`Mkeka ${mikeka.length+1}`;
    const date=el('post-date')?.value||today();
    const stake=parseInt(el('post-stake')?.value||5000);
    if(stake > currentUser.bankroll) return toast(`Bankroll haitoshi! Una TZS ${fmt(currentUser.bankroll)} tu`,'err');
    const ana=el('post-ana')?.value||'';
    const tOdds=pMatches.reduce((p,m)=>p*(parseFloat(m.odds)||1),1);
    const potRet=Math.round(tOdds*stake);
    const mId=uid();
    const btn=el('post-btn');btn.textContent='Inasave...';btn.disabled=true;

    // ── OFFLINE MODE: hifadhi kwenye IDB queue ──────────────────────
    if (!navigator.onLine) {
      const offlineQueue = (await idbGet('offline_queue')) || [];
      const newMk = {
        id: mId, user_id: currentUser.id, name, date, stake,
        total_odds: tOdds, potential_return: potRet, analysis: ana, status: 'PENDING',
        matches: pMatches.map(m=>({id:uid(),mkeka_id:mId,teams:m.teams,league:m.league,market:m.market,pick:m.pick,odds:parseFloat(m.odds),outcome:'PENDING'})),
        _offline: true, _created: Date.now()
      };
      offlineQueue.push(newMk);
      await idbSet('offline_queue', offlineQueue);
      // Hifadhi H2H/Form data kwa export PDF baadaye (local tu)
      try {
        const njemData = pMatches.map(m=>({teams:m.teams,h2h:m.h2h,team_form:m.team_form,opp_form:m.opp_form,promoted:!!m.promoted}));
        localStorage.setItem(`njem_data_${mId}`, JSON.stringify(njemData));
      } catch(e) {}
      // Ongeza kwenye mikeka ya local bila kusubiri mtandao
      mikeka.unshift({...newMk, matches: newMk.matches});
      allMikeka.unshift({...newMk, users: {name: currentUser.name, role: currentUser.role}});
      await saveOfflineData();
      // Toa stake kutoka bankroll ya local
      currentUser.bankroll -= stake;
      localStorage.setItem('njem_session', JSON.stringify(currentUser));
      btn.textContent='📤 Post Mkeka';btn.disabled=false;
      toast(`📴 Offline! Mkeka umehifadhiwa — utaupload unapopata mtandao 📶`,'warn');
      pMatches=[newM()];pChecks=[false,false,false,false];
      showTab('mikeka');
      return;
    }

    // ── ONLINE MODE: ingiza kwenye Supabase ──────────────────────────
    const{error:e1}=await sb.from('mikeka').insert({id:mId,user_id:currentUser.id,name,date,stake,total_odds:tOdds,potential_return:potRet,analysis:ana,status:'PENDING'});
    if(e1){btn.textContent='📤 Post Mkeka';btn.disabled=false;return toast('Hitilafu: '+e1.message,'err');}
    // ── PILI: ingiza matches ──────────────────────────────────────────
    const{error:e2}=await sb.from('matches').insert(pMatches.map(m=>({id:uid(),mkeka_id:mId,teams:m.teams,league:m.league,market:m.market,pick:m.pick,odds:parseFloat(m.odds),outcome:'PENDING'})));
    if(e2){
      // Rollback — futa mkeka iliyoingizwa
      await sb.from('mikeka').delete().eq('id',mId);
      btn.textContent='📤 Post Mkeka';btn.disabled=false;
      return toast('Hitilafu ya mechi: '+e2.message,'err');
    }
    // ── Hifadhi H2H/Form data kwa export PDF baadaye (local tu) ───────
    try {
      const njemData = pMatches.map(m=>({teams:m.teams,h2h:m.h2h,team_form:m.team_form,opp_form:m.opp_form,promoted:!!m.promoted}));
      localStorage.setItem(`njem_data_${mId}`, JSON.stringify(njemData));
    } catch(e) {}
    btn.textContent='📤 Post Mkeka';btn.disabled=false;
    // ── TATU: toa stake (baada ya mikeka na matches zote kufaulu) ─────
    const newBk = currentUser.bankroll - stake;
    await updateUser({ bankroll: newBk });
    toast(`Mkeka umewekwa! 🎯 Stake -TZS ${fmt(stake)}`);
    pMatches=[newM()];pChecks=[false,false,false,false];
    await loadData();showTab('mikeka');
  };
}

function wireInps(){
  document.querySelectorAll('[data-mid]').forEach(inp=>{
    inp.addEventListener('change',(e)=>{
      const mid=e.target.dataset.mid,f=e.target.dataset.f,v=e.target.value;
      pMatches=pMatches.map(m=>m._id===mid?{...m,[f]:v}:m);
      // Kwa select fields (league, market) na pick/teams — re-render inahitajika kwa AI button
      if(f==='teams'||f==='league'||f==='market'){
        // Delay kidogo ili keyboard isifunikwe
        setTimeout(()=>renderPost(el('content')),50);
      } else {
        _updateSummary();
      }
    });
    // Kwa input fields — sasisha summary bila re-render
    if(inp.tagName==='INPUT'){
      inp.addEventListener('input',(e)=>{
        const mid=e.target.dataset.mid,f=e.target.dataset.f,v=e.target.value;
        pMatches=pMatches.map(m=>m._id===mid?{...m,[f]:v}:m);
        if(f==='odds'||f==='pick')_updateSummary();
      });

function _updateNjemIndicators(mid) {
  const m = pMatches.find(x=>x._id===mid);
  if(!m) { _updateSummary(); return; }

  const h2hNum = parseInt(m.h2h)||0;
  const teamForm = parseFloat(m.team_form)||0;
  const oppForm = parseFloat(m.opp_form)||0;
  const oddsNum = parseFloat(m.odds)||0;
  const oddsRange = oddsRangeFor(m.market);
  const oddsOk = oddsNum >= oddsRange.min && oddsNum <= oddsRange.max;

  const h2hOk = m.promoted ? h2hNum>=2 : h2hNum >= 5;
  const formOk = teamForm > oppForm;
  const isVietnam = m.league === 'vleague';
  const leagueOk = !isVietnam;

  const statusDot = (ok) => `<span style="width:7px;height:7px;border-radius:50%;background:${ok?'var(--win)':'var(--loss)'};display:inline-block;flex-shrink:0"></span>`;

  const h2hStatus = el(`h2h-status-${mid}`);
  if(h2hStatus){
    h2hStatus.style.color = h2hOk?'var(--win)':'var(--loss)';
    h2hStatus.textContent = h2hNum>=5?`✅ ${h2hNum} mechi`:m.promoted&&h2hNum>=2?`✅ ${h2hNum} mechi`:h2hNum>0?`❌ ${h2hNum}<${m.promoted?2:5}`:'❌ Jaza';
  }

  // Form dot + comparison box + input border colors
  const formDot = el(`form-dot-${mid}`);
  if(formDot) formDot.innerHTML = statusDot(formOk);
  const teamFormInp = el(`team-form-inp-${mid}`);
  if(teamFormInp) teamFormInp.style.borderColor = teamForm>0?(formOk?'rgba(0,255,133,.4)':'rgba(255,170,0,.4)'):'var(--border)';
  const oppFormInp = el(`opp-form-inp-${mid}`);
  if(oppFormInp) oppFormInp.style.borderColor = oppForm>0?'rgba(255,68,68,.3)':'var(--border)';
  const formCompare = el(`form-compare-${mid}`);
  if(formCompare){
    formCompare.innerHTML = (teamForm>0&&oppForm>0) ? `<div style="margin-top:6px;font-size:11px;font-weight:700;color:${formOk?'var(--win)':'var(--loss)'};text-align:center;background:${formOk?'rgba(0,255,133,.08)':'rgba(255,68,68,.08)'};border-radius:8px;padding:.3rem">
      ${formOk?`✅ ${teamForm}% > ${oppForm}% — Form nzuri!`:`❌ ${teamForm}% ≤ ${oppForm}% — Timu yako form duni!`}
    </div>` : '';
  }

  // NJEM box border
  const njemBox = el(`njem-box-${mid}`);
  if(njemBox) njemBox.style.borderColor = h2hOk&&formOk?'rgba(0,255,133,.12)':'rgba(255,170,0,.2)';

  // Card border
  const card = el(`mcard-${mid}`);
  if(card) card.style.borderColor = isVietnam?'var(--danger)':h2hOk&&formOk&&leagueOk?'rgba(0,255,133,.2)':'rgba(255,170,0,.35)';

  // Odds indicator
  const oddsInd = el(`odds-ind-${mid}`);
  if(oddsInd) oddsInd.textContent = oddsNum>0?(oddsOk?'✅':'⚠️'):'';

  _updateSummary();
  _updateComplianceMini();
}

// Sasisha NJEM Compliance mini-score bila re-render kamili
function _updateComplianceMini(){
  const box = el('njem-compliance-mini');
  if(!box) return;
  const issues = [];
  let passed = 0, total = 0;
  pMatches.filter(m=>m.teams&&m.odds).forEach(m=>{
    total++;
    const oddsVal = parseFloat(m.odds)||0;
    const h2hOk = m.promoted ? true : (parseInt(m.h2h)||0) >= 3;
    const oddsOk = oddsVal >= 1.01 && oddsVal <= 6.00;
    const ok = m.league!=='vleague' && h2hOk && oddsOk;
    if(ok)passed++;
    else{
      if(m.league==='vleague')issues.push('🚫 Vietnam banned');
      else if(!h2hOk)issues.push(`H2H pungufu: ${m.teams?.split(' vs ')[0]||'mechi'}`);
      else if(!oddsOk)issues.push(`Odds nje (1.01–6.00): ${m.odds}`);
    }
  });
  if(total===0){ box.innerHTML=''; return; }
  const pct = total>0?Math.round(passed/total*100):0;
  const color = pct===100?'var(--win)':pct>=50?'var(--warn)':'var(--loss)';
  box.style.borderColor = pct===100?'rgba(0,255,133,.25)':pct>=50?'rgba(255,170,0,.25)':'rgba(255,68,68,.25)';
  box.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:${issues.length?'8px':'0'}">
      <div style="font-size:11px;font-weight:700;color:${color}">📋 NJEM Compliance: ${passed}/${total}</div>
      <div style="font-size:18px;font-weight:800;color:${color}">${pct}%</div>
    </div>
    ${issues.length?`<div style="display:flex;flex-wrap:wrap;gap:4px">${issues.slice(0,3).map(i=>`<span style="background:rgba(255,68,68,.1);color:var(--loss);padding:.15rem .45rem;border-radius:20px;font-size:9px;font-weight:600">${i}</span>`).join('')}</div>`:''}`;
}

function renderResults(c){
  const pending=mikeka.filter(m=>m.status==='PENDING');
  if(!pending.length){c.innerHTML=`<div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:1rem">✅ Rekodi Matokeo</div><div class="empty"><div style="font-size:44px">✅</div><div style="margin-top:8px">Hakuna mkeka unaosubiri</div></div>`;return;}
  c.innerHTML=`<div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:1rem">✅ Rekodi Matokeo</div>
    ${pending.map(m=>`<div class="card" style="padding:0;overflow:hidden;margin-bottom:.75rem">
      <div style="padding:.85rem;border-bottom:1px solid var(--border)">
        <div style="font-weight:700">${m.name||'Mkeka'}</div>
        <div style="font-size:11px;color:var(--muted)">${m.date} · ${(m.total_odds||1).toFixed(2)}x · TZS ${fmt(m.potential_return||0)}</div>
      </div>
      ${(m.matches||[]).map((match,i)=>`<div style="padding:.75rem;border-bottom:${i<m.matches.length-1?'1px solid #0d1f14':'none'}">
        <div style="font-size:12px;font-weight:600;margin-bottom:2px">${lgFlag(match.league)} ${match.teams}</div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:8px">${match.market} · ${match.pick} @ ${match.odds}x</div>
        <div style="display:flex;gap:6px">
          ${['WIN','LOSS','VOID'].map(o=>`<button onclick="window._out('${m.id}','${match.id}','${o}')" style="flex:1;padding:.4rem;border-radius:20px;border:1.5px solid ${match.outcome===o?sc(o):'var(--border)'};background:${match.outcome===o?sc(o)+'22':'transparent'};color:${match.outcome===o?sc(o):'var(--muted)'};font-weight:700;font-size:11px;cursor:pointer">${o}</button>`).join('')}
        </div>
      </div>`).join('')}
    </div>`).join('')}`;
  window._out=async(mId,matchId,outcome)=>{
    await sb.from('matches').update({outcome}).eq('id',matchId);
    const{data:all}=await sb.from('matches').select('*').eq('mkeka_id',mId);
    const allDone=all.every(m=>m.outcome!=='PENDING');
    if(allDone){
      const hasLoss=all.some(m=>m.outcome==='LOSS'),allVoid=all.every(m=>m.outcome==='VOID');
      const newS=hasLoss?'LOST':allVoid?'VOID':'WON';
      // Kinga: angalia hali ya sasa kabla ya kubadilisha (epuka double-settle)
      const{data:mkCurrent}=await sb.from('mikeka').select('status').eq('id',mId).maybeSingle();
      if(mkCurrent?.status !== 'PENDING') { await loadData(); renderResults(c); return; }
      await sb.from('mikeka').update({status:newS}).eq('id',mId);
      const mk=mikeka.find(m=>m.id===mId);
      if(newS==='WON'&&mk){
        // Always fetch fresh bankroll before crediting
        const{data:fu}=await sb.from('users').select('bankroll').eq('id',currentUser.id).maybeSingle();
        const freshBk = fu?.bankroll ?? currentUser.bankroll;
        const payout = mk.potential_return || 0;
        await updateUser({bankroll: freshBk + payout});
        toast(`🎉 Umeshinda! +TZS ${fmt(payout)} (faida: +TZS ${fmt(payout - (mk.stake||0))})`);
      } else if(newS==='LOST') {
        // Stake tayari ilipigwa — hakuna kubadilisha
        toast('Mkeka umepoteza. Jaribu tena! 💪','warn');
      } else if(newS==='VOID') {
        // VOID: rudisha stake tu
        const{data:fu2}=await sb.from('users').select('bankroll').eq('id',currentUser.id).maybeSingle();
        const freshBk2 = fu2?.bankroll ?? currentUser.bankroll;
        const stakeBack = mk?.stake || 0;
        if(stakeBack > 0) await updateUser({bankroll: freshBk2 + stakeBack});
        toast(`⬜ VOID — Stake ya TZS ${fmt(stakeBack)} imerudishwa`,'info');
      }
    }
    await loadData();renderResults(c);
  };
}

  c.innerHTML=`<div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:.75rem">⚙️ General Management</div><div class="center"><div class="spinner"></div></div>`;

// AUTO LOGIN — Check saved session
// ═══════════════════════════════════════
async function checkSavedSession() {
  try {
    const saved = localStorage.getItem('njem_session');
    if (!saved) { showAuth('login'); return; }
    const savedUser = JSON.parse(saved);
    if (!savedUser || !savedUser.id) { showAuth('login'); return; }
    // Verify user still exists in Supabase + get fresh data
    const { data, error } = await sb.from('users').select('*').eq('id', savedUser.id).maybeSingle();
    if (error || !data) {
      localStorage.removeItem('njem_session');
      showAuth('login');
      return;
    }
    // Auto login with fresh data
    await loginUser(data);
  } catch(e) {
    showAuth('login');
  }
}

  const match = pMatches.find(m => m._id === mid);
  const teamsStr = match ? match.teams : teams;
  if (!teamsStr || !teamsStr.includes(' vs ')) return toast('Jaza jina la timu kwanza!', 'warn');
  showAIAnalysis(teamsStr);
};

// ── SHARE TARGET HANDLER ─────────────────────────────
// Inashughulikia data inayoingia kupitia OS Share Tray
(function handleShareTarget() {
  const params = new URLSearchParams(window.location.search);
  const sharedText = params.get('text') || params.get('title') || '';
  const sharedUrl  = params.get('url') || '';
  if (sharedText || sharedUrl) {
    // Hifadhi kwa muda — itatumiwa baada ya login
    sessionStorage.setItem('shared_payload', JSON.stringify({ text: sharedText, url: sharedUrl }));
  }
})();

// ── URL TAB ROUTING ──────────────────────────────────
// Inaruhusu shortcuts na notification clicks kutua kwenye tab sahihi
(function handleUrlRouting() {
  const params = new URLSearchParams(window.location.search);
  const tab = params.get('tab');
  if (tab) {
    // Hifadhi — itatumiwa baada ya login
    sessionStorage.setItem('startup_tab', tab);
  }
})();

// BOOT — Check saved session first
checkSavedSession();
// ── SERVICE WORKER REGISTRATION ──────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(async reg => {
    console.log('[App] SW registered:', reg.scope);

    // ── Sikiliza messages kutoka SW ──
    navigator.serviceWorker.addEventListener('message', event => {
      const { type } = event.data || {};
      if (type === 'NOTIFICATION_CLICK') {
        window.focus();
        if (event.data.url?.includes('tab=')) {
          const tab = new URLSearchParams(event.data.url.split('?')[1]).get('tab');
          if (tab && currentTab !== tab) showTab(tab);
        } else if (currentTab) {
          showTab(currentTab);
        }
      }
      if (type === 'BG_SCORES_UPDATED' || type === 'BG_FIXTURES_UPDATED') {
        // Data mpya iko — refresh kama mtumiaji yuko kwenye Home
        if (currentTab === 'home') fetchLiveScores().then(() => renderLiveSection());
      }
    });

    // ── Push Notifications — omba ruhusa ──
    if ('Notification' in window && Notification.permission === 'default') {
      // Subiri sekunde 10 kabla kuomba (usiomba mara tu)
      setTimeout(async () => {
        try {
          const permission = await Notification.requestPermission();
          if (permission === 'granted') {
            console.log('[App] Push permission granted');
            // Subscribe kwa push (VAPID public key yako hapa)
            // const sub = await reg.pushManager.subscribe({
            //   userVisibleOnly: true,
            //   applicationServerKey: '<YOUR_VAPID_PUBLIC_KEY>'
            // });
            // Hifadhi subscription kwenye Supabase:
            // await sb.from('push_subscriptions').upsert({ user_id: currentUser.id, subscription: JSON.stringify(sub) });
          }
        } catch (e) {
          console.warn('[App] Push subscription failed:', e);
        }
      }, 10000);
    }

    // ── Background Sync — register ──
    if ('sync' in reg) {
      // Sync itaanzishwa papo hapo ikishindwa kuwasiliana na server
      window._registerBgSync = async (tag) => {
        try { await reg.sync.register(tag); }
        catch (e) { console.warn('[App] BG Sync register failed:', e); }
      };
    }

    // ── Periodic Background Sync — register ──
    if ('periodicSync' in reg) {
      try {
        const status = await navigator.permissions.query({ name: 'periodic-background-sync' });
        if (status.state === 'granted') {
          await reg.periodicSync.register('refresh-scores', { minInterval: 15 * 60 * 1000 });
          await reg.periodicSync.register('refresh-fixtures', { minInterval: 60 * 60 * 1000 });
          console.log('[App] Periodic sync registered');
        }
      } catch (e) {
        console.warn('[App] Periodic sync not supported:', e);
      }
    }

  }).catch(e => console.warn('[App] SW registration failed:', e));
}
</script>
