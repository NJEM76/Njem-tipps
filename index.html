    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#05110a;--surface:#0c1f13;--border:#1a3522;
      --accent:#00ff85;--accent2:#00c965;--text:#e4f0e8;
      --muted:#4a7a5a;--danger:#ff4444;--warn:#ffaa00;
      --win:#00ff85;--loss:#ff4444;--info:#4da6ff;
    }
    body.light-mode{
      --bg:#f0f7f2;--surface:#ffffff;--border:#c8e0d0;
      --accent:#009950;--accent2:#007a40;--text:#0d2414;
      --muted:#5a8a6a;--danger:#cc2222;--warn:#dd8800;
      --win:#009950;--loss:#cc2222;--info:#1a7acc;
    }
    body.light-mode select option{background:#fff;color:#0d2414}
    body.light-mode ::-webkit-scrollbar-thumb{background:#c8e0d0}
    body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh}
    input,select,textarea,button{font-family:'DM Sans',sans-serif}
    input::placeholder,textarea::placeholder{color:var(--muted)}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)!important}
    select option{background:#0c1f13;color:var(--text)}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes slideIn{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}
    @keyframes glow{0%,100%{box-shadow:0 0 20px #00ff8522}50%{box-shadow:0 0 40px #00ff8544}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    @keyframes ticker{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
    .fadeUp{animation:fadeUp .35s ease both}
    .glow{animation:glow 3s infinite}
    .ticker-wrap{overflow:hidden;background:rgba(0,0,0,.5);border-bottom:1px solid var(--border);padding:.28rem 0;white-space:nowrap}
    .ticker-inner{display:inline-block;animation:ticker 28s linear infinite;white-space:nowrap;font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.5px}
    .ticker-inner:hover{animation-play-state:paused}
    #app{max-width:500px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:80px}
    .header{background:rgba(12,31,19,.97);border-bottom:1px solid var(--border);padding:.85rem 1.1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .header-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--accent)}
    .header-sub{font-size:10px;color:var(--muted)}
    .bankroll-chip{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:20px;padding:.35rem .8rem;font-size:12px;color:var(--accent);font-weight:600;cursor:pointer}
    .logout-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:rgba(12,31,19,.97);border-top:1px solid var(--border);display:flex;z-index:100}
    .nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.6rem .2rem}
    .nav-icon{font-size:18px;transition:filter .2s}
    .nav-icon.active{filter:none}
    .nav-icon.inactive{filter:grayscale(1) opacity(.35)}
    .nav-label{font-size:9px;font-weight:400;color:var(--muted)}
    .nav-label.active{font-weight:700;color:var(--accent)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1rem;margin-bottom:.75rem}
    .inp{width:100%;padding:.75rem .9rem;border-radius:12px;border:1.5px solid var(--border);background:rgba(0,0,0,.3);color:var(--text);font-size:14px}
    .inp-sm{width:100%;padding:.65rem .8rem;border-radius:10px;border:1.5px solid var(--border);background:rgba(0,0,0,.3);color:var(--text);font-size:13px}
    .btn-primary{width:100%;padding:.9rem;border-radius:14px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:15px;cursor:pointer}
    .btn-ghost{width:100%;padding:.65rem;border-radius:10px;border:1px solid var(--accent);background:rgba(0,255,133,.08);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer}
    .btn-outline{padding:.4rem .9rem;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}
    .btn-outline.active{border-color:var(--accent);background:rgba(0,255,133,.15);color:var(--accent)}
    #toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
    .toast{padding:.7rem 1rem;border-radius:12px;font-weight:600;font-size:13px;max-width:260px;animation:slideIn .3s ease;box-shadow:0 4px 24px rgba(0,0,0,.6)}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:1rem}
    .stat-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:.75rem .4rem;text-align:center}
    .stat-icon{font-size:18px;margin-bottom:4px}
    .stat-val{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
    .stat-label{font-size:9px;color:var(--muted);margin-top:2px}
    #auth-screen{min-height:100vh;background:radial-gradient(ellipse at 30% 60%,#0d3520 0%,var(--bg) 65%);display:flex;align-items:center;justify-content:center;padding:1rem}
    .auth-box{width:100%;max-width:400px;background:rgba(12,31,19,.96);border:1px solid var(--border);border-radius:24px;padding:2.25rem 2rem;box-shadow:0 0 80px rgba(0,255,133,.06);animation:fadeUp .4s ease}
    .auth-logo{display:inline-flex;align-items:center;justify-content:center;width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:30px;box-shadow:0 0 30px #00ff8544}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .spinner{width:28px;height:28px;border:3px solid var(--border);border-top:3px solid var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    .center{display:flex;justify-content:center;padding:.75rem}
    .empty{text-align:center;color:var(--muted);padding:3rem 0}
    .progress-bar{background:rgba(0,0,0,.4);border-radius:20px;height:10px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--win),var(--accent2));border-radius:20px;transition:width 1s ease}
    .banner-warn{background:var(--warn);padding:.5rem 1rem;text-align:center;font-size:12px;font-weight:700;color:#000}
    .banner-danger{background:var(--danger);padding:.5rem 1rem;text-align:center;font-size:12px;font-weight:700;color:#000}
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:flex;align-items:flex-end;justify-content:center}
    .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:1.5rem;width:100%;max-width:500px;animation:fadeUp .3s ease}
    .red-flag{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.3);border-radius:12px;padding:.75rem;margin-bottom:.5rem;display:flex;gap:8px;align-items:flex-start}
    .green-tip{background:rgba(0,255,133,.08);border:1px solid rgba(0,255,133,.2);border-radius:12px;padding:.75rem;margin-bottom:.5rem;display:flex;gap:8px;align-items:flex-start}
    .ocr-zone{border:2px dashed var(--border);border-radius:14px;padding:2rem 1rem;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:.75rem}
    .ocr-zone:hover{border-color:var(--accent);background:rgba(0,255,133,.04)}
    textarea.inp-sm{resize:vertical}
    /* Calendar View */
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:.75rem}
    .cal-day{aspect-ratio:1;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:11px;font-weight:600;transition:border-color .15s}
    .cal-day.today{border-color:var(--accent);background:rgba(0,255,133,.1)}
    .cal-day.selected{border-color:var(--accent);background:var(--accent);color:#000}
    .cal-day.has-matches::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--warn);display:block;margin-top:2px}
    .cal-day.other-month{opacity:.35}
    .cal-day:hover:not(.selected){border-color:var(--accent)}
    /* EV badge */
    .ev-badge{display:inline-block;padding:.15rem .45rem;border-radius:8px;font-size:10px;font-weight:700}
    .ev-pos{background:rgba(0,255,133,.15);color:var(--win)}
    .ev-neg{background:rgba(255,68,68,.15);color:var(--loss)}
    /* Units toggle */
    .toggle-row{display:flex;align-items:center;gap:8px;font-size:12px}
    .toggle-pill{position:relative;width:38px;height:20px;cursor:pointer}
    .toggle-pill input{opacity:0;width:0;height:0}
    .toggle-track{position:absolute;inset:0;background:var(--border);border-radius:20px;transition:background .2s}
    .toggle-track::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
    .toggle-pill input:checked+.toggle-track{background:var(--accent)}
    .toggle-pill input:checked+.toggle-track::after{transform:translateX(18px)}
    /* Bet slip drag zone */
    .drag-over{border-color:var(--accent)!important;background:rgba(0,255,133,.06)!important}
    /* NJEM System validation */
    .njem-ok{border-color:rgba(0,255,133,.4)!important}
    .njem-fail{border-color:rgba(255,68,68,.4)!important}
    .njem-warn{border-color:rgba(255,170,0,.4)!important}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
    .shake{animation:shake .35s ease}
    /* Match card improvement */
    .match-card-valid{border-color:rgba(0,255,133,.25)!important;background:linear-gradient(135deg,rgba(0,255,133,.03),transparent)!important}
    .match-card-warn{border-color:rgba(255,170,0,.35)!important}
    .match-card-banned{border-color:var(--danger)!important;background:rgba(255,68,68,.04)!important}
    /* Ticker improvements */
    .ticker-inner span{color:var(--accent)}
    /* Better card shadows */
    .card{box-shadow:0 2px 12px rgba(0,0,0,.3)}
    /* Improved bottom nav */
    .nav-btn:active{background:rgba(0,255,133,.08);border-radius:12px}
    /* Post tab header */
    .post-section-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
    /* Rule badge */
    .rule-badge{display:inline-flex;align-items:center;gap:4px;padding:.2rem .55rem;border-radius:20px;font-size:10px;font-weight:700}
    .rule-ok{background:rgba(0,255,133,.12);color:var(--win)}
    .rule-fail{background:rgba(255,68,68,.12);color:var(--loss)}
    .rule-warn{background:rgba(255,170,0,.12);color:var(--warn)}
    /* Scorecard visual */
    @keyframes countUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .count-up{animation:countUp .4s ease both}
  </style>
</head>

function normaliseFootballData(match, nowMs) {
  const home = match.homeTeam?.name;
  const away = match.awayTeam?.name;
  if (!home || !away) return null;
  const st = match.status || 'TIMED';
  // football-data statuses: TIMED, SCHEDULED, IN_PLAY, PAUSED, FINISHED, POSTPONED, SUSPENDED, CANCELLED
  const isLive = ['IN_PLAY','PAUSED'].includes(st);
  const isFinished = ['FINISHED'].includes(st);
  const minuteNum = match.minute ?? match.currentPeriod?.elapsedTime ?? 0;
  let minuteDisplay = '';
  if (st === 'PAUSED') { minuteDisplay = 'HT'; }
  else if (isLive && minuteNum) { minuteDisplay = minuteNum + "'"; }
  else if (isLive) { minuteDisplay = 'LIVE'; }
  else if (isFinished) { minuteDisplay = 'FT'; }
  const hg = match.score?.fullTime?.home ?? (isLive ? (match.score?.halfTime?.home ?? '-') : '-');
  const ag = match.score?.fullTime?.away ?? (isLive ? (match.score?.halfTime?.away ?? '-') : '-');
  return {
    home: hg, away: ag,
    htHome: match.score?.halfTime?.home ?? undefined,
    htAway: match.score?.halfTime?.away ?? undefined,
    homeTeam: home, awayTeam: away,
    minute: minuteDisplay, minuteNum, status: st,
    league: match.competition?.name || '', leagueLogo: '',
    country: match.area?.name || '',
    fixtureId: match.id,
    time: match.utcDate ? (() => {
      try {
        const d = new Date(match.utcDate);
        const eat = new Date(d.getTime() + 3 * 60 * 60 * 1000);
        return eat.toTimeString().slice(0,5);
      } catch { return ''; }
    })() : '',
    date: match.utcDate?.split('T')[0] || '',
    fetchedAt: nowMs, isLive, isFinished,
    isUpcoming: !isLive && !isFinished, _src: 'footballdata',
  };
}

// ── 1. API-Football (api-sports.io) ──────────────────────────────────
async function apifootballFetch(endpoint) {
  if (!APISPORTS_KEY) return null;
  try {
    const url = `https://v3.football.api-sports.io${endpoint.startsWith('/') ? endpoint : '/' + endpoint}`;
    const res = await fetch(url, { headers: { 'x-apisports-key': APISPORTS_KEY } });
    if (!res.ok) { console.warn('API-Football HTTP', res.status, url); return null; }
    const json = await res.json();
    if (json.errors && Object.keys(json.errors).length > 0) {
      const errs = JSON.stringify(json.errors);
      // rateLimit error — inform but don't crash
      if (errs.includes('rateLimit') || errs.includes('requests')) {
        console.warn('API-Football rate limit hit');
        return { _rateLimit: true, response: [] };
      }
      console.warn('API-Football errors:', errs);
      return null;
    }
    return json;
  } catch(e) { console.warn('API-Football exception:', e.message); return null; }
}

// ── 2. AllSports API ─────────────────────────────────────────────────
async function allsportsFetch(endpoint) {
  if (!ALLSPORTS_KEY) return null;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const base = 'https://apiv2.allsportsapi.com/football/';
    const sep  = endpoint.includes('?') ? '&' : '?';
    const url  = `${base}${endpoint}${sep}APIkey=${ALLSPORTS_KEY}`;
    const res  = await fetch(url, { signal: controller.signal });
    clearTimeout(timeout);
    if (!res.ok) { console.warn('AllSports HTTP', res.status); return null; }
    return await res.json();
  } catch(e) {
    clearTimeout(timeout);
    if (e.name === 'AbortError') console.warn('AllSports timeout — request ilikuwa polepole sana');
    else console.warn('AllSports exception:', e.message);
    return null;
  }
}

function normaliseSportmonks(fix, nowMs) {
  const home = fix.participants?.find(p => p.meta?.location === 'home')?.name;
  const away = fix.participants?.find(p => p.meta?.location === 'away')?.name;
  if (!home || !away) return null;
  const statusShort = fix.state?.short_name || fix.state?.state || 'NS';
  const liveStates  = ['1H','2H','HT','ET','BT','PEN','INT','LIVE'];
  const finStates   = ['FT','AET','PENFT','FT_PEN','CANCL','ABD','POSTP'];
  const isLive     = liveStates.includes(statusShort) || (fix.state?.state === 'inprogress');
  const isFinished = finStates.some(s => statusShort.startsWith(s));
  const elapsed    = fix.periods?.find(p => p.tba === false)?.minutes || fix.minute;
  let minuteDisplay = '', minuteNum = 0;
  if (statusShort === 'HT') { minuteDisplay = 'HT'; minuteNum = 45; }
  else if (isLive && elapsed) { minuteNum = parseInt(elapsed)||0; minuteDisplay = minuteNum + "'"; }
  else if (isFinished) { minuteDisplay = 'FT'; }
  const homeLogo = fix.participants?.find(p => p.meta?.location === 'home')?.image_path || '';
  const awayLogo = fix.participants?.find(p => p.meta?.location === 'away')?.image_path || '';
  const hScore   = fix.scores?.find(s => s.score?.participant === 'home' && s.description === 'CURRENT');
  const aScore   = fix.scores?.find(s => s.score?.participant === 'away' && s.description === 'CURRENT');
  const startAt  = fix.starting_at ? new Date(fix.starting_at) : null;
  const timeStr  = startAt ? startAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
  const dateStr  = fix.starting_at?.split(' ')[0] || fix.starting_at?.split('T')[0] || '';
  return {
    home: hScore?.score?.goals ?? '-',
    away: aScore?.score?.goals ?? '-',
    homeTeam: home, awayTeam: away,
    homeLogo, awayLogo,
    minute: minuteDisplay, minuteNum, status: statusShort,
    league: fix.league?.name || '', leagueLogo: fix.league?.image_path || '',
    country: fix.league?.country?.name || '',
    fixtureId: fix.id,
    venue: fix.venue?.name || '',
    time: timeStr, date: dateStr,
    fetchedAt: nowMs, isLive, isFinished,
    isUpcoming: !isLive && !isFinished, _src: 'sportmonks',
  };
}

function normaliseSportsdb(ev, nowMs) {
  if (!ev.strHomeTeam || !ev.strAwayTeam) return null;
  const st = (ev.strStatus || '').trim();
  const isLive = ['1H','2H','HT','ET','In Progress','Live','LIVE','Extra Time','Penalties','INT'].includes(st);
  const isFinished = ['FT','AET','PEN','Match Finished','Full Time','After Extra Time'].includes(st)
                    || st.startsWith('FT') || st.startsWith('AET');

  // Kickoff timestamp (UTC) — TheSportsDB hutoa strTimestamp (UTC ISO) au dateEvent+strTime
  let kickoffMs = null;
  if (ev.strTimestamp) {
    const t = new Date(ev.strTimestamp.replace(' ', 'T') + (ev.strTimestamp.includes('Z')?'':'Z'));
    if (!isNaN(t.getTime())) kickoffMs = t.getTime();
  }
  if (!kickoffMs && ev.dateEvent && ev.strTime) {
    const t = new Date(`${ev.dateEvent}T${ev.strTime}Z`);
    if (!isNaN(t.getTime())) kickoffMs = t.getTime();
  }

  let minuteDisplay = '', minuteNum = 0;
  if (st === 'HT') { minuteDisplay = 'HT'; minuteNum = 45; }
  else if (isLive && ev.strProgress && (parseInt(ev.strProgress.toString().split('+')[0])||0) > 0) {
    const prog = ev.strProgress.toString().trim();
    minuteNum = parseInt(prog.split('+')[0]) || 0;
    minuteDisplay = prog + "'";
  } else if (isLive && kickoffMs) {
    // strProgress haipo/ni 0 — kadiria dakika kutoka kickoff time halisi
    const elapsedMins = Math.floor((nowMs - kickoffMs) / 60000);
    if (elapsedMins > 0) {
      minuteNum = Math.min(elapsedMins, st === '2H' ? 95 : 47);
      minuteDisplay = `~${minuteNum}'`;
    } else {
      minuteDisplay = 'LIVE';
    }
  } else if (isLive) { minuteDisplay = 'LIVE'; }
  else if (isFinished) { minuteDisplay = 'FT'; }
  const today = new Date().toISOString().split('T')[0];

  // TheSportsDB returns time in UTC — convert to EAT (UTC+3) for Tanzania users
  let timeStr = '';
  if (ev.strTime) {
    try {
      const rawTime = ev.strTime.slice(0, 5); // "HH:MM"
      const [hh, mm] = rawTime.split(':').map(Number);
      const utcMins = hh * 60 + mm;
      const eatMins = (utcMins + 180) % (24 * 60); // +3 hours
      const eatH = Math.floor(eatMins / 60).toString().padStart(2, '0');
      const eatM = (eatMins % 60).toString().padStart(2, '0');
      timeStr = `${eatH}:${eatM}`;
    } catch { timeStr = ev.strTime.slice(0, 5); }
  }

  return {
    home: ev.intHomeScore ?? '-', away: ev.intAwayScore ?? '-',
    homeTeam: ev.strHomeTeam, awayTeam: ev.strAwayTeam,
    minute: minuteDisplay, minuteNum, status: st, kickoffMs,
    league: ev.strLeague || '', country: ev.strCountry || '',
    fixtureId: ev.idEvent,
    time: timeStr,
    date: ev.dateEvent || today,
    fetchedAt: nowMs, isLive, isFinished,
    isUpcoming: !isLive && !isFinished, _src: 'sportsdb',
  };
}

function ingestScoreData(scoreData) {
  if (!scoreData) return;
  const k1 = `${scoreData.homeTeam} vs ${scoreData.awayTeam}`.toLowerCase();
  const k2 = `${scoreData.awayTeam} vs ${scoreData.homeTeam}`.toLowerCase();
  // Priority: apifootball > footballdata > sportmonks > allsports > sportsdb
  const existing = liveScores[k1];
  const srcPriority = { apifootball: 4, footballdata: 3, sportmonks: 2, allsports: 1, sportsdb: 0 };
  const existPri = srcPriority[existing?._src] ?? -1;
  const newPri   = srcPriority[scoreData._src] ?? -1;
  if (existing && existPri >= newPri) return;
  liveScores[k1] = scoreData;
  liveScores[k2] = scoreData;
}

// LIVE SCORES — fetch from all 3 sources

async function fetchLiveScores() {
  const nowMs = Date.now();
  const todayStr = new Date().toISOString().split('T')[0];

  // ── Source 1: API-Football (primary, accurate) ────────────────────
  if (APISPORTS_KEY) {
    try {
      const [liveData, todayData] = await Promise.all([
        apifootballFetch('/fixtures?live=all'),
        apifootballFetch(`/fixtures?date=${todayStr}&timezone=Africa/Dar_es_Salaam`),
      ]);
      const seen = new Set();
      [...(liveData?.response || []), ...(todayData?.response || [])].forEach(fix => {
        if (seen.has(fix.fixture?.id)) return;
        seen.add(fix.fixture?.id);
        ingestScoreData(normaliseApifootball(fix, nowMs));
      });
    } catch(e) { console.warn('API-Football live fetch:', e.message); }
  }

  // ── Source 2: football-data.org ──────────────────────────────────────
  if (FOOTBALLDATA_KEY) {
    try {
      const fdData = await footballdataFetch('matches?status=LIVE');
      const nowFd = Date.now();
      (fdData?.matches || []).forEach(m => ingestScoreData(normaliseFootballData(m, nowFd)));
      // Also fetch today's scheduled matches
      const todayFd = await footballdataFetch(`matches?dateFrom=${todayStr}&dateTo=${todayStr}`);
      (todayFd?.matches || []).forEach(m => ingestScoreData(normaliseFootballData(m, nowFd)));
    } catch(e) { console.warn('football-data.org live fetch:', e.message); }
  }

  // ── Source 3: Sportmonks ──────────────────────────────────────────
  if (SPORTMONKS_KEY) {
    try {
      const smRes = await sportmonksFetch(`fixtures/date/${todayStr}?include=participants,scores,state,league`);
      const nowMs2 = Date.now();
      (smRes?.data || []).forEach(fix => ingestScoreData(normaliseSportmonks(fix, nowMs2)));
    } catch(e) { console.warn('Sportmonks live fetch:', e.message); }
  }

  // ── Source 3: AllSports API ───────────────────────────────────────
  if (ALLSPORTS_KEY) {
    try {
      const res = await allsportsFetch(`?met=Fixtures&from=${todayStr}&to=${todayStr}`);
      (res?.result || []).forEach(ev => ingestScoreData(normaliseAllsports(ev, nowMs)));
    } catch(e) { console.warn('AllSports live fetch:', e.message); }
  }

  // ── Source 4: TheSportsDB — DAIMA tumia (free, inafanya kazi bila key)
  // Hata kama API nyingine zipo, TheSportsDB inatoa live match data ya ziada
  try {
    const data = await sportsdbFetch(`eventslive.php`); // live matches endpoint
    (data?.events || []).forEach(ev => ingestScoreData(normaliseSportsdb(ev, nowMs)));
  } catch(e) { console.warn('TheSportsDB live fetch:', e.message); }

  // ── Source 4b: TheSportsDB today — kama bado hakuna data ─────────
  if (Object.keys(liveScores).length === 0) {
    try {
      const data = await sportsdbFetch(`eventsday.php?d=${todayStr}&s=Soccer`);
      (data?.events || []).forEach(ev => ingestScoreData(normaliseSportsdb(ev, nowMs)));
    } catch(e) { console.warn('TheSportsDB today fetch:', e.message); }
  }

  lastLiveFetch = Date.now();
  liveDataFetchedOnce = true;
  await autoSettleMatches();
  if (['results','mikeka','home'].includes(currentTab)) refreshLiveUI();
  if (currentTab === 'home') renderLiveSection();
  if (currentTab === 'mikeka') { const c=el('content'); if(c) renderMikeka(c); }
  if (currentTab === 'fixtures') renderFixtures(el('content'));
}

// Find score for a match by team names — improved fuzzy matching with fixtureId support
function findScore(teamsStr, fixtureId = null) {
  if (!teamsStr) return null;
  const key = teamsStr.toLowerCase().trim();

  // 1. Direct exact match
  if (liveScores[key]) return liveScores[key];

  // 2. Ikiwa fixtureId imetolewa, tafuta kwa ID moja kwa moja
  if (fixtureId) {
    for (const [k, v] of Object.entries(liveScores)) {
      if (v.fixtureId == fixtureId) return v;
    }
  }

  const parts = key.split(' vs ');
  if (parts.length !== 2) return null;
  const home = parts[0].trim();
  const away = parts[1].trim();

  // 3. Normalize team names for better matching (remove FC, United, etc)
  const norm = (s) => s.replace(/\b(fc|united|u21|u23|women|youth|sc|afc|fk)\b/gi, '').replace(/[^a-z0-9]/gi, '').toLowerCase().trim();
  const nHome = norm(home), nAway = norm(away);

  for (const [k, v] of Object.entries(liveScores)) {
    const kParts = k.split(' vs ');
    if (kParts.length !== 2) continue;
    const nkHome = norm(kParts[0]), nkAway = norm(kParts[1]);
    
    // Check if normalized names match or one contains the other
    if ((nkHome.includes(nHome) || nHome.includes(nkHome)) && 
        (nkAway.includes(nAway) || nAway.includes(nkAway)) &&
        nHome.length > 2 && nAway.length > 2) return v;
  }

  // Stages 4 & 5 (prefix + loose substring) removed — caused false settlements
  // e.g. "Youn" prefix matched Young Boys instead of Young Africans

  return null;
}

// Auto-settle betslip matches that are finished
async function autoSettleMatches() {
  if (!currentUser) return;
  const pendingMikeka = mikeka.filter(m => m.status === 'PENDING');
  
  for (const mk of pendingMikeka) {
    // ── Kinga ya double-settle: angalia status ya sasa kutoka DB ────────
    const { data: mkFresh } = await sb.from('mikeka').select('status').eq('id', mk.id).maybeSingle();
    if (mkFresh?.status !== 'PENDING') continue; // tayari imesettled na mtu mwingine

    const matches = mk.matches || [];
    let needsUpdate = false;
    
    for (const match of matches) {
      if (match.outcome !== 'PENDING') continue;
      
      const score = findScore(match.teams);
      // Settle if: officially finished OR stale live (estimated to be over)
      const isSettleable = score && (score.isFinished || score._staleLive);
      if (!isSettleable) continue;
      
      // Determine outcome based on market and pick
      const outcome = determineOutcome(match, score);
      if (outcome) {
        await sb.from('matches').update({ outcome }).eq('id', match.id);
        match.outcome = outcome;
        needsUpdate = true;
        // Per-match notification
        const icon = outcome === 'WIN' ? '✅' : outcome === 'LOSS' ? '❌' : '⬜';
        const msg = `${icon} ${match.teams}\n${match.market} · ${match.pick} → ${outcome}`;
        showNotification(`${icon} Match ${outcome}`, msg, outcome === 'WIN' ? 'win' : outcome === 'LOSS' ? 'loss' : 'default');
        toast(`${icon} ${match.teams.split(' vs ')[0]} — ${outcome}`, outcome==='WIN'?'ok':outcome==='LOSS'?'err':'info');
      }
    }
    
    // Check if whole mkeka is settled
    if (needsUpdate) {
      const { data: freshMatches } = await sb.from('matches').select('*').eq('mkeka_id', mk.id);
      const allDone = (freshMatches || []).every(m => m.outcome !== 'PENDING');
      if (allDone) {
        const hasLoss = (freshMatches || []).some(m => m.outcome === 'LOSS');
        const allVoid = (freshMatches || []).every(m => m.outcome === 'VOID');
        const newStatus = hasLoss ? 'LOST' : allVoid ? 'VOID' : 'WON';
        // Kinga ya double-settle: angalia hali ya sasa kwenye DB
        const { data: mkFresh } = await sb.from('mikeka').select('status').eq('id', mk.id).maybeSingle();
        if (mkFresh?.status !== 'PENDING') continue; // tayari imesettled
        await sb.from('mikeka').update({ status: newStatus }).eq('id', mk.id);
        
        const mkName = mk.name || `Mkeka #${mk.id.slice(-4)}`;
        const wonCount = (freshMatches||[]).filter(m=>m.outcome==='WIN').length;
        const total = freshMatches.length;

        if (newStatus === 'WON') {
          // Fetch fresh bankroll from DB to avoid stale state
          const { data: freshUser } = await sb.from('users').select('bankroll').eq('id', currentUser.id).maybeSingle();
          const currentBk = freshUser?.bankroll ?? currentUser.bankroll;
          const payout = (mk.potential_return || 0);
          await updateUser({ bankroll: currentBk + payout });
          showNotification('🎉 MKEKA UMESHINDA!', `${mkName}\n${wonCount}/${total} zimeshinda\n+TZS ${fmt(payout - (mk.stake||0))} faida`, 'win');
          toast(`🎉 MKEKA WON! Payout: TZS ${fmt(payout)}`, 'ok');
        } else if (newStatus === 'LOST') {
          // Stake tayari ilipigwa — hakuna kubadilisha bankroll
          showNotification('❌ Mkeka Umepoteza', `${mkName}\n${wonCount}/${total} zilishinda`, 'loss');
          toast(`❌ Mkeka Imepotea — ${mkName}`, 'err');
        } else {
          // VOID: rudisha stake tu
          const stakeBack = mk.stake || 0;
          if (stakeBack > 0) {
            const { data: freshUser2 } = await sb.from('users').select('bankroll').eq('id', currentUser.id).maybeSingle();
            const currentBk2 = freshUser2?.bankroll ?? currentUser.bankroll;
            await updateUser({ bankroll: currentBk2 + stakeBack });
          }
          showNotification('⬜ Mkeka VOID', mkName);
          toast(`⬜ VOID — Stake TZS ${fmt(stakeBack)} imerudishwa`, 'info');
        }
        await loadData();
        if (['home','mikeka','results'].includes(currentTab)) showTab(currentTab);
      }
    }
  }
}

// Determine match outcome from score
function determineOutcome(match, score) {
  const home = parseInt(score.home) || 0;
  const away = parseInt(score.away) || 0;
  const total = home + away;
  const market = match.market || '';
  const pick = (match.pick || '').toLowerCase().trim();
  
  try {
    // 1X2
    if (market === '1X2') {
      const result = home > away ? '1' : away > home ? '2' : 'X';
      return result === pick ? 'WIN' : 'LOSS';
    }
    // Double Chance
    if (market === 'Double Chance') {
      const result = home > away ? '1' : away > home ? '2' : 'X';
      if (pick === '1x' || pick === 'x1') return (result==='1'||result==='X') ? 'WIN' : 'LOSS';
      if (pick === '12') return (result==='1'||result==='2') ? 'WIN' : 'LOSS';
      if (pick === 'x2' || pick === '2x') return (result==='2'||result==='X') ? 'WIN' : 'LOSS';
    }
    // Draw No Bet
    if (market === 'Draw No Bet') {
      if (home === away) return 'VOID';
      const result = home > away ? '1' : '2';
      return result === pick ? 'WIN' : 'LOSS';
    }
    // Over/Under
    if (market.startsWith('Over ') || market.startsWith('Under ')) {
      const line = parseFloat(market.split(' ')[1]);
      if (market.startsWith('Over ')) return total > line ? 'WIN' : 'LOSS';
      if (market.startsWith('Under ')) return total < line ? 'WIN' : 'LOSS';
    }
    // BTTS
    if (market === 'BTTS - Yes') return (home > 0 && away > 0) ? 'WIN' : 'LOSS';
    if (market === 'BTTS - No') return (home === 0 || away === 0) ? 'WIN' : 'LOSS';
    // 1st Half Over/Under — needs HT score
    if (market.startsWith('1st Half Over') || market.startsWith('1st Half Under')) {
      const htHome = parseInt(score.htHome) || 0;
      const htAway = parseInt(score.htAway) || 0;
      if (score.htHome === undefined && score.htAway === undefined) return null; // no HT data
      const htTotal = htHome + htAway;
      const line = parseFloat(market.split(' ').pop());
      if (market.includes('Over')) return htTotal > line ? 'WIN' : 'LOSS';
      if (market.includes('Under')) return htTotal < line ? 'WIN' : 'LOSS';
    }
    // 1st Half 1X2 / DC
    if (market === '1st Half 1X2') {
      if (score.htHome === undefined) return null;
      const h = parseInt(score.htHome)||0, a = parseInt(score.htAway)||0;
      const r = h > a ? '1' : a > h ? '2' : 'X';
      return r === pick ? 'WIN' : 'LOSS';
    }
    if (market === '1st Half Double Chance') {
      if (score.htHome === undefined) return null;
      const h = parseInt(score.htHome)||0, a = parseInt(score.htAway)||0;
      const r = h > a ? '1' : a > h ? '2' : 'X';
      if (pick === '1x' || pick === 'x1') return (r==='1'||r==='X') ? 'WIN' : 'LOSS';
      if (pick === '12') return (r==='1'||r==='2') ? 'WIN' : 'LOSS';
      if (pick === 'x2' || pick === '2x') return (r==='2'||r==='X') ? 'WIN' : 'LOSS';
    }
    // 2nd Half Over/Under — computed as FT minus HT
    if (market.startsWith('2nd Half Over') || market.startsWith('2nd Half Under') || market === '2nd Half 1X2' || market === '2nd Half Double Chance') {
      if (score.htHome === undefined || !score.isFinished) return null;
      const sh_home = home - (parseInt(score.htHome)||0);
      const sh_away = away - (parseInt(score.htAway)||0);
      const sh_total = sh_home + sh_away;
      if (market.includes('Over ') || market.includes('Under ')) {
        const line = parseFloat(market.split(' ').pop());
        if (market.includes('Over')) return sh_total > line ? 'WIN' : 'LOSS';
        if (market.includes('Under')) return sh_total < line ? 'WIN' : 'LOSS';
      }
      if (market === '2nd Half 1X2') {
        const r = sh_home > sh_away ? '1' : sh_away > sh_home ? '2' : 'X';
        return r === pick ? 'WIN' : 'LOSS';
      }
      if (market === '2nd Half Double Chance') {
        const r = sh_home > sh_away ? '1' : sh_away > sh_home ? '2' : 'X';
        if (pick === '1x' || pick === 'x1') return (r==='1'||r==='X') ? 'WIN' : 'LOSS';
        if (pick === '12') return (r==='1'||r==='2') ? 'WIN' : 'LOSS';
        if (pick === 'x2' || pick === '2x') return (r==='2'||r==='X') ? 'WIN' : 'LOSS';
      }
    }
    // Home team individual Over/Under
    if (market.startsWith('Home Over') || market.startsWith('Home Under')) {
      const line = parseFloat(market.split(' ').pop());
      if (market.includes('Over')) return home > line ? 'WIN' : 'LOSS';
      if (market.includes('Under')) return home < line ? 'WIN' : 'LOSS';
    }
    // Away team individual Over/Under
    if (market.startsWith('Away Over') || market.startsWith('Away Under')) {
      const line = parseFloat(market.split(' ').pop());
      if (market.includes('Over')) return away > line ? 'WIN' : 'LOSS';
      if (market.includes('Under')) return away < line ? 'WIN' : 'LOSS';
    }
    // HT markets - cannot auto-settle without HT score
    return null;
  } catch(e) {
    return null;
  }
}

// ── Audio alert using Web Audio API (sauti ya notification) ──────────
function playNotificationSound(type = 'default') {
  try {
    // Unda AudioContext mpya kila wakati — salama zaidi kwa iOS
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const sequences = {
      win:     [{f:523,t:0,d:.12},{f:659,t:.13,d:.12},{f:784,t:.26,d:.2}],
      loss:    [{f:400,t:0,d:.15},{f:300,t:.18,d:.25}],
      live:    [{f:440,t:0,d:.08},{f:440,t:.12,d:.08}],
      default: [{f:520,t:0,d:.1},{f:660,t:.12,d:.1}],
    };
    const seq = sequences[type] || sequences.default;
    // ctx.resume() ni muhimu sana kwa iOS — lazima iitwe kabla ya kucheza sauti
    ctx.resume().then(() => {
      seq.forEach(({f, t, d}) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = f;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.35, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + d);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + d + 0.05);
      });
      setTimeout(() => ctx.close(), 1500);
    });
  } catch(e) { /* AudioContext inaweza kuzuiwa kabla ya user interaction */ }
}

function showNotification(title, body, soundType = 'default') {
  // Store in history + update badge
  addNotifToHistory(title, body, soundType);
  // Sauti
  playNotificationSound(soundType);
  // Vibration for mobile
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);

  if (!('Notification' in window)) return;

  const notifOptions = {
    body,
    icon: '/icon-192.png',
    badge: '/icon-192.png',
    tag: `njem-${soundType}-${Date.now()}`,
    renotify: true,
    silent: false,
    requireInteraction: soundType === 'win' || soundType === 'loss',
    data: { soundType, timestamp: Date.now() },
    actions: soundType === 'win'
      ? [{ action: 'view', title: '👀 Angalia' }]
      : undefined,
  };

  const doNotify = () => {
    try {
      // Background notifications require a service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification(title, notifOptions);
        }).catch(err => {
          console.warn('SW notification failed, using window:', err);
          new Notification(title, notifOptions);
        });
      } else {
        new Notification(title, notifOptions);
      }
    } catch(e) { console.warn('Notification error:', e); }
  };

  if (Notification.permission === 'granted') {
    doNotify();
  } else if (Notification.permission !== 'denied') {
    Notification.requestPermission().then(p => {
      if (p === 'granted') doNotify();
    });
  }
}

// Cash out alert

  const pendingMikeka = mikeka.filter(m => m.status === 'PENDING');
  pendingMikeka.forEach(mk => {
    const matches = mk.matches || [];
    let wonCount = 0, pendingCount = 0;
    
    matches.forEach(match => {
      if (match.outcome === 'WIN') wonCount++;
      if (match.outcome === 'PENDING') {
        const score = findScore(match.teams);
        if (score && score.isLive) pendingCount++;
      }
    });
    
    // If more than 70% of matches won and rest are live
    const pct = wonCount / matches.length;
    if (pct >= 0.7 && pendingCount > 0) {
      showNotification('💰 CASHOUT ALERT!', `${mk.name}: ${wonCount}/${matches.length} zimeshinda — Fikiria cashout!`);
      toast(`💰 CASHOUT: ${mk.name} — ${wonCount}/${matches.length} WIN!`, 'warn');
    }
  });
}

async function fetchTeamForm(teamName) {

async function fetchH2H(homeTeam, awayTeam) {
  try {
    // TheSportsDB tu — bure, bila API key, bila quota
    const [homeData, awayData] = await Promise.all([
      fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(homeTeam)}`).then(r=>r.json()),
      fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(awayTeam)}`).then(r=>r.json()),
    ]);
    const homeId = (homeData.teams||[])[0]?.idTeam;

    if (!homeId || !awayId) return [];
    const res = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/eventsh2h.php?idHomeTeam=${homeId}&idAwayTeam=${awayId}`);
    const data = await res.json();
    return (data.results||[]).slice(0,5);
  } catch(e) { return []; }
}

function analyzeForm(events, teamName) {
  if (!events || !events.length) return { wins:0, draws:0, losses:0, goalsFor:0, goalsAgainst:0, form:[] };
  let wins=0, draws=0, losses=0, goalsFor=0, goalsAgainst=0, form=[];
  events.forEach(ev => {
    const isHome = ev.strHomeTeam?.toLowerCase().includes(teamName.toLowerCase().split(' ')[0]);
    const hg = parseInt(ev.intHomeScore)||0;
    const ag = parseInt(ev.intAwayScore)||0;
    const gf = isHome ? hg : ag;
    const ga = isHome ? ag : hg;
    goalsFor += gf; goalsAgainst += ga;
    if (gf > ga) { wins++; form.push('W'); }
    else if (gf === ga) { draws++; form.push('D'); }
    else { losses++; form.push('L'); }
  });
  return { wins, draws, losses, goalsFor, goalsAgainst, form };
}

function analyzeH2H(h2hEvents, homeTeam) {
  if (!h2hEvents || !h2hEvents.length) return null;
  let homeWins=0, awayWins=0, draws=0, totalGoals=0;
  h2hEvents.forEach(ev => {
    const hg = parseInt(ev.intHomeScore)||0;
    const ag = parseInt(ev.intAwayScore)||0;
    totalGoals += hg + ag;
    const isHome = ev.strHomeTeam?.toLowerCase().includes(homeTeam.toLowerCase().split(' ')[0]);
    if (hg > ag) isHome ? homeWins++ : awayWins++;
    else if (hg < ag) isHome ? awayWins++ : homeWins++;
    else draws++;
  });
  return {
    homeWins, awayWins, draws,
    avgGoals: (totalGoals / h2hEvents.length).toFixed(1),
    total: h2hEvents.length
  };
}

// Fetch AI web insights via OpenRouter (with web search prompt)
async function fetchAIWebInsights(homeTeam, awayTeam) {
  if (!GEMINI_KEY) return null;
  try {
    const prompt = `You are a football analyst. Analyze the upcoming match: ${homeTeam} vs ${awayTeam}.
Search for and provide:
1. Recent injuries or suspensions for both teams
2. Current form and momentum
3. Any head-to-head patterns
4. Most likely match events (goals, corners, cards patterns)
Respond in JSON only, no markdown:
{"summary":"2-3 sentence analysis","injuries":"injury notes or null","keyPlayers":"key player info","patterns":"corners/cards/goals patterns","confidence":"high|medium|low"}`;

    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + GEMINI_KEY,
        'HTTP-Referer': 'https://76tipps.netlify.app',
        'X-Title': '76TIPPS'
      },
      body: JSON.stringify({
        model: 'meta-llama/llama-3.2-11b-vision-instruct:free',
        max_tokens: 400,
        temperature: 0.3,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) return null;
    const data = await res.json();
    const text = data.choices?.[0]?.message?.content || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const match = clean.match(/\{[\s\S]*\}/);
    if (!match) return { summary: text.slice(0, 200) };
    return JSON.parse(match[0]);
  } catch(e) { return null; }
}

function generateAIRecommendations(homeTeam, awayTeam, homeStats, awayStats, h2h, webInsights=null) {
  const recs = [];
  const totalHomeGoals = homeStats.goalsFor + homeStats.goalsAgainst;
  const totalAwayGoals = awayStats.goalsFor + awayStats.goalsAgainst;
  const avgTotalGoals = homeStats.form.length ? (totalHomeGoals / homeStats.form.length) : 0;
  const avgAwayGoals = awayStats.form.length ? (totalAwayGoals / awayStats.form.length) : 0;
  const avgGoals = (avgTotalGoals + avgAwayGoals) / 2;
  const h2hAvgGoals = h2h ? parseFloat(h2h.avgGoals) : 0;

  // Over/Under recommendation
  const goalAvg = h2h ? (h2hAvgGoals + avgGoals) / 2 : avgGoals;
  if (goalAvg > 2.5) {
    recs.push({
      icon: '⚽',
      market: `Over 2.5 Goals`,
      pick: 'Over 2.5',
      confidence: Math.min(Math.round(55 + (goalAvg - 2.5) * 10), 78),
      reason: `Wastani wa magoli ${goalAvg.toFixed(1)} kwa mechi. ${h2h ? `H2H avg ${h2hAvgGoals} magoli.` : ''}`,
      type: goalAvg > 3 ? 'best' : 'ok'
    });
  } else {
    recs.push({
      icon: '🔒',
      market: `Under 2.5 Goals`,
      pick: 'Under 2.5',
      confidence: Math.min(Math.round(55 + (2.5 - goalAvg) * 8), 72),
      reason: `Mechi za hivi karibuni zina magoli machache. Avg ${goalAvg.toFixed(1)}.`,
      type: goalAvg < 1.8 ? 'best' : 'ok'
    });
  }

  // 1X2 / Double Chance recommendation
  const homeWinRate = homeStats.form.length ? homeStats.wins / homeStats.form.length : 0;
  const awayWinRate = awayStats.form.length ? awayStats.wins / awayStats.form.length : 0;
  const h2hHomeDominance = h2h ? h2h.homeWins / h2h.total : 0.5;

  if (homeWinRate > 0.6 && h2hHomeDominance > 0.4) {
    recs.push({
      icon: '🏠',
      market: 'Double Chance 1X',
      pick: '1X',
      confidence: Math.min(Math.round(55 + homeWinRate * 20), 75),
      reason: `${homeTeam} wameshinda ${Math.round(homeWinRate*100)}% ya mechi zao za hivi karibuni. H2H wanaongoza ${h2h?h2h.homeWins:0}/${h2h?h2h.total:0}.`,
      type: homeWinRate > 0.7 ? 'best' : 'ok'
    });
  } else if (awayWinRate > 0.6) {
    recs.push({
      icon: '✈️',
      market: 'Double Chance X2',
      pick: 'X2',
      confidence: Math.min(Math.round(52 + awayWinRate * 18), 72),
      reason: `${awayTeam} wana form nzuri — wameshinda ${Math.round(awayWinRate*100)}% ya mechi zao.`,
      type: awayWinRate > 0.7 ? 'best' : 'ok'
    });
  } else {
    recs.push({
      icon: '⚖️',
      market: 'Double Chance 1X',
      pick: '1X',
      confidence: 55,
      reason: 'Mechi usawa — Double Chance ni salama zaidi kuliko 1X2 moja kwa moja.',
      type: 'ok'
    });
  }

  // BTTS recommendation
  const homeScoredIn = homeStats.goalsFor > 0;
  const awayScoredIn = awayStats.goalsFor > 0;
  const homeConcedeRate = homeStats.form.length ? homeStats.goalsAgainst / homeStats.form.length : 1;
  const awayConcedeRate = awayStats.form.length ? awayStats.goalsAgainst / awayStats.form.length : 1;

  if (homeConcedeRate > 0.8 && awayConcedeRate > 0.8) {
    recs.push({
      icon: '🎯',
      market: 'BTTS - Yes',
      pick: 'BTTS Yes',
      confidence: Math.min(Math.round(55 + (homeConcedeRate + awayConcedeRate) * 5), 73),
      reason: `${homeTeam} wapoteza avg ${homeConcedeRate.toFixed(1)} kwa mechi. ${awayTeam} avg ${awayConcedeRate.toFixed(1)}. Pande zote zinaweza kuscore.`,
      type: homeConcedeRate > 1 && awayConcedeRate > 1 ? 'best' : 'ok'
    });
  }

  // Sort by confidence
  recs.sort((a, b) => b.confidence - a.confidence);
  return recs.slice(0, 4);
}

// Match Details Modal — Live Stats
async function showMatchDetailsModal(teamsStr, eventId) {
  // Create modal
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'match-modal';
  ov.innerHTML = `
    <div class="modal-box" style="max-height:85vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <div>
          <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800">📊 Match Details</div>
          <div id="match-modal-refresh-label" style="font-size:10px;color:var(--muted)"></div>
        </div>
        <button onclick="document.getElementById('match-modal').remove()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">×</button>
      </div>
      <div id="match-details-content"><div class="center"><div class="spinner"></div></div></div>
    </div>`;
  document.body.appendChild(ov);
  ov.onclick = (e) => { if(e.target===ov) ov.remove(); };

  let modalRefreshInterval = null;

  // Auto-close cleans up interval
  const origRemove = ov.remove.bind(ov);
  ov.remove = () => { if(modalRefreshInterval) clearInterval(modalRefreshInterval); origRemove(); };

  async function loadModalContent() {
    const score = findScore(teamsStr);
    const dc = document.getElementById('match-details-content');
    if (!dc) return;

    // Update refresh label
    const lbl = document.getElementById('match-modal-refresh-label');
    if (lbl) {
      const s = score;
      if (s?.isLive) lbl.innerHTML = `<span style="color:var(--danger);animation:pulse 1s infinite">🔴 LIVE — inajirudia kila 30s</span>`;
      else if (s?.isFinished) lbl.textContent = 'Mechi imekwisha';
      else lbl.textContent = teamsStr;
    }

    // Fetch event details — try API-Sports first, then Sportmonks, then TheSportsDB
    try {
      let eventData = null;
      let timeline = [];

      if (eventId && APISPORTS_KEY) {
        // API-Sports: live stats + timeline
        // TheSportsDB IDs are large (>1M). API-Football IDs are <1M.
        // Skip API-Sports call if eventId looks like a TheSportsDB ID.
        const idNum = parseInt(eventId) || 0;
        const looksLikeApifootball = idNum > 0 && idNum < 1000000;
        if (looksLikeApifootball) {
          try {
            const [statsData, eventsData] = await Promise.all([
              apiSports(`fixtures/statistics?fixture=${eventId}`),
              apiSports(`fixtures/events?fixture=${eventId}`),
            ]);
            if (statsData?.response?.length >= 2) {
              const homeStats = statsData.response[0]?.statistics || [];
              const awayStats = statsData.response[1]?.statistics || [];
              const hs = {}, as = {};
              homeStats.forEach(s => { hs[s.type] = s.value ?? 0; });
              awayStats.forEach(s => { as[s.type] = s.value ?? 0; });
              eventData = { _apiStats: { hs, as } };
            }
            timeline = eventsData?.response || [];
          } catch(e) { console.warn('API-Sports modal fetch error:', e); }
        } // end looksLikeApifootball
      } // end APISPORTS_KEY block
      
      // Secondary check: if API-Sports failed or no data, try Sportmonks
      if (!eventData && eventId && SPORTMONKS_KEY) {
        // Sportmonks: fetch fixture with stats include
        const smData = await sportmonksFetch(
          `fixtures/${eventId}?include=statistics;events;participants;scores;state`
        );
        if (smData?.data) {
          const fix = smData.data;
          const homeParticipant = fix.participants?.find(p => p.meta?.location === 'home');
          const awayParticipant = fix.participants?.find(p => p.meta?.location === 'away');
          const homeId = homeParticipant?.id;
          const awayId = awayParticipant?.id;
          if (fix.statistics?.length) {
            const hs = {}, as = {};
            fix.statistics.forEach(stat => {
              const bucket = stat.participant_id === homeId ? hs : as;
              bucket[stat.type?.name || stat.type_id] = stat.data?.value ?? stat.value ?? 0;
            });
            eventData = { _apiStats: { hs, as } };
          }
          // Build timeline from events
          timeline = (fix.events || []).map(ev => ({
            time: { elapsed: ev.minute },
            type: ev.type?.name || '',
            detail: ev.detail?.name || '',
            player: { name: ev.player_name || '' },
            team: { name: ev.participant_id === homeId ? (homeParticipant?.name||'') : (awayParticipant?.name||'') },
          }));
        }

      } else if (eventId) {
        // TheSportsDB fallback — fetch event details + lineup if available
        try {
          const [evRes, lineupRes] = await Promise.all([
            fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/lookupevent.php?id=${eventId}`),
            fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/lookuplinescores.php?id=${eventId}`),
          ]);
          const evData = await evRes.json();
          eventData = (evData.events || [])[0] || null;

          // Build timeline from TheSportsDB events (goals, cards, substitutions)
          try {
            const tlRes = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/lookuptimeline.php?id=${eventId}`);
            const tlData = await tlRes.json();
            if (tlData?.timeline?.length) {
              timeline = tlData.timeline.map(ev => ({
                time: { elapsed: ev.strTimeline?.replace("'","") || '' },
                type: ev.strType || ev.strEvent || '',
                detail: ev.strComment || ev.strAssist || '',
                player: { name: ev.strPlayer || ev.strSubstOff || '' },
                team: { name: ev.strTeam || '' },
                _raw: ev,
              }));
            }
          } catch(e2) { /* timeline haipatikani */ }
        } catch(e) {}
      }

      const s = score || {};
      const home = s.homeTeam || teamsStr.split(' vs ')[0];
      const away = s.awayTeam || teamsStr.split(' vs ')[1];

      // Real-time minute estimation for live
      let displayMinute = s.minute || '';

      // Parse stats - prefer API-Sports data

          yellow_away: eventData?.intAwayYellowCards || 0,
          red_home: eventData?.intHomeRedCards || 0,
          red_away: eventData?.intAwayRedCards || 0,
          offsides_home: '—', offsides_away: '—',

        };
        stats.possession_away = 100 - stats.possession_home;
      }

      const statusColor = s.isLive ? 'var(--danger)' : s.isFinished ? 'var(--muted)' : 'var(--warn)';
      const statusText = s.isLive ? `🔴 LIVE ${displayMinute}` : s.isFinished ? '✅ FT' : `🕐 ${s.time||''}`;

      dc.innerHTML = `

          ${generateMatchAI(s, stats)}

    } catch(e) {
      const dc2 = document.getElementById('match-details-content');
      if(dc2) dc2.innerHTML = `
        <div style="background:linear-gradient(135deg,#0f3520,#092518);border-radius:16px;padding:1.25rem;margin-bottom:1rem;text-align:center">

        </div>
        <div style="text-align:center;color:var(--muted);padding:1.5rem;background:var(--surface);border-radius:14px">
          <div style="font-size:32px">📡</div>

          <button onclick="window._reloadModal && window._reloadModal()" style="margin-top:14px;padding:.5rem 1.25rem;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;cursor:pointer">🔄 Jaribu Tena</button>
        </div>`;
    }
  }

  await loadModalContent();
  window._reloadModal = loadModalContent;

  // Auto-refresh every 30s if match is live
  modalRefreshInterval = setInterval(async () => {
    const score = findScore(teamsStr);
    if (!document.getElementById('match-modal')) { clearInterval(modalRefreshInterval); return; }
    if (score?.isLive) {
      await loadModalContent();
    } else if (score?.isFinished) {
      clearInterval(modalRefreshInterval);
      const lbl = document.getElementById('match-modal-refresh-label');
      if (lbl) lbl.textContent = 'Mechi imekwisha';
    }
  }, 30000);
}

function statRow(label, homeVal, awayVal, homePct) {
  const pct = typeof homePct === 'number' ? Math.min(Math.max(homePct, 5), 95) : 50;
  return `
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
        <span style="font-weight:600;color:var(--accent)">${homeVal}</span>
        <span style="color:var(--muted);font-size:11px">${label}</span>
        <span style="font-weight:600;color:var(--text)">${awayVal}</span>
      </div>
      <div style="background:rgba(0,0,0,.4);border-radius:20px;height:6px;overflow:hidden;display:flex">
        <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:20px;transition:width .8s"></div>
      </div>
    </div>`;
}

function formatForm(formStr) {
  if (!formStr) return '';
  return formStr.split('').map(c => {
    const col = c==='W'?'var(--win)':c==='L'?'var(--loss)':'var(--warn)';
    return `<span style="color:${col};font-weight:700;font-size:11px">${c}</span>`;
  }).join(' ');
}

function generateMatchAI(score, stats) {
  const tips = [];
  const home = score.homeTeam || 'Home';
  const away = score.awayTeam || 'Away';
  const h = parseInt(score.home) || 0;
  const a = parseInt(score.away) || 0;
  const total = h + a;
  const min = score.minuteNum || 0;

  if (score.isLive) {
    // Live recommendations
    if (total === 0 && min > 60) tips.push({icon:'💡',msg:`${min}+ dakika bila goli — Over 0.5 inaweza kuwa risky`});
    if (total >= 2 && min < 70) tips.push({icon:'🔥',msg:`Magoli ${total} tayari — Over ${total}.5 inawezekana kabla FT`});
    if (h > a + 1) tips.push({icon:'💰',msg:`${home} wanaongoza kwa ${h}-${a} — Fikiria cashout sasa`});
    if (a > h + 1) tips.push({icon:'💰',msg:`${away} wanaongoza kwa ${a}-${h} — Fikiria cashout sasa`});
    if (parseInt(stats.red_home) > 0) tips.push({icon:'🟥',msg:`${home} wana mchezaji nje — ${away} wana advantage`});
    if (parseInt(stats.red_away) > 0) tips.push({icon:'🟥',msg:`${away} wana mchezaji nje — ${home} wana advantage`});
    if (h === a && min > 75) tips.push({icon:'⚡',msg:`Sare ${h}-${a} dakika ${min} — Bonyeza kwa ${home} au ${away} kwa late goal`});
  } else if (score.isFinished) {
    tips.push({icon:'📊',msg:`Matokeo: ${home} ${h} - ${a} ${away}`});
    if (total > 3) tips.push({icon:'📈',msg:`Magoli ${total} — Over 2.5 ingelifaa kwenye mechi hii`});
    if (total < 2) tips.push({icon:'📉',msg:`Magoli ${total} tu — Under 2.5 ingelifaa`});
  } else {
    tips.push({icon:'⏳',msg:`Mechi hii bado haijachezwa — subiri kwa data zaidi`});
  }

  if (!tips.length) tips.push({icon:'📊',msg:'Data ya kutosha haipatikani kwa mapendekezo'});

  return tips.map(t => `
    <div style="display:flex;gap:8px;margin-bottom:6px;align-items:flex-start">
      <span style="font-size:14px">${t.icon}</span>
      <span style="font-size:12px;color:#5a9e70">${t.msg}</span>
    </div>`).join('');
}

async function showFixtureBrowser() {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'fix-modal';
  const regions = [...new Set(SPORTSDB_LEAGUES.map(l => l.region))];
  let selDate = new Date().toISOString().split('T')[0];

  ov.innerHTML = `
    <div class="modal-box" style="max-height:88vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <div>
          <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800">📅 Fixtures</div>
          <div style="font-size:11px;color:var(--muted)">Chagua tarehe → Chagua ligi → Ona mechi</div>
        </div>
        <button onclick="document.getElementById('fix-modal').remove()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">×</button>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:1rem;overflow-x:auto;padding-bottom:4px">
        ${[0,1,2,3].map(d => {
          const dt = new Date(); dt.setDate(dt.getDate() + d);
          const label = d===0?'Leo':d===1?'Kesho':dt.toLocaleDateString('sw-TZ',{weekday:'short',day:'numeric'});
          const val = dt.toISOString().split('T')[0];
          return `<button onclick="window._fixDate('${val}')" data-date="${val}"
            style="padding:.4rem .85rem;border-radius:20px;border:1.5px solid ${d===0?'var(--accent)':'var(--border)'};background:${d===0?'rgba(0,255,133,.15)':'transparent'};color:${d===0?'var(--accent)':'var(--muted)'};font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap">
            ${label}</button>`;
        }).join('')}
      </div>
      ${regions.map(r => `
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;margin-top:10px">${r}</div>
        <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:8px">
          ${SPORTSDB_LEAGUES.filter(l=>l.region===r).map(l => `
            <button onclick="window._loadFixtures('${l.id}')"
              style="display:flex;align-items:center;gap:10px;padding:.65rem .85rem;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;text-align:left;font-family:inherit">
              <span style="font-size:20px">${l.flag}</span>
              <span style="font-size:13px;font-weight:500">${l.name}</span>
              <span style="margin-left:auto;color:var(--muted);font-size:16px">›</span>
            </button>`).join('')}
        </div>`).join('')}
    </div>`;
  document.body.appendChild(ov);
  ov.onclick = (e) => { if(e.target===ov) ov.remove(); };

  window._fixDate = (date) => {
    selDate = date; fixSelectedDate = date;
    document.querySelectorAll('[data-date]').forEach(b => {
      b.style.borderColor = b.dataset.date===date?'var(--accent)':'var(--border)';
      b.style.background  = b.dataset.date===date?'rgba(0,255,133,.15)':'transparent';
      b.style.color       = b.dataset.date===date?'var(--accent)':'var(--muted)';
    });
  };

  window._loadFixtures = async (lgId) => {
    const lg = SPORTSDB_LEAGUES.find(l => l.id === lgId);
    if (!lg) return;
    fixSelectedDate = selDate;
    const box = ov.querySelector('.modal-box');
    box.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:1rem">
        <button onclick="document.getElementById('fix-modal').remove();showFixtureBrowser();" style="background:none;border:none;color:var(--accent);cursor:pointer;font-size:22px">←</button>
        <div>
          <div style="font-family:'Syne',sans-serif;font-size:15px;font-weight:800">${lg.flag} ${lg.name}</div>
          <div style="font-size:11px;color:var(--muted)">${selDate}</div>
        </div>
        <button onclick="document.getElementById('fix-modal').remove()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;margin-left:auto">×</button>
      </div>
      <div id="fix-matches-out"><div class="center"><div class="spinner"></div></div></div>`;
    await loadFixMatchesFree(lg);
  };

  window._addToBetslip = (teams, league) => {
    if (pMatches.length >= MAX_MATCHES) { toast(`Max mechi ${MAX_MATCHES} (NJEM System)!`,'err'); document.getElementById('fix-modal')?.remove(); return; }
    const leagueObj = LEAGUES.find(l => l.name.toLowerCase().includes(league.toLowerCase().split(' ')[0]));
    const leagueId = leagueObj?.id || 'epl';
    if(leagueId === 'vleague'){ toast('🚫 Vietnam V.League ni BANNED kwenye NJEM System!','err'); return; }
    const newMatch = { ...newM(), teams, league: leagueId };
    pMatches.push(newMatch);
    toast(`✅ ${teams} imeongezwa!`);
    document.getElementById('fix-modal')?.remove();
    showTab('post');
  };
}

// Start/stop live polling
function startLiveScores() {
  if (liveInterval) return;
  liveEnabled = true;
  fetchLiveScores(); // Immediate first fetch

  // Poll every 60s normally; if live matches detected, poll every 30s
  liveInterval = setInterval(async () => {
    await fetchLiveScores();
    checkCashoutAlerts();
    // If live matches exist, schedule an extra fetch in 30s
    const hasLive = Object.values(liveScores).some(s => s.isLive);
    if (hasLive && !liveBoostTimeout) {
      liveBoostTimeout = setTimeout(async () => {
        liveBoostTimeout = null;
        await fetchLiveScores();
      }, 30000);
    }
  }, 60000);

  // Real-time minute counter — increments displayed minute every 60s based on fetchedAt
  liveMinuteInterval = setInterval(() => {
    const now = Date.now();
    let hasLive = false;
    Object.values(liveScores).forEach(s => {
      if (!s.isLive || !s.fetchedAt || s.status === 'HT') return;
      hasLive = true;
      // Estimate current minute based on time elapsed since fetch
      if (s.minuteNum > 0) {
        const elapsedMins = Math.floor((now - s.fetchedAt) / 60000);
        const cap = s.minuteNum <= 45 ? 47 : 95; // allow stoppage time
        s._estimatedMinute = Math.min(s.minuteNum + elapsedMins, cap);
      } else if (s.kickoffMs) {
        // minuteNum haipo — kadiria moja kwa moja kutoka kickoff time
        const elapsedFromKickoff = Math.floor((now - s.kickoffMs) / 60000);
        const cap = s.status === '2H' ? 95 : 47;
        s._estimatedMinute = Math.max(0, Math.min(elapsedFromKickoff, cap));
      } else {
        s._estimatedMinute = s.minuteNum || 0;
      }
      // Mark stale if: estimated min >= 92 AND > 3 min since last fetch
      // OR if > 110 minutes since fetch (match definitely over)
      // OR if status says 2H and estimated min >= 95
      const minsSinceFetch = (now - s.fetchedAt) / 60000;
      if (
        (s._estimatedMinute >= 92 && minsSinceFetch > 3) ||
        (s.status === '2H' && s._estimatedMinute >= 95) ||
        minsSinceFetch > 110
      ) {
        s._staleLive = true;
        s.isLive = false;
        s.isFinished = true;
      }
    });
    if (hasLive && currentTab === 'home') renderLiveSection();
  }, 20000); // Update display every 20s

  console.log('✅ Live scores started — polling every 60s, 30s when live');
}

function stopLiveScores() {
  if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
  if (liveMinuteInterval) { clearInterval(liveMinuteInterval); liveMinuteInterval = null; }
  if (liveBoostTimeout) { clearTimeout(liveBoostTimeout); liveBoostTimeout = null; }
  liveEnabled = false;
}

const STAKE_TIERS = [
  { min: 10000,  max: 35000,  stake: 5000,  label: 'Daraja 1' },
  { min: 35000,  max: 60000,  stake: 7000,  label: 'Daraja 2' },
  { min: 60000,  max: 100000, stake: 10000, label: 'Daraja 3' },
  { min: 100000, max: Infinity, stake: 15000, label: 'Daraja 4' },
];

function getAutoStake(bankroll) {
  for (const tier of STAKE_TIERS) {
    if (bankroll >= tier.min && bankroll < tier.max) return tier;
  }
  if (bankroll < 10000) return { stake: Math.max(1000, Math.floor(bankroll * 0.1 / 500) * 500), label: 'Daraja 0', min: 0, max: 10000 };
  return STAKE_TIERS[STAKE_TIERS.length - 1];
}

function getStakeTierLabel(bankroll) {
  const t = getAutoStake(bankroll);
  return t.label;
}

// Called after every bankroll change — auto-update stake if it changed tier
async function checkAndUpdateAutoStake(newBankroll) {
  if (!currentUser || currentUser.role === 'viewer') return;
  const tier = getAutoStake(newBankroll);
  const oldStake = currentUser.stake || 5000;
  if (tier.stake !== oldStake) {
    await sb.from('users').update({ stake: tier.stake }).eq('id', currentUser.id);
    currentUser.stake = tier.stake;
    localStorage.setItem('njem_session', JSON.stringify(currentUser));
    const tierName = tier.label;
    toast(`📈 Stake imebadilika → TZS ${fmt(tier.stake)} (${tierName})`, 'info');
    // Update header bankroll chip to reflect new daraja
    const bkChip = el('bankroll-val');

    // Show tier badge
    const tierBadge = el('stake-tier-badge');
    if (tierBadge) tierBadge.textContent = tierName;
  }
}

async function idbSet(key, value) {
  try {
    const db = await openIDB();
    const tx = db.transaction('cache', 'readwrite');
    tx.objectStore('cache').put({ key, value, ts: Date.now() });
    return new Promise(r => { tx.oncomplete = r; tx.onerror = r; });
  } catch(e) {}
}
async function idbGet(key) {
  try {
    const db = await openIDB();
    return new Promise((res, rej) => {
      const tx = db.transaction('cache', 'readonly');
      const req = tx.objectStore('cache').get(key);
      req.onsuccess = () => res(req.result?.value ?? null);
      req.onerror = () => res(null);
    });
  } catch(e) { return null; }
}
function openIDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(IDB_DB, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('cache', { keyPath: 'key' });
    req.onsuccess = e => res(e.target.result);
    req.onerror = () => rej(req.error);
  });
}

async function loginUser(user){
  const ls=el('loading-screen');if(ls)ls.style.display='none';
  currentUser=user;
  // Save session to localStorage — inabaki hata ukifunga app
  localStorage.setItem('njem_session', JSON.stringify(user));
  el('auth-screen').style.display='none';el('app').style.display='block';
  // Apply saved theme
  applyTheme();
  await loadData();startRealtime();renderShell();
  // ── URL/Shortcut tab routing ──
  const startupTab = sessionStorage.getItem('startup_tab');
  if (startupTab) { sessionStorage.removeItem('startup_tab'); showTab(startupTab); }
  else { showTab('home'); }
  startLiveScores();
  // ── Share target payload ──
  const sharedPayload = sessionStorage.getItem('shared_payload');
  if (sharedPayload) {
    sessionStorage.removeItem('shared_payload');
    try {
      const { text } = JSON.parse(sharedPayload);
      if (text) { showTab('post'); setTimeout(() => { const ta = document.querySelector('#post-tab textarea,#post-tab input[type=text]'); if (ta) { ta.value = text; ta.dispatchEvent(new Event('input')); } }, 300); }
    } catch {}
  }
  // Auto-stake check on login (silent — no toast if already correct)
  if (currentUser.role !== 'viewer') {
    const tier = getAutoStake(currentUser.bankroll || 0);
    if (tier.stake !== (currentUser.stake || 5000)) {
      await sb.from('users').update({ stake: tier.stake }).eq('id', currentUser.id);
      currentUser.stake = tier.stake;
      localStorage.setItem('njem_session', JSON.stringify(currentUser));
    }
  }
  // Request notification permission proactively at login
  if('Notification' in window && Notification.permission === 'default'){
    setTimeout(() => {
      Notification.requestPermission().then(p => {
        if(p === 'granted') toast('🔔 Notifications zimewashwa!', 'ok');
        else if(p === 'denied') toast('⚠️ Notifications zimezuiwa — washa kwenye browser settings', 'warn');
      });
    }, 2000); // slight delay so user sees the app first
  }
}

// Upload mikeka iliyohifadhiwa offline kwenda Supabase ukipata mtandao
async function syncOfflineQueue() {
  if (!navigator.onLine || !currentUser) return;
  const queue = (await idbGet('offline_queue')) || [];
  if (!queue.length) return;
  let synced = 0;
  const remaining = [];
  for (const mk of queue) {
    try {
      const { matches: mkMatches, _offline, _created, ...mkData } = mk;
      const { error: e1 } = await sb.from('mikeka').insert(mkData);
      if (e1) { remaining.push(mk); continue; }
      const { error: e2 } = await sb.from('matches').insert(mkMatches);
      if (e2) { await sb.from('mikeka').delete().eq('id', mk.id); remaining.push(mk); continue; }
      synced++;
    } catch(e) { remaining.push(mk); }
  }
  await idbSet('offline_queue', remaining);
  if (synced > 0) {
    toast(`✅ Mikeka ${synced} ya offline imesync!`, 'ok');
    await loadData();
    if (currentTab) showTab(currentTab);
  }
}

function getStreak(){
  const s=[...mikeka].filter(m=>m.status!=='PENDING'&&m.status!=='VOID');
  if(!s.length)return{type:'none',count:0};
  const t=s[0].status==='WON'?'WIN':'LOSS';let c=0;
  for(const m of s){if((m.status==='WON')===(t==='WIN'))c++;else break;}
  return{type:t,count:c};
}
function analyzeRisk(matches){
  const flags=[],tips=[];
  const totalOdds=matches.reduce((p,m)=>p*(parseFloat(m.odds)||1),1);

  // ── NJEM System checks ──────────────────────────────────────────────
  matches.forEach(m=>{
    const teams = m.teams || 'Mechi';
    const teamShort = teams.split(' vs ')[0] || teams;

    // Vietnam ban
    if(m.league==='vleague')flags.push({icon:'🚫',msg:`${teamShort}: Vietnam V.League ni BANNED — toa mechi hii!`});

    // H2H check
    const h2hNum=parseInt(m.h2h)||0;
    const h2hMin=m.promoted?2:5;
    if(h2hNum>0&&h2hNum<h2hMin)flags.push({icon:'❌',msg:`${teamShort}: H2H ${h2hNum} — chini ya minimum ${h2hMin}`});
    if(h2hNum===0)flags.push({icon:'⚠️',msg:`${teamShort}: H2H haijajazwa — jaza data`});

    // Form check
    const tf=parseFloat(m.team_form)||0;
    const of=parseFloat(m.opp_form)||0;
    if(tf>0&&of>0&&tf<=of)flags.push({icon:'📉',msg:`${teamShort}: Form ${tf}% ≤ mpinzani ${of}% — timu yako ni duni`});
    if(tf>0&&of>0&&tf>of)tips.push({icon:'✅',msg:`${teamShort}: Form ${tf}% > mpinzani ${of}% — vizuri!`});

    // Odds range
    const odds=parseFloat(m.odds)||0;
    if(odds>0&&odds<1.6)flags.push({icon:'⚠️',msg:`${teamShort}: Odds ${odds} — chini ya 1.60, value si nzuri`});
    if(odds>2.0)flags.push({icon:'🔴',msg:`${teamShort}: Odds ${odds} — juu ya 2.00, hatari kwa NJEM System`});

    // Promoted team
    if(m.promoted)flags.push({icon:'⬆️',msg:`${teamShort}: Timu iliyopanda daraja — H2H data ni pungufu, kuwa makini`});
  });

  // ── General checks ───────────────────────────────────────────────────
  if(matches.length>4)flags.push({icon:'⚠️',msg:`Mechi ${matches.length} — NJEM System max ni 4`});
  if(totalOdds>4)flags.push({icon:'🔴',msg:`Total odds ${totalOdds.toFixed(2)} — kubwa sana kwa Double Chance system`});

  const streak=getStreak();
  if(streak.type==='LOSS'&&streak.count>=2)flags.push({icon:'🚨',msg:`Loss streak ${streak.count} — fikiria vizuri kabla ya kuweka!`});

  const lgMap={};
  mikeka.forEach(mk=>(mk.matches||[]).forEach(match=>{
    if(!lgMap[match.league])lgMap[match.league]={w:0,l:0,t:0};
    lgMap[match.league].t++;
    if(match.outcome==='WIN')lgMap[match.league].w++;
    if(match.outcome==='LOSS')lgMap[match.league].l++;
  }));
  matches.forEach(m=>{
    const lg=lgMap[m.league];
    if(lg&&lg.t>=3){
      const wr=(lg.w/lg.t)*100;
      if(wr<30)flags.push({icon:'📊',msg:`${lgName(m.league)}: Win rate ${wr.toFixed(0)}% — league hii inakuchania!`});
      if(wr>60)tips.push({icon:'✅',msg:`${lgName(m.league)}: Win rate ${wr.toFixed(0)}% — league nzuri kwako!`});
    }
  });
  const mkMap={};
  mikeka.forEach(mk=>(mk.matches||[]).forEach(match=>{
    if(!mkMap[match.market])mkMap[match.market]={w:0,t:0};
    mkMap[match.market].t++;
    if(match.outcome==='WIN')mkMap[match.market].w++;
  }));
  const best=Object.entries(mkMap).filter(([,v])=>v.t>=3).sort((a,b)=>(b[1].w/b[1].t)-(a[1].w/a[1].t))[0];
  if(best)tips.push({icon:'💡',msg:`Market bora kwako: ${best[0]} (${((best[1].w/best[1].t)*100).toFixed(0)}% win)`});
  return{flags,tips,totalOdds};
}
async function ocrImage(base64,mimeType){
  if(!GEMINI_KEY){toast('Weka OpenRouter API key kwenye Admin → Settings','err');return[];}
  try{
    const url='https://openrouter.ai/api/v1/chat/completions';
    const body={
      model:'meta-llama/llama-3.2-11b-vision-instruct:free',
      messages:[{
        role:'user',
        content:[
          {type:'text',text:`You are a sports betting slip reader. Extract ALL matches from this betslip image.
Return ONLY a valid JSON array, nothing else, no markdown:
[{"teams":"Team A vs Team B","market":"Double Chance","pick":"1X","odds":"1.75"}]
Always return valid JSON array even if unsure.`},
          {type:'image_url',image_url:{url:'data:'+mimeType+';base64,'+base64}}
        ]
      }],
      max_tokens:1000,
      temperature:0.1
    };
    const res=await fetch(url,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+GEMINI_KEY,
        'HTTP-Referer':'https://76tipps.netlify.app',
        'X-Title':'76TIPPS'
      },
      body:JSON.stringify(body)
    });
    if(!res.ok){
      const err=await res.json();
      toast('OpenRouter error: '+(err.error?.message||res.status),'err');
      return[];
    }
    const data=await res.json();
    const text=data.choices?.[0]?.message?.content||'[]';
    const clean=text.replace(/```json|```/g,'').trim();
    const match=clean.match(/\[[\s\S]*\]/);
    if(!match){toast('Mechi hazipatikani kwenye picha','warn');return[];}
    return JSON.parse(match[0]);
  }catch(e){
    console.error('OCR error:',e);
    toast('OCR imeshindwa: '+e.message,'err');
    return[];
  }
}

        ${nextTier ? `<span style="font-size:10px;color:var(--muted)">Daraja lijalo @ TZS ${fmt(nextTier.min)}</span>` : '<span style="font-size:10px;color:var(--win)">🏆 Kiwango cha juu!</span>'}

      <div style="margin-bottom:1rem">
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">

            const active = currentUser.bankroll >= t.min && currentUser.bankroll < t.max;
            const reached = currentUser.bankroll >= t.min;
            return `<div style="background:${active?'rgba(0,255,133,.2)':reached?'rgba(0,255,133,.06)':'rgba(0,0,0,.2)'};border:1px solid ${active?'var(--accent)':reached?'rgba(0,255,133,.3)':'var(--border)'};border-radius:10px;padding:.5rem .3rem;text-align:center">
              <div style="font-size:9px;color:${active?'var(--accent)':'var(--muted)'};font-weight:700">${t.label}</div>
              <div style="font-size:10px;font-weight:700;color:${active?'var(--win)':reached?'var(--text)':'var(--muted)'}">TZS ${fmt(t.stake)}</div>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="grid-2" style="margin-bottom:1rem">
        <button onclick="window._bkAction('add')" style="padding:.75rem;border-radius:12px;border:none;background:var(--win);color:#000;font-weight:700;cursor:pointer;font-size:14px">➕ Ongeza</button>
        <button onclick="window._bkAction('withdraw')" style="padding:.75rem;border-radius:12px;border:none;background:var(--danger);color:#fff;font-weight:700;cursor:pointer;font-size:14px">➖ Toa</button>
      </div>
      <div id="bk-area"></div>
      <button onclick="this.closest('.modal-overlay').remove()" style="width:100%;padding:.65rem;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:13px;margin-top:.5rem">Funga</button>
    </div>`;
  document.body.appendChild(ov);ov.onclick=(e)=>{if(e.target===ov)ov.remove();};
  window._bkAction=(type)=>{
    el('bk-area').innerHTML=`
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px">${type==='add'?'Kiasi cha Kuongeza':'Kiasi cha Kutoa'} (TZS)</div>
      <input class="inp" id="bk-amt" type="number" placeholder="e.g. 10000" style="margin-bottom:8px"/>
      <input class="inp" id="bk-note" placeholder="Maelezo (Deposit / Withdraw)" style="margin-bottom:10px"/>
      <button onclick="window._bkConfirm('${type}')" style="width:100%;padding:.75rem;border-radius:12px;border:none;background:${type==='add'?'var(--win)':'var(--danger)'};color:${type==='add'?'#000':'#fff'};font-weight:700;cursor:pointer">${type==='add'?'Ongeza':'Toa'}</button>`;
  };
  window._bkConfirm=async(type)=>{
    const amt=parseFloat(el('bk-amt')?.value||0);
    if(!amt||amt<=0)return toast('Weka kiasi sahihi!','err');
    if(type==='withdraw'&&amt>currentUser.bankroll)return toast('Huna pesa za kutosha!','err');
    const newBk=type==='add'?currentUser.bankroll+amt:currentUser.bankroll-amt;
    await updateUser({bankroll:newBk});
    await sb.from('transactions').insert({id:uid(),user_id:currentUser.id,type,amount:amt,note:el('bk-note')?.value||'',balance_after:newBk}).catch(()=>{});
    toast(type==='add'?`✅ Imeongezwa TZS ${fmt(amt)}`:`✅ Imetolewa TZS ${fmt(amt)}`);
    ov.remove();showTab(currentTab);
  };
}

    const k = s.homeTeam + s.awayTeam;
    if (seen.has(k)) return false;
    seen.add(k); return true;

  const liveOnly = unique.filter(s => s.isLive && !s._staleLive);
  const staleLive = unique.filter(s => s.isLive && s._staleLive); // treat as finished

  const finished = [...unique.filter(s => s.isFinished), ...staleLive].slice(0, 30);

      </span>
    </div>
    ${(liveOnly.length||upcoming.length||finished.length)?'<div style="font-size:10px;color:var(--muted);margin-bottom:8px;padding:.4rem .6rem;background:rgba(0,0,0,.25);border-radius:8px">📡 Data: TheSportsDB — score inaweza kuchelewa hadi dakika 3-5. Gusa mechi kwa statistics.</div>':''}
    <div style="display:flex;flex-direction:column;gap:6px">
      ${displayMatches.map(s => matchCard(s)).join('')}
    </div>
    ${!displayMatches.length && !finished.length ? `
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem 1rem;text-align:center">
        <div style="font-size:40px;margin-bottom:10px">⚽</div>
        <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px">Hamna Live Match Kwa Sasa</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Hakuna mechi zinazochezwa sasa hivi. Angalia Fixtures kwa mechi zinazosubiri.</div>

      </div>` : ''}

    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:12px 0 6px">✅ Zimekwisha Leo (${finished.length})</div>
    <div style="display:flex;flex-direction:column;gap:5px">
      ${finished.map(s => matchCard(s)).join('')}
    </div>` : ''}
  `;
}
