<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NJEM BET APP</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#06110b;
  --surface:#0d1b13;
  --card:#102016;
  --border:#183322;
  --accent:#00ff85;
  --text:#f5fff8;
  --muted:#7fa58f;
  --danger:#ff4d4d;
  --warn:#ffaa00;
  --info:#4da6ff;
  --win:#00ff85;
  --loss:#ff4d4d;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
}

.hidden{
  display:none!important;
}

.app{
  max-width:700px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(6,17,11,.95);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:1rem;
}

.logo{
  font-family:'Syne',sans-serif;
  font-size:24px;
  font-weight:800;
  color:var(--accent);
}

.page{
  padding:1rem;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:18px;
  padding:1rem;
  margin-bottom:1rem;
}

.inp,
.inp-sm,
textarea,
select{
  width:100%;
  background:#08140d;
  border:1px solid var(--border);
  color:var(--text);
  padding:.9rem;
  border-radius:12px;
  outline:none;
}

.inp-sm{
  padding:.7rem;
  font-size:13px;
}

textarea{
  resize:none;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.btn-primary{
  width:100%;
  border:none;
  background:var(--accent);
  color:#00150b;
  font-weight:800;
  padding:1rem;
  border-radius:14px;
  cursor:pointer;
}

.btn-outline{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  padding:.7rem 1rem;
  border-radius:12px;
  cursor:pointer;
}

.btn-ghost{
  background:rgba(0,255,133,.08);
  border:1px solid rgba(0,255,133,.2);
  color:var(--accent);
  padding:.7rem 1rem;
  border-radius:12px;
  cursor:pointer;
  width:100%;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:rgba(6,17,11,.97);
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-around;
  padding:.8rem 0;
  z-index:100;
}

.nav-btn{
  background:none;
  border:none;
  color:var(--muted);
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  cursor:pointer;
}

.nav-btn.active{
  color:var(--accent);
}

.stat-box{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:1rem;
  text-align:center;
}

.stat-icon{
  font-size:22px;
  margin-bottom:8px;
}

.stat-val{
  font-size:18px;
  font-weight:800;
}

.stat-label{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.auth-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1rem;
}

.auth-card{
  width:100%;
  max-width:420px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:24px;
  padding:1.5rem;
}

.empty{
  padding:2rem;
  text-align:center;
  color:var(--muted);
}

.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#0f2217;
  border:1px solid var(--border);
  color:var(--text);
  padding:.9rem 1rem;
  border-radius:12px;
  z-index:9999;
}

.progress{
  height:8px;
  background:#08140d;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  background:var(--accent);
}

</style>
</head>

<body>

<div id="auth" class="auth-wrap">
  <div class="auth-card">

    <div style="text-align:center;margin-bottom:1.5rem">
      <div class="logo">NJEM BET</div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">
        Smart Betting Community
      </div>
    </div>

    <div id="login-box">

      <input class="inp" id="login-phone" placeholder="Namba ya simu" style="margin-bottom:10px"/>

      <input class="inp" id="login-pass" type="password" placeholder="Password" style="margin-bottom:10px"/>

      <button class="btn-primary" onclick="login()">
        LOGIN
      </button>

      <div style="margin-top:15px;text-align:center">
        <button onclick="showRegister()" style="background:none;border:none;color:var(--accent);cursor:pointer">
          Fungua Account
        </button>
      </div>

    </div>

    <div id="register-box" class="hidden">

      <input class="inp" id="reg-name" placeholder="Jina" style="margin-bottom:10px"/>

      <input class="inp" id="reg-phone" placeholder="Namba ya simu" style="margin-bottom:10px"/>

      <input class="inp" id="reg-pass" type="password" placeholder="Password" style="margin-bottom:10px"/>

      <button class="btn-primary" onclick="registerUser()">
        CREATE ACCOUNT
      </button>

      <div style="margin-top:15px;text-align:center">
        <button onclick="showLogin()" style="background:none;border:none;color:var(--accent);cursor:pointer">
          Tayari nina account
        </button>
      </div>

    </div>

  </div>
</div>

<div id="app" class="app hidden">

  <div class="topbar">
    <div style="display:flex;justify-content:space-between;align-items:center">

      <div>
        <div class="logo">NJEM BET</div>
        <div style="font-size:11px;color:var(--muted)" id="welcome"></div>
      </div>

      <button onclick="logout()" class="btn-outline">
        Logout
      </button>

    </div>
  </div>

  <div id="content" class="page"></div>

  <div class="bottom-nav">

    <button class="nav-btn active" onclick="showTab('feed')" id="nav-feed">
      <div>📡</div>
      <span>Feed</span>
    </button>

    <button class="nav-btn" onclick="showTab('post')" id="nav-post">
      <div>➕</div>
      <span>Post</span>
    </button>

    <button class="nav-btn" onclick="showTab('mikeka')" id="nav-mikeka">
      <div>📋</div>
      <span>Mikeka</span>
    </button>

    <button class="nav-btn" onclick="showTab('reports')" id="nav-reports">
      <div>📊</div>
      <span>Reports</span>
    </button>

    <button class="nav-btn" onclick="showTab('admin')" id="nav-admin">
      <div>⚙️</div>
      <span>Admin</span>
    </button>

  </div>

</div>

<script>

const SUPABASE_URL = "WEKA_SUPABASE_URL";
const SUPABASE_KEY = "WEKA_SUPABASE_ANON_KEY";

const sb = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let currentUser = null;
let mikeka = [];

const LEAGUES = [
  {id:'epl',name:'England Premier League',flag:'🏴'},
  {id:'laliga',name:'Spain La Liga',flag:'🇪🇸'},
  {id:'seriea',name:'Italy Serie A',flag:'🇮🇹'},
  {id:'bundesliga',name:'Germany Bundesliga',flag:'🇩🇪'},
  {id:'ligue1',name:'France Ligue 1',flag:'🇫🇷'},
  {id:'ucl',name:'UEFA Champions League',flag:'🇪🇺'},
  {id:'caf',name:'CAF Champions League',flag:'🌍'},
  {id:'saudi',name:'Saudi Pro League',flag:'🇸🇦'},
  {id:'mls',name:'MLS',flag:'🇺🇸'},
  {id:'brazil',name:'Brazil Serie A',flag:'🇧🇷'},
  {id:'argentina',name:'Argentina Liga',flag:'🇦🇷'},
  {id:'tanzania',name:'NBC Premier League',flag:'🇹🇿'},
  {id:'kenya',name:'Kenya Premier League',flag:'🇰🇪'},
  {id:'uganda',name:'Uganda Premier League',flag:'🇺🇬'},
  {id:'southafrica',name:'PSL South Africa',flag:'🇿🇦'}
];

const MARKETS = [
  '1X2',
  'Double Chance',
  'Over 1.5',
  'Over 2.5',
  'Under 2.5',
  'BTTS YES',
  'BTTS NO'
];

function uid(){
  return Math.random().toString(36).slice(2);
}

function fmt(n){
  return Number(n || 0).toLocaleString();
}

function el(id){
  return document.getElementById(id);
}

function toast(msg){
  const d = document.createElement('div');
  d.className='toast';
  d.innerText=msg;
  document.body.appendChild(d);

  setTimeout(()=>{
    d.remove();
  },2500);
}

function today(){
  return new Date().toISOString().split('T')[0];
}

function showRegister(){
  el('login-box').classList.add('hidden');
  el('register-box').classList.remove('hidden');
}

function showLogin(){
  el('register-box').classList.add('hidden');
  el('login-box').classList.remove('hidden');
}

async function registerUser(){

  const name = el('reg-name').value;
  const phone = el('reg-phone').value;
  const pass = el('reg-pass').value;

  if(!name || !phone || !pass){
    return toast('Jaza taarifa zote');
  }

  const user = {
    id:uid(),
    name,
    phone,
    password:pass,
    role:'owner',
    bankroll:100000
  };

  const {error} = await sb.from('users').insert(user);

  if(error){
    return toast(error.message);
  }

  toast('Account imefunguliwa');

  showLogin();
}

async function login(){

  const phone = el('login-phone').value;
  const password = el('login-pass').value;

  const {data,error} = await sb
  .from('users')
  .select('*')
  .eq('phone',phone)
  .eq('password',password)
  .maybeSingle();

  if(error || !data){
    return toast('Login imekataa');
  }

  currentUser = data;

  localStorage.setItem('njem_session',JSON.stringify(data));

  startApp();
}

function logout(){

  localStorage.removeItem('njem_session');

  location.reload();
}

async function checkSession(){

  const saved = localStorage.getItem('njem_session');

  if(!saved){
    return;
  }

  currentUser = JSON.parse(saved);

  startApp();
}

async function startApp(){

  el('auth').classList.add('hidden');

  el('app').classList.remove('hidden');

  el('welcome').innerText = currentUser.name;

  await loadData();

  showTab('feed');
}

async function loadData(){

  const {data} = await sb
  .from('mikeka')
  .select('*')
  .order('created_at',{ascending:false});

  mikeka = data || [];
}

function showTab(tab){

  document.querySelectorAll('.nav-btn').forEach(n=>{
    n.classList.remove('active');
  });

  el('nav-'+tab).classList.add('active');

  if(tab==='feed'){
    renderFeed();
  }

  if(tab==='post'){
    renderPost();
  }

  if(tab==='mikeka'){
    renderMikeka();
  }

  if(tab==='reports'){
    renderReports();
  }

  if(tab==='admin'){
    renderAdmin();
  }
}

function renderFeed(){

  el('content').innerHTML = `
  
  <div class="card">
    <div style="font-size:20px;font-weight:800;font-family:'Syne'">
      📡 Public Feed
    </div>
  </div>

  ${mikeka.length===0 ? `
  
    <div class="empty">
      Hakuna mikeka bado
    </div>

  ` : mikeka.map(m=>`

    <div class="card">

      <div style="display:flex;justify-content:space-between;margin-bottom:10px">

        <div>
          <div style="font-weight:700">
            ${m.name}
          </div>

          <div style="font-size:11px;color:var(--muted)">
            ${m.date}
          </div>
        </div>

        <div style="color:var(--accent);font-weight:800">
          ${Number(m.total_odds || 1).toFixed(2)}x
        </div>

      </div>

      <div style="font-size:12px;color:var(--muted)">
        Stake: TZS ${fmt(m.stake)}
      </div>

      <div style="margin-top:5px;font-size:14px;font-weight:700;color:var(--win)">
        Return: TZS ${fmt(m.potential_return)}
      </div>

    </div>

  `).join('')}

  `;
}

function renderPost(){

  el('content').innerHTML = `

  <div class="card">

    <div style="font-size:20px;font-weight:800;font-family:'Syne';margin-bottom:1rem">
      ➕ Mkeka Mpya
    </div>

    <input class="inp" id="mk-name" placeholder="Jina la mkeka" style="margin-bottom:10px"/>

    <div class="grid-2" style="margin-bottom:10px">

      <input class="inp-sm" id="mk-date" type="date" value="${today()}"/>

      <input class="inp-sm" id="mk-stake" type="number" placeholder="Stake"/>

    </div>

    <div id="matches"></div>

    <button onclick="addMatch()" class="btn-outline" style="width:100%;margin-bottom:10px">
      + Add Match
    </button>

    <button onclick="saveMkeka()" class="btn-primary">
      SAVE MIKEKA
    </button>

  </div>

  `;

  addMatch();
}

let matchCount = 0;

function addMatch(){

  matchCount++;

  const div = document.createElement('div');

  div.className='card';

  div.innerHTML = `

    <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:10px">
      Match ${matchCount}
    </div>

    <input class="inp-sm teams" placeholder="Team A vs Team B" style="margin-bottom:8px"/>

    <div class="grid-2" style="margin-bottom:8px">

      <select class="inp-sm league">

        ${LEAGUES.map(l=>`
          <option value="${l.id}">
            ${l.flag} ${l.name}
          </option>
        `).join('')}

      </select>

      <select class="inp-sm market">

        ${MARKETS.map(m=>`
          <option>${m}</option>
        `).join('')}

      </select>

    </div>

    <div class="grid-2">

      <input class="inp-sm pick" placeholder="Pick"/>

      <input class="inp-sm odds" type="number" step="0.01" placeholder="Odds"/>

    </div>

  `;

  el('matches').appendChild(div);
}

async function saveMkeka(){

  const name = el('mk-name').value;
  const date = el('mk-date').value;
  const stake = Number(el('mk-stake').value);

  const cards = document.querySelectorAll('#matches .card');

  const matches = [];

  let totalOdds = 1;

  cards.forEach(c=>{

    const teams = c.querySelector('.teams').value;
    const league = c.querySelector('.league').value;
    const market = c.querySelector('.market').value;
    const pick = c.querySelector('.pick').value;
    const odds = Number(c.querySelector('.odds').value);

    totalOdds *= odds;

    matches.push({
      teams,
      league,
      market,
      pick,
      odds
    });

  });

  const payload = {
    id:uid(),
    user_id:currentUser.id,
    name,
    date,
    stake,
    matches,
    total_odds:totalOdds,
    potential_return:Math.round(totalOdds * stake),
    status:'PENDING'
  };

  const {error} = await sb
  .from('mikeka')
  .insert(payload);

  if(error){
    return toast(error.message);
  }

  toast('Mkeka umehifadhiwa');

  await loadData();

  showTab('feed');
}

function renderMikeka(){

  el('content').innerHTML = `

    <div class="card">

      <div style="font-size:20px;font-weight:800;font-family:'Syne';margin-bottom:1rem">
        📋 Mikeka
      </div>

      ${mikeka.map(m=>`

        <div style="padding:1rem;border:1px solid var(--border);border-radius:14px;margin-bottom:10px">

          <div style="display:flex;justify-content:space-between">

            <div>
              <div style="font-weight:700">${m.name}</div>

              <div style="font-size:11px;color:var(--muted)">
                ${m.date}
              </div>
            </div>

            <div style="color:var(--accent);font-weight:800">
              ${Number(m.total_odds).toFixed(2)}x
            </div>

          </div>

        </div>

      `).join('')}

    </div>

  `;
}

function renderReports(){

  const won = mikeka.filter(m=>m.status==='WON').length;
  const lost = mikeka.filter(m=>m.status==='LOST').length;

  const staked = mikeka.reduce((a,b)=>a+Number(b.stake || 0),0);

  const returned = mikeka
  .filter(m=>m.status==='WON')
  .reduce((a,b)=>a+Number(b.potential_return || 0),0);

  const profit = returned - staked;

  el('content').innerHTML = `

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">

      <div class="stat-box">
        <div class="stat-icon">📋</div>
        <div class="stat-val">${mikeka.length}</div>
        <div class="stat-label">Mikeka</div>
      </div>

      <div class="stat-box">
        <div class="stat-icon">🏆</div>
        <div class="stat-val">${won}</div>
        <div class="stat-label">Wins</div>
      </div>

      <div class="stat-box">
        <div class="stat-icon">❌</div>
        <div class="stat-val">${lost}</div>
        <div class="stat-label">Losses</div>
      </div>

      <div class="stat-box">
        <div class="stat-icon">💰</div>
        <div class="stat-val">${fmt(profit)}</div>
        <div class="stat-label">Profit</div>
      </div>

    </div>

  `;
}

async function renderAdmin(){

  const {data} = await sb
  .from('users')
  .select('*');

  el('content').innerHTML = `

    <div class="card">

      <div style="font-size:20px;font-weight:800;font-family:'Syne';margin-bottom:1rem">
        ⚙️ Admin
      </div>

      ${(data || []).map(u=>`

        <div style="display:flex;justify-content:space-between;padding:1rem 0;border-bottom:1px solid var(--border)">

          <div>

            <div style="font-weight:700">
              ${u.name}
            </div>

            <div style="font-size:11px;color:var(--muted)">
              ${u.phone}
            </div>

          </div>

          <div style="color:var(--accent);font-weight:700">
            ${u.role}
          </div>

        </div>

      `).join('')}

    </div>

  `;
}

checkSession();

if('serviceWorker' in navigator){

  navigator.serviceWorker.register('/sw.js');

}

</script>

</body>
</html>
