<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NJEM Tipps v2.0</title>
  <meta name="theme-color" content="#00ff85"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#05110a;--surface:#0c1f13;--border:#1a3522;
      --accent:#00ff85;--text:#e4f0e8;--muted:#4a7a5a;
    }
    body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh}
    .header{background:rgba(12,31,19,.97);border-bottom:1px solid var(--border);padding:.85rem 1.1rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
    .header-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;color:var(--accent)}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1rem;margin-bottom:.75rem}
    .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:rgba(12,31,19,.97);border-top:1px solid var(--border);display:flex;z-index:100}
    .nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.6rem .2rem}
    .nav-label{font-size:9px;color:var(--muted)}
    .nav-label.active{color:var(--accent);font-weight:700}
    #toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
    .toast{padding:.7rem 1rem;border-radius:12px;font-weight:600;font-size:13px;max-width:260px;background:#0c1f13;border:1px solid var(--accent)}
    .live-dot{width:9px;height:9px;background:#ff4444;border-radius:50%;display:inline-block;margin-right:6px;animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  </style>
</head>
<body>
<div id="toast-container"></div>

<div id="loading-screen" style="min-height:100vh;background:#05110a;display:flex;flex-direction:column;align-items:center;justify-content:center">
  <div style="font-family:'Syne',sans-serif;font-size:24px;color:#00ff85">NJEM TIPPS</div>
  <p style="color:#4a7a5a;margin-top:10px">Inapakia mechi za live...</p>
</div>

<div id="app" style="display:none;max-width:500px;margin:0 auto;min-height:100vh;padding-bottom:80px">
  <div class="header">
    <div class="header-title">NJEM TIPPS v2.0</div>
    <div id="bankroll-display" style="background:rgba(0,0,0,.4);padding:6px 12px;border-radius:20px;font-size:13px">Bankroll: TZS 125,000</div>
  </div>

  <div id="content" style="padding:1rem"></div>

  <div class="bottom-nav">
    <button class="nav-btn" onclick="switchTab('home')"><span class="nav-label active" id="nav-home">Home</span></button>
    <button class="nav-btn" onclick="switchTab('fixtures')"><span class="nav-label" id="nav-fixtures">Fixtures</span></button>
    <button class="nav-btn" onclick="switchTab('mikeka')"><span class="nav-label" id="nav-mikeka">Mikeka Yangu</span></button>
    <button class="nav-btn" onclick="switchTab('public')"><span class="nav-label" id="nav-public">Public</span></button>
  </div>
</div>

<script>
let currentTab = 'home';
let liveScores = {};

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

async function fetchLiveScores() {
  try {
    const today = new Date().toISOString().split('T')[0];
    const res = await fetch(`https://www.thesportsdb.com/api/v1/json/447279/eventsday.php?d=${today}&s=Soccer`);
    
    if (res.ok) {
      const data = await res.json();
      const events = data.events || [];
      
      liveScores = {};

      events.forEach(ev => {
        if (!ev.strHomeTeam || !ev.strAwayTeam) return;

        const key = `${ev.strHomeTeam} vs ${ev.strAwayTeam}`.toLowerCase().trim();
        const status = (ev.strStatus || '').toUpperCase().trim();
        const progress = (ev.strProgress || '').toUpperCase();

        // Logic iliyoboreshwa sana
        let isLive = false;
        let minute = '';

        if (status.includes('1H') || status.includes('2H') || status.includes('HT') || 
            status.includes('ET') || status.includes('LIVE') || status.includes('IN PROGRESS') ||
            progress.includes('1H') || progress.includes('2H')) {
          isLive = true;
          minute = ev.strProgress || 'LIVE';
        }

        const isFinished = status.includes('FT') || status.includes('AET') || 
                          status.includes('PEN') || status.includes('FINISHED') || 
                          status.includes('MATCH FINISHED');

        if (isLive && !isFinished) {
          liveScores[key] = {
            home: ev.intHomeScore !== null ? ev.intHomeScore : 0,
            away: ev.intAwayScore !== null ? ev.intAwayScore : 0,
            minute: minute,
            league: ev.strLeague || 'Unknown',
            isLive: true
          };
        }
      });
    }
    
    if (currentTab === 'home') renderHome();
  } catch(e) {
    console.error(e);
  }
}

function renderHome() {
  let html = `<h2 style="margin-bottom:15px"><span class="live-dot"></span> Live Scores</h2>`;

  const liveKeys = Object.keys(liveScores);

  if (liveKeys.length === 0) {
    html += `<p style="text-align:center;padding:80px 20px;color:#4a7a5a">
      Hakuna mechi za live kwa sasa 😔<br>
      <small>Jaribu tena baada ya dakika chache</small>
    </p>`;
  } else {
    liveKeys.forEach(key => {
      const m = liveScores[key];
      html += `
        <div class="card">
          <small style="color:#4a7a5a">${m.league}</small><br>
          <strong>${key}</strong><br>
          <span style="font-size:21px;font-weight:700">${m.home} - ${m.away}</span>
          <span style="float:right;color:#00ff85;font-weight:700">${m.minute}</span>
        </div>`;
    });
  }
  document.getElementById('content').innerHTML = html;
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-label').forEach(el => el.classList.remove('active'));
  const active = document.getElementById('nav-' + tab);
  if (active) active.classList.add('active');

  if (tab === 'home') renderHome();
  else document.getElementById('content').innerHTML = `<h2 style="padding:20px">${tab.toUpperCase()} - Inakuja hivi karibuni</h2>`;
}

function initApp() {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  
  switchTab('home');
  fetchLiveScores();
  setInterval(fetchLiveScores, 25000);   // Refresh kila sekunde 25
}

window.onload = initApp;
</script>
</body>
</html>
