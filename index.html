async function footballdataFetch(endpoint) {
  if (!FOOTBALLDATA_KEY) return null;
  try {
    const url = `https://api.football-data.org/v4/${endpoint.replace(/^\//, '')}`;
    const res = await fetch(url, { headers: { 'X-Auth-Token': FOOTBALLDATA_KEY } });
    if (res.status === 429) { console.warn('football-data.org rate limit'); return { _rateLimit: true }; }
    if (!res.ok) { console.warn('football-data.org HTTP', res.status); return null; }
    return await res.json();
  } catch(e) { console.warn('football-data.org fetch:', e.message); return null; }
}

function normaliseFootballData(match, nowMs) {
  const home = match.homeTeam?.name;
  const away = match.awayTeam?.name;
  if (!home || !away) return null;
  const st = match.status || 'TIMED';
  // football-data statuses: TIMED, SCHEDULED, IN_PLAY, PAUSED, FINISHED, POSTPONED, SUSPENDED, CANCELLED
  const isLive = ['IN_PLAY','PAUSED'].includes(st);
  const isFinished = ['FINISHED'].includes(st);
  const minuteNum = match.minute || 0;
  let minuteDisplay = '';
  if (st === 'PAUSED') { minuteDisplay = 'HT'; }
  else if (isLive && minuteNum) { minuteDisplay = minuteNum + "'"; }
  else if (isLive) { minuteDisplay = 'LIVE'; }
  else if (isFinished) { minuteDisplay = 'FT'; }
  const hg = match.score?.fullTime?.home ?? (isLive ? (match.score?.halfTime?.home ?? '-') : '-');
  const ag = match.score?.fullTime?.away ?? (isLive ? (match.score?.halfTime?.away ?? '-') : '-');
  return {
    home: hg, away: ag,
    homeTeam: home, awayTeam: away,
    minute: minuteDisplay, minuteNum, status: st,
    league: match.competition?.name || '', leagueLogo: '',
    country: match.area?.name || '',
    fixtureId: match.id,
    time: match.utcDate ? (() => {
      try {
        const d = new Date(match.utcDate);
        const eat = new Date(d.getTime() + 3 * 60 * 60 * 1000);
        return eat.toTimeString().slice(0,5);
      } catch { return ''; }
    })() : '',
    date: match.utcDate?.split('T')[0] || '',
    fetchedAt: nowMs, isLive, isFinished,
    isUpcoming: !isLive && !isFinished, _src: 'footballdata',
  };
}

// ── 1. API-Football (api-sports.io) ──────────────────────────────────
async function apifootballFetch(endpoint) {
  if (!APISPORTS_KEY) return null;
  try {
    const url = `https://v3.football.api-sports.io${endpoint.startsWith('/') ? endpoint : '/' + endpoint}`;
    const res = await fetch(url, { headers: { 'x-apisports-key': APISPORTS_KEY } });
    if (!res.ok) { console.warn('API-Football HTTP', res.status, url); return null; }
    const json = await res.json();
    if (json.errors && Object.keys(json.errors).length > 0) {
      const errs = JSON.stringify(json.errors);
      // rateLimit error — inform but don't crash
      if (errs.includes('rateLimit') || errs.includes('requests')) {
        console.warn('API-Football rate limit hit');
        return { _rateLimit: true, response: [] };
      }
      console.warn('API-Football errors:', errs);
      return null;
    }
    return json;
  } catch(e) { console.warn('API-Football exception:', e.message); return null; }
}
// alias used in match details modal
async function apiSportsFetch(endpoint) { return apifootballFetch(endpoint); }
async function apiSports(endpoint)      { return apifootballFetch(endpoint); }

// ── 2. AllSports API ─────────────────────────────────────────────────
async function allsportsFetch(endpoint) {
  if (!ALLSPORTS_KEY) return null;
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 10000);
  try {
    const base = 'https://apiv2.allsportsapi.com/football/';
    const sep  = endpoint.includes('?') ? '&' : '?';
    const url  = `${base}${endpoint}${sep}APIkey=${ALLSPORTS_KEY}`;
    const res  = await fetch(url, { signal: controller.signal });
    clearTimeout(timeout);
    if (!res.ok) { console.warn('AllSports HTTP', res.status); return null; }
    return await res.json();
  } catch(e) {
    clearTimeout(timeout);
    if (e.name === 'AbortError') console.warn('AllSports timeout — request ilikuwa polepole sana');
    else console.warn('AllSports exception:', e.message);
    return null;
  }
}

// ── 3. Sportmonks API ────────────────────────────────────────────────
async function sportmonksFetch(endpoint) {
  if (!SPORTMONKS_KEY) return null;
  try {
    const base = 'https://api.sportmonks.com/v3/football/';
    const sep  = endpoint.includes('?') ? '&' : '?';
    const url  = `${base}${endpoint}${sep}api_token=${SPORTMONKS_KEY}`;
    const res  = await fetch(url);
    if (!res.ok) { console.warn('Sportmonks HTTP', res.status); return null; }
    const json = await res.json();
    if (json.message && json.message.includes('token')) {
      console.warn('Sportmonks auth error:', json.message);
      return null;
    }
    return json;
  } catch(e) { console.warn('Sportmonks exception:', e.message); return null; }
}

function normaliseSportmonks(fix, nowMs) {
  const home = fix.participants?.find(p => p.meta?.location === 'home')?.name;
  const away = fix.participants?.find(p => p.meta?.location === 'away')?.name;
  if (!home || !away) return null;
  const statusShort = fix.state?.short_name || fix.state?.state || 'NS';
  const liveStates  = ['1H','2H','HT','ET','BT','PEN','INT','LIVE'];
  const finStates   = ['FT','AET','PENFT','FT_PEN','CANCL','ABD','POSTP'];
  const isLive     = liveStates.includes(statusShort) || (fix.state?.state === 'inprogress');
  const isFinished = finStates.some(s => statusShort.startsWith(s));
  const elapsed    = fix.periods?.find(p => p.tba === false)?.minutes || fix.minute;
  let minuteDisplay = '', minuteNum = 0;
  if (statusShort === 'HT') { minuteDisplay = 'HT'; minuteNum = 45; }
  else if (isLive && elapsed) { minuteNum = parseInt(elapsed)||0; minuteDisplay = minuteNum + "'"; }
  else if (isFinished) { minuteDisplay = 'FT'; }
  const homeLogo = fix.participants?.find(p => p.meta?.location === 'home')?.image_path || '';
  const awayLogo = fix.participants?.find(p => p.meta?.location === 'away')?.image_path || '';
  const hScore   = fix.scores?.find(s => s.score?.participant === 'home' && s.description === 'CURRENT');
  const aScore   = fix.scores?.find(s => s.score?.participant === 'away' && s.description === 'CURRENT');
  const startAt  = fix.starting_at ? new Date(fix.starting_at) : null;
  const timeStr  = startAt ? startAt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
  const dateStr  = fix.starting_at?.split(' ')[0] || fix.starting_at?.split('T')[0] || '';
  return {
    home: hScore?.score?.goals ?? '-',
    away: aScore?.score?.goals ?? '-',
    homeTeam: home, awayTeam: away,
    homeLogo, awayLogo,
    minute: minuteDisplay, minuteNum, status: statusShort,
    league: fix.league?.name || '', leagueLogo: fix.league?.image_path || '',
    country: fix.league?.country?.name || '',
    fixtureId: fix.id,
    venue: fix.venue?.name || '',
    time: timeStr, date: dateStr,
    fetchedAt: nowMs, isLive, isFinished,
    isUpcoming: !isLive && !isFinished, _src: 'sportmonks',
  };
}

// ── Normalise a fixture from any source into a common scoreData object ─
function normaliseApifootball(fix, nowMs) {
  const home = fix.teams?.home?.name;

  if (!home || !away) return null;
  const elapsed    = fix.fixture?.status?.elapsed;
  const statusShort= fix.fixture?.status?.short || 'NS';
  const isLive     = ['1H','2H','HT','ET','BT','P','INT'].includes(statusShort);
  const isFinished = ['FT','AET','PEN'].includes(statusShort);
  let minuteDisplay = '', minuteNum = 0;
  if (statusShort === 'HT') { minuteDisplay = 'HT'; minuteNum = 45; }
  else if (isLive && elapsed) { minuteNum = elapsed; minuteDisplay = elapsed + "'"; }
  else if (isFinished) { minuteDisplay = 'FT'; }
  return {
    home: fix.goals?.home ?? '-', away: fix.goals?.away ?? '-',
    homeTeam: home, awayTeam: away,
    homeLogo: fix.teams?.home?.logo || '', awayLogo: fix.teams?.away?.logo || '',
    minute: minuteDisplay, minuteNum, status: statusShort,
    statusLong: fix.fixture?.status?.long || '',
    league: fix.league?.name || '', leagueLogo: fix.league?.logo || '',
    country: fix.league?.country || '', fixtureId: fix.fixture?.id,
    venue: fix.fixture?.venue?.name || '',

    date: fix.fixture?.date?.split('T')[0] || '',
    fetchedAt: nowMs, isLive, isFinished,
    isUpcoming: !isLive && !isFinished, _src: 'apifootball',
  };
}

function normaliseAllsports(ev, nowMs) {
  const home = ev.event_home_team;
  const away = ev.event_away_team;
  if (!home || !away) return null;
  const st     = (ev.event_status || '').toString().trim();
  const isLive = ['1H','2H','HT','ET','LIVE','In Progress'].includes(st) || (st !== '' && !isNaN(parseInt(st)));
  const isFinished = ['Finished','FT','AET','After Penalties'].includes(st);
  let minuteDisplay = '', minuteNum = 0;
  if (st === 'HT') { minuteDisplay = 'HT'; minuteNum = 45; }
  else if (isLive && !isNaN(parseInt(st))) { minuteNum = parseInt(st); minuteDisplay = minuteNum + "'"; }
  else if (isLive) { minuteDisplay = 'LIVE'; }
  else if (isFinished) { minuteDisplay = 'FT'; }
  return {
    home: ev.event_final_result ? ev.event_final_result.split(' - ')[0] : (ev.event_home_final_score ?? '-'),
    away: ev.event_final_result ? ev.event_final_result.split(' - ')[1] : (ev.event_away_final_score ?? '-'),
    homeTeam: home, awayTeam: away,
    homeLogo: ev.home_team_logo || '', awayLogo: ev.away_team_logo || '',
    minute: minuteDisplay, minuteNum, status: st,
    league: ev.league_name || '', leagueLogo: ev.league_logo || '',
    country: ev.country_name || '', fixtureId: ev.event_key,
    venue: ev.event_stadium || '',
    time: ev.event_time || '',
    date: ev.event_date || '',
    fetchedAt: nowMs, isLive, isFinished,
    isUpcoming: !isLive && !isFinished, _src: 'allsports',
  };
}

function normaliseSportsdb(ev, nowMs) {
  if (!ev.strHomeTeam || !ev.strAwayTeam) return null;
  const st = (ev.strStatus || '').trim();
  const isLive = ['1H','2H','HT','ET','In Progress','Live','LIVE','Extra Time','Penalties','INT'].includes(st);
  const isFinished = ['FT','AET','PEN','Match Finished','Full Time','After Extra Time'].includes(st)
                    || st.startsWith('FT') || st.startsWith('AET');
  let minuteDisplay = '', minuteNum = 0;
  if (st === 'HT') { minuteDisplay = 'HT'; minuteNum = 45; }
  else if (isLive && ev.strProgress) {
    const prog = ev.strProgress.toString().trim();
    minuteNum = parseInt(prog.split('+')[0]) || 0;
    minuteDisplay = prog + "'";
  } else if (isLive) { minuteDisplay = 'LIVE'; }
  else if (isFinished) { minuteDisplay = 'FT'; }
  const today = new Date().toISOString().split('T')[0];

  // TheSportsDB returns time in UTC — convert to EAT (UTC+3) for Tanzania users
  let timeStr = '';
  if (ev.strTime) {
    try {
      const rawTime = ev.strTime.slice(0, 5); // "HH:MM"
      const [hh, mm] = rawTime.split(':').map(Number);
      const utcMins = hh * 60 + mm;
      const eatMins = (utcMins + 180) % (24 * 60); // +3 hours
      const eatH = Math.floor(eatMins / 60).toString().padStart(2, '0');
      const eatM = (eatMins % 60).toString().padStart(2, '0');
      timeStr = `${eatH}:${eatM}`;
    } catch { timeStr = ev.strTime.slice(0, 5); }
  }

  return {
    home: ev.intHomeScore ?? '-', away: ev.intAwayScore ?? '-',
    homeTeam: ev.strHomeTeam, awayTeam: ev.strAwayTeam,
    minute: minuteDisplay, minuteNum, status: st,
    league: ev.strLeague || '', country: ev.strCountry || '',
    fixtureId: ev.idEvent,
    time: timeStr,
    date: ev.dateEvent || today,
    fetchedAt: nowMs, isLive, isFinished,
    isUpcoming: !isLive && !isFinished, _src: 'sportsdb',
  };
}

function ingestScoreData(scoreData) {
  if (!scoreData) return;
  const k1 = `${scoreData.homeTeam} vs ${scoreData.awayTeam}`.toLowerCase();
  const k2 = `${scoreData.awayTeam} vs ${scoreData.homeTeam}`.toLowerCase();
  // Priority: apifootball > footballdata > sportmonks > allsports > sportsdb
  const existing = liveScores[k1];
  const srcPriority = { apifootball: 4, footballdata: 3, sportmonks: 2, allsports: 1, sportsdb: 0 };
  const existPri = srcPriority[existing?._src] ?? -1;
  const newPri   = srcPriority[scoreData._src] ?? -1;
  if (existing && existPri >= newPri) return;
  liveScores[k1] = scoreData;
  liveScores[k2] = scoreData;
}

async function fetchLiveScores() {
  const nowMs = Date.now();
  const todayStr = new Date().toISOString().split('T')[0];

  // ── Source 1: API-Football (primary, accurate) ────────────────────
  if (APISPORTS_KEY) {
    try {
      const [liveData, todayData] = await Promise.all([
        apifootballFetch('/fixtures?live=all'),
        apifootballFetch(`/fixtures?date=${todayStr}&timezone=Africa/Dar_es_Salaam`),
      ]);
      const seen = new Set();
      [...(liveData?.response || []), ...(todayData?.response || [])].forEach(fix => {
        if (seen.has(fix.fixture?.id)) return;
        seen.add(fix.fixture?.id);
        ingestScoreData(normaliseApifootball(fix, nowMs));
      });
    } catch(e) { console.warn('API-Football live fetch:', e.message); }
  }

  // ── Source 2: football-data.org ──────────────────────────────────────
  if (FOOTBALLDATA_KEY) {
    try {
      const fdData = await footballdataFetch('matches?status=LIVE');
      const nowFd = Date.now();
      (fdData?.matches || []).forEach(m => ingestScoreData(normaliseFootballData(m, nowFd)));
      // Also fetch today's scheduled matches
      const todayFd = await footballdataFetch(`matches?dateFrom=${todayStr}&dateTo=${todayStr}`);
      (todayFd?.matches || []).forEach(m => ingestScoreData(normaliseFootballData(m, nowFd)));
    } catch(e) { console.warn('football-data.org live fetch:', e.message); }
  }

  // ── Source 3: Sportmonks ──────────────────────────────────────────
  if (SPORTMONKS_KEY) {
    try {
      const smRes = await sportmonksFetch(`fixtures/date/${todayStr}?include=participants,scores,state,league`);
      const nowMs2 = Date.now();
      (smRes?.data || []).forEach(fix => ingestScoreData(normaliseSportmonks(fix, nowMs2)));
    } catch(e) { console.warn('Sportmonks live fetch:', e.message); }
  }

  // ── Source 3: AllSports API ───────────────────────────────────────
  if (ALLSPORTS_KEY) {
    try {
      const res = await allsportsFetch(`?met=Fixtures&from=${todayStr}&to=${todayStr}`);
      (res?.result || []).forEach(ev => ingestScoreData(normaliseAllsports(ev, nowMs)));
    } catch(e) { console.warn('AllSports live fetch:', e.message); }
  }

  // ── Source 4: TheSportsDB — DAIMA tumia (free, inafanya kazi bila key)
  // Hata kama API nyingine zipo, TheSportsDB inatoa live match data ya ziada
  try {
    const data = await sportsdbFetch(`eventslive.php`); // live matches endpoint
    (data?.events || []).forEach(ev => ingestScoreData(normaliseSportsdb(ev, nowMs)));
  } catch(e) { console.warn('TheSportsDB live fetch:', e.message); }

  // ── Source 4b: TheSportsDB today — kama bado hakuna data ─────────
  if (Object.keys(liveScores).length === 0) {
    try {
      const data = await sportsdbFetch(`eventsday.php?d=${todayStr}&s=Soccer`);
      (data?.events || []).forEach(ev => ingestScoreData(normaliseSportsdb(ev, nowMs)));
    } catch(e) { console.warn('TheSportsDB today fetch:', e.message); }
  }

  lastLiveFetch = Date.now();
  liveDataFetchedOnce = true;
  await autoSettleMatches();
  if (['results','mikeka','home'].includes(currentTab)) refreshLiveUI();
  if (currentTab === 'home') renderLiveSection();
  if (currentTab === 'mikeka') { const c=el('content'); if(c) renderMikeka(c); }
  if (currentTab === 'fixtures') renderFixtures(el('content'));
}

// Find score for a match by team names — improved fuzzy matching with fixtureId support
function findScore(teamsStr, fixtureId = null) {
  if (!teamsStr) return null;
  const key = teamsStr.toLowerCase().trim();

  // 1. Direct exact match
  if (liveScores[key]) return liveScores[key];

  // 2. Ikiwa fixtureId imetolewa, tafuta kwa ID moja kwa moja
  if (fixtureId) {
    for (const [k, v] of Object.entries(liveScores)) {
      if (v.fixtureId == fixtureId) return v;
    }
  }

  const parts = key.split(' vs ');
  if (parts.length !== 2) return null;
  const home = parts[0].trim();
  const away = parts[1].trim();

  // 3. Prefix match — angalau herufi 4 za mwanzo zilingane
  const homePrefix = home.slice(0, 4);
  const awayPrefix = away.slice(0, 4);
  for (const [k, v] of Object.entries(liveScores)) {
    const kLower = k.toLowerCase();
    const kParts = kLower.split(' vs ');
    if (kParts.length !== 2) continue;
    const kHome = kParts[0].trim();
    const kAway = kParts[1].trim();
    if (
      (kHome.startsWith(homePrefix) || home.startsWith(kHome.slice(0,4))) &&
      (kAway.startsWith(awayPrefix) || away.startsWith(kAway.slice(0,4)))
    ) return v;
  }

  // 4. Partial name match — check if stored key contains BOTH team name fragments
  for (const [k, v] of Object.entries(liveScores)) {
    const kParts = k.split(' vs ');
    if (kParts.length !== 2) continue;
    const kHome = kParts[0].trim();
    const kAway = kParts[1].trim();
    const homeSlug = home.slice(0, 5);
    const awaySlug = away.slice(0, 5);
    if (
      (kHome.includes(homeSlug) || home.includes(kHome.slice(0,5))) &&
      (kAway.includes(awaySlug) || away.includes(kAway.slice(0,5)))
    ) return v;
  }

  // 5. Looser — at least one team matches strongly
  for (const [k, v] of Object.entries(liveScores)) {
    if (k.includes(home.slice(0,6)) || k.includes(away.slice(0,6))) return v;
  }

  return null;
}

// Auto-settle betslip matches that are finished
async function autoSettleMatches() {
  if (!currentUser) return;
  const pendingMikeka = mikeka.filter(m => m.status === 'PENDING');
  
  for (const mk of pendingMikeka) {
    // ── Kinga ya double-settle: angalia status ya sasa kutoka DB ────────
    const { data: mkFresh } = await sb.from('mikeka').select('status').eq('id', mk.id).maybeSingle();
    if (mkFresh?.status !== 'PENDING') continue; // tayari imesettled na mtu mwingine

    const matches = mk.matches || [];
    let needsUpdate = false;
    
    for (const match of matches) {
      if (match.outcome !== 'PENDING') continue;
      
      const score = findScore(match.teams);
      // Settle if: officially finished OR stale live (estimated to be over)
      const isSettleable = score && (score.isFinished || score._staleLive);
      if (!isSettleable) continue;
      
      // Determine outcome based on market and pick
      const outcome = determineOutcome(match, score);
      if (outcome) {
        await sb.from('matches').update({ outcome }).eq('id', match.id);
        match.outcome = outcome;
        needsUpdate = true;
        // Per-match notification
        const icon = outcome === 'WIN' ? '✅' : outcome === 'LOSS' ? '❌' : '⬜';
        const msg = `${icon} ${match.teams}\n${match.market} · ${match.pick} → ${outcome}`;
        showNotification(`${icon} Match ${outcome}`, msg, outcome === 'WIN' ? 'win' : outcome === 'LOSS' ? 'loss' : 'default');
        toast(`${icon} ${match.teams.split(' vs ')[0]} — ${outcome}`, outcome==='WIN'?'ok':outcome==='LOSS'?'err':'info');
      }
    }
    
    // Check if whole mkeka is settled
    if (needsUpdate) {
      const { data: freshMatches } = await sb.from('matches').select('*').eq('mkeka_id', mk.id);
      const allDone = (freshMatches || []).every(m => m.outcome !== 'PENDING');
      if (allDone) {
        const hasLoss = (freshMatches || []).some(m => m.outcome === 'LOSS');
        const allVoid = (freshMatches || []).every(m => m.outcome === 'VOID');
        const newStatus = hasLoss ? 'LOST' : allVoid ? 'VOID' : 'WON';
        // Kinga ya double-settle: angalia hali ya sasa kwenye DB
        const { data: mkFresh } = await sb.from('mikeka').select('status').eq('id', mk.id).maybeSingle();
        if (mkFresh?.status !== 'PENDING') continue; // tayari imesettled
        await sb.from('mikeka').update({ status: newStatus }).eq('id', mk.id);
        
        const mkName = mk.name || `Mkeka #${mk.id.slice(-4)}`;
        const wonCount = (freshMatches||[]).filter(m=>m.outcome==='WIN').length;
        const total = freshMatches.length;

        if (newStatus === 'WON') {
          // Fetch fresh bankroll from DB to avoid stale state
          const { data: freshUser } = await sb.from('users').select('bankroll').eq('id', currentUser.id).maybeSingle();
          const currentBk = freshUser?.bankroll ?? currentUser.bankroll;
          const payout = (mk.potential_return || 0);
          await updateUser({ bankroll: currentBk + payout });
          showNotification('🎉 MKEKA UMESHINDA!', `${mkName}\n${wonCount}/${total} zimeshinda\n+TZS ${fmt(payout - (mk.stake||0))} faida`, 'win');
          toast(`🎉 MKEKA WON! Payout: ${displayVal(payout)}`, 'ok');
        } else if (newStatus === 'LOST') {
          // Stake tayari ilipigwa — hakuna kubadilisha bankroll
          showNotification('❌ Mkeka Umepoteza', `${mkName}\n${wonCount}/${total} zilishinda`, 'loss');
          toast(`❌ Mkeka Imepotea — ${mkName}`, 'err');
        } else {
          // VOID: rudisha stake tu
          const stakeBack = mk.stake || 0;
          if (stakeBack > 0) {
            const { data: freshUser2 } = await sb.from('users').select('bankroll').eq('id', currentUser.id).maybeSingle();
            const currentBk2 = freshUser2?.bankroll ?? currentUser.bankroll;
            await updateUser({ bankroll: currentBk2 + stakeBack });
          }
          showNotification('⬜ Mkeka VOID', mkName);
          toast(`⬜ VOID — Stake TZS ${fmt(stakeBack)} imerudishwa`, 'info');
        }
        await loadData();
        if (['home','mikeka','results'].includes(currentTab)) showTab(currentTab);
      }
    }
  }
}

// Determine match outcome from score
function determineOutcome(match, score) {
  const home = parseInt(score.home) || 0;
  const away = parseInt(score.away) || 0;
  const total = home + away;
  const market = match.market || '';
  const pick = (match.pick || '').toLowerCase().trim();
  
  try {
    // 1X2
    if (market === '1X2') {
      const result = home > away ? '1' : away > home ? '2' : 'X';
      return result === pick ? 'WIN' : 'LOSS';
    }
    // Double Chance
    if (market === 'Double Chance') {
      const result = home > away ? '1' : away > home ? '2' : 'X';
      if (pick === '1x' || pick === 'x1') return (result==='1'||result==='X') ? 'WIN' : 'LOSS';
      if (pick === '12') return (result==='1'||result==='2') ? 'WIN' : 'LOSS';
      if (pick === 'x2' || pick === '2x') return (result==='2'||result==='X') ? 'WIN' : 'LOSS';
    }
    // Draw No Bet
    if (market === 'Draw No Bet') {
      if (home === away) return 'VOID';
      const result = home > away ? '1' : '2';
      return result === pick ? 'WIN' : 'LOSS';
    }
    // Over/Under
    if (market.startsWith('Over ') || market.startsWith('Under ')) {
      const line = parseFloat(market.split(' ')[1]);
      if (market.startsWith('Over ')) return total > line ? 'WIN' : 'LOSS';
      if (market.startsWith('Under ')) return total < line ? 'WIN' : 'LOSS';
    }
    // BTTS
    if (market === 'BTTS - Yes') return (home > 0 && away > 0) ? 'WIN' : 'LOSS';
    if (market === 'BTTS - No') return (home === 0 || away === 0) ? 'WIN' : 'LOSS';
    // HT markets - cannot auto-settle without HT score
    return null;
  } catch(e) {
    return null;
  }
}

// ── Audio alert using Web Audio API (sauti ya notification) ──────────
function playNotificationSound(type = 'default') {
  try {
    // Unda AudioContext mpya kila wakati — salama zaidi kwa iOS
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const sequences = {
      win:     [{f:523,t:0,d:.12},{f:659,t:.13,d:.12},{f:784,t:.26,d:.2}],
      loss:    [{f:400,t:0,d:.15},{f:300,t:.18,d:.25}],
      live:    [{f:440,t:0,d:.08},{f:440,t:.12,d:.08}],
      default: [{f:520,t:0,d:.1},{f:660,t:.12,d:.1}],
    };
    const seq = sequences[type] || sequences.default;
    // ctx.resume() ni muhimu sana kwa iOS — lazima iitwe kabla ya kucheza sauti
    ctx.resume().then(() => {
      seq.forEach(({f, t, d}) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = f;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.35, ctx.currentTime + t);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + d);
        osc.start(ctx.currentTime + t);
        osc.stop(ctx.currentTime + t + d + 0.05);
      });
      setTimeout(() => ctx.close(), 1500);
    });
  } catch(e) { /* AudioContext inaweza kuzuiwa kabla ya user interaction */ }
}

function showNotification(title, body, soundType = 'default') {
  // Store in history + update badge
  addNotifToHistory(title, body, soundType);
  // Sauti
  playNotificationSound(soundType);
  // Vibration for mobile
  if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);

  if (!('Notification' in window)) return;

  const notifOptions = {
    body,
    icon: '/icon-192.png',
    badge: '/icon-192.png',
    tag: `njem-${soundType}-${Date.now()}`,
    renotify: true,
    silent: false,
    requireInteraction: soundType === 'win' || soundType === 'loss',
    data: { soundType, timestamp: Date.now() },
    actions: soundType === 'win'
      ? [{ action: 'view', title: '👀 Angalia' }]
      : undefined,
  };

  const doNotify = () => {
    try {
      // Try Service Worker first (works in background)
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(reg => {
          reg.showNotification(title, notifOptions).catch(() => {
            // Fallback to basic Notification
            new Notification(title, notifOptions);
          });
        }).catch(() => {
          new Notification(title, notifOptions);
        });
      } else {
        new Notification(title, notifOptions);
      }
    } catch(e) { console.warn('Notification error:', e); }
  };

  if (Notification.permission === 'granted') {
    doNotify();
  } else if (Notification.permission !== 'denied') {
    Notification.requestPermission().then(p => {
      if (p === 'granted') doNotify();
    });
  }
}

// Cash out alert
function checkCashoutAlerts() {
  const pendingMikeka = mikeka.filter(m => m.status === 'PENDING');
  pendingMikeka.forEach(mk => {
    const matches = mk.matches || [];
    let wonCount = 0, pendingCount = 0;
    
    matches.forEach(match => {
      if (match.outcome === 'WIN') wonCount++;
      if (match.outcome === 'PENDING') {
        const score = findScore(match.teams);
        if (score && score.isLive) pendingCount++;
      }
    });
    
    // If more than 70% of matches won and rest are live
    const pct = wonCount / matches.length;
    if (pct >= 0.7 && pendingCount > 0) {
      showNotification('💰 CASHOUT ALERT!', `${mk.name}: ${wonCount}/${matches.length} zimeshinda — Fikiria cashout!`);
      toast(`💰 CASHOUT: ${mk.name} — ${wonCount}/${matches.length} WIN!`, 'warn');
    }
  });
}

async function fetchTeamForm(teamName) {
  try {
    // TheSportsDB tu — bure, bila API key, bila quota
    const res = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(teamName)}`);
    const data = await res.json();
    const team = (data.teams||[])[0];
    if (!team) return null;
    const res2 = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/eventslast.php?id=${team.idTeam}`);
    const data2 = await res2.json();
    return { team, events: (data2.results||[]).slice(0,5) };
  } catch(e) { return null; }
}

async function fetchH2H(homeTeam, awayTeam) {
  try {
    // TheSportsDB tu — bure, bila API key, bila quota
    const [homeData, awayData] = await Promise.all([
      fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(homeTeam)}`).then(r=>r.json()),
      fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/searchteams.php?t=${encodeURIComponent(awayTeam)}`).then(r=>r.json()),
    ]);
    const homeId = (homeData.teams||[])[0]?.idTeam;
    const awayId = (awayData.teams||[])[0]?.idTeam;
    if (!homeId || !awayId) return [];
    const res = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/eventsh2h.php?idHomeTeam=${homeId}&idAwayTeam=${awayId}`);
    const data = await res.json();
    return (data.results||[]).slice(0,5);
  } catch(e) { return []; }
}

function analyzeForm(events, teamName) {
  if (!events || !events.length) return { wins:0, draws:0, losses:0, goalsFor:0, goalsAgainst:0, form:[] };
  let wins=0, draws=0, losses=0, goalsFor=0, goalsAgainst=0, form=[];
  events.forEach(ev => {
    const isHome = ev.strHomeTeam?.toLowerCase().includes(teamName.toLowerCase().split(' ')[0]);
    const hg = parseInt(ev.intHomeScore)||0;
    const ag = parseInt(ev.intAwayScore)||0;
    const gf = isHome ? hg : ag;
    const ga = isHome ? ag : hg;
    goalsFor += gf; goalsAgainst += ga;
    if (gf > ga) { wins++; form.push('W'); }
    else if (gf === ga) { draws++; form.push('D'); }
    else { losses++; form.push('L'); }
  });
  return { wins, draws, losses, goalsFor, goalsAgainst, form };
}

function analyzeH2H(h2hEvents, homeTeam) {
  if (!h2hEvents || !h2hEvents.length) return null;
  let homeWins=0, awayWins=0, draws=0, totalGoals=0;
  h2hEvents.forEach(ev => {
    const hg = parseInt(ev.intHomeScore)||0;
    const ag = parseInt(ev.intAwayScore)||0;
    totalGoals += hg + ag;
    const isHome = ev.strHomeTeam?.toLowerCase().includes(homeTeam.toLowerCase().split(' ')[0]);
    if (hg > ag) isHome ? homeWins++ : awayWins++;
    else if (hg < ag) isHome ? awayWins++ : homeWins++;
    else draws++;
  });
  return {
    homeWins, awayWins, draws,
    avgGoals: (totalGoals / h2hEvents.length).toFixed(1),
    total: h2hEvents.length
  };
}

// Fetch AI web insights via OpenRouter (with web search prompt)
async function fetchAIWebInsights(homeTeam, awayTeam) {
  if (!GEMINI_KEY) return null;
  try {
    const prompt = `You are a football analyst. Analyze the upcoming match: ${homeTeam} vs ${awayTeam}.
Search for and provide:
1. Recent injuries or suspensions for both teams
2. Current form and momentum
3. Any head-to-head patterns
4. Most likely match events (goals, corners, cards patterns)
Respond in JSON only, no markdown:
{"summary":"2-3 sentence analysis","injuries":"injury notes or null","keyPlayers":"key player info","patterns":"corners/cards/goals patterns","confidence":"high|medium|low"}`;

    const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + GEMINI_KEY,
        'HTTP-Referer': 'https://njem-tipps.netlify.app',
        'X-Title': 'NJEM Tipps'
      },
      body: JSON.stringify({
        model: 'meta-llama/llama-3.2-11b-vision-instruct:free',
        max_tokens: 400,
        temperature: 0.3,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    if (!res.ok) return null;
    const data = await res.json();
    const text = data.choices?.[0]?.message?.content || '';
    const clean = text.replace(/```json|```/g, '').trim();
    const match = clean.match(/\{[\s\S]*\}/);
    if (!match) return { summary: text.slice(0, 200) };
    return JSON.parse(match[0]);
  } catch(e) { return null; }
}

function generateAIRecommendations(homeTeam, awayTeam, homeStats, awayStats, h2h, webInsights=null) {
  const recs = [];
  const totalHomeGoals = homeStats.goalsFor + homeStats.goalsAgainst;
  const totalAwayGoals = awayStats.goalsFor + awayStats.goalsAgainst;
  const avgTotalGoals = homeStats.form.length ? (totalHomeGoals / homeStats.form.length) : 0;
  const avgAwayGoals = awayStats.form.length ? (totalAwayGoals / awayStats.form.length) : 0;
  const avgGoals = (avgTotalGoals + avgAwayGoals) / 2;
  const h2hAvgGoals = h2h ? parseFloat(h2h.avgGoals) : 0;

  // Over/Under recommendation
  const goalAvg = h2h ? (h2hAvgGoals + avgGoals) / 2 : avgGoals;
  if (goalAvg > 2.5) {
    recs.push({
      icon: '⚽',
      market: `Over 2.5 Goals`,
      pick: 'Over 2.5',
      confidence: Math.min(Math.round(55 + (goalAvg - 2.5) * 10), 78),
      reason: `Wastani wa magoli ${goalAvg.toFixed(1)} kwa mechi. ${h2h ? `H2H avg ${h2hAvgGoals} magoli.` : ''}`,
      type: goalAvg > 3 ? 'best' : 'ok'
    });
  } else {
    recs.push({
      icon: '🔒',
      market: `Under 2.5 Goals`,
      pick: 'Under 2.5',
      confidence: Math.min(Math.round(55 + (2.5 - goalAvg) * 8), 72),
      reason: `Mechi za hivi karibuni zina magoli machache. Avg ${goalAvg.toFixed(1)}.`,
      type: goalAvg < 1.8 ? 'best' : 'ok'
    });
  }

  // 1X2 / Double Chance recommendation
  const homeWinRate = homeStats.form.length ? homeStats.wins / homeStats.form.length : 0;
  const awayWinRate = awayStats.form.length ? awayStats.wins / awayStats.form.length : 0;
  const h2hHomeDominance = h2h ? h2h.homeWins / h2h.total : 0.5;

  if (homeWinRate > 0.6 && h2hHomeDominance > 0.4) {
    recs.push({
      icon: '🏠',
      market: 'Double Chance 1X',
      pick: '1X',
      confidence: Math.min(Math.round(55 + homeWinRate * 20), 75),
      reason: `${homeTeam} wameshinda ${Math.round(homeWinRate*100)}% ya mechi zao za hivi karibuni. H2H wanaongoza ${h2h?h2h.homeWins:0}/${h2h?h2h.total:0}.`,
      type: homeWinRate > 0.7 ? 'best' : 'ok'
    });
  } else if (awayWinRate > 0.6) {
    recs.push({
      icon: '✈️',
      market: 'Double Chance X2',
      pick: 'X2',
      confidence: Math.min(Math.round(52 + awayWinRate * 18), 72),
      reason: `${awayTeam} wana form nzuri — wameshinda ${Math.round(awayWinRate*100)}% ya mechi zao.`,
      type: awayWinRate > 0.7 ? 'best' : 'ok'
    });
  } else {
    recs.push({
      icon: '⚖️',
      market: 'Double Chance 1X',
      pick: '1X',
      confidence: 55,
      reason: 'Mechi usawa — Double Chance ni salama zaidi kuliko 1X2 moja kwa moja.',
      type: 'ok'
    });
  }

  // BTTS recommendation
  const homeScoredIn = homeStats.goalsFor > 0;
  const awayScoredIn = awayStats.goalsFor > 0;
  const homeConcedeRate = homeStats.form.length ? homeStats.goalsAgainst / homeStats.form.length : 1;
  const awayConcedeRate = awayStats.form.length ? awayStats.goalsAgainst / awayStats.form.length : 1;

  if (homeConcedeRate > 0.8 && awayConcedeRate > 0.8) {
    recs.push({
      icon: '🎯',
      market: 'BTTS - Yes',
      pick: 'BTTS Yes',
      confidence: Math.min(Math.round(55 + (homeConcedeRate + awayConcedeRate) * 5), 73),
      reason: `${homeTeam} wapoteza avg ${homeConcedeRate.toFixed(1)} kwa mechi. ${awayTeam} avg ${awayConcedeRate.toFixed(1)}. Pande zote zinaweza kuscore.`,
      type: homeConcedeRate > 1 && awayConcedeRate > 1 ? 'best' : 'ok'
    });
  }

  // Sort by confidence
  recs.sort((a, b) => b.confidence - a.confidence);
  return recs.slice(0, 4);
}

// Match Details Modal — Live Stats
async function showMatchDetailsModal(teamsStr, eventId) {
  // Create modal
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'match-modal';
  ov.innerHTML = `
    <div class="modal-box" style="max-height:85vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <div>
          <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800">📊 Match Details</div>
          <div id="match-modal-refresh-label" style="font-size:10px;color:var(--muted)"></div>
        </div>
        <button onclick="document.getElementById('match-modal').remove()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">×</button>
      </div>
      <div id="match-details-content"><div class="center"><div class="spinner"></div></div></div>
    </div>`;
  document.body.appendChild(ov);
  ov.onclick = (e) => { if(e.target===ov) ov.remove(); };

  let modalRefreshInterval = null;

  // Auto-close cleans up interval
  const origRemove = ov.remove.bind(ov);
  ov.remove = () => { if(modalRefreshInterval) clearInterval(modalRefreshInterval); origRemove(); };

  async function loadModalContent() {
    const score = findScore(teamsStr);
    const dc = document.getElementById('match-details-content');
    if (!dc) return;

    // Update refresh label
    const lbl = document.getElementById('match-modal-refresh-label');
    if (lbl) {
      const s = score;
      if (s?.isLive) lbl.innerHTML = `<span style="color:var(--danger);animation:pulse 1s infinite">🔴 LIVE — inajirudia kila 30s</span>`;
      else if (s?.isFinished) lbl.textContent = 'Mechi imekwisha';
      else lbl.textContent = teamsStr;
    }

    // Fetch event details — try API-Sports first, then Sportmonks, then TheSportsDB
    try {
      let eventData = null;
      let timeline = [];

      if (eventId && APISPORTS_KEY) {
        // API-Sports: live stats + timeline
        const [statsData, eventsData] = await Promise.all([
          apiSports(`fixtures/statistics?fixture=${eventId}`),
          apiSports(`fixtures/events?fixture=${eventId}`),
        ]);
        if (statsData?.response?.length >= 2) {
          const homeStats = statsData.response[0]?.statistics || [];
          const awayStats = statsData.response[1]?.statistics || [];
          const hs = {}, as = {};
          homeStats.forEach(s => { hs[s.type] = s.value ?? 0; });
          awayStats.forEach(s => { as[s.type] = s.value ?? 0; });
          eventData = { _apiStats: { hs, as } };
        }
        timeline = eventsData?.response || [];

      } else if (eventId && SPORTMONKS_KEY) {
        // Sportmonks: fetch fixture with stats include
        const smData = await sportmonksFetch(
          `fixtures/${eventId}?include=statistics;events;participants;scores;state`
        );
        if (smData?.data) {
          const fix = smData.data;
          const homeParticipant = fix.participants?.find(p => p.meta?.location === 'home');
          const awayParticipant = fix.participants?.find(p => p.meta?.location === 'away');
          const homeId = homeParticipant?.id;
          const awayId = awayParticipant?.id;
          if (fix.statistics?.length) {
            const hs = {}, as = {};
            fix.statistics.forEach(stat => {
              const bucket = stat.participant_id === homeId ? hs : as;
              bucket[stat.type?.name || stat.type_id] = stat.data?.value ?? stat.value ?? 0;
            });
            eventData = { _apiStats: { hs, as } };
          }
          // Build timeline from events
          timeline = (fix.events || []).map(ev => ({
            time: { elapsed: ev.minute },
            type: ev.type?.name || '',
            detail: ev.detail?.name || '',
            player: { name: ev.player_name || '' },
            team: { name: ev.participant_id === homeId ? (homeParticipant?.name||'') : (awayParticipant?.name||'') },
          }));
        }

      } else if (eventId) {
        // TheSportsDB fallback — fetch event details + lineup if available
        try {
          const [evRes, lineupRes] = await Promise.all([
            fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/lookupevent.php?id=${eventId}`),
            fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/lookuplinescores.php?id=${eventId}`),
          ]);
          const evData = await evRes.json();
          eventData = (evData.events || [])[0] || null;

          // Build timeline from TheSportsDB events (goals, cards, substitutions)
          try {
            const tlRes = await fetch(`https://www.thesportsdb.com/api/v1/json/${SPORTSDB_KEY}/lookuptimeline.php?id=${eventId}`);
            const tlData = await tlRes.json();
            if (tlData?.timeline?.length) {
              timeline = tlData.timeline.map(ev => ({
                time: { elapsed: ev.strTimeline?.replace("'","") || '' },
                type: ev.strType || ev.strEvent || '',
                detail: ev.strComment || ev.strAssist || '',
                player: { name: ev.strPlayer || ev.strSubstOff || '' },
                team: { name: ev.strTeam || '' },
                _raw: ev,
              }));
            }
          } catch(e2) { /* timeline haipatikani */ }
        } catch(e) {}
      }

      const s = score || {};
      const home = s.homeTeam || teamsStr.split(' vs ')[0];
      const away = s.awayTeam || teamsStr.split(' vs ')[1];

      // Real-time minute estimation for live
      let displayMinute = s.minute || '';
      if (s.isLive && s.minuteNum > 0 && s.fetchedAt && s.status !== 'HT') {
        const elapsed = Math.floor((Date.now() - s.fetchedAt) / 60000);
        const estimated = Math.min(s.minuteNum + elapsed, s.minuteNum <= 45 ? 45 : 90);
        displayMinute = estimated + "'";
      }

      // Parse stats - prefer API-Sports data
      let stats;
      if (eventData?._apiStats) {
        const hs = eventData._apiStats.hs;
        const as = eventData._apiStats.as;
        const parsePct = (v) => parseInt((v||'50%').toString().replace('%','')) || 50;
        const posHome = parsePct(hs['Ball Possession']);
        stats = {
          possession_home: posHome,
          possession_away: 100 - posHome,
          shots_home: hs['Total Shots'] || '—',
          shots_away: as['Total Shots'] || '—',
          shots_on_home: hs['Shots on Goal'] || '—',
          shots_on_away: as['Shots on Goal'] || '—',

          saves_home: hs['Goalkeeper Saves'] || '—',

      } else {

        stats = {

function statRow(label, homeVal, awayVal, homePct) {
  const pct = typeof homePct === 'number' ? Math.min(Math.max(homePct, 5), 95) : 50;
  return `
    <div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
        <span style="font-weight:600;color:var(--accent)">${homeVal}</span>
        <span style="color:var(--muted);font-size:11px">${label}</span>
        <span style="font-weight:600;color:var(--text)">${awayVal}</span>
      </div>
      <div style="background:rgba(0,0,0,.4);border-radius:20px;height:6px;overflow:hidden;display:flex">
        <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:20px;transition:width .8s"></div>
      </div>
    </div>`;
}

function formatForm(formStr) {
  if (!formStr) return '';
  return formStr.split('').map(c => {
    const col = c==='W'?'var(--win)':c==='L'?'var(--loss)':'var(--warn)';
    return `<span style="color:${col};font-weight:700;font-size:11px">${c}</span>`;
  }).join(' ');
}

function generateMatchAI(score, stats) {
  const tips = [];
  const home = score.homeTeam || 'Home';
  const away = score.awayTeam || 'Away';
  const h = parseInt(score.home) || 0;
  const a = parseInt(score.away) || 0;
  const total = h + a;
  const min = score.minuteNum || 0;

  if (score.isLive) {
    // Live recommendations
    if (total === 0 && min > 60) tips.push({icon:'💡',msg:`${min}+ dakika bila goli — Over 0.5 inaweza kuwa risky`});
    if (total >= 2 && min < 70) tips.push({icon:'🔥',msg:`Magoli ${total} tayari — Over ${total}.5 inawezekana kabla FT`});
    if (h > a + 1) tips.push({icon:'💰',msg:`${home} wanaongoza kwa ${h}-${a} — Fikiria cashout sasa`});
    if (a > h + 1) tips.push({icon:'💰',msg:`${away} wanaongoza kwa ${a}-${h} — Fikiria cashout sasa`});
    if (parseInt(stats.red_home) > 0) tips.push({icon:'🟥',msg:`${home} wana mchezaji nje — ${away} wana advantage`});
    if (parseInt(stats.red_away) > 0) tips.push({icon:'🟥',msg:`${away} wana mchezaji nje — ${home} wana advantage`});
    if (h === a && min > 75) tips.push({icon:'⚡',msg:`Sare ${h}-${a} dakika ${min} — Bonyeza kwa ${home} au ${away} kwa late goal`});
  } else if (score.isFinished) {
    tips.push({icon:'📊',msg:`Matokeo: ${home} ${h} - ${a} ${away}`});
    if (total > 3) tips.push({icon:'📈',msg:`Magoli ${total} — Over 2.5 ingelifaa kwenye mechi hii`});
    if (total < 2) tips.push({icon:'📉',msg:`Magoli ${total} tu — Under 2.5 ingelifaa`});
  } else {
    tips.push({icon:'⏳',msg:`Mechi hii bado haijachezwa — subiri kwa data zaidi`});
  }

  if (!tips.length) tips.push({icon:'📊',msg:'Data ya kutosha haipatikani kwa mapendekezo'});

  return tips.map(t => `
    <div style="display:flex;gap:8px;margin-bottom:6px;align-items:flex-start">
      <span style="font-size:14px">${t.icon}</span>
      <span style="font-size:12px;color:#5a9e70">${t.msg}</span>
    </div>`).join('');
}

// Start/stop live polling
function startLiveScores() {
  if (liveInterval) return;
  liveEnabled = true;
  fetchLiveScores(); // Immediate first fetch

  // Poll every 60s normally; if live matches detected, poll every 30s
  liveInterval = setInterval(async () => {
    await fetchLiveScores();
    checkCashoutAlerts();
    // If live matches exist, schedule an extra fetch in 30s
    const hasLive = Object.values(liveScores).some(s => s.isLive);
    if (hasLive && !liveBoostTimeout) {
      liveBoostTimeout = setTimeout(async () => {
        liveBoostTimeout = null;
        await fetchLiveScores();
      }, 30000);
    }
  }, 60000);

  // Real-time minute counter — increments displayed minute every 60s based on fetchedAt
  liveMinuteInterval = setInterval(() => {
    const now = Date.now();
    let hasLive = false;
    Object.values(liveScores).forEach(s => {
      if (!s.isLive || !s.fetchedAt || s.status === 'HT') return;
      hasLive = true;
      // Estimate current minute based on time elapsed since fetch
      if (s.minuteNum > 0) {
        const elapsedMins = Math.floor((now - s.fetchedAt) / 60000);
        const cap = s.minuteNum <= 45 ? 47 : 95; // allow stoppage time
        s._estimatedMinute = Math.min(s.minuteNum + elapsedMins, cap);
      } else {
        s._estimatedMinute = s.minuteNum || 0;
      }
      // Mark stale if: estimated min >= 93 AND > 5 min since last fetch (was 15min — too long!)
      // OR if > 120 minutes since fetch (match definitely over)
      const minsSinceFetch = (now - s.fetchedAt) / 60000;
      if (
        (s._estimatedMinute >= 93 && minsSinceFetch > 5) ||
        minsSinceFetch > 120
      ) {
        s._staleLive = true;
      }
    });
    if (hasLive && currentTab === 'home') renderLiveSection();
  }, 20000); // Update display every 20s

  console.log('✅ Live scores started — polling every 60s, 30s when live');
}

function stopLiveScores() {
  if (liveInterval) { clearInterval(liveInterval); liveInterval = null; }
  if (liveMinuteInterval) { clearInterval(liveMinuteInterval); liveMinuteInterval = null; }
  if (liveBoostTimeout) { clearTimeout(liveBoostTimeout); liveBoostTimeout = null; }
  liveEnabled = false;
}

async function loginUser(user){
  const ls=el('loading-screen');if(ls)ls.style.display='none';
  currentUser=user;
  // Save session to localStorage — inabaki hata ukifunga app
  localStorage.setItem('njem_session', JSON.stringify(user));
  el('auth-screen').style.display='none';el('app').style.display='block';
  await loadData();startRealtime();renderShell();showTab('home');
  startLiveScores();
  // Request notification permission proactively at login
  if('Notification' in window && Notification.permission === 'default'){
    setTimeout(() => {
      Notification.requestPermission().then(p => {
        if(p === 'granted') toast('🔔 Notifications zimewashwa!', 'ok');
        else if(p === 'denied') toast('⚠️ Notifications zimezuiwa — washa kwenye browser settings', 'warn');
      });
    }, 2000); // slight delay so user sees the app first
  }
}
function logout(){

  currentUser=null;mikeka=[];allMikeka=[];

function getStreak(){
  const s=[...mikeka].filter(m=>m.status!=='PENDING'&&m.status!=='VOID');
  if(!s.length)return{type:'none',count:0};
  const t=s[0].status==='WON'?'WIN':'LOSS';let c=0;
  for(const m of s){if((m.status==='WON')===(t==='WIN'))c++;else break;}
  return{type:t,count:c};
}
function analyzeRisk(matches){
  const flags=[],tips=[];
  const totalOdds=matches.reduce((p,m)=>p*(parseFloat(m.odds)||1),1);
  if(matches.length>4)flags.push({icon:'⚠️',msg:`Mechi ${matches.length} — chances za kupoteza zinaongezeka`});
  if(totalOdds>20)flags.push({icon:'🔴',msg:`Odds ${totalOdds.toFixed(2)} ni kubwa mno!`});
  matches.forEach(m=>{
    if(parseFloat(m.odds)<1.2)flags.push({icon:'⚠️',msg:`${m.teams||'Mechi'}: Odds ${m.odds} — value si nzuri`});
    if(parseFloat(m.odds)>5)flags.push({icon:'🔴',msg:`${m.teams||'Mechi'}: Odds ${m.odds} — hatari!`});
  });
  const streak=getStreak();
  if(streak.type==='LOSS'&&streak.count>=2)flags.push({icon:'🚨',msg:`Loss streak ${streak.count} — fikiria vizuri!`});
  const lgMap={};
  mikeka.forEach(mk=>(mk.matches||[]).forEach(match=>{
    if(!lgMap[match.league])lgMap[match.league]={w:0,l:0,t:0};
    lgMap[match.league].t++;
    if(match.outcome==='WIN')lgMap[match.league].w++;
    if(match.outcome==='LOSS')lgMap[match.league].l++;
  }));
  matches.forEach(m=>{
    const lg=lgMap[m.league];
    if(lg&&lg.t>=3){
      const wr=(lg.w/lg.t)*100;
      if(wr<30)flags.push({icon:'📊',msg:`${lgName(m.league)}: Win rate ${wr.toFixed(0)}% — league hii inakuchania!`});
      if(wr>60)tips.push({icon:'✅',msg:`${lgName(m.league)}: Win rate ${wr.toFixed(0)}% — league nzuri kwako!`});
    }
  });
  const mkMap={};
  mikeka.forEach(mk=>(mk.matches||[]).forEach(match=>{
    if(!mkMap[match.market])mkMap[match.market]={w:0,t:0};
    mkMap[match.market].t++;
    if(match.outcome==='WIN')mkMap[match.market].w++;
  }));
  const best=Object.entries(mkMap).filter(([,v])=>v.t>=3).sort((a,b)=>(b[1].w/b[1].t)-(a[1].w/a[1].t))[0];
  if(best)tips.push({icon:'💡',msg:`Market bora kwako: ${best[0]} (${((best[1].w/best[1].t)*100).toFixed(0)}% win)`});
  return{flags,tips,totalOdds};
}
async function ocrImage(base64,mimeType){
  if(!GEMINI_KEY){toast('Weka OpenRouter API key kwenye Admin → Settings','err');return[];}
  try{
    const url='https://openrouter.ai/api/v1/chat/completions';
    const body={
      model:'meta-llama/llama-3.2-11b-vision-instruct:free',
      messages:[{
        role:'user',
        content:[
          {type:'text',text:`You are a sports betting slip reader. Extract ALL matches from this betslip image.
Return ONLY a valid JSON array, nothing else, no markdown:
[{"teams":"Team A vs Team B","market":"Double Chance","pick":"1X","odds":"1.75"}]
Always return valid JSON array even if unsure.`},
          {type:'image_url',image_url:{url:'data:'+mimeType+';base64,'+base64}}
        ]
      }],
      max_tokens:1000,
      temperature:0.1
    };
    const res=await fetch(url,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':'Bearer '+GEMINI_KEY,
        'HTTP-Referer':'https://njem-tipps.netlify.app',
        'X-Title':'NJEM Tipps'
      },
      body:JSON.stringify(body)
    });
    if(!res.ok){
      const err=await res.json();
      toast('OpenRouter error: '+(err.error?.message||res.status),'err');
      return[];
    }
    const data=await res.json();
    const text=data.choices?.[0]?.message?.content||'[]';
    const clean=text.replace(/```json|```/g,'').trim();
    const match=clean.match(/\[[\s\S]*\]/);
    if(!match){toast('Mechi hazipatikani kwenye picha','warn');return[];}
    return JSON.parse(match[0]);
  }catch(e){
    console.error('OCR error:',e);
    toast('OCR imeshindwa: '+e.message,'err');
    return[];
  }
}

      <button onclick="window._bkConfirm('${type}')" style="width:100%;padding:.75rem;border-radius:12px;border:none;background:${type==='add'?'var(--win)':'var(--danger)'};color:${type==='add'?'#000':'#fff'};font-weight:700;cursor:pointer">${type==='add'?'Ongeza':'Toa'}</button>`;
  };
  window._bkConfirm=async(type)=>{
    const amt=parseFloat(el('bk-amt')?.value||0);
    if(!amt||amt<=0)return toast('Weka kiasi sahihi!','err');
    if(type==='withdraw'&&amt>currentUser.bankroll)return toast('Huna pesa za kutosha!','err');
    const newBk=type==='add'?currentUser.bankroll+amt:currentUser.bankroll-amt;
    await updateUser({bankroll:newBk});
    await sb.from('transactions').insert({id:uid(),user_id:currentUser.id,type,amount:amt,note:el('bk-note')?.value||'',balance_after:newBk}).catch(()=>{});
    toast(type==='add'?`✅ Imeongezwa TZS ${fmt(amt)}`:`✅ Imetolewa TZS ${fmt(amt)}`);
    ov.remove();showTab(currentTab);
  };
}

function renderLiveSection() {
  const sec = el('live-section');
  if (!sec) return;

  const allMatches = Object.values(liveScores);
  // deduplicate
  const seen = new Set();
  const unique = allMatches.filter(s => {
    const k = s.homeTeam + s.awayTeam;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });

  const liveOnly = unique.filter(s => s.isLive && !s._staleLive);
  const staleLive = unique.filter(s => s.isLive && s._staleLive); // treat as finished
  const upcoming = unique.filter(s => s.isUpcoming).slice(0, 6);
  const finished = [...unique.filter(s => s.isFinished), ...staleLive].slice(0, 5);

  // ── Bado haijakuwa fetch hata moja ──────────────────────────────────
  if (!liveDataFetchedOnce) {
    sec.innerHTML = `
      <div style="font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px">
        📅 Mechi za Leo
        <span style="margin-left:auto;font-size:10px;color:var(--muted);font-weight:400">Inapakia...</span>
      </div>
      <div class="center"><div class="spinner"></div></div>
      <div style="text-align:center;font-size:11px;color:var(--muted);margin-top:6px">Inafetch data kutoka TheSportsDB...</div>`;
    if (!APISPORTS_KEY && !SPORTMONKS_KEY && !ALLSPORTS_KEY) {
      sec.innerHTML += `<div class="banner-warn" style="margin-top:8px;border-radius:8px">⚠️ Unatumia TheSportsDB bure — live scores zinaweza kuchelewa hadi dakika 30. Weka API-Football key kwa matokeo ya wakati halisi.</div>`;
    }
    if (!liveInterval) fetchLiveScores();
    return;
  }

  // ── Fetch imekamilika lakini hakuna mechi yoyote ─────────────────────
  if (!unique.length) {
    const secAgo0 = lastLiveFetch ? Math.floor((Date.now() - lastLiveFetch) / 1000) : null;
    const freshLabel0 = secAgo0 !== null ? (secAgo0 < 60 ? `${secAgo0}s iliyopita` : `${Math.floor(secAgo0/60)}m iliyopita`) : '';
    sec.innerHTML = `
      <div style="font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px">
        📅 Mechi za Leo

          <button onclick="window._refreshLive()" style="padding:.2rem .55rem;border-radius:8px;border:1px solid var(--border);background:rgba(0,255,133,.08);color:var(--accent);font-size:11px;font-weight:700;cursor:pointer">🔄 Refresh</button>
          <span style="font-size:10px;color:var(--muted);font-weight:400">${freshLabel0}</span>
        </span>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem 1rem;text-align:center">
        <div style="font-size:40px;margin-bottom:10px">⚽</div>
        <div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px">Hamna Live Match Kwa Sasa</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Hakuna mechi za live au zinazokuja leo zinazojulikana. Jaribu baadaye au angalia Fixtures.</div>
        <button onclick="window._showFixtures()" style="padding:.55rem 1.2rem;border-radius:20px;border:1.5px solid var(--accent);background:rgba(0,255,133,.08);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer">📅 Angalia Fixtures →</button>

      ${finished.map(s => matchCard(s)).join('')}
    </div>` : ''}
  `;
}

function renderFixtures(c) {
  if (!fixSelectedDate) fixSelectedDate = new Date().toISOString().split('T')[0];
  // Extended dates: -2 days to +4 days = 7 total
  const dates = [-2,-1,0,1,2,3,4].map(d => {
    const dt = new Date(); dt.setDate(dt.getDate() + d);
    const label = d===-2?'Juzi-1':d===-1?'Jana':d===0?'Leo':d===1?'Kesho':dt.toLocaleDateString('sw-TZ',{weekday:'short',day:'numeric'});
    return { val: dt.toISOString().split('T')[0], label };
  });
  const regions = [...new Set(SPORTSDB_LEAGUES.map(l => l.region))];

  c.innerHTML = `
    <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between">
      📅 Fixtures
      <button onclick="window._fixRefresh()" style="padding:.35rem .8rem;border-radius:20px;border:1px solid var(--border);background:rgba(0,255,133,.08);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer">🔄 Refresh</button>
    </div>

    <!-- Date selector — scrollable -->
    <div style="display:flex;gap:6px;margin-bottom:.75rem;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch">
      ${dates.map(d => `
        <button onclick="window._fixPickDate('${d.val}')" id="fixd-${d.val}"
          style="padding:.4rem .85rem;border-radius:20px;border:1.5px solid ${d.val===fixSelectedDate?'var(--accent)':'var(--border)'};background:${d.val===fixSelectedDate?'rgba(0,255,133,.15)':'transparent'};color:${d.val===fixSelectedDate?'var(--accent)':'var(--muted)'};font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0">
          ${d.label}
        </button>`).join('')}
      <button onclick="window._showCalendar()" style="padding:.4rem .85rem;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;flex-shrink:0">📅 Kalenda</button><!-- Custom date input -->
      <label style="flex-shrink:0;display:flex;align-items:center;gap:4px;padding:.4rem .75rem;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;white-space:nowrap">
        📆 <input type="date" id="fix-custom-date" value="${fixSelectedDate}" style="border:none;background:transparent;color:var(--accent);font-size:12px;cursor:pointer;width:110px;outline:none" onchange="window._fixPickDate(this.value)"/>
      </label>
    </div>

    <!-- Search leagues -->
    <input class="inp" id="fix-search" placeholder="🔍 Tafuta ligi au nchi..." style="margin-bottom:.75rem;font-size:13px" value="${fixLeagueSearch||''}" oninput="window._fixSearch(this.value)"/>

    <!-- League selector by region -->
    <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Chagua Ligi (${SPORTSDB_LEAGUES.length})</div>
    <div id="fix-league-list">
    ${regions.map(r => {
      const leagues = SPORTSDB_LEAGUES.filter(l=>l.region===r);
      return `
      <div class="fix-region-block" data-region="${r}">
        <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:8px 0 4px">${r} (${leagues.length})</div>
        <div style="display:flex;flex-direction:column;gap:4px;margin-bottom:4px">
          ${leagues.map(l => `
            <button onclick="window._fixPickLeague('${l.id}')" id="fixl-${l.id}"
              style="display:flex;align-items:center;gap:10px;padding:.6rem .85rem;border-radius:12px;border:1px solid ${fixSelectedLeague?.id===l.id?'var(--accent)':'var(--border)'};background:${fixSelectedLeague?.id===l.id?'rgba(0,255,133,.08)':'var(--surface)'};color:var(--text);cursor:pointer;text-align:left;font-family:inherit;transition:border-color .15s">
              <span style="font-size:18px">${l.flag}</span>
              <span style="font-size:13px;font-weight:${fixSelectedLeague?.id===l.id?'700':'400'};color:${fixSelectedLeague?.id===l.id?'var(--accent)':'var(--text)'}">${l.name}</span>
              <span style="margin-left:auto;color:var(--muted);font-size:16px">›</span>
            </button>`).join('')}
        </div>
      </div>`;
    }).join('')}
    </div>

    <!-- Matches output -->
    <div id="fix-matches-out" style="margin-top:1rem"></div>
  `;

  
    window._showCalendar = () => {
      const ov = document.createElement('div');
      ov.className = 'modal-overlay';
      ov.id = 'calendar-modal';
      ov.innerHTML = `
        <div class="modal-box" style="padding:1.5rem">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
            <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800">📅 Chagua Tarehe</div>
            <button onclick="document.getElementById('calendar-modal').remove()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">×</button>
          </div>
          <input type="date" id="cal-date-input" class="inp" value="${fixSelectedDate}" style="margin-bottom:1rem"/>
          <button onclick="window._fixPickDate(document.getElementById('cal-date-input').value); document.getElementById('calendar-modal').remove();" class="btn-primary">Fungua Mechi</button>
        </div>
      `;
      document.body.appendChild(ov);
      ov.onclick = (e) => { if(e.target===ov) ov.remove(); };
    };
  window._fixPickDate = (date) => {
    if (!date) return;
    fixSelectedDate = date;
    document.querySelectorAll('[id^="fixd-"]').forEach(b => {
      const isActive = b.id === 'fixd-' + date;
      b.style.borderColor = isActive ? 'var(--accent)' : 'var(--border)';
      b.style.background = isActive ? 'rgba(0,255,133,.15)' : 'transparent';
      b.style.color = isActive ? 'var(--accent)' : 'var(--muted)';
    });
    // Also update custom date input
    const cdi = el('fix-custom-date');
    if (cdi) cdi.value = date;
    if (fixSelectedLeague) loadFixMatchesFree(fixSelectedLeague);
  };

  window._fixRefresh = () => {
    const btn = document.querySelector('button[onclick="window._fixRefresh()"]');
    if (btn) { btn.textContent = '⏳ ...'; btn.disabled = true; }
    if (fixSelectedLeague) {
      loadFixMatchesFree(fixSelectedLeague).then(() => {
        if (btn) { btn.textContent = '🔄 Refresh'; btn.disabled = false; }
        toast('Fixtures zimesasishwa! ✅', 'ok');
      });
    } else {
      if (btn) { btn.textContent = '🔄 Refresh'; btn.disabled = false; }
      toast('Chagua ligi kwanza!', 'warn');
    }
  };

  window._fixSearch = (q) => {
    fixLeagueSearch = q.toLowerCase();
    const blocks = document.querySelectorAll('.fix-region-block');
    blocks.forEach(block => {
      const btns = block.querySelectorAll('button[id^="fixl-"]');
      let visibleCount = 0;
      btns.forEach(btn => {
        const lgName = btn.querySelector('span:nth-child(2)')?.textContent?.toLowerCase() || '';
        const regionName = block.dataset.region?.toLowerCase() || '';
        const match = !fixLeagueSearch || lgName.includes(fixLeagueSearch) || regionName.includes(fixLeagueSearch);
        btn.style.display = match ? '' : 'none';
        if (match) visibleCount++;
      });
      block.style.display = visibleCount > 0 ? '' : 'none';
    });
  };

  window._fixPickLeague = (lgId) => {
    const lg = SPORTSDB_LEAGUES.find(l => l.id === lgId);
    if (!lg) return;
    fixSelectedLeague = lg;
    document.querySelectorAll('[id^="fixl-"]').forEach(b => {
      const isActive = b.id === 'fixl-' + lgId;
      b.style.borderColor = isActive ? 'var(--accent)' : 'var(--border)';
      b.style.background = isActive ? 'rgba(0,255,133,.08)' : 'var(--surface)';
      const nameSpan = b.querySelector('span:nth-child(2)');
      if (nameSpan) { nameSpan.style.color = isActive ? 'var(--accent)' : 'var(--text)'; nameSpan.style.fontWeight = isActive ? '700' : '400'; }
    });
    // Scroll to results
    const out = el('fix-matches-out');
    if (out) setTimeout(() => out.scrollIntoView({behavior:'smooth', block:'start'}), 100);
    loadFixMatchesFree(lg);
  };

  // Reapply search filter if any
  if (fixLeagueSearch) window._fixSearch(fixLeagueSearch);

  // Kama kulikuwa na league iliyochaguliwa, ipakia tena
  if (fixSelectedLeague) loadFixMatchesFree(fixSelectedLeague);
}

function renderFixCard(home, away, isLive, isFT, hg, ag, minute, time, leagueId, showBetBtn, fixtureId) {
  const safeH = (home||'').replace(/'/g,"\\'");
