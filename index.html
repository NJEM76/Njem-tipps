  const timeDisplay = time ? time : '--:--';
  return `
    <div style="background:var(--surface);border:1px solid ${isLive?'rgba(255,68,68,.4)':'var(--border)'};border-radius:14px;padding:.85rem;margin-bottom:.6rem${isLive?';box-shadow:0 0 12px rgba(255,68,68,.15)':''}">
      <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:.5rem">
        <div style="text-align:right"><div style="font-size:13px;font-weight:600">${home}</div></div>
        <div style="text-align:center;min-width:80px">
          ${isLive ? `
            <div style="font-size:20px;font-weight:800;color:var(--danger)">${hg??0} - ${ag??0}</div>
            <div style="font-size:10px;color:var(--danger);animation:pulse 1s infinite;font-weight:700">🔴 ${minute||'LIVE'}</div>
          ` : isFT ? `
            <div style="font-size:20px;font-weight:800;color:var(--muted)">${hg??'-'} - ${ag??'-'}</div>
            <div style="font-size:10px;color:var(--muted);font-weight:700">✅ FT</div>
          ` : `
            <div style="font-size:17px;font-weight:800;color:var(--accent)">${timeDisplay}</div>
            <div style="font-size:9px;color:var(--muted)">KICK-OFF</div>
          `}
        </div>
        <div style="text-align:left"><div style="font-size:13px;font-weight:600">${away}</div></div>
      </div>
      ${showBetBtn && !isFT && home && away ? `
      <div style="margin-top:8px;display:flex;gap:6px">
        <button onclick="window._fixAddBetslip('${safeH} vs ${safeA}','${leagueId}')"
          style="flex:1;padding:.4rem;border-radius:10px;border:1px solid rgba(0,255,133,.3);background:rgba(0,255,133,.08);color:var(--accent);font-size:11px;font-weight:600;cursor:pointer">
          ➕ Ongeza Betslip
        </button>
        ${isLive ? `<button onclick="window._showMatchDetails('${safeH} vs ${safeA}','${fixtureId||''}')" style="padding:.4rem .7rem;border-radius:10px;border:1px solid rgba(255,68,68,.3);background:rgba(255,68,68,.08);color:var(--danger);font-size:11px;cursor:pointer">📊 Stats</button>` : ''}
      </div>` : ''}
    </div>`;
}

// ── Main fixture loader — tries 3 sources in order ────────────────────
async function loadFixMatchesFree(league) {
  const out = el('fix-matches-out');
  if (!out) return;
  out.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:.5rem">
      <span style="font-size:18px">${league.flag}</span>
      <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px">${league.name}</span>
      <span style="font-size:11px;color:var(--muted)">${fixSelectedDate}</span>
    </div>
    <div class="center"><div class="spinner"></div><div style="font-size:11px;color:var(--muted);margin-top:6px">Inatafuta kutoka vyanzo vya data...</div></div>`;

  let matches = [];   // normalised scoreData objects
  let srcLabel = '';

  // ── Source 1: API-Football ───────────────────────────────────────
  if (APISPORTS_KEY) {
    const lgId = APIFOOTBALL_LEAGUE_IDS[league.id];
    if (lgId) {
      try {
        const data = await apifootballFetch(`/fixtures?league=${lgId}&date=${fixSelectedDate}&timezone=Africa/Dar_es_Salaam`);
        if (data && !data._rateLimit && (data.response||[]).length > 0) {
          const nowMs = Date.now();
          matches = data.response.map(fix => normaliseApifootball(fix, nowMs)).filter(Boolean);
          srcLabel = '⚡ API-Football';
        }
      } catch(e) { console.warn('fix src1:', e.message); }
    }
  }

  // ── Source 1b: football-data.org ────────────────────────────────
  if (!matches.length && FOOTBALLDATA_KEY) {
    const fdCode = FOOTBALLDATA_LEAGUE_IDS[league.id];
    if (fdCode) {
      try {
        const data = await footballdataFetch(`competitions/${fdCode}/matches?dateFrom=${fixSelectedDate}&dateTo=${fixSelectedDate}`);
        if ((data?.matches||[]).length > 0) {
          const nowMs = Date.now();
          matches = data.matches.map(m => normaliseFootballData(m, nowMs)).filter(Boolean);
          srcLabel = '🟠 football-data.org';
        }
      } catch(e) { console.warn('fix src1b football-data:', e.message); }
    }
  }

  // ── Source 2: Sportmonks (free trial — 120 leagues) ──────────────
  if (!matches.length && SPORTMONKS_KEY) {
    const lgId = SPORTMONKS_LEAGUE_IDS[league.id];
    if (lgId) {
      try {
        const data = await sportmonksFetch(
          `fixtures/date/${fixSelectedDate}?filters=leagueId:${lgId}&include=participants;scores;state;league;venue`
        );
        if ((data?.data||[]).length > 0) {
          const nowMs = Date.now();
          matches = data.data.map(fix => normaliseSportmonks(fix, nowMs)).filter(Boolean);
          srcLabel = '🟢 Sportmonks';
        }
      } catch(e) { console.warn('fix src2 Sportmonks:', e.message); }
    }
    // Kama league haina ID kwenye Sportmonks, jaribu kuSearch kwa jina
    if (!matches.length) {
      try {
        const today2 = fixSelectedDate;
        const data = await sportmonksFetch(
          `fixtures/date/${today2}?include=participants;scores;state;league`
        );
        if ((data?.data||[]).length > 0) {
          const nowMs = Date.now();
          const lgNameLower = league.name.toLowerCase();
          const filtered = (data.data).filter(fix =>
            fix.league?.name?.toLowerCase().includes(lgNameLower.split(' ')[0])
          );
          if (filtered.length > 0) {
            matches = filtered.map(fix => normaliseSportmonks(fix, nowMs)).filter(Boolean);
            srcLabel = '🟢 Sportmonks';
          }
        }
      } catch(e) { console.warn('fix src2b Sportmonks search:', e.message); }
    }
  }

  // ── Source 3: AllSports API ──────────────────────────────────────
  if (!matches.length && ALLSPORTS_KEY) {
    const lgId = ALLSPORTS_LEAGUE_IDS[league.id];
    if (lgId) {
      try {
        const data = await allsportsFetch(`?met=Fixtures&leagueId=${lgId}&from=${fixSelectedDate}&to=${fixSelectedDate}`);
        if ((data?.result||[]).length > 0) {
          const nowMs = Date.now();
          matches = data.result.map(ev => normaliseAllsports(ev, nowMs)).filter(Boolean);
          srcLabel = '🌐 AllSports';
        }
      } catch(e) { console.warn('fix src3 AllSports:', e.message); }
    }
  }

  // ── Source 4: TheSportsDB (free fallback) ────────────────────────
  if (!matches.length && league.sportsdbId && league.sportsdbId !== '0') {
    try {
      // Tanzania special handling — TPL sometimes listed under different names
      const isTanzania = ['tpl','crdb_fed','mapinduzi'].includes(league.id);
      
      // First try: fetch by league sportsdbId directly
      const data = await sportsdbFetch(`eventsday.php?d=${fixSelectedDate}&l=${league.sportsdbId}`);
      let evs = data?.events || [];

      // STRICT: Filter by country + league name to prevent cross-country contamination
      // e.g. Norway sportsdbId 4346 should NOT show MLS results  
      if (evs.length > 0) {
        const CTRY_MAP = {
          'kpl':'kenya','npfl':'nigeria','psl':'south africa','egypt':'egypt','ghana':'ghana',
          'uganda':'uganda','rwanda':'rwanda','zambia':'zambia','morocco':'morocco',
          'algeria':'algeria','tunisia':'tunisia','senegal':'senegal','mali':'mali',
          'burkina':'burkina','guinea':'guinea','togo':'togo','benin':'benin',
          'gabon':'gabon','libya':'libya','mozambique':'mozambique','cote':'ivory',
          'cameroon':'cameroon','angola':'angola','drc':'congo','ethiopia':'ethiopia',
          'zimbabwe':'zimbabwe','namibia':'namibia','malawi':'malawi',
          'epl':'england','laliga':'spain','bundesliga':'germany',
          'seriea':'italy','ligue1':'france','eredivisie':'netherlands','primeira':'portugal',
          'jupiler':'belgium','superlig':'turkey','championship':'england','scottish':'scotland',
          'norwegian':'norway','swedish':'sweden','danish':'denmark','swiss':'switzerland',
          'austrian':'austria','greek':'greece','czech':'czech','romanian':'romania',
          'croatian':'croatia','serbian':'serbia','rpl':'russia','ekstraklasa':'poland',
          'ukr':'ukraine','azerbaijani':'azerbaijan','kazakh':'kazakhstan',
          'albanian':'albania','bosnian':'bosnia','slovakian':'slovakia',
          'hungarian':'hungary','bulgarian':'bulgaria','belarusian':'belarus',
          'armenian':'armenia','georgian':'georgia',
          'mls':'united states','brasileirao':'brazil','liga_mx':'mexico',
          'argentina':'argentina','colombia':'colombia','chile':'chile','peru':'peru',
          'ecuador':'ecuador','venezuela':'venezuela','uruguay':'uruguay',
          'paraguay':'paraguay','bolivia':'bolivia',
          'jleague':'japan','kleague':'korea','csl':'china','isl':'india',
          'saudi':'saudi','uae':'emirates','qatar':'qatar','iran':'iran','iraq':'iraq',
          'jordan':'jordan','oman':'oman','a_league':'australia','thailand':'thailand',
          'vleague':'vietnam','mpl':'malaysia','bahrain':'bahrain',
        };
        const reqCountry = CTRY_MAP[league.id];
        if (reqCountry && !isTanzania) {
          const filtered = evs.filter(ev => {
            const ctryL = (ev.strCountry||'').toLowerCase();
            const lgL = (ev.strLeague||'').toLowerCase();
            return ctryL.includes(reqCountry) || lgL.includes(reqCountry);
          });
          if (filtered.length > 0) evs = filtered;
          else evs = []; // No results matching this country — try next source
        } else if (league.id !== 'tpl') {
          // For leagues without country map, filter by league name keyword
          const keyword = league.name.split(' ')[0].toLowerCase();
          const filtered = evs.filter(ev => ev.strLeague?.toLowerCase().includes(keyword));
          if (filtered.length > 0) evs = filtered;
        }
      }

      // Second try: search all soccer events if direct fetch gave nothing — WITH STRICT COUNTRY FILTER
      if (!evs.length) {
        const data2 = await sportsdbFetch(`eventsday.php?d=${fixSelectedDate}&s=Soccer`);
        const allEvs = data2?.events || [];
        
        if (isTanzania) {
          const tanzaniaKeywords = ['tanzania', 'tanzanian', 'tpl', 'crdb', 'mapinduzi'];
          evs = allEvs.filter(ev => {
            const lgLower = (ev.strLeague || '').toLowerCase();
            const ctryLower = (ev.strCountry || '').toLowerCase();
            return tanzaniaKeywords.some(kw => lgLower.includes(kw) || ctryLower.includes(kw));
          });
        } else {
          // STRICT: use country map to avoid cross-country contamination
          const LEAGUE_COUNTRY_MAP = {
            'kpl':'kenya','npfl':'nigeria','psl':'south africa','egypt':'egypt',
            'ghana':'ghana','uganda':'uganda','rwanda':'rwanda','zambia':'zambia',
            'morocco':'morocco','algeria':'algeria','tunisia':'tunisia','senegal':'senegal',
            'mali':'mali','burkina':'burkina','guinea':'guinea','togo':'togo',
            'benin':'benin','gabon':'gabon','libya':'libya','mozambique':'mozambique',
            'cote':'ivory','cameroon':'cameroon','angola':'angola','drc':'congo',
            'ethiopia':'ethiopia','zimbabwe':'zimbabwe','namibia':'namibia','malawi':'malawi',
            'epl':'england','laliga':'spain','bundesliga':'germany','seriea':'italy',
            'ligue1':'france','eredivisie':'netherlands','primeira':'portugal',
            'jupiler':'belgium','superlig':'turkey','championship':'england',
            'scottish':'scotland','swiss':'switzerland','austrian':'austria',
            'greek':'greece','danish':'denmark','swedish':'sweden','norwegian':'norway',
            'czech':'czech','romanian':'romania','croatian':'croatia','serbian':'serbia',
            'rpl':'russia','ekstraklasa':'poland','ukr':'ukraine',
            'azerbaijani':'azerbaijan','kazakh':'kazakhstan','albanian':'albania',
            'bosnian':'bosnia','slovakian':'slovakia','hungarian':'hungary',
            'bulgarian':'bulgaria','belarusian':'belarus','armenian':'armenia','georgian':'georgia',
            'mls':'united states','brasileirao':'brazil','liga_mx':'mexico',
            'argentina':'argentina','colombia':'colombia','chile':'chile',
            'peru':'peru','ecuador':'ecuador','venezuela':'venezuela',
            'uruguay':'uruguay','paraguay':'paraguay','bolivia':'bolivia',
            'jleague':'japan','kleague':'korea','csl':'china','isl':'india',
            'saudi':'saudi','uae':'emirates','qatar':'qatar',
            'iran':'iran','iraq':'iraq','jordan':'jordan','oman':'oman',
            'a_league':'australia','thailand':'thailand','vleague':'vietnam',
            'mpl':'malaysia','bahrain':'bahrain',
          };
          const requiredCountry = LEAGUE_COUNTRY_MAP[league.id];
          const nameParts = league.name.toLowerCase()
            .replace(/[^\w\s]/g,'')
            .split(' ')
            .filter(p => p.length > 3 && !['premier','league','super','first','division','national','professional','ligue'].includes(p));
          
          evs = allEvs.filter(ev => {
            const lgLower = ev.strLeague?.toLowerCase() || '';
            const ctryLower = ev.strCountry?.toLowerCase() || '';
            // Must match country if we know it
            if (requiredCountry && !ctryLower.includes(requiredCountry) && !lgLower.includes(requiredCountry)) return false;
            // Must match at least one distinctive name part
            if (nameParts.length > 0) return nameParts.some(p => lgLower.includes(p));
            return true;
          });
        }
      }

      if (evs.length > 0) {
        const nowMs = Date.now();
        matches = evs.map(ev => normaliseSportsdb(ev, nowMs)).filter(Boolean);
        srcLabel = '📡 TheSportsDB';
      }
      
      // Tanzania last resort: try round-based fetch
      if (!matches.length && isTanzania) {
        try {
          const roundData = await sportsdbFetch(`eventsnextleague.php?id=${league.sportsdbId}`);
          const nextEvs = roundData?.events || [];
          if (nextEvs.length > 0) {
            const nowMs = Date.now();
            matches = nextEvs.map(ev => normaliseSportsdb(ev, nowMs)).filter(Boolean);
            srcLabel = '📡 TheSportsDB (Next)';
          }
        } catch(e2) { console.warn('Tanzania next round fetch:', e2.message); }
      }
    } catch(e) { console.warn('fix src4 TheSportsDB:', e.message); }
  }

  // ── No data found ────────────────────────────────────────────────
  if (!matches.length) {
    const hasAnyKey = APISPORTS_KEY || ALLSPORTS_KEY || SPORTMONKS_KEY;
    out.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:.75rem">
        <span style="font-size:18px">${league.flag}</span>
        <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px">${league.name}</span>
      </div>
      <div style="text-align:center;padding:2rem;color:var(--muted)">
        <div style="font-size:36px">📅</div>
        <div style="margin-top:8px;font-size:13px;font-weight:600">Hakuna mechi tarehe ${fixSelectedDate}</div>
        <div style="font-size:11px;margin-top:6px;line-height:1.5">
          ${!hasAnyKey
            ? `⚠️ Ongeza <strong style="color:var(--warn)">Sportmonks</strong>, <strong style="color:var(--warn)">API-Football</strong> au <strong style="color:var(--warn)">AllSports key</strong> kwenye Admin kwa data sahihi zaidi`
            : `Ligi hii inaweza kuwa na mapumziko leo, au tarehe hii haina mechi zilizopangwa.`}
        </div>
        <button onclick="window._fixPickLeague('${league.id}')" style="margin-top:14px;padding:.5rem 1.25rem;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:12px;cursor:pointer">🔄 Jaribu Tena</button>
      </div>`;
    return;
  }

  // ── Render matches ───────────────────────────────────────────────
  out.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:.75rem;flex-wrap:wrap">
      <span style="font-size:18px">${league.flag}</span>
      <span style="font-family:'Syne',sans-serif;font-weight:800;font-size:14px">${league.name}</span>
      <span style="font-size:11px;color:var(--muted);margin-left:auto">${matches.length} mechi</span>
      <span style="font-size:10px;color:var(--muted);background:rgba(0,0,0,.3);padding:.15rem .5rem;border-radius:8px">${srcLabel}</span>
    </div>
    ${matches.map(m => renderFixCard(
      m.homeTeam, m.awayTeam,
      m.isLive, m.isFinished,
      m.home, m.away,
      m.minute, m.time,
      league.id, true, m.fixtureId
    )).join('')}`;

  window._fixAddBetslip = (teams, lgId) => {
    if (pMatches.length >= MAX_MATCHES) { toast(`Max mechi ${MAX_MATCHES}!`, 'err'); return; }
    const newMatch = { ...newM(), teams, league: lgId };
    pMatches.push(newMatch);
    toast(`✅ ${teams} imeongezwa!`);
    showTab('post');
  };
}

// MIKEKA — shows ALL betslips to everyone (read-only for viewers)
let mkF='ALL',mkQ='',mkView='all'; // mkView: 'all' or 'mine'
function renderMikeka(c){
  const isOwner=currentUser.role==='owner';
  const isAnalyst=currentUser.role==='analyst'||isOwner;
  // Source: all betslips (allMikeka) visible to everyone; 'mine' shows only own
  const source=mkView==='mine'?mikeka:allMikeka;
  const shown=source.filter(m=>mkF==='ALL'||m.status===mkF).filter(m=>!mkQ||m.name?.toLowerCase().includes(mkQ)||(m.matches||[]).some(x=>x.teams?.toLowerCase().includes(mkQ)));
  c.innerHTML=`
    <div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:.75rem">📋 Mikeka Yote</div>
    <div style="display:flex;gap:6px;margin-bottom:.75rem">
      <button onclick="window._mkView('all')" style="flex:1;padding:.45rem;border-radius:10px;border:1.5px solid ${mkView==='all'?'var(--accent)':'var(--border)'};background:${mkView==='all'?'rgba(0,255,133,.12)':'transparent'};color:${mkView==='all'?'var(--accent)':'var(--muted)'};font-weight:700;font-size:12px;cursor:pointer">📡 Yote (${allMikeka.length})</button>
      <button onclick="window._mkView('mine')" style="flex:1;padding:.45rem;border-radius:10px;border:1.5px solid ${mkView==='mine'?'var(--accent)':'var(--border)'};background:${mkView==='mine'?'rgba(0,255,133,.12)':'transparent'};color:${mkView==='mine'?'var(--accent)':'var(--muted)'};font-weight:700;font-size:12px;cursor:pointer">👤 Yangu (${mikeka.length})</button>
    </div>
    <input class="inp" id="mk-q" placeholder="🔍 Tafuta mkeka au timu..." value="${mkQ}" style="margin-bottom:.75rem"/>
    <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:.75rem">
      ${['ALL','PENDING','WON','LOST','CASHOUT','VOID'].map(f=>`<button class="btn-outline ${mkF===f?'active':''}" onclick="window._mkF('${f}')" style="${mkF===f?`border-color:${sc(f)};background:${sc(f)}22;color:${sc(f)}`:''}">
        ${f} <span style="opacity:.6">${source.filter(m=>f==='ALL'||m.status===f).length}</span></button>`).join('')}
    </div>
    ${shown.length===0?'<div class="empty"><div style="font-size:44px">📋</div><div style="margin-top:8px">Hakuna mikeka</div></div>':shown.map(m=>mkCard(m,false)).join('')}`;
  el('mk-q').oninput=(e)=>{mkQ=e.target.value.toLowerCase();renderMikeka(c);};
  window._mkF=(f)=>{mkF=f;renderMikeka(c);};
  window._mkView=(v)=>{mkView=v;renderMikeka(c);};
  c.querySelectorAll('[data-exp]').forEach(btn=>{
    btn.onclick=()=>{const d=el('det-'+btn.dataset.exp);if(d)d.style.display=d.style.display==='none'?'block':'none';};
  });
}

function mkCard(m,mini){
  const matches=m.matches||[];
  const posterName=m.users?.name||(m.user_id===currentUser.id?currentUser.name:null);
  const isOwn=m.user_id===currentUser.id;
  const isOwner=currentUser.role==='owner';
  const isAnalyst=currentUser.role==='analyst'||isOwner;
  const canEdit=isOwn&&isAnalyst&&m.status==='PENDING';
  const canCashout=isOwn&&isAnalyst&&m.status==='PENDING';
  const isCashout=m.status==='CASHOUT';
  const statusEmoji=m.status==='WON'?'🟢':m.status==='LOST'?'🔴':m.status==='CASHOUT'?'💵':m.status==='VOID'?'⚪':'🟡';

  // Build per-match rows with live score integration
  function matchRow(match, i) {
    const sc2 = findScore(match.teams);
    const isLive  = sc2?.isLive;
    const isFT    = sc2?.isFinished;
    const hg = sc2 ? sc2.home : null;
    const ag = sc2 ? sc2.away : null;
    const min = sc2?._estimatedMinute || sc2?.minuteNum || 0;
    const minDisplay = sc2?.minute || '';
    const outcomeColor = match.outcome==='WIN'?'var(--win)':match.outcome==='LOSS'?'var(--loss)':match.outcome==='VOID'?'var(--muted)':'var(--warn)';
    const scoreChip = (isLive||isFT) && hg!==null && ag!==null
      ? `<span style="background:${isLive?'rgba(255,68,68,.15)':'rgba(0,0,0,.3)'};border:1px solid ${isLive?'rgba(255,68,68,.5)':'rgba(255,255,255,.1)'};border-radius:8px;padding:.15rem .5rem;font-size:12px;font-weight:800;color:${isLive?'var(--danger)':'var(--muted)'};margin-left:4px">${hg} - ${ag}</span>`
      : '';
    const minChip = isLive
      ? `<span style="font-size:9px;color:var(--danger);animation:pulse 1s infinite;font-weight:700;display:inline-block;margin-left:3px">${minDisplay||'LIVE'}</span>`
      : isFT ? `<span style="font-size:9px;color:var(--muted);font-weight:700;margin-left:3px">FT</span>` : '';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;${i<matches.length-1?'border-bottom:1px solid #0d1f14':''}">
      <div style="flex:1">
        <div style="font-size:12px;font-weight:600;display:flex;align-items:center;flex-wrap:wrap;gap:2px">
          ${lgFlag(match.league)} ${match.teams}${scoreChip}${minChip}
        </div>
        <div style="font-size:10px;color:var(--muted)">${lgName(match.league)} · ${match.market} · ${match.pick}</div>
      </div>
      <div style="text-align:right;margin-left:8px">
        <div style="font-size:12px">${match.odds}x</div>
        <div style="font-size:10px;font-weight:700;color:${outcomeColor};background:${outcomeColor}22;padding:.1rem .4rem;border-radius:6px">${match.outcome||'PENDING'}</div>
      </div>
    </div>`;
  }

  // Count live matches for header badge
  const liveCount = m.status==='PENDING' ? matches.filter(match=>findScore(match.teams)?.isLive).length : 0;
  const liveBadge = liveCount>0
    ? `<span style="background:rgba(255,68,68,.15);border:1px solid rgba(255,68,68,.4);border-radius:12px;padding:.1rem .5rem;font-size:9px;font-weight:700;color:var(--danger);animation:pulse 1.5s infinite;margin-left:6px">🔴 ${liveCount} LIVE</span>`
    : '';

  return`<div style="background:var(--surface);border:1px solid ${isOwn?'rgba(0,255,133,.25)':'var(--border)'};border-radius:16px;margin-bottom:.6rem;overflow:hidden">
    <div data-exp="${m.id}" style="padding:.85rem;cursor:${mini?'default':'pointer'};display:flex;justify-content:space-between;align-items:center">
      <div style="flex:1">
        <div style="font-weight:600;font-size:13px;display:flex;align-items:center;flex-wrap:wrap">${statusEmoji} ${m.name||'Mkeka #'+m.id.slice(-4)}${liveBadge}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">
          ${posterName?`👤 <span style="color:${isOwn?'var(--accent)':'var(--muted)'};">${posterName}</span> · `:''}${m.date} · ${matches.length} mechi · TZS ${fmt(m.stake)}
        </div>
        ${isCashout&&m.cashout_amount?`<div style="font-size:11px;color:var(--info);margin-top:2px;font-weight:600">💵 Cashout: TZS ${fmt(m.cashout_amount)}</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <div style="background:${sc(m.status)}22;color:${sc(m.status)};padding:.15rem .55rem;border-radius:20px;font-size:10px;font-weight:700">${m.status}</div>
        <div style="font-size:12px;color:var(--accent);font-weight:600">${(m.total_odds||1).toFixed(2)}x</div>
      </div>
    </div>
    ${!mini?`<div id="det-${m.id}" style="display:none;border-top:1px solid var(--border);padding:.75rem">
      ${matches.map((match,i)=>matchRow(match,i)).join('')}
      <div style="margin-top:.75rem;padding:.6rem;background:rgba(0,0,0,.3);border-radius:10px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:${isCashout?'6px':'0'}">
          <span style="color:var(--muted)">Potential Return:</span><span style="color:var(--accent);font-weight:700">${displayVal(m.potential_return||0)}</span>
        </div>
        ${isCashout&&m.cashout_amount?`
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">
          <span style="color:var(--muted)">Cashout Iliyopokelewa:</span><span style="color:var(--info);font-weight:700">TZS ${fmt(m.cashout_amount)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span style="color:var(--muted)">Faida/Hasara vs Stake:</span>

window._editMkeka = async (mkId) => {

  if (!mk) return toast('Mkeka haipatikani', 'err');
  const matches = mk.matches || [];
  const allRegions = [...new Set(LEAGUES.map(l => l.region))];

  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.id = 'edit-modal';

  const matchesHtml = matches.map((match, i) => `
    <div style="background:rgba(0,0,0,.25);border-radius:10px;padding:.75rem;margin-bottom:8px">
      <div style="font-size:10px;font-weight:700;color:var(--accent);margin-bottom:6px">Mechi ${i+1}</div>
      <input class="inp-sm" id="edit-teams-${match.id}" value="${match.teams||''}" placeholder="Timu A vs Timu B" style="margin-bottom:6px"/>
      <div class="grid-2" style="margin-bottom:6px">
        <select class="inp-sm" id="edit-league-${match.id}">
          ${allRegions.map(r=>`<optgroup label="${r}">${LEAGUES.filter(l=>l.region===r).map(l=>`<option value="${l.id}" ${match.league===l.id?'selected':''}>${l.flag} ${l.name}</option>`).join('')}</optgroup>`).join('')}
        </select>
        <select class="inp-sm" id="edit-market-${match.id}">
          ${MARKETS.map(mk=>`<option value="${mk}" ${match.market===mk?'selected':''}>${mk}</option>`).join('')}
        </select>
      </div>
      <div class="grid-2">
        <input class="inp-sm" id="edit-pick-${match.id}" value="${match.pick||''}" placeholder="Pick (1X, Over 2.5...)"/>
        <input class="inp-sm" id="edit-odds-${match.id}" value="${match.odds||''}" type="number" step="0.01" min="1.01" max="50" placeholder="Odds"/>
      </div>
    </div>`).join('');

  ov.innerHTML = `
    <div class="modal-box" style="max-height:90vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
        <div style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800">✏️ Edit Mkeka</div>
        <button onclick="document.getElementById('edit-modal').remove()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer">×</button>
      </div>
      <div style="margin-bottom:10px">
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px">Jina la Mkeka</div>
        <input class="inp" id="edit-name" value="${mk.name||''}" placeholder="Jina la mkeka"/>
      </div>
      <div class="grid-2" style="margin-bottom:10px">
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px">Tarehe</div>
          <input type="date" class="inp-sm" id="edit-date" value="${mk.date||today()}"/>
        </div>
        <div>
          <div style="font-size:10px;color:var(--muted);margin-bottom:4px">Stake (TZS)</div>
          <input type="number" class="inp-sm" id="edit-stake" value="${mk.stake||5000}"/>
        </div>
      </div>
      <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:8px">Mechi (${matches.length})</div>
      ${matchesHtml}
      <div style="margin-bottom:10px">
        <div style="font-size:10px;color:var(--muted);margin-bottom:4px">Analysis</div>
        <textarea class="inp-sm" id="edit-ana" rows="2" placeholder="Analysis yako...">${mk.analysis||''}</textarea>
      </div>
      <button id="edit-save-btn" style="width:100%;padding:.9rem;border-radius:14px;border:none;background:var(--accent);color:#000;font-weight:700;font-size:15px;cursor:pointer">💾 Hifadhi Mabadiliko</button>
    </div>`;
  document.body.appendChild(ov);
  ov.onclick = (e) => { if(e.target===ov) ov.remove(); };

  document.getElementById('edit-save-btn').onclick = async () => {
    const btn = document.getElementById('edit-save-btn');
    btn.textContent = 'Inasave...'; btn.disabled = true;

    const newName = document.getElementById('edit-name')?.value || mk.name;
    const newDate = document.getElementById('edit-date')?.value || mk.date;
    const newStake = parseInt(document.getElementById('edit-stake')?.value || mk.stake);

    // Update each match
    for (const match of matches) {
      const newTeams  = document.getElementById(`edit-teams-${match.id}`)?.value || match.teams;
      const newLeague = document.getElementById(`edit-league-${match.id}`)?.value || match.league;
      const newMarket = document.getElementById(`edit-market-${match.id}`)?.value || match.market;
      const newPick   = document.getElementById(`edit-pick-${match.id}`)?.value || match.pick;
      const newOdds   = parseFloat(document.getElementById(`edit-odds-${match.id}`)?.value || match.odds);
      await sb.from('matches').update({teams:newTeams,league:newLeague,market:newMarket,pick:newPick,odds:newOdds}).eq('id',match.id);
    }

    // Recalculate odds & potential return
    const newOddsArr = matches.map(match => parseFloat(document.getElementById(`edit-odds-${match.id}`)?.value || match.odds));
    const newTotalOdds = newOddsArr.reduce((p,o)=>p*(o||1),1);
    const newPotRet = Math.round(newTotalOdds * newStake);
    const newAna = document.getElementById('edit-ana')?.value || '';

    const {error} = await sb.from('mikeka').update({
      name: newName, date: newDate, stake: newStake,
      total_odds: newTotalOdds, potential_return: newPotRet, analysis: newAna
    }).eq('id', mkId);

    btn.textContent = '💾 Hifadhi Mabadiliko'; btn.disabled = false;
    if (error) return toast('Hitilafu: ' + error.message, 'err');
    toast('✅ Mkeka umesasishwa!');
    ov.remove();
    await loadData();
    showTab('mikeka');
  };
};

    const { error } = await sb.from('mikeka').update({

      cashout_amount: amt

    if (error) {
      btn.textContent = '✅ Thibitisha Cashout'; btn.disabled = false;
      return toast('Hitilafu: ' + error.message, 'err');
    }

    // Stake iliishapigwa wakati wa POST — ongeza cashout amount tu kurudi bankroll
    const newBankroll = currentUser.bankroll + amt;
    await updateUser({ bankroll: newBankroll });

    toast(`💵 Cashout ya TZS ${fmt(amt)} imesajiliwa!`, 'ok');
    ov.remove();
    await loadData();
    showTab('mikeka');
  };
};

let pMatches=[],pChecks=[false,false,false,false],kOn=false,kProb=55;

      <input type="file" id="ocr-in" accept="image/*,image/jpeg,image/png,image/webp" capture="environment" style="position:absolute;opacity:0;pointer-events:none;width:1px;height:1px"/>

    <div style="background:${allOk?'#0f3520':'#1f1a00'};border:1px solid ${allOk?'rgba(0,255,133,.3)':'rgba(255,170,0,.3)'};border-radius:14px;padding:1rem;margin-bottom:.9rem">
      <div style="font-size:12px;font-weight:700;color:${allOk?'var(--win)':'var(--warn)'};margin-bottom:10px">${allOk?'✅ Checklist Imekamilika!':'⚠️ Pre-Bet Checklist'}</div>
      ${['Nimefanya research ya kutosha','Odds hizi zina value','Siko kwenye loss streak kubwa','Mechi zote ni kutoka leagues ninazojua'].map((l,i)=>`
        <div onclick="window._chk(${i})" style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;cursor:pointer">
          <div style="width:18px;height:18px;border-radius:5px;border:2px solid ${pChecks[i]?'var(--win)':'var(--muted)'};background:${pChecks[i]?'rgba(0,255,133,.2)':'transparent'};flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--win)">${pChecks[i]?'✓':''}</div>

      ${risk.flags.map(f=>`<div class="red-flag"><span>${f.icon}</span><span style="font-size:12px;color:var(--danger)">${f.msg}</span></div>`).join('')}

    <input class="inp" id="post-name" placeholder="Jina la mkeka (optional)" style="margin-bottom:10px"/>
    <div class="grid-2" style="margin-bottom:10px">
      <div><div style="font-size:10px;color:var(--muted);margin-bottom:4px">Tarehe</div><input type="date" class="inp-sm" id="post-date" value="${today()}"/></div>

    </div>
    <div class="card" style="margin-bottom:.9rem">
      <div style="display:flex;justify-content:space-between;align-items:center${kOn?';margin-bottom:12px':''}">
        <div style="font-size:12px;font-weight:700;color:var(--accent)">🧮 Kelly Criterion</div>
        <button class="btn-outline ${kOn?'active':''}" onclick="window._kTog()">${kOn?'Ficha':'Tumia'}</button>
      </div>
      ${kOn?`<input type="range" min="30" max="80" value="${kProb}" oninput="window._kSlide(this.value)" style="width:100%;accent-color:var(--accent);margin-bottom:8px"/>
      <div class="grid-2" style="margin-bottom:8px">
        <div style="background:rgba(0,0,0,.3);padding:.6rem;border-radius:8px;text-align:center"><div style="font-size:10px;color:var(--muted)">Win Prob</div><div style="font-weight:700;color:var(--accent)" id="k-pct">${kProb}%</div></div>
        <div style="background:rgba(0,0,0,.3);padding:.6rem;border-radius:8px;text-align:center"><div style="font-size:10px;color:var(--muted)">Stake Bora</div><div style="font-weight:700;color:var(--accent)">TZS ${fmt(kStake)}</div></div>
      </div>
      <button class="btn-ghost" onclick="window._kApply(${kStake})">↑ Tumia TZS ${fmt(kStake)}</button>`:''}
    </div>
    <div style="font-size:13px;font-weight:700;margin-bottom:8px">Mechi (${pMatches.length}/${MAX_MATCHES})</div>
    <div id="matches-con">${pMatches.map((m,i)=>mHTML(m,i,regions)).join('')}</div>
    <button onclick="window._addM()" style="width:100%;padding:.65rem;border-radius:10px;border:1.5px dashed var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;margin-bottom:.9rem">+ Ongeza Mechi</button>
    <textarea class="inp-sm" id="post-ana" placeholder="Analysis yako — mbona umichagua mikeka hii?" rows="3" style="margin-bottom:.9rem"></textarea>
    <div style="background:linear-gradient(135deg,#0f3520,#092518);border:1px solid rgba(0,255,133,.2);border-radius:14px;padding:1rem;margin-bottom:.9rem">
      ${[['Total Odds',tOdds.toFixed(2)+'x','var(--text)'],['Stake','TZS '+fmt(stake),'var(--text)'],['Potential Return','TZS '+fmt(potRet),'var(--win)'],['Faida','TZS '+fmt(potRet-stake),(potRet-stake)>=0?'var(--win)':'var(--loss)']].map(([l,v,col])=>`
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px"><span style="color:var(--muted)">${l}</span><span style="font-weight:700;color:${col}">${v}</span></div>`).join('')}
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-primary" id="analyze-btn" onclick="window._analyzeMkeka()" style="flex:1;background:linear-gradient(135deg,#00ff85,#00c965)">🤖 Analyze Mkeka</button>
      <button id="post-btn" onclick="window._post()" style="flex:0 0 auto;padding:.9rem 1.1rem;border-radius:14px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer">📤 Post</button>
    </div>`;

  wireInps();

  // OCR handler - robust version for mobile
  const ocrInput = el('ocr-in');
  if(ocrInput){
    // Remove old listeners
    const newInput = ocrInput.cloneNode(true);
    ocrInput.parentNode.replaceChild(newInput, ocrInput);
    newInput.addEventListener('change', async function(e){
      const file = e.target.files && e.target.files[0];
      if(!file){toast('Hakuna picha iliyochaguliwa','warn');return;}
      if(!GEMINI_KEY){toast('Weka OpenRouter API key kwenye Admin kwanza!','err');return;}
      // Show loading state
      const txt = el('ocr-txt');
      const lbl = el('ocr-label');
      if(txt) txt.textContent = '🤖 OpenRouter AI inasoma picha...';
      if(lbl) lbl.style.borderColor = 'var(--accent)';
      toast('📸 Picha imepokelewa — AI inasoma...','info');
      const reader = new FileReader();
      reader.onload = async(ev) => {
        try{
          const b64 = ev.target.result.split(',')[1];
          const extracted = await ocrImage(b64, file.type);
          if(extracted && extracted.length > 0){
            pMatches = extracted.slice(0, MAX_MATCHES).map(m=>({
              ...newM(),
              teams: m.teams||'',
              market: MARKETS.includes(m.market) ? m.market : 'Double Chance',
              odds: m.odds||'',
              pick: m.pick||m.market||''
            }));
            toast('✅ Mechi '+extracted.length+' zimepatikana!');
            renderPost(c);
          } else {
            if(txt) txt.textContent = '⚠️ Mechi hazipatikani — Jaza manually';
            toast('Mechi hazipatikani kwenye picha','warn');
          }
        }catch(err){
          if(txt) txt.textContent = '❌ Hitilafu — Jaribu tena';
          toast('Hitilafu: '+err.message,'err');
        }
      };
      reader.onerror = () => toast('Imeshindwa kusoma picha','err');
      reader.readAsDataURL(file);
    });
  }
  window._chk=(i)=>{pChecks[i]=!pChecks[i];renderPost(c);};
  window._kTog=()=>{kOn=!kOn;renderPost(c);};
  window._kSlide=(v)=>{kProb=parseInt(v);const p=el('k-pct');if(p)p.textContent=v+'%';};
  window._kApply=(s)=>{const i=el('post-stake');if(i)i.value=s;renderPost(c);};
  window._addM=()=>{if(pMatches.length>=MAX_MATCHES)return toast(`Max mechi ${MAX_MATCHES}!`,'err');pMatches.push(newM());renderPost(c);};
  window._delM=(id)=>{if(pMatches.length>1){pMatches=pMatches.filter(m=>m._id!==id);renderPost(c);}};
  window._analyzeMkeka=()=>showMkekaAIAnalysis();
  window._post=async()=>{
    if(!pChecks.every(Boolean))return toast('Kamilisha checklist kwanza!','warn');
    readInps();
    if(!pMatches.every(m=>m.teams&&m.odds))return toast('Jaza mechi zote vizuri!','err');
    const streak=getStreak();
    if(streak.type==='LOSS'&&streak.count>=LOSS_STREAK_LIMIT)return toast('🚨 Loss streak! Pumzika kwanza!','err');
    const name=el('post-name')?.value||`Mkeka ${mikeka.length+1}`;
    const date=el('post-date')?.value||today();
    const stake=parseInt(el('post-stake')?.value||5000);
    if(stake > currentUser.bankroll) return toast(`Bankroll haitoshi! Una TZS ${fmt(currentUser.bankroll)} tu`,'err');
    const ana=el('post-ana')?.value||'';
    const tOdds=pMatches.reduce((p,m)=>p*(parseFloat(m.odds)||1),1);
    const potRet=Math.round(tOdds*stake);
    const mId=uid();
    const btn=el('post-btn');btn.textContent='Inasave...';btn.disabled=true;
    // ── KWANZA: ingiza mkeka ──────────────────────────────────────────
    const{error:e1}=await sb.from('mikeka').insert({id:mId,user_id:currentUser.id,name,date,stake,total_odds:tOdds,potential_return:potRet,analysis:ana,status:'PENDING'});
    if(e1){btn.textContent='📤 Post Mkeka';btn.disabled=false;return toast('Hitilafu: '+e1.message,'err');}
    // ── PILI: ingiza matches ──────────────────────────────────────────
    const{error:e2}=await sb.from('matches').insert(pMatches.map(m=>({id:uid(),mkeka_id:mId,teams:m.teams,league:m.league,market:m.market,pick:m.pick,odds:parseFloat(m.odds),outcome:'PENDING'})));
    if(e2){
      // Rollback — futa mkeka iliyoingizwa
      await sb.from('mikeka').delete().eq('id',mId);
      btn.textContent='📤 Post Mkeka';btn.disabled=false;
      return toast('Hitilafu ya mechi: '+e2.message,'err');
    }
    btn.textContent='📤 Post Mkeka';btn.disabled=false;
    // ── TATU: toa stake (baada ya mikeka na matches zote kufaulu) ─────
    const newBk = currentUser.bankroll - stake;
    await updateUser({ bankroll: newBk });
    toast(`Mkeka umewekwa! 🎯 Stake -${displayVal(stake)}`);
    pMatches=[newM()];pChecks=[false,false,false,false];
    await loadData();showTab('mikeka');
  };
}

function renderResults(c){
  const pending=mikeka.filter(m=>m.status==='PENDING');
  if(!pending.length){c.innerHTML=`<div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:1rem">✅ Rekodi Matokeo</div><div class="empty"><div style="font-size:44px">✅</div><div style="margin-top:8px">Hakuna mkeka unaosubiri</div></div>`;return;}
  c.innerHTML=`<div style="font-family:'Syne',sans-serif;font-size:17px;font-weight:800;margin-bottom:1rem">✅ Rekodi Matokeo</div>
    ${pending.map(m=>`<div class="card" style="padding:0;overflow:hidden;margin-bottom:.75rem">
      <div style="padding:.85rem;border-bottom:1px solid var(--border)">
        <div style="font-weight:700">${m.name||'Mkeka'}</div>
        <div style="font-size:11px;color:var(--muted)">${m.date} · ${(m.total_odds||1).toFixed(2)}x · ${displayVal(m.potential_return||0)}</div>
      </div>
      ${(m.matches||[]).map((match,i)=>`<div style="padding:.75rem;border-bottom:${i<m.matches.length-1?'1px solid #0d1f14':'none'}">
        <div style="font-size:12px;font-weight:600;margin-bottom:2px">${lgFlag(match.league)} ${match.teams}</div>
        <div style="font-size:10px;color:var(--muted);margin-bottom:8px">${match.market} · ${match.pick} @ ${match.odds}x</div>
        <div style="display:flex;gap:6px">
          ${['WIN','LOSS','VOID'].map(o=>`<button onclick="window._out('${m.id}','${match.id}','${o}')" style="flex:1;padding:.4rem;border-radius:20px;border:1.5px solid ${match.outcome===o?sc(o):'var(--border)'};background:${match.outcome===o?sc(o)+'22':'transparent'};color:${match.outcome===o?sc(o):'var(--muted)'};font-weight:700;font-size:11px;cursor:pointer">${o}</button>`).join('')}
        </div>
      </div>`).join('')}
    </div>`).join('')}`;
  window._out=async(mId,matchId,outcome)=>{
    await sb.from('matches').update({outcome}).eq('id',matchId);
    const{data:all}=await sb.from('matches').select('*').eq('mkeka_id',mId);
    const allDone=all.every(m=>m.outcome!=='PENDING');
    if(allDone){
      const hasLoss=all.some(m=>m.outcome==='LOSS'),allVoid=all.every(m=>m.outcome==='VOID');
      const newS=hasLoss?'LOST':allVoid?'VOID':'WON';
      // Kinga: angalia hali ya sasa kabla ya kubadilisha (epuka double-settle)
      const{data:mkCurrent}=await sb.from('mikeka').select('status').eq('id',mId).maybeSingle();
      if(mkCurrent?.status !== 'PENDING') { await loadData(); renderResults(c); return; }
      await sb.from('mikeka').update({status:newS}).eq('id',mId);
      const mk=mikeka.find(m=>m.id===mId);
      if(newS==='WON'&&mk){
        // Always fetch fresh bankroll before crediting
        const{data:fu}=await sb.from('users').select('bankroll').eq('id',currentUser.id).maybeSingle();
        const freshBk = fu?.bankroll ?? currentUser.bankroll;
        const payout = mk.potential_return || 0;
        await updateUser({bankroll: freshBk + payout});
        toast(`🎉 Umeshinda! +${displayVal(payout)} (faida: +TZS ${fmt(payout - (mk.stake||0))})`);
      } else if(newS==='LOST') {
        // Stake tayari ilipigwa — hakuna kubadilisha
        toast('Mkeka umepoteza. Jaribu tena! 💪','warn');
      } else if(newS==='VOID') {
        // VOID: rudisha stake tu
        const{data:fu2}=await sb.from('users').select('bankroll').eq('id',currentUser.id).maybeSingle();
        const freshBk2 = fu2?.bankroll ?? currentUser.bankroll;
        const stakeBack = mk?.stake || 0;
        if(stakeBack > 0) await updateUser({bankroll: freshBk2 + stakeBack});
        toast(`⬜ VOID — Stake ya TZS ${fmt(stakeBack)} imerudishwa`,'info');
      }
    }
    await loadData();renderResults(c);
  };
}

.container{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
.header{background:linear-gradient(135deg,#0f3520,#05110a);border:1px solid rgba(0,255,133,.2);border-radius:24px;padding:2.5rem 2rem;margin-bottom:2rem;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:-50%;right:-10%;width:400px;height:400px;background:radial-gradient(circle,rgba(0,255,133,.08),transparent 70%);pointer-events:none}
.logo{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#00ff85,#00c965);font-size:28px;margin-bottom:1.25rem;box-shadow:0 0 30px rgba(0,255,133,.3)}
h1{font-family:'Syne',sans-serif;font-size:2.2rem;font-weight:800;color:#00ff85;letter-spacing:-1px;margin-bottom:.25rem}
.subtitle{font-size:13px;color:#4a7a5a;margin-bottom:1.5rem}
.meta{display:flex;gap:1.5rem;flex-wrap:wrap;font-size:12px;color:#4a7a5a}
.meta strong{color:#e4f0e8}
.grade-badge{position:absolute;top:2rem;right:2rem;font-family:'Syne',sans-serif;font-size:4rem;font-weight:800;color:${gradeColor};opacity:.9}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem}
@media(max-width:600px){.stats-grid{grid-template-columns:1fr 1fr}}
.stat-card{background:#0c1f13;border:1px solid #1a3522;border-radius:16px;padding:1.25rem;text-align:center}
.stat-icon{font-size:1.75rem;margin-bottom:.5rem}
.stat-value{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:.25rem}
.stat-label{font-size:11px;color:#4a7a5a;text-transform:uppercase;letter-spacing:.5px}
.section{background:#0c1f13;border:1px solid #1a3522;border-radius:16px;padding:1.5rem;margin-bottom:1.5rem}
.section-title{font-family:'Syne',sans-serif;font-size:1rem;font-weight:700;color:#00ff85;margin-bottom:1.25rem;display:flex;align-items:center;gap:.5rem}
.bar-container{background:rgba(0,0,0,.4);border-radius:20px;height:10px;overflow:hidden;margin-bottom:.25rem}
.bar-fill{height:100%;background:linear-gradient(90deg,#00ff85,#00c965);border-radius:20px}
.progress-labels{display:flex;justify-content:space-between;font-size:11px;color:#4a7a5a}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:700;color:#4a7a5a;text-transform:uppercase;letter-spacing:.5px;padding:.6rem .75rem;border-bottom:2px solid #1a3522}
td{padding:.65rem .75rem;border-bottom:1px solid #0d1f14;font-size:13px;vertical-align:top}
tr:last-child td{border-bottom:none}
.profit-box{background:linear-gradient(135deg,${parseFloat(profit)>=0?'#0f3520,#092518':'#2a0808,#1a0505'});border:1px solid ${parseFloat(profit)>=0?'rgba(0,255,133,.3)':'rgba(255,68,68,.3)'};border-radius:16px;padding:1.5rem;text-align:center;margin-bottom:2rem}
.profit-amount{font-family:'Syne',sans-serif;font-size:2.5rem;font-weight:800;color:${parseFloat(profit)>=0?'#00ff85':'#ff4444'}}
.footer{text-align:center;padding:2rem;color:#4a7a5a;font-size:12px;border-top:1px solid #1a3522;margin-top:2rem}
@media print{body{background:#fff;color:#000}.header{background:#f0f8f0;border-color:#ccc}h1{color:#006633}.stat-card{background:#f9fff9;border-color:#ccc}.section{background:#f9fff9;border-color:#ccc}table td{color:#000}th{color:#333}.profit-box{background:#f0fff0;border-color:#ccc}.profit-amount{color:${parseFloat(profit)>=0?'#006633':'#cc0000'}}.bar-fill{background:#006633}}
</style>
</head>
<body>
<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="logo">📊</div>
    <h1>NJEM Tipps</h1>
    <div class="subtitle">Ripoti ya Uchambuzi wa Kubeti — ${periodLabel}</div>
    <div class="meta">
      <span><strong>👤 Bettor:</strong> ${currentUser.name}</span>
      <span><strong>📅 Tarehe:</strong> ${exportDate}</span>
      <span><strong>📊 Mikeka:</strong> ${allData.length}</span>
    </div>
    <div class="grade-badge">${gradeVal}</div>
  </div>

  <!-- Profit/Loss Banner -->
  <div class="profit-box">
    <div style="font-size:13px;color:#4a7a5a;margin-bottom:.5rem;text-transform:uppercase;letter-spacing:1px">JUMLA YA FAIDA / HASARA</div>
    <div class="profit-amount">${parseFloat(profit)>=0?'+':''}TZS ${fmt(profit)}</div>
    <div style="font-size:13px;color:#4a7a5a;margin-top:.5rem">ROI: <strong style="color:${parseFloat(roi)>=0?'#00ff85':'#ff4444'}">${roi}%</strong> · Win Rate: <strong style="color:${parseFloat(wr)>=50?'#00ff85':'#ff4444'}">${wr}%</strong></div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon">📋</div>
      <div class="stat-value" style="color:#e4f0e8">${fil.length}</div>
      <div class="stat-label">Mikeka Yote</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">✅</div>
      <div class="stat-value" style="color:#00e676">${won.length}</div>
      <div class="stat-label">Imeshinda</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">❌</div>
      <div class="stat-value" style="color:#ff4444">${lost.length}</div>
      <div class="stat-label">Imepoteza</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">⏳</div>
      <div class="stat-value" style="color:#ffaa00">${fil.filter(m=>m.status==='PENDING').length}</div>
      <div class="stat-label">Inasubiri</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">💸</div>
      <div class="stat-value" style="color:#e4f0e8;font-size:1.1rem">TZS ${fmt(staked)}</div>
      <div class="stat-label">Jumla Staked</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">💰</div>
      <div class="stat-value" style="color:#00e676;font-size:1.1rem">TZS ${fmt(ret)}</div>
      <div class="stat-label">Jumla Return</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🎯</div>
      <div class="stat-value" style="color:${parseFloat(wr)>=50?'#00e676':'#ff4444'}">${wr}%</div>
      <div class="stat-label">Win Rate</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📈</div>
      <div class="stat-value" style="color:${parseFloat(roi)>=0?'#00e676':'#ff4444'}">${roi}%</div>
      <div class="stat-label">ROI</div>
    </div>
  </div>

  <!-- Win Rate Bar -->
  <div class="section">
    <div class="section-title">📊 Uwiano wa Win / Loss</div>
    <div class="bar-container">
      <div class="bar-fill" style="width:${Math.min(parseFloat(wr)||0,100)}%"></div>
    </div>
    <div class="progress-labels">
      <span>❌ Lost: ${lost.length}</span>
      <span style="color:#00e676;font-weight:700">${wr}% WIN RATE</span>
      <span>✅ Won: ${won.length}</span>
    </div>
  </div>

  <!-- League Performance -->
  ${lgRows ? `<div class="section">
    <div class="section-title">🏆 Utendaji kwa Ligi</div>
    <table>
      <thead><tr><th>Ligi</th><th>Mechi</th><th>WIN</th><th>LOSS</th><th>Win%</th></tr></thead>
      <tbody>${lgRows}</tbody>
    </table>
  </div>` : ''}

  <!-- Mikeka History -->
  <div class="section">
    <div class="section-title">📋 Historia ya Mikeka ${allData.length > 50?'(50 za kwanza)':''}</div>
    <table>
      <thead>
        <tr>
          <th>Mkeka</th><th>Tarehe</th><th>Hali</th><th>Stake</th><th>Return</th><th>Faida/Hasara</th><th>Odds</th>
        </tr>
      </thead>
      <tbody>${mkRows}</tbody>
    </table>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div style="font-size:1.5rem;margin-bottom:.5rem">📊</div>
    <div style="font-weight:700;color:#00ff85;font-family:'Syne',sans-serif;margin-bottom:.25rem">NJEM TIPPS v2.0</div>
    <div>Ripoti ilizalishwa tarehe ${exportDate}</div>
    <div style="margin-top:.5rem">📞 NJEM MABULA: <strong style="color:#e4f0e8">0764674285</strong></div>
    <div style="margin-top:.75rem;font-size:10px;opacity:.6">⚠️ Ripoti hii ni kwa matumizi ya kibinafsi tu. Kubeti kunaweza kuleta hasara. Weka kwa akili.</div>
  </div>
</div>
</body>
</html>`;
        const blob = new Blob([htmlReport], {type:'text/html;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download=fileName+'.html';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('✅ Ripoti ya Kitaalamu imepakuliwa!','ok');
        
      } else if (format === 'csv') {
        // Build CSV
        let csv = 'Mkeka,Tarehe,Hali,Stake (TZS),Return (TZS),Faida (TZS),Odds,Mechi,Masoko\n';
        allData.forEach(m => {
          const matches = (m.matches||[]).map(x => `${x.teams}(${x.market}@${x.odds}x→${x.outcome||'PENDING'})`).join('; ');
          const markets = (m.matches||[]).map(x => x.market).join('; ');
          const profit2 = m.status==='WON' ? (m.potential_return||0) - (m.stake||0) : m.status==='LOST' ? -(m.stake||0) : 0;
          csv += `"${m.name||'Mkeka'}","${m.date}","${m.status}","${m.stake||0}","${m.status==='WON'?m.potential_return||0:0}","${profit2}","${(m.total_odds||1).toFixed(2)}","${matches}","${markets}"\n`;
        });
        const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download=fileName+'.csv';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('✅ CSV imepakuliwa!','ok');
        
      } else if (format === 'json') {
        const exportData = {
          exported_by: currentUser.name,
          exported_at: new Date().toISOString(),
          period: rP,
          summary: { total: fil.length, won: won.length, lost: lost.length, win_rate: wr+'%', roi: roi+'%', total_staked: staked, total_return: ret, profit },
          mikeka: allData.map(m => ({
            id: m.id, name: m.name||'Mkeka', date: m.date, status: m.status,
            stake: m.stake, potential_return: m.potential_return, total_odds: m.total_odds,
            matches: (m.matches||[]).map(x => ({ teams: x.teams, league: lgName(x.league), market: x.market, pick: x.pick, odds: x.odds, outcome: x.outcome }))
          }))
        };
        const blob = new Blob([JSON.stringify(exportData, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download=fileName+'.json';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('✅ JSON imepakuliwa!','ok');
        
      } else if (format === 'txt') {
        const hr = '━'.repeat(40);
        let txt = `\n${hr}\n  🏆 NJEM TIPPS — HISTORIA YA MIKEKA\n${hr}\n`;
        txt += `\n👤 Mtu: ${currentUser.name}\n`;
        txt += `📅 Kipindi: ${rP==='week'?'Wiki hii':rP==='month'?'Mwezi huu':rP==='year'?'Mwaka huu':'Yote'}\n`;
        txt += `📆 Tarehe ya Export: ${new Date().toLocaleDateString('sw-TZ')}\n`;
        txt += `\n${hr}\n  📊 MUHTASARI\n${hr}\n`;
        txt += `• Mikeka Yote: ${fil.length}\n`;
        txt += `• Imeshinda: ${won.length} | Imepoteza: ${lost.length}\n`;
        txt += `• Win Rate: ${wr}%\n`;
        txt += `• ROI: ${roi}%\n`;
        txt += `• Jumla Staked: TZS ${fmt(staked)}\n`;
        txt += `• Jumla Return: TZS ${fmt(ret)}\n`;
        txt += `• Faida/Hasara: ${profit>=0?'+':''}TZS ${fmt(profit)}\n`;
        txt += `\n${hr}\n  📋 ORODHA YA MIKEKA\n${hr}\n`;
        allData.forEach((m, i) => {
          const p2 = m.status==='WON'?(m.potential_return||0)-(m.stake||0):m.status==='LOST'?-(m.stake||0):0;
          txt += `\n${i+1}. ${m.name||'Mkeka'} [${m.status}]\n`;
          txt += `   📅 ${m.date} | 🎲 ${(m.total_odds||1).toFixed(2)}x\n`;
          txt += `   💸 Stake: TZS ${fmt(m.stake||0)} → Return: ${displayVal(m.potential_return||0)} | Faida: ${p2>=0?'+':''}TZS ${fmt(p2)}\n`;
          (m.matches||[]).forEach(x => {
            txt += `   ${x.outcome==='WIN'?'✅':x.outcome==='LOSS'?'❌':'⬜'} ${x.teams} | ${x.market} @ ${x.odds}x → ${x.outcome||'PENDING'}\n`;
          });
        });
        txt += `\n${hr}\n  📞 NJEM MABULA: 0764674285\n${hr}\n`;
        const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download=fileName+'.txt';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
        toast('✅ Ripoti imepakuliwa!','ok');
      }
      document.getElementById('export-modal')?.remove();
    };
  };

  const rc=el('rc');
  if(rV==='overview'){
    rc.innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.75rem">
        ${[['📋',fil.length,'Mikeka','var(--text)'],['✅',won.length,'Imeshinda','var(--win)'],['❌',lost.length,'Imepoteza','var(--loss)'],['🎯',wr+'%','Win Rate',parseFloat(wr)>=50?'var(--win)':'var(--loss)'],['💸',fmt(staked),'Staked','var(--text)'],['💰',fmt(ret),'Return','var(--win)'],[profit>=0?'📈':'📉',(profit>=0?'+':'')+fmt(profit),'Faida',profit>=0?'var(--win)':'var(--loss)'],['🔄',roi+'%','ROI',parseFloat(roi)>=0?'var(--win)':'var(--loss)']].map(([ic,v,l,col])=>`<div class="stat-box"><div class="stat-icon">${ic}</div><div class="stat-val" style="color:${col}">${v}</div><div class="stat-label">${l}</div></div>`).join('')}
      </div>
      <div class="card" style="margin-bottom:.75rem">
        <div style="font-size:12px;font-weight:700;margin-bottom:10px">Win vs Loss</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${clamp(parseFloat(wr),0,100)}%"></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted)"><span>Loss: ${lost.length}</span><span style="color:var(--win);font-weight:700">${wr}% won</span><span>Win: ${won.length}</span></div>
      </div>
      <div style="background:linear-gradient(135deg,#0f3520,#092518);border:1px solid rgba(0,255,133,.2);border-radius:14px;padding:1rem;display:flex;align-items:center;gap:16px">
        <div style="font-family:'Syne',sans-serif;font-size:52px;font-weight:800;color:${gColor}">${grade}</div>
        <div><div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px">🛡️ NJEM Score</div>
          <div style="font-size:12px;color:#5a9e70">${parseFloat(roi)>=15?'🔥 Bora sana!':parseFloat(roi)>=0?'👍 Uko njia sahihi!':parseFloat(roi)>=-10?'⚠️ Pumzika kidogo.':'🚨 Simama. Reboot.'}</div>
        </div>
      </div>
      ${mikeka.length===0?`<div class="card" style="margin-top:.75rem;border-color:rgba(255,170,0,.3)"><div style="font-size:12px;color:var(--warn);font-weight:700;margin-bottom:4px">📊 Stats Zitaonekana Hapa</div><div style="font-size:11px;color:var(--muted)">Unapoweka mikeka, uchambuzi wako wa kibinafsi utaonekana hapa — win rate, ROI, leagues bora, na zaidi.</div></div>`:''}`;
  }
  if(rV==='assets'){
    // Assets: cashout + won breakdown + bankroll status
    const cashouts=fil.filter(m=>m.status==='CASHOUT');
    const totalStaked=fil.reduce((s,m)=>s+(m.stake||0),0);
    const totalWon=won.reduce((s,m)=>s+(m.potential_return||0),0);
    const totalCashout=cashouts.reduce((s,m)=>s+(m.cashout_amount||0),0);
    const totalReceived=totalWon+totalCashout;
    const totalLost=fil.filter(m=>m.status==='LOST').reduce((s,m)=>s+(m.stake||0),0);
    const netPL=totalReceived-totalStaked;
    const pending=fil.filter(m=>m.status==='PENDING');
    const pendingExposure=pending.reduce((s,m)=>s+(m.stake||0),0);
    const pendingPotential=pending.reduce((s,m)=>s+(m.potential_return||0),0);

    rc.innerHTML=`
      <!-- Bankroll card -->
      <div style="background:linear-gradient(135deg,#0f3520,#092518);border:1px solid rgba(0,255,133,.25);border-radius:16px;padding:1.1rem;margin-bottom:.75rem">
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:1px">💰 Bankroll Ya Sasa</div>
        <div style="font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:var(--accent)">TZS ${fmt(currentUser.bankroll)}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:4px">Pending exposure: <span style="color:var(--warn)">TZS ${fmt(pendingExposure)}</span> · Potential win: <span style="color:var(--win)">TZS ${fmt(pendingPotential)}</span></div>
      </div>

      <!-- Flow summary -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.75rem">
        <div class="stat-box"><div class="stat-icon">📤</div><div class="stat-val" style="color:var(--text)">TZS ${fmt(totalStaked)}</div><div class="stat-label">Kilichowekwa</div></div>
        <div class="stat-box"><div class="stat-icon">🏆</div><div class="stat-val" style="color:var(--win)">TZS ${fmt(totalWon)}</div><div class="stat-label">Won Returns</div></div>
        <div class="stat-box"><div class="stat-icon">💵</div><div class="stat-val" style="color:var(--info)">TZS ${fmt(totalCashout)}</div><div class="stat-label">Cashout Total</div></div>
        <div class="stat-box"><div class="stat-icon">${netPL>=0?'📈':'📉'}</div><div class="stat-val" style="color:${netPL>=0?'var(--win)':'var(--loss)'}">${netPL>=0?'+':''}${fmt(netPL)}</div><div class="stat-label">Net P/L</div></div>
      </div>

      <!-- Income sources breakdown -->
      <div class="card" style="margin-bottom:.75rem">
        <div style="font-size:12px;font-weight:700;color:var(--accent);margin-bottom:10px">📊 Vyanzo vya Mapato</div>
        ${totalReceived===0?`<div style="text-align:center;color:var(--muted);font-size:12px;padding:.5rem">Bado hakuna mapato kwenye kipindi hiki</div>`:`
        <div style="margin-bottom:8px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span>🏆 Won Bets (${won.length})</span>
            <span style="color:var(--win);font-weight:700">TZS ${fmt(totalWon)}</span>
          </div>
          ${totalReceived>0?`<div style="background:rgba(0,0,0,.4);border-radius:6px;height:8px;overflow:hidden"><div style="height:100%;width:${((totalWon/totalReceived)*100).toFixed(0)}%;background:var(--win);border-radius:6px"></div></div>`:''}
        </div>
        <div>
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
            <span>💵 Cashouts (${cashouts.length})</span>
            <span style="color:var(--info);font-weight:700">TZS ${fmt(totalCashout)}</span>
          </div>
          ${totalReceived>0?`<div style="background:rgba(0,0,0,.4);border-radius:6px;height:8px;overflow:hidden"><div style="height:100%;width:${((totalCashout/totalReceived)*100).toFixed(0)}%;background:var(--info);border-radius:6px"></div></div>`:''}
        </div>`}
      </div>

      <!-- Cashout history -->
      ${cashouts.length>0?`
      <div class="card" style="margin-bottom:.75rem">
        <div style="font-size:12px;font-weight:700;color:var(--info);margin-bottom:10px">💵 Historia ya Cashouts</div>
        ${cashouts.map(m=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #0d1f14">
            <div>
              <div style="font-size:12px;font-weight:600">${m.name||'Mkeka'}</div>
              <div style="font-size:10px;color:var(--muted)">${m.date} · Stake: TZS ${fmt(m.stake)}</div>
            </div>
            <div style="text-align:right">
              <div style="font-size:13px;font-weight:700;color:var(--info)">TZS ${fmt(m.cashout_amount||0)}</div>
              <div style="font-size:10px;color:${(m.cashout_amount||0)>=m.stake?'var(--win)':'var(--loss)'}">${(m.cashout_amount||0)>=m.stake?'+':''}TZS ${fmt((m.cashout_amount||0)-m.stake)}</div>
            </div>
          </div>`).join('')}
      </div>`:''}

      <!-- Won history -->
      ${won.length>0?`
      <div class="card">
        <div style="font-size:12px;font-weight:700;color:var(--win);margin-bottom:10px">🏆 Won Bets (${won.length})</div>
        ${won.slice(0,5).map(m=>`
          <div style="display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #0d1f14">
            <div>
              <div style="font-size:12px;font-weight:600">${m.name||'Mkeka'}</div>
              <div style="font-size:10px;color:var(--muted)">${m.date} · ${(m.total_odds||1).toFixed(2)}x</div>
            </div>

  window._role=async(uid,role)=>{await sb.from('users').update({role}).eq('id',uid);toast(`Role → ${ROLES[role]}`);};

  window._saveApiSports=()=>{
    APISPORTS_KEY=el('apisports-key')?.value?.trim()||'';

  window._saveSportmonks=()=>{

    renderAdmin(c);
  };
  window._adSettle=async(mkId,newStatus,userId,potReturn,stake)=>{
    // Kinga: angalia hali ya sasa kabla ya kubadilisha
    const{data:mkCur}=await sb.from('mikeka').select('status').eq('id',mkId).maybeSingle();
    if(mkCur?.status !== 'PENDING'){toast('Mkeka huu tayari umesettled','warn');await loadData();renderAdmin(c);return;}
    await sb.from('mikeka').update({status:newStatus}).eq('id',mkId);
    if(newStatus==='WON'){
      // Rudisha potential_return yote (stake iliishapigwa wakati wa POST)
      const{data:u}=await sb.from('users').select('bankroll').eq('id',userId).maybeSingle();
      if(u){const nb=(u.bankroll||0)+(potReturn||0);await sb.from('users').update({bankroll:nb}).eq('id',userId);if(userId===currentUser.id)await updateUser({bankroll:nb});}
      toast(`✅ WON! Payout TZS ${fmt(potReturn||0)}`,'ok');
    }else if(newStatus==='VOID'){
      // VOID: rudisha stake tu
      const{data:u}=await sb.from('users').select('bankroll').eq('id',userId).maybeSingle();
      if(u&&stake){const nb=(u.bankroll||0)+(stake||0);await sb.from('users').update({bankroll:nb}).eq('id',userId);if(userId===currentUser.id)await updateUser({bankroll:nb});}
      toast(`⬜ VOID — Stake TZS ${fmt(stake||0)} imerudishwa`,'info');
    }else{toast(`Settled: ${newStatus}`);}
    await loadData();renderAdmin(c);
  };
  window._adMatchOut=async(mkId,matchId,outcome,userId,potReturn,stake)=>{
    await sb.from('matches').update({outcome}).eq('id',matchId);
    const{data:fm}=await sb.from('matches').select('*').eq('mkeka_id',mkId);
    const allDone=(fm||[]).every(m=>m.outcome&&m.outcome!=='PENDING');
    if(allDone){
      const hasLoss=(fm||[]).some(m=>m.outcome==='LOSS'),allVoid=(fm||[]).every(m=>m.outcome==='VOID');
      const ns=hasLoss?'LOST':allVoid?'VOID':'WON';
      // Kinga ya double-settle
      const{data:mkCur}=await sb.from('mikeka').select('status').eq('id',mkId).maybeSingle();
      if(mkCur?.status !== 'PENDING'){toast('Mkeka huu tayari umesettled','warn');await loadData();renderAdmin(c);return;}
      await sb.from('mikeka').update({status:ns}).eq('id',mkId);
      if(ns==='WON'){
        // Rudisha potential_return yote
        const{data:u}=await sb.from('users').select('bankroll').eq('id',userId).maybeSingle();
        if(u){const nb=(u.bankroll||0)+(potReturn||0);await sb.from('users').update({bankroll:nb}).eq('id',userId);if(userId===currentUser.id)await updateUser({bankroll:nb});}
        toast(`🎉 WON! Payout TZS ${fmt(potReturn||0)}`,'ok');
      }else if(ns==='VOID'){
        // Rudisha stake tu
        const{data:u}=await sb.from('users').select('bankroll').eq('id',userId).maybeSingle();
        if(u&&stake){const nb=(u.bankroll||0)+(stake||0);await sb.from('users').update({bankroll:nb}).eq('id',userId);if(userId===currentUser.id)await updateUser({bankroll:nb});}
        toast(`⬜ VOID — Stake TZS ${fmt(stake||0)} imerudishwa`,'info');
      }else{toast(`Settled: ${ns}`);}
    }else{toast(`Match → ${outcome}`,'info');}
    await loadData();renderAdmin(c);
  };
}

// ═══════════════════════════════════════
// AUTO LOGIN — Check saved session
// ═══════════════════════════════════════
async function checkSavedSession() {
  try {
    const saved = localStorage.getItem('njem_session');
    if (!saved) { showAuth('login'); return; }
    const savedUser = JSON.parse(saved);
    if (!savedUser || !savedUser.id) { showAuth('login'); return; }
    // Verify user still exists in Supabase + get fresh data
    const { data, error } = await sb.from('users').select('*').eq('id', savedUser.id).maybeSingle();
    if (error || !data) {
      localStorage.removeItem('njem_session');
      showAuth('login');
      return;
    }
    // Auto login with fresh data
    await loginUser(data);
  } catch(e) {
    showAuth('login');
  }
}

// Global handlers
window._showMatchDetails = (teams, eventId) => showMatchDetailsModal(teams, eventId);
window._showFixtures = () => showFixtureBrowser();
window._refreshLive = async () => {
  const btn = document.querySelector('button[onclick="window._refreshLive()"]');
  if (btn) { btn.textContent = '⏳ ...'; btn.disabled = true; }
  await fetchLiveScores();
  if (currentTab === 'home') renderLiveSection();
  if (btn) { btn.textContent = '🔄 Refresh'; btn.disabled = false; }
  toast('Imesasishwa! ✅', 'ok');
};
window._aiAnalysis = (teams, mid) => {
  readInps();
  const match = pMatches.find(m => m._id === mid);
  const teamsStr = match ? match.teams : teams;
  if (!teamsStr || !teamsStr.includes(' vs ')) return toast('Jaza jina la timu kwanza!', 'warn');
  showAIAnalysis(teamsStr);
};
