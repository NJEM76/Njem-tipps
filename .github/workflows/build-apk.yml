name: Tengeneza APK Yangu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kagua Mafile
        uses: actions/checkout@v4

      - name: Weka Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Weka Android SDK
        uses: android-actions/setup-android@v3

      - name: Weka Mfumo wa APK
        run: |
          npm install -g @capacitor/cli @capacitor/core
          npm install
          npx cap init "76TIPPS" "com.tipps76.app" --web-dir=.
          npx cap add android

      - name: Compile APK
        run: |
          npx cap sync
          cd android && ./gradlew assembleDebug

      - name: Hifadhi APK
        uses: actions/upload-artifact@v4
        with:
          name: 76TIPPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
