name: Build 76TIPPS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create Android project
        run: |
          mkdir -p android/app/src/main/java/com/njem/tipps
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/values

          # settings.gradle
          cat > android/settings.gradle << 'GRADLE'
pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
  }
}
rootProject.name = "NjemTipps"
include ':app'
GRADLE

          # build.gradle (root)
          cat > android/build.gradle << 'GRADLE'
plugins {
  id 'com.android.application' version '8.3.0' apply false
}
GRADLE

          # app/build.gradle
          cat > android/app/build.gradle << 'GRADLE'
plugins {
  id 'com.android.application'
}
android {
  namespace 'com.njem.tipps'
  compileSdk 34
  defaultConfig {
    applicationId "com.njem.tipps"
    minSdk 21
    targetSdk 34
    versionCode 4
    versionName "1.0.4"
  }
  buildTypes {
    debug {
      minifyEnabled false
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.0'
}
GRADLE

          # AndroidManifest.xml
          cat > android/app/src/main/AndroidManifest.xml << 'XML'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
  <uses-permission android:name="android.permission.INTERNET"/>
  <application
    android:label="76TIPPS"
    android:icon="@mipmap/ic_launcher"
    android:theme="@style/AppTheme"
    android:usesCleartextTraffic="false">
    <activity
      android:name=".MainActivity"
      android:exported="true"
      android:configChanges="orientation|screenSize|keyboardHidden">
      <intent-filter>
        <action android:name="android.intent.action.MAIN"/>
        <category android:name="android.intent.category.LAUNCHER"/>
      </intent-filter>
    </activity>
  </application>
</manifest>
XML

          # MainActivity.java
          cat > android/app/src/main/java/com/njem/tipps/MainActivity.java << 'JAVA'
package com.njem.tipps;
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import android.webkit.WebChromeClient;
import androidx.appcompat.app.AppCompatActivity;
public class MainActivity extends AppCompatActivity {
  private WebView webView;
  @Override
  protected void onCreate(Bundle savedInstanceState) {
    super.onCreate(savedInstanceState);
    webView = new WebView(this);
    setContentView(webView);
    WebSettings s = webView.getSettings();
    s.setJavaScriptEnabled(true);
    s.setDomStorageEnabled(true);
    s.setDatabaseEnabled(true);
    s.setCacheMode(WebSettings.LOAD_DEFAULT);
    webView.setWebViewClient(new WebViewClient());
    webView.setWebChromeClient(new WebChromeClient());
    webView.loadUrl("https://njem-tipps.vercel.app");
  }
  @Override
  public void onBackPressed() {
    if (webView.canGoBack()) webView.goBack();
    else super.onBackPressed();
  }
}
JAVA

          # themes.xml
          cat > android/app/src/main/res/values/themes.xml << 'XML'
<?xml version="1.0" encoding="utf-8"?>
<resources>
  <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"/>
</resources>
XML

          # Generate valid PNG icons using Python
          python3 << 'PYTHON'
import struct, zlib, os

def make_png(w, h, rgb):
  def chunk(tag, data):
    c = tag + data
    return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
  ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
  raw = b''.join(b'\x00' + bytes(rgb) * w for _ in range(h))
  idat = chunk(b'IDAT', zlib.compress(raw))
  iend = chunk(b'IEND', b'')
  return b'\x89PNG\r\n\x1a\n' + ihdr + idat + iend

sizes = [
  ('mipmap-mdpi', 48),
  ('mipmap-hdpi', 72),
  ('mipmap-xhdpi', 96),
  ('mipmap-xxhdpi', 144),
]
rgb = [34, 197, 94]
for folder, size in sizes:
  path = f'android/app/src/main/res/{folder}/ic_launcher.png'
  with open(path, 'wb') as f:
    f.write(make_png(size, size, rgb))
  print(f'OK {path}')
PYTHON

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 76TIPPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
