name: Build Android APK - 76TIPPS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create simple WebView project for 76TIPPS
        run: |
          mkdir -p android/app/src/main/java/com/njem/tipps
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values

          # settings.gradle
          cat > android/settings.gradle << 'EOF'
          include ':app'
          EOF

          # build.gradle (project level)
          cat > android/build.gradle << 'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # app/build.gradle
          cat > android/app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'com.njem.tipps'
              compileSdk 34

              defaultConfig {
                  applicationId "com.njem.tipps"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

          # AndroidManifest.xml
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="76TIPPS"
                  android:icon="@drawable/ic_launcher">
                  <activity android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # MainActivity.java
          cat > android/app/src/main/java/com/njem/tipps/MainActivity.java << 'EOF'
          package com.njem.tipps;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  setContentView(webView);

                  WebSettings webSettings = webView.getSettings();
                  webSettings.setJavaScriptEnabled(true);
                  webSettings.setDomStorageEnabled(true);
                  webSettings.setLoadWithOverviewMode(true);
                  webSettings.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://njem-tipps.vercel.app");
              }
          }
          EOF

          # Simple placeholder icon (you can replace later)
          echo "Placeholder icon" > android/app/src/main/res/drawable/ic_launcher.png

          # strings.xml
          cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <resources>
              <string name="app_name">76TIPPS</string>
          </resources>
          EOF

      - name: Make gradlew executable
        run: |
          cd android
          chmod +x gradlew || echo "gradlew not yet created, will use wrapper"

      - name: Setup Gradle Wrapper
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            echo "Creating Gradle wrapper..."
            gradle wrapper --gradle-version 8.5
          fi

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 76TIPPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
