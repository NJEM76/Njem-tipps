name: Tengeneza APK Yangu

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kagua Mafile
        uses: actions/checkout@v4

      - name: Weka Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Weka Android SDK
        uses: android-actions/setup-android@v3

      - name: Weka NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Kutengeneza APK ya 76TIPPS
        run: |
          npm install -g cordova
          cordova create folder_app com.tipps76.app "76TIPPS"
          cp -r * folder_app/www/ || true
          cd folder_app
          cordova platform add android
          cordova build android --debug

      - name: Hifadhi APK
        uses: actions/upload-artifact@v4
        with:
          name: 76TIPPS-APK
          path: folder_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
