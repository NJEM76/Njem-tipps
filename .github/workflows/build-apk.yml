name: Build 76TIPPS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create Android WebView Project
        run: |
          mkdir -p android/app/src/main/java/com/njem/tipps
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/values

          cat > android/settings.gradle << 'EOT'
include ':app'
EOT

          cat > android/build.gradle << 'EOT'
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
    }
}
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
EOT

          cat > android/app/build.gradle << 'EOT'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.njem.tipps'
    compileSdk 34

    defaultConfig {
        applicationId "com.njem.tipps"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
EOT

          cat > android/app/src/main/AndroidManifest.xml << 'EOT'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET"/>
    <application
        android:allowBackup="true"
        android:label="76TIPPS"
        android:icon="@mipmap/ic_launcher">
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:configChanges="orientation|screenSize">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOT

          cat > android/app/src/main/java/com/njem/tipps/MainActivity.java << 'EOT'
package com.njem.tipps;

import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        webView = new WebView(this);
        setContentView(webView);

        WebSettings settings = webView.getSettings();
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setLoadWithOverviewMode(true);
        settings.setUseWideViewPort(true);

        webView.setWebViewClient(new WebViewClient());
        webView.loadUrl("https://njem-tipps.vercel.app");
    }

    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }
}
EOT

          cat > android/app/src/main/res/values/strings.xml << 'EOT'
<resources>
    <string name="app_name">76TIPPS</string>
</resources>
EOT

          echo "Placeholder icon created" > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
EOT

      - name: Setup Gradle Wrapper
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 76TIPPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
