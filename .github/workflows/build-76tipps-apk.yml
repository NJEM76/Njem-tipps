name: Build 76TIPPS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create project structure
        run: |
          mkdir -p android/app/src/main/java/com/njem/tipps
          mkdir -p android/app/src/main/res/drawable-hdpi
          mkdir -p android/app/src/main/res/drawable-mdpi
          mkdir -p android/app/src/main/res/drawable-xhdpi
          mkdir -p android/app/src/main/res/drawable-xxhdpi
          mkdir -p android/app/src/main/res/values

      - name: Write settings.gradle
        run: |
          cat > android/settings.gradle << 'ENDOFFILE'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "76TIPPS"
          include ':app'
          ENDOFFILE

      - name: Write root build.gradle
        run: |
          cat > android/build.gradle << 'ENDOFFILE'
          plugins {
            id 'com.android.application' version '8.3.0' apply false
          }
          ENDOFFILE

      - name: Write app build.gradle
        run: |
          cat > android/app/build.gradle << 'ENDOFFILE'
          plugins {
            id 'com.android.application'
          }
          android {
            namespace 'com.njem.tipps'
            compileSdk 34
            defaultConfig {
              applicationId "com.njem.tipps"
              minSdk 21
              targetSdk 34
              versionCode 3
              versionName "1.0.3"
            }
            buildTypes {
              debug {
                minifyEnabled false
              }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          ENDOFFILE

      - name: Write AndroidManifest.xml
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
              android:label="76TIPPS"
              android:icon="@mipmap/ic_launcher"
              android:usesCleartextTraffic="false">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          ENDOFFILE

      - name: Write MainActivity.java
        run: |
          cat > android/app/src/main/java/com/njem/tipps/MainActivity.java << 'ENDOFFILE'
          package com.njem.tipps;

          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

            private WebView webView;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              webView = new WebView(this);
              setContentView(webView);

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setCacheMode(WebSettings.LOAD_DEFAULT);
              settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);

              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl("https://njem-tipps.vercel.app");
            }

            @Override
            public void onBackPressed() {
              if (webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }
          }
          ENDOFFILE

      - name: Write colors.xml
        run: |
          cat > android/app/src/main/res/values/colors.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <color name="black">#FF000000</color>
            <color name="white">#FFFFFFFF</color>
          </resources>
          ENDOFFILE

      - name: Write themes.xml
        run: |
          cat > android/app/src/main/res/values/themes.xml << 'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="Theme.76TIPPS" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="colorPrimary">@color/black</item>
            </style>
          </resources>
          ENDOFFILE

      - name: Generate launcher icon (Python)
        run: |
          python3 - << 'ENDOFFILE'
          import struct, zlib

          def create_png(width, height, color_rgba):
            def chunk(name, data):
              c = name + data
              return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
            sig = b'\x89PNG\r\n\x1a\n'
            ihdr_data = struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0)
            ihdr = chunk(b'IHDR', ihdr_data)
            r, g, b, a = color_rgba
            raw = b''
            for _ in range(height):
              raw += b'\x00' + bytes([r, g, b] * width)
            compressed = zlib.compress(raw)
            idat = chunk(b'IDAT', compressed)
            iend = chunk(b'IEND', b'')
            return sig + ihdr + idat + iend

          # Green color matching 76TIPPS branding
          color = (34, 197, 94, 255)

          sizes = {
            'android/app/src/main/res/drawable-mdpi/ic_launcher.png': (48, 48),
            'android/app/src/main/res/drawable-hdpi/ic_launcher.png': (72, 72),
            'android/app/src/main/res/drawable-xhdpi/ic_launcher.png': (96, 96),
            'android/app/src/main/res/drawable-xxhdpi/ic_launcher.png': (144, 144),
          }

          import os
          os.makedirs('android/app/src/main/res/mipmap-mdpi', exist_ok=True)
          os.makedirs('android/app/src/main/res/mipmap-hdpi', exist_ok=True)
          os.makedirs('android/app/src/main/res/mipmap-xhdpi', exist_ok=True)
          os.makedirs('android/app/src/main/res/mipmap-xxhdpi', exist_ok=True)

          mipmap_sizes = {
            'android/app/src/main/res/mipmap-mdpi/ic_launcher.png': (48, 48),
            'android/app/src/main/res/mipmap-hdpi/ic_launcher.png': (72, 72),
            'android/app/src/main/res/mipmap-xhdpi/ic_launcher.png': (96, 96),
            'android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png': (144, 144),
          }

          for path, (w, h) in {**sizes, **mipmap_sizes}.items():
            data = create_png(w, h, color)
            with open(path, 'wb') as f:
              f.write(data)
            print(f"Created {path} ({w}x{h})")
          ENDOFFILE

      - name: Generate Gradle wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Build debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 76TIPPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
