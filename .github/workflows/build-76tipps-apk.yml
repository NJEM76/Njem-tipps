name: Build 76TIPPS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
     uses: actions/checkout@v4

      name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      name: Create Android WebView Project
        run: |
          mkdir -p android/app/src/main/java/com/njem/tipps
          mkdir -p android/app/src/main/res/drawable
          mkdir -p android/app/src/main/res/values

          echo 'include ":app"' > android/settings.gradle

          cat > android/build.gradle << EOF
          buildscript {
            repositories { google() mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.3.0' }
          }
          allprojects { repositories { google() mavenCentral() } }
          EOF

          cat > android/app/build.gradle << EOF
          apply plugin: 'com.android.application'
          android {
            namespace 'com.njem.tipps'
            compileSdk 34
            defaultConfig {
              applicationId "com.njem.tipps"
              minSdk 21
              targetSdk 34
              versionCode 3
              versionName "1.0"
            }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.7.0' }
          EOF

          cat > android/app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="76TIPPS" android:icon="@drawable/ic_launcher">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > android/app/src/main/java/com/njem/tipps/MainActivity.java << EOF
          package com.njem.tipps;
          import android.os.Bundle;
          import android.webkit.*;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
            private WebView webView;
            @Override protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              webView = new WebView(this);
              setContentView(webView);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true);
              webView.setWebViewClient(new WebViewClient());
              webView.loadUrl("https://njem-tipps.vercel.app");
            }
            @Override public void onBackPressed() {
              if (webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
          }
          EOF

          echo " " > android/app/src/main/res/drawable/ic_launcher.png

      name:dle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

       name: Build APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 76TIPPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
